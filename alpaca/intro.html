<script type="text/markdown" id="src"># Alpaca Research 初聊教案 · 10/23 周五 11:30 ET · 30 分钟 Google Meet · Alpaca Research Intro Call

给 Christina(贾宜静)。这是 10/23 周五和 Alpaca Research 第一次通话的准备材料。
<span class="en">For Christina: prep for your first call with Alpaca Research on Friday, October 23.</span>

先说最重要的一件事:Alpaca Research **不是量化公司**。它在波士顿和剑桥(麻省)做「个人 AI」:自己设计硬件、推理引擎、模型和应用,让最强的大模型跑在你自己拥有的机器上。
<span class="en">The most important point: Alpaca Research is not a trading firm. It builds personal AI in Boston and Cambridge, Massachusetts: hardware, an inference engine, models and apps, so frontier models run on hardware you own.</span>

所以这份材料不准备概率题和脑筋急转弯,换成「在个人设备上跑大模型」的几道估算题(第 3 章 B 部分)。
<span class="en">So there are no probability puzzles here. Instead, Part B of Chapter 3 covers back-of-envelope questions on running large models locally.</span>

| 标记 <span class="en">Marker</span> | 意思 <span class="en">Meaning</span> |
|---|---|
| 【原邮件】 <span class="en">From their email</span> | 招聘邮件或日历邀请里写的。<span class="en">From their email or calendar invite.</span> |
| 【官方】 <span class="en">Official posting</span> | 他们自己发的岗位描述。<span class="en">From their own job postings.</span> |

> 提纲:S 每次评测完人工导出 CSV、找 AI 写分析、手动回传 → T PM 要自动化,前后端我设计 → A 只读表头和几行样例,用户确认口径,沙箱跑全量,批准后才上传 → 15 分钟上限改成后台异步会话 3 小时 + MongoDB 存状态 → 先量再改:12.5 GB 文件「卡住」,真因是反复数行 → R 一次对话、1.6 GB 一两分钟、走后还在生产

要点 <span class="en">Key points</span>
- 先讲用户的痛点,不先讲技术。
  <span class="en">Start with the users' pain, not the tech.</span>

- 「数一下搬了多少字节」的习惯:12.5 GB 的文件被反复从头读,才是慢的原因。这和本地推理「看内存带宽」是同一种思路。
  <span class="en">The habit of counting bytes moved: re-reading a 12.5 GB file was the real slowdown. Same instinct as watching memory bandwidth in local inference.</span>

口述版(约 90 秒) <span class="en">Script, about 90 seconds</span>

> [S] At TikTok, the model platform is where content-safety models get evaluated before launch. After each evaluation, someone exported a CSV, figured out which columns were the score and the ground truth, had an AI tool write the analysis, and uploaded the report by hand.
>
> [T] My product manager wanted that automated, and I designed and shipped it, frontend and backend, as a new domain in the company's agent framework.
>
> [A · Flow] The agent reads only the header and a few sample rows, asks the user to confirm the score column, the label column and the threshold, then runs the full analysis in a sandbox. <u>Nothing is uploaded until the user approves that exact report.</u>
>
> [A · Long runs] The synchronous service was capped at fifteen minutes, so I moved the full analysis to an asynchronous sandbox session that can run for three hours, with task state in MongoDB keyed by thread ID. The page can always recover a run, and cancel actually kills the process.
>
> [A · Measure first] Once, a 12.5-gigabyte export looked stuck, and I added sampling for huge files. The next day I measured: a single streaming pass over about 250,000 rows finished in time. The real problem was <u>the agent re-reading the whole file just to count rows</u>, over a cross-region mount. I removed the extra reads and the sampling, so every report stays exact.
>
> [R] The manual loop became one conversation, a 1.6-gigabyte export finishes in one to two minutes, and the team kept it in production after I left.

<span class="en">Follow-ups</span>

| 追问 <span class="en">Follow-up</span> | 回答 <span class="en">Answer</span> |
|---|---|
| 哪些是你做的,哪些是平台?<span class="en">What was yours vs. the platform?</span> | Firefly 是 TikTok 的模型平台,不是你做的。你在公司的 agent 框架(agent_harness,基于 LangGraph 和 MCP)里新增了 firefly 域:提示分支、工具(定位导出文件、预览、提交报告)、沙箱会话、前端面板。7/8 到 7/10 三天 20 个提交做出第一版。<span class="en">Firefly is the platform. I added a new domain to the company's agent framework: the prompt branch, tools to locate, preview and submit, sandbox sessions and the panel. The first version took twenty commits over three days.</span> |
| LangGraph 和 MCP 是什么?<span class="en">What are LangGraph and MCP?</span> | LangGraph 把 agent 写成一张图:节点是一步,边决定下一步去哪,每个对话线程的状态会存下来。MCP(Model Context Protocol)是把工具交给模型的标准接口,模型按统一格式调用工具。<span class="en">LangGraph models an agent as a graph of steps with saved per-thread state. MCP is a standard interface for exposing tools to a model.</span> |
| 为什么不直接流式返回?<span class="en">Why not just stream the result?</span> | 同步请求最长 900 秒(15 分钟);几小时没数据的流会被网关掐断。所以请求先回一个短 ACK,活在后台会话里跑,页面去 MongoDB 里查状态。定位、预览、读回报告走同步;全量分析走异步。<span class="en">Synchronous requests capped at 900 seconds, and the gateway cuts a stream that's silent for hours. So the request returns a short acknowledgement, the work runs in a background session, and the page polls state in MongoDB. Locating, preview and read-back stay synchronous; the full analysis is async.</span> |
| 安全上怎么做?<span class="en">How did you keep it safe?</span> | agent 用用户自己的短期登录凭证调工具,没有自己的高权限;输入文件只读挂载,只能写输出目录和 /tmp;出网走白名单;凭证不进日志;只提交用户批准的那份报告。<span class="en">It acts as the user with short-lived credentials, inputs are read-only, writes go only to the output folder and /tmp, network access is allow-listed, credentials never hit logs, and only the approved report is submitted.</span> |
| 重做会改什么?<span class="en">What would you change?</span> | 扩大用户前,先做 1、5、10、20 个并发用户的阶梯压测。平台大约只有 20 个沙箱会话,交接文档里写明不能承诺 20 个人同时用一定没问题。<span class="en">Before widening access, step load tests at 1, 5, 10 and 20 users. The platform had about twenty sandbox sessions, and my handover says we can't promise twenty simultaneous users will be fine.</span> |
| 超时调参那条怎么做的?<span class="en">How did the timeout skills work?</span> | 脚本和 agent 并行:脚本拉下游每个接口近 7 天成功请求的加权 P99,参考延迟取「每天最大加权 P99」里最高的两天;agent 把下游分成计算类和存储类,配不同的安全系数,并在代码里找到现有超时配置;偏离大就自动开合并请求,附上决策报告。真实落地:一个广告定向服务的两个调用超时从 100 ms 收到 10 ms 和 60 ms;另一个 reranker 服务一共调了 8 个接口的超时。<span class="en">A script pulls 7-day weighted P99 per downstream call and takes the top two daily maxima; the agent classifies calls as compute or storage for different safety factors and finds the current config; big gaps become a merge request with a decision report. Real results: two timeouts on an ad-targeting service went from 100 ms to 10 ms and 60 ms, and 8 interface timeouts were tuned on a reranker service.</span> |
| 为什么看 P99 不看平均?<span class="en">Why P99, not the mean?</span> | 平均值会把少数慢请求藏起来。例子:99 个请求各 5 ms、1 个 500 ms,平均约 10 ms,看起来很正常,可那个 500 ms 的用户已经超时了。超时阈值要盖住几乎所有正常请求,所以看 P99 再乘安全系数。<span class="en">The mean hides the slow tail: 99 requests at 5 ms and one at 500 ms average about 10 ms. A timeout has to cover nearly all normal requests, so use P99 plus a safety factor.</span> |

口述版(约 80 秒) <span class="en">Script, about 80 seconds</span>

> [S] Climbing routes are marked only by hold color, and beginners, or anyone with weak color vision, often can't tell which holds belong to their route.
>
> [T] With one classmate, I led RCRI: recognize the routes and estimate difficulty from a camera, in real time, on a small device, <u>with no cloud upload</u>.

> [A · Pipeline] We kept it modular so each stage can be debugged on its own. YOLOv8 finds the holds, a second model labels the hold types, color grouping builds the routes, and a scoring step estimates difficulty. We trained on GCP, and the hold detector reached mAP50 0.825.
>
> [A · Device] Then we exported to ONNX and built a TensorRT FP16 engine on a 2-gigabyte Jetson Nano. Its Maxwell GPU has fast FP16 but no INT8 path, so FP16 was the right precision.
>
> [A · Judgment] We also fixed the difficulty features. Raw pixel sizes and distances changed with how far the camera was, so we switched to <u>scale-free ratios</u>, like the gap between holds divided by the average hold size.
>
> [R] On the Nano, hold detection runs at <u>12 frames a second, 83 milliseconds a frame, in 0.7 gigabytes and 5 watts</u>. The full six-class pipeline runs at 5 frames a second. We also talked with a climbing gym about using it.

口述版(约 80 秒) <span class="en">Script, about 80 seconds</span>

> [S] I do research sponsored by Walmart, with Arklex, an agent-evaluation startup, on how to evaluate conversational AI agents. Judging thousands of real conversations with an LLM is slow and expensive.
>
> [T] So the question is: what is <u>the smallest test set that still behaves like the full set</u>?
>
> [A · Score] We score a candidate subset with a Q-function that has three parts. Representativeness: every real conversation should have a close neighbor in the subset. Behavior: the subset's tool-use patterns should match the full set, using metrics from VISTA, a Columbia user-simulation paper. And failure coverage: the subset should still contain the kinds of failures we've seen. <u>All three must reach 0.9.</u>
>
> [A · My part] I own the metrics, the baselines, like HDBSCAN clustering, LLM clustering and an agentic baseline, and the error analysis. This month I moved the pipeline onto τ²-bench, a public agent benchmark, and built an LLM judge that labels why each failed conversation failed.
>
> [R] In a first test on 20 failed conversations, the judge found 69 errors, which grouped into 50 distinct ones. And in 4 of the 20, the fault was in <u>the benchmark's gold answer or its simulated user, not the agent</u>. So failure labels need a human check before we trust them.
>
> [Stakeholder] I meet Walmart's team every week, so the metrics come from what they'd actually act on.

这段在说什么:为什么要做(评测贵)→ 要什么(最小但不失真)→ 怎么打分(三项各 0.9)→ 你做了哪块 → 这周的新发现。对 Alpaca 有用:每次量化模型或改推理引擎,都需要一个便宜、但代表真实使用的回归测试集。
<span class="en">Why, what, how it's scored, your part, and this week's finding. It matters to Alpaca: every time you quantize a model or change the engine, you need a cheap regression set that still reflects real use.</span>

追问表
<span class="en">Follow-ups</span>

| 追问 <span class="en">Follow-up</span> | 回答 <span class="en">Answer</span> |
|---|---|
| Q-function 具体怎么算?<span class="en">How is Q computed?</span> | 代表性 = 1 − 全集每条对话到子集里最近一条的平均距离(文本向量距离);行为 = 子集和全集在三个工具指标上差多少(差越小越接近 1);失败覆盖 = 子集覆盖了全集失败类型的比例。Q = 三项平均,三项都 ≥ 0.9 才算合格。<span class="en">Representativeness is one minus the average distance from each conversation to its nearest pick; behavior compares three tool metrics between subset and full set; failure is the share of failure types covered. Q is the average, and all three must be at least 0.9.</span> |
| 三个工具指标是什么?<span class="en">Which tool metrics?</span> | 来自 VISTA(哥大的用户模拟论文):转移熵,看「调完 A 之后常接什么」够不够多样;分布熵,看工具用得均不均匀;轨迹距离,看工具调用序列两两之间的编辑距离。<span class="en">From VISTA: transition entropy, distribution entropy, and trajectory distance, the normalized edit distance between tool sequences.</span> |
| 怎么选子集?<span class="en">How do you select?</span> | 贪心:先加「让代表性和失败覆盖涨得最多」的对话,直到这两项到 0.9;再补行为;然后能删就删(删了仍合格);最后做 5 轮交换,能让 Q 变高就换。<span class="en">Greedy adds until representativeness and failure reach 0.9, then behavior; then remove members while staying feasible; then five swap rounds if Q improves.</span> |
| 子集最后多大?<span class="en">How small did it get?</span> | τ²-bench 零售域 456 条对话(o4-mini 当 agent):10/16 那次用 Nomic 文本向量,每个失败过的任务算一种失败,选出 207 条,三项都过 0.9,Q 0.962。更早一次是仓库里的示例配置,数据是 GPT-4.1 当 agent 的那份,用的是简单的哈希向量,选出 94 条,Q 0.931,失败覆盖 0.907。数据、向量、失败定义都不一样,两个数不能直接比。用哪个请你确认(附录 D)。<span class="en">On 456 retail conversations with o4-mini as the agent, the Oct 16 run picked 207 with all three above 0.9. An earlier example run on GPT-4.1 conversations with simpler embeddings picked 94. Different data, embeddings and failure definitions, so the two aren't directly comparable.</span> |
| 为什么拿 HDBSCAN 当基线?<span class="en">Why HDBSCAN?</span> | 它按密度聚类,不用预先定簇数,每簇挑代表。7 月在 50 个场景上比过:按六个聚类质量指标排名,HDBSCAN 平均第 1.43,LLM 分批聚类 1.57;但按 Q 打分,LLM 分批聚类 0.852 高于 HDBSCAN 0.811。<span class="en">Density-based, no preset number of clusters. In July, HDBSCAN ranked best on clustering metrics, but LLM batch clustering scored higher on Q, 0.852 versus 0.811.</span> |
| 失败标注怎么做的?<span class="en">How does failure labeling work?</span> | 两步:LLM 判官读一条失败对话,加上领域规则、任务说明和没通过的检查项,输出错误列表(12 种类别,带轮次);再把所有错误分批(每批 8 个)归并成「唯一错误」。第一版没给领域规则时,判官把一次合规的拒绝误判成幻觉,加了规则才对。<span class="en">An LLM judge reads each failed conversation with the policy, task and failed checks, and lists errors in twelve categories; then errors are merged in batches of eight into unique errors. Without the policy, the judge once mislabeled a compliant refusal as a hallucination.</span> |
| 和 Alpaca 有什么关系?<span class="en">Why does this matter here?</span> | 本地模型每次量化、换引擎,都要回答「它还够好吗」。一个小而有代表性的测试集,能便宜地回答这个问题。<span class="en">Each time you quantize or change the engine, you need to know it's still good enough; a small, representative test set answers that cheaply.</span> |

要点 <span class="en">Key points</span>
- 生活比方:每个任务给一张「坐标」,大家用同一套坐标轴,所以能比谁和谁像。

口述版(约 60 秒) <span class="en">Script, about 60 seconds</span>

> [S] When one frozen LLM serves many tasks, a single shared LoRA lets the tasks interfere, and separate adapters share nothing.
>
> [T] TaskMap writes each task's weight update as <u>coefficients on fixed, shared orthogonal axes</u>, so updates for different tasks live in one coordinate system and can be compared directly.
>
> [A] I'm second author. My part was the ablations and the cold-start experiments, on a frozen BF16 Qwen2.5-1.5B.
>
> [R] The ablations showed the gains come from <u>block-specific coefficients, not learned routing or sparsity</u>; random routing did just as well. On 20 tasks the model had never seen, shared LoRA had the higher average, but its worst task dropped 26.7 points, versus 7.9 for TaskMap. So TaskMap is safer rather than stronger on average, and direct per-task optimization still beats it on known tasks. The paper says so openly.

这段在说什么:问题 → 想法 → 你的部分 → 结论和局限。主动说局限,会让人更信你前面说的结论。
<span class="en">Problem, idea, your part, findings and limits. Stating the limits makes the findings more credible.</span>

追问表
<span class="en">Follow-ups</span>

| 追问 <span class="en">Follow-up</span> | 回答 <span class="en">Answer</span> |
|---|---|
| 为什么要正交基?<span class="en">Why orthogonal bases?</span> | 正交时,两个更新之间的距离正好等于两组系数之间的距离,所以系数就是唯一的「坐标」。小例子:两条轴,任务甲 (1, 0)、乙 (0.8, 0.2)、丙 (0, 1);甲乙距离 0.28,很像;甲丙 1.41,完全不同。LoRA 做不到,因为很多组 B·A 能得到同一个更新。<span class="en">With orthonormal bases, the distance between updates equals the distance between coefficient vectors, so coefficients are unique coordinates. LoRA factors aren't unique.</span> |
| 为什么只改 FFN?<span class="en">Why only the FFN?</span> | FFN 占约三分之二参数,以往研究发现它的激活最能看出是什么任务。Qwen2.5-1.5B 的 FFN 中间维度 8960,切成 70 块,每块 128。<span class="en">FFNs hold about two thirds of the parameters and best predict task identity; the 8,960-wide layer is cut into 70 blocks of 128.</span> |
| 已知任务上的分数?<span class="en">Known-task scores?</span> | 9 个任务的平均:TaskMap 46.3 ± 2.2,共享 LoRA 40.3,VeRA 42.5,超网络 47.7,逐任务直接优化 49.3。参数量对齐的 LoRA r=40 只有 37.0,说明提升不是靠参数多。<span class="en">TaskMap 46.3, shared LoRA 40.3, VeRA 42.5, hypernetwork 47.7, direct optimization 49.3; a parameter-matched LoRA scored 37.0.</span> |

| 推理时会更慢吗?<span class="en">Is inference slower?</span> | 实验里残差是用 Python hook 加上去的,没有融合 kernel,所以不快。只服务一个任务时,可以把这个任务的更新预先算好合进权重,像合并 LoRA 一样;要同时服务多个任务,就要把残差融进 FFN 的 kernel。这是我的想法,论文没做。<span class="en">We added residuals through Python hooks, no fused kernels. For one task you could merge the update into the weights, like merging a LoRA; for many tasks you'd fuse it into the FFN kernel. That's my idea, not in the paper.</span> |

### 3.13 本地跑大模型卡在哪 · What limits a large model on a personal device

**先打个比方**
<span class="en">An analogy first</span>

- 厨师做菜。每做一道菜(生成一个字),都要把整本菜谱(模型的全部权重)从书架搬到灶台,从头翻一遍。
  <span class="en">A cook has to carry the whole recipe book from the shelf to the stove for every single dish, that is, every token.</span>
- 厨师手很快(计算单元很强),但书架到灶台只有一条窄走廊(内存带宽)。所以一秒能做几道菜,看的是走廊多宽,不是厨师手多快。
  <span class="en">The cook is fast, but the hallway is narrow, so the hallway, the memory bandwidth, sets the pace.</span>
- 书架放不放得下这本书 = 内存容量。把菜谱印成小一号的字 = 量化。灶台边记「客人刚才说过什么」的便利贴 = KV 缓存,聊得越久越厚。
  <span class="en">Whether the book fits on the shelf is capacity; printing it smaller is quantization; the sticky notes about the conversation so far are the KV cache.</span>
- 餐厅(数据中心)的办法:同时接几百桌的单,书搬一趟,几百桌一起用。家里只有你一个人,凑不出几百桌。
  <span class="en">A restaurant, the datacenter, batches hundreds of orders per trip; at home there's only you.</span>

**一张小图**
<span class="en">A small diagram</span>

```
          容量 C:能放下多大的 W 和 K
   ┌─────────────────────────────────┐
   │  内存 M:   权重 W   +   KV 缓存 K  │
   └────────────────┬────────────────┘
                    │  带宽 B:每秒能搬多少字节
                    ▼
   ┌─────────────────────────────────┐
   │  计算单元 U:很快,大部分时间在等数据 │ ──> 出 1 个 token
   └─────────────────────────────────┘
   单人生成:每出 1 个 token,W 要从 M 整个搬一遍到 U
   速度上限 ≈ B ÷ W 的字节数
```

> 🔤 M = 内存(memory);W = 模型权重(weights),也就是全部参数;K = KV 缓存,模型对前文的「笔记」;C = 内存容量(capacity),能放下多少字节;B = 内存带宽(bandwidth),每秒能读多少字节;U = 计算单元,GPU 或 NPU 里做乘加的部分。
> <span class="en">M is memory; W is the model weights, all the parameters; K is the KV cache, the model's notes on the conversation; C is capacity, how many bytes fit; B is bandwidth, bytes read per second; U is the compute units that do the multiply-adds. For one user, every token moves all of W from M to U, so speed is at most B divided by the size of W.</span>

**几个数算一遍**(脚本在 3.14,已实跑)
<span class="en">The numbers, computed by the script in 3.14</span>

1. 放不放得下:字节数 = 参数个数 × 每个参数的位数 ÷ 8。
   <span class="en">Bytes equal parameters times bits per parameter divided by eight.</span>
   - Qwen2.5-1.5B(你 TaskMap 用的骨干):15.4 亿 × 16 位 ÷ 8 ≈ 3.1 GB;4 位约 0.8 GB。
     <span class="en">Your TaskMap backbone is about 3.1 GB at 16 bits and 0.8 GB at 4 bits.</span>
   - 70B 模型(比如 Llama-3-70B):16 位 140 GB;8 位 70 GB;4 位 35 GB。
     <span class="en">A 70B model is 140 GB at 16 bits, 70 at 8, 35 at 4.</span>
   - 真实的 4 位格式,常见做法是每 32 个数多存一个 16 位缩放系数:4 + 16 ÷ 32 = 4.5 位,所以 35 GB 实际约 39.4 GB。
     <span class="en">Real 4-bit formats often add one 16-bit scale per 32 weights, about 4.5 bits, so roughly 39.4 GB.</span>
   - RTX 4090 只有 24 GB 显存,放不下;Apple M2 Ultra 最多 192 GB 统一内存,放得下。
     <span class="en">An RTX 4090's 24 GB can't hold it; an M2 Ultra with up to 192 GB can.</span>
2. 一秒几个字:上限 ≈ 带宽 ÷ 每个字要读的字节数。还是 70B、4 位、35 GB:
   <span class="en">Tokens per second is at most bandwidth over bytes read per token. For the 35 GB model:</span>
   - M2 Ultra,800 GB/s → 最多约 22.9 个/秒。
     <span class="en">An M2 Ultra at 800 GB/s: at most about 22.9 tokens a second.</span>
   - 普通台式机,双通道 DDR5-5600,2 × 8 字节 × 56 亿次/秒 = 89.6 GB/s → 最多约 2.6 个/秒。
     <span class="en">A desktop with dual-channel DDR5-5600, two channels times 8 bytes times 5.6 billion transfers a second, is 89.6 GB/s: at most about 2.6 tokens a second.</span>
   - 数据中心的 H100,约 3,350 GB/s → 最多约 95.7 个/秒(放得下的话)。
     <span class="en">A datacenter H100 at about 3,350 GB/s: at most about 95.7 tokens a second, if the model fits.</span>
3. KV 缓存多大:每个 token 占 2(K 和 V)× 层数 × KV 头数 × 每个头的维度 × 2 字节。
   <span class="en">KV cache per token is two, for K and V, times layers times KV heads times head size times two bytes.</span>
   - Llama-3-70B:2 × 80 × 8 × 128 × 2 = 327,680 字节,约 320 KiB;8K 个 token 约 2.68 GB,32K 个约 10.7 GB。
     <span class="en">About 320 KiB per token for Llama-3-70B: 2.7 GB at 8K tokens, 10.7 GB at 32K.</span>
   - Qwen2.5-1.5B:2 × 28 × 2 × 128 × 2 = 28,672 字节,28 KiB;32K 个约 0.94 GB。
     <span class="en">28 KiB per token for Qwen2.5-1.5B.</span>
   - 每生成一个字,这些笔记也要读一遍,所以聊得越长越慢。
     <span class="en">The cache is read for every new token too, so long chats slow down.</span>
4. 为什么数据中心便宜:每个参数、每个 token 做一次乘加,算 2 次运算;16 位参数占 2 字节。所以单人生成时,每搬 1 字节只做约 1 次运算。
   <span class="en">Each parameter does one multiply-add, two operations, per token, and takes two bytes at 16 bits, so single-user decoding does about one operation per byte.</span>
   - H100 每秒约 989 万亿次运算(BF16)、每秒搬 3.35 TB,算下来每字节要做约 295 次运算才能让计算单元忙起来。
     <span class="en">An H100 needs about 295 operations per byte to keep its compute busy.</span>
   - 也就是要同时处理约 300 个 token。数据中心把几百个请求凑成一批,一次读权重服务几百人;个人设备只有你一个人。
     <span class="en">That means roughly 300 tokens in flight; datacenters batch hundreds of requests per weight read, a personal device can't.</span>
5. MoE(混合专家模型):每个 token 只用一部分「专家」。DeepSeek-V3 共 6,710 亿参数,每个 token 只激活 370 亿。
   <span class="en">Mixture of experts: DeepSeek-V3 has 671 billion parameters but activates 37 billion per token.</span>
   - 4 位时要放下 335.5 GB,但每个字只读 18.5 GB,800 GB/s 时最多约 43.2 个/秒。
     <span class="en">At 4 bits you must hold 335.5 GB but read only 18.5 GB per token, so up to about 43 tokens a second at 800 GB/s.</span>
   - 结论:MoE 吃容量、省带宽,「大而便宜的内存」最占便宜。
     <span class="en">MoE is capacity-hungry but bandwidth-light, which rewards large, cheap memory.</span>

**为什么**
<span class="en">Why</span>

- 一个人用的时候(批大小 = 1),生成阶段卡在内存上,不卡在算力上。所以个人设备的上限由两个数决定:能放多大(容量),一秒读多少(带宽)。
  <span class="en">With one user, decoding is memory-bound, so capacity and bandwidth set the limits.</span>
- 这就是 Alpaca 把「内存架构」放在核心的原因。你在通话里说出这一点,就证明你看懂了他们的技术赌注。
  <span class="en">That's why Alpaca puts the memory architecture at the core; saying so shows you understand their bet.</span>
- 例外:读入提示词(prefill)时,几千个 token 一起算,读一次权重能算很多 token,这一步卡在算力上。
  <span class="en">The exception is prefill, where the whole prompt is processed at once and compute becomes the limit.</span>

**代价和取舍**
<span class="en">Trade-offs</span>

| 办法 <span class="en">Lever</span> | 省了什么 <span class="en">What it saves</span> | 代价 <span class="en">Cost</span> |
|---|---|---|
| 量化,16 位 → 4 位 <span class="en">Quantization</span> | 字节少约 3.6 倍(算上缩放系数),单人生成接近按比例变快,也放得下更大的模型。<span class="en">About 3.6x fewer bytes, so faster decoding and bigger models fit.</span> | 位数越低越容易掉质量,4 位以下更明显;每次都要在真实任务上重新评测。<span class="en">Quality drops, especially below 4 bits; re-evaluate on real tasks every time.</span> |
| GQA,少用几个 KV 头 <span class="en">Grouped-query attention</span> | Llama-3-70B 用 64 个查询头配 8 个 KV 头,KV 缓存比每头都存小 8 倍。<span class="en">8 KV heads for 64 query heads makes the cache 8x smaller.</span> | 训练时就要这么设计,部署时改不了。<span class="en">Decided at training time.</span> |
| KV 缓存量化或只留最近一段 <span class="en">KV quantization or windows</span> | 长对话省内存和带宽。<span class="en">Saves memory and bandwidth on long chats.</span> | 长上下文的准确度可能下降。<span class="en">Long-context accuracy may drop.</span> |
| 投机解码 <span class="en">Speculative decoding</span> | 小模型先猜 k 个字,大模型一次前向同时验证 k 个,平均每读一次权重出不止一个字。<span class="en">A draft model guesses k tokens and the big model verifies them in one pass.</span> | 要多放一个小模型;猜错的部分白算;效果看猜中率。<span class="en">Extra memory, wasted work on misses, gains depend on acceptance rate.</span> |
| 批处理 <span class="en">Batching</span> | 一次读权重服务很多请求,吞吐高。<span class="en">One weight read serves many requests.</span> | 个人设备请求少;批越大,每个人等得越久。<span class="en">Few requests on a personal device; bigger batches mean longer waits.</span> |
| MoE <span class="en">Mixture of experts</span> | 每个字读得少。<span class="en">Fewer bytes per token.</span> | 全部专家都要放下;放在慢内存里换专家会卡。<span class="en">All experts must fit; swapping from slow memory stalls.</span> |

**面试怎么答(约 60 秒)**
<span class="en">How to say it in the interview</span>

> 提纲:单人生成卡内存不卡算力 → 70B 4 位 35 GB,800 GB/s 约 23 个/秒 → 数据中心靠批处理(H100 要约 300 次运算/字节,单人只有约 1)→ 个人设备只能靠容量和带宽 → 能动的杠杆:每字少读字节(量化、KV、MoE)、每次读权重多出字(投机解码)

> [Core] For one user, generating text is mostly limited by memory, not compute. Every new token has to read all the weights once. So a 70-billion-parameter model at 4 bits moves about 35 gigabytes per token, and on a machine with 800 gigabytes a second that caps you around 23 tokens a second, before you even count the KV cache.
>
> [Datacenter] Datacenters get around this by batching: one read of the weights serves hundreds of requests. An H100 needs roughly 300 operations per byte to be compute-bound, and single-user decoding does about one.
>
> [Device] A personal device serves one person, so <u>memory capacity and bandwidth decide what you can run and how fast</u>. That's why an inference engine plus a memory architecture seems like the right place to attack it.
>
> [Levers] The levers are fewer bytes per token, through quantization, smaller KV caches and mixture-of-experts models, and more tokens per weight read, through speculative decoding.

这段在说什么:先给结论(卡内存),再给一个能心算的例子,再解释数据中心为什么不一样,最后列出能动的杠杆。每个数都在上面算过。
<span class="en">Conclusion, a worked example, why datacenters differ, then the levers. Every number is computed above.</span>

**追问表**
<span class="en">Follow-ups</span>

| 追问 <span class="en">Follow-up</span> | 回答 <span class="en">Answer</span> |
|---|---|
| 量化是什么,能压到多低?<span class="en">What is quantization, how low can you go?</span> | 把每个权重存成更少的位数,每一小块(比如 32 个数)配一个缩放系数,用的时候乘回来。16 位到 4 位,算上缩放系数字节少约 3.6 倍,单人生成速度接近按比例提升。代价:4 位以下质量更容易掉,少数特别大的「离群值」会被压坏;所以每次量化都要在真实任务上重新评测,这正是我在 Walmart 研究里做的事。<span class="en">Store weights in fewer bits with a scale per small block. 16 to 4 bits is about 3.6x fewer bytes, so close to proportionally faster decoding. Below 4 bits quality drops and outliers get crushed, so re-evaluate on real tasks, which is what my Walmart research is about.</span> |
| KV 缓存是什么,为什么重要?<span class="en">What is the KV cache?</span> | 模型对已读内容的笔记:每个 token、每一层存一对 K、V 向量,下一个字只算新的一行,不用把前文重算。Llama-3-70B 每个 token 约 320 KiB,32K 上下文约 10.7 GB,而且每生成一个字都要读一遍。办法:GQA(8 个 KV 头而不是 64 个)、把 KV 存成 8 位、只留最近一段。代价是长上下文的准确度。<span class="en">Saved K and V vectors for every past token and layer, so the model doesn't recompute the past. About 320 KiB per token for a 70B model, 10.7 GB at 32K, read on every step. Fixes: GQA, 8-bit KV, sliding windows, at some long-context accuracy cost.</span> |
| prefill 和 decode 有什么不同?<span class="en">Prefill vs. decode?</span> | prefill 把整段提示词一次算完,很多 token 共用一次权重读取,卡在算力上;decode 一次一个 token,卡在带宽上。所以「出第一个字要多久」看算力,「之后每秒几个字」看带宽。同一台设备上要给两者排期,比如把长提示词切块,和生成交替进行。<span class="en">Prefill processes the prompt in one go and is compute-bound; decode is one token at a time and bandwidth-bound. Time to first token tracks compute, tokens per second track bandwidth, and a device has to schedule both, for example by chunking long prompts.</span> |
| 数据中心为什么每个字更便宜?<span class="en">Why are datacenters cheaper per token?</span> | 批处理。H100 每字节要约 295 次运算才饱和,单人生成只有约 1 次;凑几百个请求一批,一次读权重服务几百人,成本就摊薄了。个人设备凑不了批,只能让「读权重」本身更便宜:更多、更便宜的容量和更高的带宽。<span class="en">Batching amortizes each weight read across hundreds of requests. A personal device can't batch, so reading weights itself has to get cheaper: more, cheaper capacity and more bandwidth.</span> |
| MoE 对个人设备是好是坏?<span class="en">Is MoE good for personal devices?</span> | 每个字只读激活的专家。DeepSeek-V3 每个 token 用 6,710 亿里的 370 亿,4 位时要放 335.5 GB,但每个字只读 18.5 GB,800 GB/s 上限约 43 个/秒。所以它吃容量、省带宽,适合「内存大」的设备。代价:专家要全放下;如果专家放在慢内存里,切换会卡。<span class="en">It reads only active experts, so it needs lots of capacity but little bandwidth per token, which suits memory-rich devices, as long as all experts fit in fast memory.</span> |
| 投机解码怎么回事?<span class="en">How does speculative decoding work?</span> | 小的草稿模型先猜后面 k 个字;大模型做一次前向,同时检查这 k 个,猜对的直接收下。大模型读一次权重就验证了多个字,平均每次读权重出不止一个字。效果取决于猜中率;代价是多放一个小模型,猜错的部分白算。<span class="en">A small draft model proposes k tokens and the big model checks all k in one pass, so one weight read can yield several tokens. It depends on the acceptance rate and costs extra memory and wasted work on misses.</span> |
| 你会怎么测一个推理引擎?<span class="en">How would you benchmark an inference engine?</span> | 分开测:出第一个字的时间(看 prefill)、之后每秒几个字(看 decode)、每个字延迟的 P50 和 P99(TikTok 养成的习惯,看尾巴不只看平均)、内存峰值、每个字耗多少能量。再和带宽上限比:比如上限 23 个/秒、实测 18 个/秒,就是上限的 78%,说明还有多少空间。测量要控制条件:BOLT 研究里,不固定测速环境时同一个二进制只测出 73%,固定后是 92%。<span class="en">Measure time to first token, tokens per second, per-token P50 and P99, peak memory and energy per token, then compare with the bandwidth ceiling, for example 18 out of 23 is 78%. And control the setup: in my BOLT work, the same binary measured 73% without controls and 92% with them.</span> |
| GPU、CPU、统一内存怎么选?<span class="en">GPU, CPU or unified memory?</span> | 显卡显存快但小:RTX 4090 是 1,008 GB/s、24 GB;普通内存大但慢:双通道 DDR5-5600 约 89.6 GB/s;Apple M2 Ultra 的统一内存最多 192 GB、800 GB/s,两头都要一点。真正的取舍是「每 GB 多少钱」和「每 GB/s 多少钱」,这正是做内存架构的人在优化的东西。<span class="en">GPU memory is fast but small, system RAM is big but slow, and unified memory sits in between. The real trade-off is cost per gigabyte versus cost per gigabyte per second, which is what a memory architecture optimizes.</span> |
| 那为什么不全放云上?<span class="en">Why not just use the cloud?</span> | 云在「每个字的成本」上今天确实占优,因为能批处理。本地赢在隐私、延迟、断网可用,以及长任务不按字收费。我不会说云不好,而是说有一大类场景(私人数据、长时间跑的 agent)本地更合适。<span class="en">The cloud wins on cost per token today because of batching. Local wins on privacy, latency, offline use and long-running agents. It's about which workloads belong on your own hardware.</span> |

### 3.14 算账脚本(已实跑)· The estimate script (run locally)

已实跑:2026-10-20 在本机用 python3 跑通,输出贴在代码下面。结构参数来自 Hugging Face 上两个模型的 config.json;设备带宽来自厂商公开规格。
<span class="en">Run on 2026-10-20 with python3; output below. Model shapes come from the models' config files; bandwidths from vendor specs.</span>

```python
# 本地跑大模型的四个账:装不装得下、一秒几个字、KV 缓存多大、为什么数据中心便宜
GB = 1e9  # 这里的 GB 按 10^9 字节算,和厂商标的带宽单位一致

def weight_gb(params, bits):
    # 权重占多少内存 = 参数个数 × 每个参数的位数 / 8
    return params * bits / 8 / GB

def kv_bytes_per_token(layers, kv_heads, head_dim, bytes_per_val=2):
    # 每生成/读入一个 token,要存 K 和 V 两份(×2),每层一份,每个 KV 头一份
    return 2 * layers * kv_heads * head_dim * bytes_per_val

def decode_tok_per_s(bandwidth_gbps, gb_read_per_token):
    # 单人(batch=1)生成时,每出一个字都要把权重从内存里完整读一遍
    # 所以上限 = 每秒能搬的字节 / 每个字要搬的字节
    return bandwidth_gbps / gb_read_per_token

# 1) 权重内存
models = {"Qwen2.5-1.5B": 1.54e9, "Llama-3-70B": 70e9, "DeepSeek-V3 (MoE)": 671e9}
for name, p in models.items():
    print(f"{name:18s} 16-bit {weight_gb(p,16):7.1f} GB | 8-bit {weight_gb(p,8):7.1f} GB | 4-bit {weight_gb(p,4):7.1f} GB")

# 2) KV 缓存(两个模型的结构参数来自 Hugging Face config.json)
qwen = kv_bytes_per_token(layers=28, kv_heads=2, head_dim=128)    # 1536/12 = 128
llama = kv_bytes_per_token(layers=80, kv_heads=8, head_dim=128)   # 8192/64 = 128
for name, b in [("Qwen2.5-1.5B", qwen), ("Llama-3-70B", llama)]:
    print(f"{name:13s} KV per token {b:,} bytes = {b/1024:.0f} KiB; 8K tokens {b*8192/GB:.2f} GB; 32K tokens {b*32768/GB:.2f} GB")

# 3) 一秒几个字(只算读权重,忽略 KV 和计算,所以是上限)
devices = {"PC, 64 GB DDR5-5600 x2ch": (2*8*5.6, 64),  # 2 通道 × 8 字节 × 5.6G 次/秒 = 89.6 GB/s
           "Apple M2 Ultra": (800, 192),
           "RTX 4090": (1008, 24),
           "H100 SXM": (3350, 80)}
w70_int4 = weight_gb(70e9, 4)
for name, (bw, cap) in devices.items():
    if cap < w70_int4:  # 装不下就谈不上速度
        print(f"{name:26s} {bw:7.1f} GB/s, {cap} GB -> 70B 4-bit ({w70_int4:.0f} GB) does NOT fit")
        continue
    print(f"{name:26s} {bw:7.1f} GB/s, {cap} GB -> 70B 4-bit ({w70_int4:.0f} GB): <= {decode_tok_per_s(bw, w70_int4):5.1f} tok/s")

# 4) MoE:容量按全部参数算,每个字只读激活的那部分
ds_total, ds_active = weight_gb(671e9, 4), weight_gb(37e9, 4)
print(f"DeepSeek-V3 4-bit: hold {ds_total:.1f} GB, read {ds_active:.1f} GB per token -> at 800 GB/s <= {decode_tok_per_s(800, ds_active):.1f} tok/s")

# 5) 为什么数据中心便宜:批处理让一次读权重服务很多人
flops_per_param = 2            # 每个参数每个 token 一次乘加 = 2 次运算
bytes_per_param_fp16 = 2
intensity_b1 = flops_per_param / bytes_per_param_fp16   # batch=1 时每搬 1 字节做几次运算
ridge = 989e12 / 3.35e12                                 # H100:算力 / 带宽,超过它才是算力瓶颈
print(f"batch=1 intensity {intensity_b1:.0f} FLOP/byte; H100 needs about {ridge:.0f} FLOP/byte -> batch of about {ridge/intensity_b1:.0f} to stop being memory-bound")
```

怎么读这段输出:
<span class="en">How to read it:</span>

- 第 1 到 3 行:同一个模型,位数减半,内存减半。
  <span class="en">Halve the bits, halve the memory.</span>
- 第 4、5 行:KV 缓存按 token 线性涨,32K 上下文时 70B 模型要多 10.7 GB。
  <span class="en">KV cache grows linearly with tokens: 10.7 GB extra at 32K for a 70B model.</span>
- 第 6 到 9 行:同一个 35 GB 的模型,速度上限和带宽成正比;4090 带宽最高,但放不下。

- 最后一行:单人生成每字节约 1 次运算,H100 要约 295 次才吃饱,这就是数据中心靠批处理省钱的原因。
  <span class="en">One operation per byte versus 295 needed is why datacenters batch.</span>
- 这些都是上限:真实系统还要读 KV 缓存、有计算和调度开销,实际会更低。
  <span class="en">These are upper bounds; real systems are slower.</span>

## C.2 名词表 · Glossary

- **推理引擎(inference engine)**:让训练好的模型真正跑起来、算出回答的那层软件。 The software layer that runs a trained model.
- **内存容量(memory capacity)**:内存一共能放多少字节,决定放不放得下一个模型。 How many bytes fit in memory.
- **内存带宽(memory bandwidth)**:每秒能从内存读多少字节。单人生成时,它决定一秒能出几个字。 Bytes per second memory can deliver; it sets single-user decoding speed.
- **量化(quantization)**:把每个权重存成更少的位数(比如 16 位变 4 位),每一小块配一个缩放系数。字节少了,速度快了,质量可能掉。 Storing weights in fewer bits with per-block scales.
- **BF16 / FP16**:两种 16 位浮点格式,每个数 2 字节。BF16 的数值范围更大,训练常用。 Two 16-bit float formats, 2 bytes per number.
- **INT8 / INT4**:8 位和 4 位整数格式,用于量化。 8-bit and 4-bit integer formats used for quantization.
- **KV 缓存(KV cache)**:模型对已读内容的「笔记」。每个 token、每一层存一对 K、V 向量,对话越长越大,每生成一个字都要读一遍。 Saved keys and values for every past token and layer.
- **prefill**:把整段提示词一次读进去的阶段。很多 token 一起算,主要卡在算力上。 Reading in the whole prompt at once; mostly compute-bound.
- **decode**:一个字一个字往外生成的阶段。单人使用时主要卡在内存带宽上。 Generating one token at a time; memory-bound for a single user.
- **批处理(batching)**:把很多请求凑在一起算,一次读权重服务很多人。数据中心便宜的主要原因。 Serving many requests per weight read.
- **MoE(混合专家)**:模型里有很多「专家」,每个 token 只走其中几个。要放下全部参数,但每个字只读一小部分。 Mixture of experts; each token uses only a few experts.
- **投机解码(speculative decoding)**:小模型先猜几个字,大模型一次验证,猜对的直接收下,平均每读一次权重出不止一个字。 A draft model guesses, the big model verifies several tokens at once.
- **GQA(分组查询注意力)**:让多个查询头共用一组 K、V,KV 缓存变小。Llama-3-70B 是 64 个查询头配 8 个 KV 头。 Grouped-query attention; query heads share K and V to shrink the cache.
- **TensorRT**:NVIDIA 的推理编译器。把模型针对某一块 GPU 编译成引擎,合并层、挑最快的实现、用低精度。 NVIDIA's inference compiler for a specific GPU.
- **ONNX**:一种通用的模型格式。PyTorch 训练好先导出成 ONNX,再交给 TensorRT 编译。 A portable model format between training and deployment.
- **Jetson Nano**:NVIDIA 的小型边缘计算板。你用的是 2 GB 版,CPU 和 GPU 共用内存,GPU 不支持 INT8。 NVIDIA's small edge board; yours is the 2 GB version.
- **YOLOv8**:一类实时目标检测模型,有 n、s、m 等大小,越大越准越慢。 A family of real-time object detectors.
- **mAP50**:目标检测的准确度指标。框和真实框重叠超过一半算对,再对各类取平均精度。 Detection accuracy counting a box as correct at 50% overlap.
- **IoU(交并比)**:两个框的重叠面积除以合起来的面积,0 到 1。 Overlap area divided by combined area of two boxes.
- **FPS**:每秒处理的帧数。 Frames per second.
- **CUDA**:NVIDIA GPU 的编程接口。主机端负责分配显存、搬数据、决定怎么启动 kernel;kernel 是在 GPU 上跑的函数。 NVIDIA's GPU programming interface; host code launches kernels.
- **nvprof**:NVIDIA 的老版性能分析工具,能看 SM 利用率、占用率、显存读带宽。 NVIDIA's older GPU profiler.
- **CLIP**:把图片和文字映射到同一个向量空间的模型,可以不训练直接按文字描述分类(零样本)。 A model that maps images and text into one vector space.
- **LangGraph**:把 agent 写成「步骤图」的框架,每个对话线程的状态会存下来。 A framework that models an agent as a graph of steps.
- **MCP(Model Context Protocol)**:把工具交给模型调用的标准接口。 A standard interface for giving tools to a model.
- **SSE(服务器推送事件)**:服务器一条连接持续往浏览器推消息的方式,常用于流式输出。 Server-sent events, a one-way stream from server to browser.
- **ACK(确认回执)**:请求先回一句「收到了」,活在后台继续做。 A quick acknowledgement before the work continues in the background.
- **sandbox(沙箱)**:隔离的运行环境,代码在里面跑,碰不到外面的数据和网络。 An isolated environment for running code.
- **MongoDB**:文档型数据库。你用它按对话线程存任务状态。 A document database; you stored task state in it.
- **Redis checkpointer**:框架里用 Redis 存对话进度的组件。那个 Redis 只做缓存,内存紧时会删数据。 The framework component that saved conversation progress in Redis.
- **P99**:99% 的请求都比它快的那个延迟值,用来看最慢的那一小撮。 The latency that 99% of requests beat.
- **Q-function**:Walmart 研究里给测试子集打的总分,代表性、行为、失败覆盖三项平均,每项都要到 0.9。 The total score of a test subset in the Walmart research.
- **τ²-bench**:公开的 agent 评测基准,有航空、零售、电信三个领域的对话任务。 A public agent benchmark with airline, retail and telecom tasks.
- **VISTA**:哥大的一篇用户模拟评测论文,你借用了它的三个工具使用指标。 A Columbia user-simulation paper whose tool metrics you reuse.
- **HDBSCAN**:一种按密度聚类的方法,不用事先定簇数。 Density-based clustering without a preset number of clusters.
- **LLM 判官(LLM judge)**:用大模型读对话、按规则打标签或打分。 Using an LLM to label or score conversations.
- **LoRA**:给大模型加两个小矩阵来微调,只训练这两个小矩阵。 Fine-tuning a model through two small added matrices.
- **正交基(orthonormal basis)**:一组两两垂直、长度为 1 的方向。用它当坐标轴,系数就是唯一的坐标。 Perpendicular unit directions used as coordinate axes.
- **负迁移(negative transfer)**:适配之后某个任务反而变差。TaskMap 看的是最差那个任务掉多少。 A task getting worse after adaptation.
- **冷启动(cold start)**:模型从没见过的任务,只能靠任务描述来适配。 Adapting to a task never seen before, from its description.
- **BOLT**:LLVM 的二进制优化工具,按实际运行数据重新排列编译好的程序,让常跑的代码挨在一起。 LLVM's tool that reorders a compiled binary by its runtime profile.
- **PGO(按运行数据优化)**:先跑程序收集哪里常跑,再按这些数据优化。数据过期了就会失效。 Profile-guided optimization.
- **Wax**:一种把过期的运行数据重新对到新程序上的方法,你们的研究拿它和 BOLT 自带的方法比。 A method for remapping stale profiles onto a new binary.
- **OTA(空中升级)**:设备通过网络远程更新软件。你的毕设是汽车上的差分升级。 Over-the-air software updates.
- **DuckDB**:不用服务器的分析型数据库,能直接查 S3 上的 Parquet 文件。 An embedded analytics database that queries files directly.
- **Overture Maps**:亚马逊、Meta、微软等公司发起的开放地图数据,约 6,400 万个地点。 An open map dataset with about 64 million places.
- **双塔模型(two-tower model)**:用户和物品各用一个网络算向量,按相似度召回。DiyoWater 只做了设计和上线门槛。 Separate user and item encoders matched by vector similarity.
- **OPT**:F-1 学生毕业后的工作许可,一般 12 个月。 Work authorization for F-1 graduates, usually 12 months.
- **STEM OPT**:STEM 学位可以在 OPT 之后再延 24 个月,要求雇主加入 E-Verify 并签 I-983 培训计划。 A 24-month extension for STEM degrees with an E-Verify employer.
- **EAD(工卡)**:移民局发的工作许可卡。OPT 必须拿到它才能开始上班。 The employment authorization card.
- **I-765**:申请 EAD 的表。OPT 最早可以在项目结束前 90 天递。 The form used to apply for the EAD.
- **I-20**:学校出的 F-1 身份文件,上面写着项目结束日期。 The school document for F-1 status, with the program end date.
- **CPT**:F-1 学生在读期间、和课程相关的校外实习许可,由学校批。 Work authorization during studies, approved by the school.
- **ISSO**:哥大的国际学生和学者办公室,管 F-1 的工作许可。 Columbia's international students and scholars office.
- **E-Verify**:美国政府的雇佣资格核验系统。雇主加入后,员工才能用 STEM OPT。 The government's employment eligibility system.
- **I-983**:STEM OPT 的培训计划表,学生和雇主一起填。 The STEM OPT training plan signed with the employer.
- **H-1B**:美国的工作签证,要雇主担保。 A US work visa that requires employer sponsorship.
- **premium processing(加急)**:付费让移民局在约 30 天内处理,2026 年 3 月起 OPT 加急费是 $1,780。 Paid faster USCIS processing, about 30 days.

<script type="application/json" id="gloss">{"推理引擎": "推理引擎(inference engine):让训练好的模型真正跑起来、算出回答的那层软件。 The software layer that runs a trained model.", "inference engine": "推理引擎(inference engine):让训练好的模型真正跑起来、算出回答的那层软件。 The software layer that runs a trained model.", "内存容量": "内存容量(memory capacity):内存一共能放多少字节,决定放不放得下一个模型。 How many bytes fit in memory.", "memory capacity": "内存容量(memory capacity):内存一共能放多少字节,决定放不放得下一个模型。 How many bytes fit in memory.", "内存带宽": "内存带宽(memory bandwidth):每秒能从内存读多少字节。单人生成时,它决定一秒能出几个字。 Bytes per second memory can deliver; it sets single-user decoding speed.", "memory bandwidth": "内存带宽(memory bandwidth):每秒能从内存读多少字节。单人生成时,它决定一秒能出几个字。 Bytes per second memory can deliver; it sets single-user decoding speed.", "量化": "量化(quantization):把每个权重存成更少的位数(比如 16 位变 4 位),每一小块配一个缩放系数。字节少了,速度快了,质量可能掉。 Storing weights in fewer bits with per-block scales.", "quantization": "量化(quantization):把每个权重存成更少的位数(比如 16 位变 4 位),每一小块配一个缩放系数。字节少了,速度快了,质量可能掉。 Storing weights in fewer bits with per-block scales.", "BF16": "BF16 / FP16:两种 16 位浮点格式,每个数 2 字节。BF16 的数值范围更大,训练常用。 Two 16-bit float formats, 2 bytes per number.", "FP16": "BF16 / FP16:两种 16 位浮点格式,每个数 2 字节。BF16 的数值范围更大,训练常用。 Two 16-bit float formats, 2 bytes per number.", "INT8": "INT8 / INT4:8 位和 4 位整数格式,用于量化。 8-bit and 4-bit integer formats used for quantization.", "INT4": "INT8 / INT4:8 位和 4 位整数格式,用于量化。 8-bit and 4-bit integer formats used for quantization.", "KV 缓存": "KV 缓存(KV cache):模型对已读内容的「笔记」。每个 token、每一层存一对 K、V 向量,对话越长越大,每生成一个字都要读一遍。 Saved keys and values for every past token and layer.", "KV cache": "KV 缓存(KV cache):模型对已读内容的「笔记」。每个 token、每一层存一对 K、V 向量,对话越长越大,每生成一个字都要读一遍。 Saved keys and values for every past token and layer.", "prefill": "prefill:把整段提示词一次读进去的阶段。很多 token 一起算,主要卡在算力上。 Reading in the whole prompt at once; mostly compute-bound.", "decode": "decode:一个字一个字往外生成的阶段。单人使用时主要卡在内存带宽上。 Generating one token at a time; memory-bound for a single user.", "批处理": "批处理(batching):把很多请求凑在一起算,一次读权重服务很多人。数据中心便宜的主要原因。 Serving many requests per weight read.", "batching": "批处理(batching):把很多请求凑在一起算,一次读权重服务很多人。数据中心便宜的主要原因。 Serving many requests per weight read.", "MoE": "MoE(混合专家):模型里有很多「专家」,每个 token 只走其中几个。要放下全部参数,但每个字只读一小部分。 Mixture of experts; each token uses only a few experts.", "混合专家": "MoE(混合专家):模型里有很多「专家」,每个 token 只走其中几个。要放下全部参数,但每个字只读一小部分。 Mixture of experts; each token uses only a few experts.", "投机解码": "投机解码(speculative decoding):小模型先猜几个字,大模型一次验证,猜对的直接收下,平均每读一次权重出不止一个字。 A draft model guesses, the big model verifies several tokens at once.", "speculative decoding": "投机解码(speculative decoding):小模型先猜几个字,大模型一次验证,猜对的直接收下,平均每读一次权重出不止一个字。 A draft model guesses, the big model verifies several tokens at once.", "GQA": "GQA(分组查询注意力):让多个查询头共用一组 K、V,KV 缓存变小。Llama-3-70B 是 64 个查询头配 8 个 KV 头。 Grouped-query attention; query heads share K and V to shrink the cache.", "分组查询注意力": "GQA(分组查询注意力):让多个查询头共用一组 K、V,KV 缓存变小。Llama-3-70B 是 64 个查询头配 8 个 KV 头。 Grouped-query attention; query heads share K and V to shrink the cache.", "TensorRT": "TensorRT:NVIDIA 的推理编译器。把模型针对某一块 GPU 编译成引擎,合并层、挑最快的实现、用低精度。 NVIDIA's inference compiler for a specific GPU.", "ONNX": "ONNX:一种通用的模型格式。PyTorch 训练好先导出成 ONNX,再交给 TensorRT 编译。 A portable model format between training and deployment.", "Jetson Nano": "Jetson Nano:NVIDIA 的小型边缘计算板。你用的是 2 GB 版,CPU 和 GPU 共用内存,GPU 不支持 INT8。 NVIDIA's small edge board; yours is the 2 GB version.", "YOLOv8": "YOLOv8:一类实时目标检测模型,有 n、s、m 等大小,越大越准越慢。 A family of real-time object detectors.", "mAP50": "mAP50:目标检测的准确度指标。框和真实框重叠超过一半算对,再对各类取平均精度。 Detection accuracy counting a box as correct at 50% overlap.", "IoU": "IoU(交并比):两个框的重叠面积除以合起来的面积,0 到 1。 Overlap area divided by combined area of two boxes.", "交并比": "IoU(交并比):两个框的重叠面积除以合起来的面积,0 到 1。 Overlap area divided by combined area of two boxes.", "FPS": "FPS:每秒处理的帧数。 Frames per second.", "CUDA": "CUDA:NVIDIA GPU 的编程接口。主机端负责分配显存、搬数据、决定怎么启动 kernel;kernel 是在 GPU 上跑的函数。 NVIDIA's GPU programming interface; host code launches kernels.", "nvprof": "nvprof:NVIDIA 的老版性能分析工具,能看 SM 利用率、占用率、显存读带宽。 NVIDIA's older GPU profiler.", "CLIP": "CLIP:把图片和文字映射到同一个向量空间的模型,可以不训练直接按文字描述分类(零样本)。 A model that maps images and text into one vector space.", "LangGraph": "LangGraph:把 agent 写成「步骤图」的框架,每个对话线程的状态会存下来。 A framework that models an agent as a graph of steps.", "MCP": "MCP(Model Context Protocol):把工具交给模型调用的标准接口。 A standard interface for giving tools to a model.", "Model Context Protocol": "MCP(Model Context Protocol):把工具交给模型调用的标准接口。 A standard interface for giving tools to a model.", "SSE": "SSE(服务器推送事件):服务器一条连接持续往浏览器推消息的方式,常用于流式输出。 Server-sent events, a one-way stream from server to browser.", "服务器推送事件": "SSE(服务器推送事件):服务器一条连接持续往浏览器推消息的方式,常用于流式输出。 Server-sent events, a one-way stream from server to browser.", "ACK": "ACK(确认回执):请求先回一句「收到了」,活在后台继续做。 A quick acknowledgement before the work continues in the background.", "确认回执": "ACK(确认回执):请求先回一句「收到了」,活在后台继续做。 A quick acknowledgement before the work continues in the background.", "sandbox": "sandbox(沙箱):隔离的运行环境,代码在里面跑,碰不到外面的数据和网络。 An isolated environment for running code.", "MongoDB": "MongoDB:文档型数据库。你用它按对话线程存任务状态。 A document database; you stored task state in it.", "Redis checkpointer": "Redis checkpointer:框架里用 Redis 存对话进度的组件。那个 Redis 只做缓存,内存紧时会删数据。 The framework component that saved conversation progress in Redis.", "P99": "P99:99% 的请求都比它快的那个延迟值,用来看最慢的那一小撮。 The latency that 99% of requests beat.", "Q-function": "Q-function:Walmart 研究里给测试子集打的总分,代表性、行为、失败覆盖三项平均,每项都要到 0.9。 The total score of a test subset in the Walmart research.", "τ²-bench": "τ²-bench:公开的 agent 评测基准,有航空、零售、电信三个领域的对话任务。 A public agent benchmark with airline, retail and telecom tasks.", "VISTA": "VISTA:哥大的一篇用户模拟评测论文,你借用了它的三个工具使用指标。 A Columbia user-simulation paper whose tool metrics you reuse.", "HDBSCAN": "HDBSCAN:一种按密度聚类的方法,不用事先定簇数。 Density-based clustering without a preset number of clusters.", "LLM 判官": "LLM 判官(LLM judge):用大模型读对话、按规则打标签或打分。 Using an LLM to label or score conversations.", "LLM judge": "LLM 判官(LLM judge):用大模型读对话、按规则打标签或打分。 Using an LLM to label or score conversations.", "LoRA": "LoRA:给大模型加两个小矩阵来微调,只训练这两个小矩阵。 Fine-tuning a model through two small added matrices.", "正交基": "正交基(orthonormal basis):一组两两垂直、长度为 1 的方向。用它当坐标轴,系数就是唯一的坐标。 Perpendicular unit directions used as coordinate axes.", "orthonormal basis": "正交基(orthonormal basis):一组两两垂直、长度为 1 的方向。用它当坐标轴,系数就是唯一的坐标。 Perpendicular unit directions used as coordinate axes.", "负迁移": "负迁移(negative transfer):适配之后某个任务反而变差。TaskMap 看的是最差那个任务掉多少。 A task getting worse after adaptation.", "negative transfer": "负迁移(negative transfer):适配之后某个任务反而变差。TaskMap 看的是最差那个任务掉多少。 A task getting worse after adaptation.", "冷启动": "冷启动(cold start):模型从没见过的任务,只能靠任务描述来适配。 Adapting to a task never seen before, from its description.", "cold start": "冷启动(cold start):模型从没见过的任务,只能靠任务描述来适配。 Adapting to a task never seen before, from its description.", "BOLT": "BOLT:LLVM 的二进制优化工具,按实际运行数据重新排列编译好的程序,让常跑的代码挨在一起。 LLVM's tool that reorders a compiled binary by its runtime profile.", "PGO": "PGO(按运行数据优化):先跑程序收集哪里常跑,再按这些数据优化。数据过期了就会失效。 Profile-guided optimization.", "按运行数据优化": "PGO(按运行数据优化):先跑程序收集哪里常跑,再按这些数据优化。数据过期了就会失效。 Profile-guided optimization.", "Wax": "Wax:一种把过期的运行数据重新对到新程序上的方法,你们的研究拿它和 BOLT 自带的方法比。 A method for remapping stale profiles onto a new binary.", "OTA": "OTA(空中升级):设备通过网络远程更新软件。你的毕设是汽车上的差分升级。 Over-the-air software updates.", "空中升级": "OTA(空中升级):设备通过网络远程更新软件。你的毕设是汽车上的差分升级。 Over-the-air software updates.", "DuckDB": "DuckDB:不用服务器的分析型数据库,能直接查 S3 上的 Parquet 文件。 An embedded analytics database that queries files directly.", "Overture Maps": "Overture Maps:亚马逊、Meta、微软等公司发起的开放地图数据,约 6,400 万个地点。 An open map dataset with about 64 million places.", "双塔模型": "双塔模型(two-tower model):用户和物品各用一个网络算向量,按相似度召回。DiyoWater 只做了设计和上线门槛。 Separate user and item encoders matched by vector similarity.", "two-tower model": "双塔模型(two-tower model):用户和物品各用一个网络算向量,按相似度召回。DiyoWater 只做了设计和上线门槛。 Separate user and item encoders matched by vector similarity.", "OPT": "OPT:F-1 学生毕业后的工作许可,一般 12 个月。 Work authorization for F-1 graduates, usually 12 months.", "STEM OPT": "STEM OPT:STEM 学位可以在 OPT 之后再延 24 个月,要求雇主加入 E-Verify 并签 I-983 培训计划。 A 24-month extension for STEM degrees with an E-Verify employer.", "EAD": "EAD(工卡):移民局发的工作许可卡。OPT 必须拿到它才能开始上班。 The employment authorization card.", "工卡": "EAD(工卡):移民局发的工作许可卡。OPT 必须拿到它才能开始上班。 The employment authorization card.", "I-765": "I-765:申请 EAD 的表。OPT 最早可以在项目结束前 90 天递。 The form used to apply for the EAD.", "I-20": "I-20:学校出的 F-1 身份文件,上面写着项目结束日期。 The school document for F-1 status, with the program end date.", "CPT": "CPT:F-1 学生在读期间、和课程相关的校外实习许可,由学校批。 Work authorization during studies, approved by the school.", "ISSO": "ISSO:哥大的国际学生和学者办公室,管 F-1 的工作许可。 Columbia's international students and scholars office.", "E-Verify": "E-Verify:美国政府的雇佣资格核验系统。雇主加入后,员工才能用 STEM OPT。 The government's employment eligibility system.", "I-983": "I-983:STEM OPT 的培训计划表,学生和雇主一起填。 The STEM OPT training plan signed with the employer.", "H-1B": "H-1B:美国的工作签证,要雇主担保。 A US work visa that requires employer sponsorship.", "premium processing": "premium processing(加急):付费让移民局在约 30 天内处理,2026 年 3 月起 OPT 加急费是 $1,780。 Paid faster USCIS processing, about 30 days.", "加急": "premium processing(加急):付费让移民局在约 30 天内处理,2026 年 3 月起 OPT 加急费是 $1,780。 Paid faster USCIS processing, about 30 days."}</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<script>
const md=document.getElementById('src').textContent;
const main=document.getElementById('body');
main.innerHTML=marked.parse(md,{mangle:false,headerIds:false});
main.querySelectorAll('p,li,td').forEach(el=>{el.innerHTML=el.innerHTML.replace(/🈶([^<）]*)/g,'<span class="zh">🈶$1</span>');});
const DKEY='alpaca_intro_done_v1';const FKEY='alpaca_intro_fav_v1';const LKEY='alpaca_intro_later_v1';
function ld(k,d){try{return JSON.parse(localStorage.getItem(k)||d)}catch(e){return JSON.parse(d)}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let done=ld(DKEY,'{}');
function hkey(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return 'h'+h.toString(36)}

/* 篇 banners + TOC groups */
const tl=document.getElementById('tl');const heads=[];let n=0;
let group=null,gwrap=null,lastL2=null,l2count=0;
const groups=[];
main.querySelectorAll('h1,h2,h3').forEach(h=>{
  const raw=h.textContent.trim();
  const id='s'+(n++);h.id=id;heads.push(h);
  if(h.tagName==='H1'&&raw.startsWith('篇')){
    const desc=h.nextElementSibling&&h.nextElementSibling.tagName==='BLOCKQUOTE'?h.nextElementSibling:null;
    const d=document.createElement('div');d.className='part';d.id=id;
    d.innerHTML='<div class="k">PART</div><h1></h1>'+(desc?'<p>'+desc.textContent+'</p>':'');
    d.querySelector('h1').textContent=raw;h.replaceWith(d);if(desc)desc.remove();
    group=document.createElement('details');group.open=true;
    group.innerHTML='<summary>'+raw+'<span class="pp"></span></summary>';
    gwrap=document.createElement('div');group.appendChild(gwrap);tl.appendChild(group);
    groups.push({el:group,items:[]});
    return;
  }
  const key=hkey(raw);h.dataset.k=key;
  const a=document.createElement('a');a.href='#'+id;a.textContent=raw;
  a.className=h.tagName==='H1'?'l1':h.tagName==='H2'?'l2':'l3';
  if(h.tagName==='H3'){if(lastL2)a.classList.add('of-'+lastL2);}
  if(h.tagName==='H2'){lastL2=key;a.dataset.k=key;}
  if(done[key])a.classList.add('done');
  a.dataset.hk=key;
  (gwrap||tl).appendChild(a);
  if(h.tagName!=='H1'&&groups.length)groups[groups.length-1].items.push(key);
  if(h.tagName==='H2'){a.addEventListener('click',()=>{a.classList.toggle('open');});}
  /* heading widgets */
  const chk=document.createElement('span');chk.className='chk'+(done[key]?' on':'');chk.textContent=done[key]?'✓ 掌握':'☐ 掌握';chk.title='勾上=这节我掌握了';
  chk.onclick=()=>{done[key]=!done[key];if(!done[key])delete done[key];sv(DKEY,done);chk.className='chk'+(done[key]?' on':'');chk.textContent=done[key]?'✓ 掌握':'☐ 掌握';a.classList.toggle('done',!!done[key]);prog();};
  h.appendChild(chk);
  {const fv=ld(FKEY,'{}');const st=document.createElement('span');st.className='fav'+(fv[key]?' on':'');st.textContent=fv[key]?'★ 已收藏':'☆ 收藏';st.title='收藏这一节,集中显示在页面最上面';
   st.onclick=()=>{const f=ld(FKEY,'{}');if(f[key])delete f[key];else f[key]={t:raw.slice(0,80),ts:Date.now()};sv(FKEY,f);st.className='fav'+(f[key]?' on':'');st.textContent=f[key]?'★ 已收藏':'☆ 收藏';renderFavs();};
   h.appendChild(st);}
  {const lv=ld(LKEY,'{}');const lt=document.createElement('span');lt.className='lat'+(lv[key]?' on':'');lt.textContent=lv[key]?'🔖 待看':'🔖 稍后';lt.title='标记稍后再看';if(lv[key])a.classList.add('lat-on');
   lt.onclick=()=>{const f=ld(LKEY,'{}');if(f[key])delete f[key];else f[key]={t:raw.slice(0,80),ts:Date.now()};sv(LKEY,f);lt.className='lat'+(f[key]?' on':'');lt.textContent=f[key]?'🔖 待看':'🔖 稍后';a.classList.toggle('lat-on',!!f[key]);renderLater();};
   h.appendChild(lt);}
  const ask=document.createElement('a');ask.className='ask';ask.textContent='＋问';ask.title='对这一节提问';
  ask.onclick=()=>{setSec(h);document.getElementById('qtext').focus();};
  h.appendChild(ask);
});
function prog(){
  let T=0,D=0;
  groups.forEach(g=>{const t=g.items.length,d=g.items.filter(k=>done[k]).length;T+=t;D+=d;g.el.querySelector('.pp').textContent=d+'/'+t;});
  document.getElementById('allprog').innerHTML='已掌握 '+D+' / '+T+' 节<div class="bar"><i style="width:'+(T?100*D/T:0)+'%"></i></div>';
}
prog();
function secNodes(h){const out=[];const lvl=+h.tagName[1];let e=h.nextElementSibling;while(e){if(/^H[1-3]$/.test(e.tagName)&&(+e.tagName[1])<=lvl)break;if(!e.classList.contains('chnav'))out.push(e);e=e.nextElementSibling;}return out;}
function renderFavs(){const box=document.getElementById('favs');const f=ld(FKEY,'{}');const ks=Object.keys(f).sort((a,b)=>f[a].ts-f[b].ts);
  box.innerHTML='';const h2=document.createElement('h2');h2.textContent='⭐ 我的收藏 ('+ks.length+')';box.appendChild(h2);
  if(!ks.length){const p=document.createElement('p');p.className='hint';p.textContent='点任意标题旁的「☆ 收藏」,那一节会集中出现在这里;可以一键全部展开,面试前只看这一块。收藏存在这台设备的浏览器里。';box.appendChild(p);return;}
  const all=document.createElement('button');all.className='fbtn';all.textContent='全部展开';let open=false;
  all.onclick=()=>{open=!open;all.textContent=open?'全部收起':'全部展开';box.querySelectorAll('.fi').forEach(fi=>fi._set(open));};h2.appendChild(all);
  const cp=document.createElement('button');cp.className='fbtn';cp.textContent='复制收藏清单';cp.onclick=()=>{const txt=ks.map((k,i)=>(i+1)+'. '+f[k].t).join('\n');try{navigator.clipboard.writeText(txt).then(()=>{cp.textContent='已复制';setTimeout(()=>cp.textContent='复制收藏清单',1500);},()=>{prompt&&0;});}catch(e){}};h2.appendChild(cp);
  ks.forEach(k=>{const h=heads.find(x=>x.dataset.k===k);const fi=document.createElement('div');fi.className='fi';const row=document.createElement('div');row.className='row';
    const a=document.createElement('a');a.className='t';a.textContent=f[k].t;if(h)a.href='#'+h.id;row.appendChild(a);
    const tg=document.createElement('button');tg.className='fbtn';tg.textContent='展开';row.appendChild(tg);
    const rm=document.createElement('button');rm.className='fbtn';rm.textContent='✕';rm.title='取消收藏';rm.onclick=()=>{const g=ld(FKEY,'{}');delete g[k];sv(FKEY,g);if(h){const st=h.querySelector('.fav');if(st){st.className='fav';st.textContent='☆ 收藏';}}renderFavs();};row.appendChild(rm);
    fi.appendChild(row);const body=document.createElement('div');body.className='body';body.hidden=true;fi.appendChild(body);
    fi._set=(on)=>{if(on&&!body.childNodes.length&&h){secNodes(h).forEach(n=>{const c=n.cloneNode(true);c.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));c.removeAttribute&&c.removeAttribute('id');body.appendChild(c);});}body.hidden=!on;tg.textContent=on?'收起':'展开';};
    tg.onclick=()=>fi._set(body.hidden);box.appendChild(fi);});
}
renderFavs();
function renderLater(){const box=document.getElementById('later');const f=ld(LKEY,'{}');const ks=Object.keys(f).sort((a,b)=>f[a].ts-f[b].ts);
  box.innerHTML='';if(!ks.length){box.hidden=true;return;}box.hidden=false;
  const h2=document.createElement('h2');h2.textContent='🔖 稍后再看 ('+ks.length+')';box.appendChild(h2);

    box.appendChild(fi);});
}

const Q=[["速览", "第 0 章"], ["公司", "第 1 章"], ["开场项目", "第 2 章"], ["动机安排", "A 部分"], ["本地大模型", "B 部分"], ["押题 32", "C 部分"], ["反问", "第 4 章"], ["请你确认", "附录 D"]];

/* ---- 生动化:给标注块上色 ---- */

/* ---- 章标题:编号徽章 + 预计阅读时间 + 上一章/下一章 ---- */
const CPM=420; /* 中文阅读速度:字/分钟 */
const chapters=[];
(function(){
  const h1s=[...main.querySelectorAll('h1')].filter(h=>!h.closest('.part'));
  h1s.forEach((h,i)=>{
    let len=0;let e=h.nextElementSibling;const nodes=[];
    while(e&&!(e.tagName==='H1')&&!e.classList.contains('part')){len+=e.innerText.length;nodes.push(e);e=e.nextElementSibling;}
    const mins=Math.max(1,Math.round(len/CPM));
    h.classList.add('ch');const sm=document.createElement('small');sm.textContent='预计阅读 ≈ '+mins+' 分钟 · '+nodes.filter(n=>n.tagName==='H2').length+' 节';h.appendChild(sm);
    chapters.push({h,nodes,len,mins,last:nodes[nodes.length-1]||h});
    const a=tl.querySelector('a[href="#'+h.id+'"]');if(a){const r=document.createElement('span');r.className='rt';r.textContent=mins+'′';a.appendChild(r);}
  });
  chapters.forEach((c,i)=>{
    const nav=document.createElement('div');nav.className='chnav';
    const prev=chapters[i-1],next=chapters[i+1];
    nav.innerHTML=(prev?'<a href="#'+prev.h.id+'">← 上一章:'+prev.h.firstChild.textContent.trim().slice(0,22)+'</a>':'<span></span>')+(next?'<a href="#'+next.h.id+'">下一章:'+next.h.firstChild.textContent.trim().slice(0,22)+' →</a>':'<span></span>');
    c.last.after(nav);
  });
  main.querySelectorAll('h2').forEach(h=>{const m=h.firstChild&&h.firstChild.textContent.match(/^\s*(§?\d+(?:\.\d+)*|附录 [A-C]|[一二三四五六七八九十]+、)/);if(m){const n=document.createElement('span');n.className='num';n.textContent=m[1].trim();h.firstChild.textContent=h.firstChild.textContent.replace(m[0],'').replace(/^[·\s]+/,'');h.prepend(n);}});
})();
function chapterStatus(){
  const y=window.scrollY+140;let cur=null;
  for(const c of chapters){if(c.h.offsetTop<=y)cur=c;else break;}
  if(!cur)return;
  const start=cur.h.offsetTop,end=cur.last.offsetTop+cur.last.offsetHeight;
  const pct=Math.min(100,Math.max(0,Math.round(100*(y-start)/Math.max(1,end-start))));
  document.getElementById('chname').textContent=cur.h.firstChild.textContent.trim().slice(0,40);
  document.getElementById('chleft').textContent='还剩 ≈ '+Math.max(0,Math.round(cur.mins*(100-pct)/100))+' 分钟';
  document.getElementById('chprog').style.width=pct+'%';document.getElementById('chpct').textContent=pct+'%';
}
window.addEventListener('scroll',()=>{clearTimeout(window.__c);window.__c=setTimeout(chapterStatus,60);});chapterStatus();

/* ---- 名词悬停解释(来自附录 C) ---- */
(function(){
  const G=JSON.parse(document.getElementById('gloss').textContent||'{}');
  const terms=Object.keys(G).sort((a,b)=>b.length-a.length);if(!terms.length)return;
  const esc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('('+terms.map(esc).join('|')+')','gi');
  const lower={};terms.forEach(t=>lower[t.toLowerCase()]=t);
  const appC=heads.find(h=>h.textContent.trim().startsWith('附录 C'));
  const skip=n=>{for(let e=n.parentElement;e;e=e.parentElement){const tg=e.tagName;if(tg==='PRE'||tg==='CODE'||tg==='A'||tg==='H1'||tg==='H2'||tg==='H3'||tg==='SCRIPT'||e.classList.contains('gl')||e.classList.contains('part'))return true;}return false;};
  let inC=false;
  const blocks=main.querySelectorAll('p,li,td,th,blockquote');
  blocks.forEach(bl=>{
    if(appC&&bl.compareDocumentPosition(appC)&Node.DOCUMENT_POSITION_PRECEDING)return; /* skip glossary itself */
    const seen=new Set();
    const walker=document.createTreeWalker(bl,NodeFilter.SHOW_TEXT,{acceptNode:n=>skip(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(nd=>{
      const txt=nd.nodeValue;if(!re.test(txt)){re.lastIndex=0;return;}re.lastIndex=0;
      const frag=document.createDocumentFragment();let last=0,m,changed=false;
      while((m=re.exec(txt))){const key=lower[m[1].toLowerCase()];if(!key||seen.has(key)){continue;}
        /* latin terms must be whole words */
        if(/^[A-Za-z0-9+.\- ]+$/.test(key)){const b=txt[m.index-1]||' ',a=txt[m.index+m[0].length]||' ';if(/[A-Za-z0-9_]/.test(b)||/[A-Za-z0-9_]/.test(a))continue;}
        seen.add(key);frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        const sp=document.createElement('span');sp.className='gl';sp.textContent=m[0];sp.dataset.d=G[key];frag.appendChild(sp);last=m.index+m[0].length;changed=true;}
      if(changed){frag.appendChild(document.createTextNode(txt.slice(last)));nd.replaceWith(frag);}
    });
  });
  const tip=document.getElementById('tip');
  main.addEventListener('mouseover',e=>{const t=e.target.closest('.gl');if(!t)return;const d=t.dataset.d;const i=d.indexOf(':');tip.innerHTML='<b></b> ';tip.querySelector('b').textContent=d.slice(0,i);tip.appendChild(document.createTextNode(d.slice(i+1)));tip.style.display='block';
    const r=t.getBoundingClientRect();let x=r.left,y=r.bottom+8;if(x+370>innerWidth)x=innerWidth-380;if(y+140>innerHeight)y=r.top-8-tip.offsetHeight;tip.style.left=x+'px';tip.style.top=y+'px';});
  main.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.gl'))tip.style.display='none';});
})();
document.getElementById('top').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
/* reading progress + current highlight */
const rp=document.getElementById('rp');
function savePos(){try{let best=null;for(const h of heads){if(!h.isConnected)continue;if(h.getBoundingClientRect().top<=120)best=h;else break;}if(best&&best.dataset.k){localStorage.setItem('alpaca_intro_pos_v1',JSON.stringify({k:best.dataset.k,off:Math.round(window.scrollY-(best.getBoundingClientRect().top+window.scrollY)),when:Date.now()}));}}catch(e){}}
function onscroll(){const h=document.documentElement;rp.style.width=(100*h.scrollTop/(h.scrollHeight-h.clientHeight))+'%';clearTimeout(window.__t);window.__t=setTimeout(()=>{nearest();savePos();},80);}

/* ---- 右侧 Q&A:用 Claude 生成解答(只在 claude.ai 里打开的版本可用) ---- */
let SAMPLE=null;const sampleReady=(async()=>{await new Promise(r=>setTimeout(r,0));try{if(window.claude&&window.claude.use){SAMPLE=await window.claude.use('sample');}}catch(e){SAMPLE=null;}try{render();}catch(e){}})();
function secText(id){const h=document.getElementById(id);if(!h)return '';let t=[];let e=h.nextElementSibling;const lvl=+h.tagName[1];while(e){if(/^H[1-3]$/.test(e.tagName)&&(+e.tagName[1])<=lvl)break;if(!e.classList.contains('part'))t.push(e.innerText);e=e.nextElementSibling;}return t.join('\n').slice(0,6000);}
async function answer(it,box,btn){
  if(!SAMPLE){box.textContent='这个功能只在 claude.ai 上打开的版本可用。本地版请点「复制全部为 Markdown」发给我。';return;}
  const ctx=secText(it.id);btn.disabled=true;box.className='ans think';box.textContent='Claude 在想…(5–60 秒)';
  const prompt='你是在帮一位 2027 届新毕业生准备 Alpaca Research(波士顿/剑桥的个人 AI 全栈创业公司:硬件+推理引擎+模型+应用)Intro Call(10/23 周五 11:30 ET,30 分钟 Google Meet):公司、开场、项目深挖、动机和安排、本地跑大模型从零讲、32 题押题、反问。她正在读一份冲刺手册,看到下面这一节时提了一个问题。请用中文、零基础也能懂的口吻回答:先一句人话给结论,再展开解释,必要时给面试里可以直接说的一句英文原话。不要编造她的项目细节;涉及她的项目只引用手册原文。控制在 300 字以内。\n\n【她正在看的章节】'+(it.title||'')+'\n'+ctx+'\n\n【她的问题】'+it.text;
  try{const {text}=await SAMPLE(prompt,{onText:({text})=>{box.className='ans';box.textContent=text;}});
    const all=load();const i=all.findIndex(x=>x.k===it.k);if(i>=0){all[i].answer=text;store(all);}box.className='ans';box.textContent=text;}
  catch(e){box.className='ans';box.textContent=e&&e.text?e.text:(e&&e.code==='not_granted'?'你没有允许这个页面使用 Claude,所以生成不了。':'生成失败('+(e&&e.code||'unknown')+'),稍后再试或发给我。');}
  finally{btn.disabled=false;}
}
/* ---- 右侧 Q&A ---- */
const KEY='alpaca_intro_qa_v1';
let cur={id:'',title:'(未定位)'};
function setSec(h){cur={id:h.id,title:h.textContent.replace('＋问','').replace(/[☐✓] 掌握/,'').replace(/[☆★] (已)?收藏/,'').replace(/🔖 (稍后|待看)/,'').trim()};try{if(h.dataset.k)localStorage.setItem('alpaca_intro_last_v1',JSON.stringify({k:h.dataset.k,title:cur.title,when:Date.now()}));}catch(e){}document.getElementById('cursec').textContent='当前章节:'+cur.title;
  tl.querySelectorAll('a.cur').forEach(a=>a.classList.remove('cur'));const a=tl.querySelector('a[href="#'+h.id+'"]');if(a)a.classList.add('cur');}
function nearest(){let best=null;for(const h of heads){if(!h.isConnected)continue;const r=h.getBoundingClientRect();if(r.top<=120)best=h;else break;}if(best)setSec(best);}
nearest();
(function(){try{const LAND="第 0 章";let _sv=null;try{_sv=JSON.parse(localStorage.getItem('alpaca_intro_pos_v1')||'null')||JSON.parse(localStorage.getItem('alpaca_intro_last_v1')||'null')}catch(e){}if(LAND&&!(_sv&&_sv.k)){const h=heads.find(x=>x.textContent.indexOf(LAND)>=0);if(h){const go=()=>{window.scrollTo({top:Math.max(0,h.getBoundingClientRect().top+window.scrollY-10),behavior:'auto'});try{h.scrollIntoView({block:'start',behavior:'auto'})}catch(e){}};go();setTimeout(go,300);setTimeout(go,1200);setTimeout(go,2500);return;}}let p=JSON.parse(localStorage.getItem('alpaca_intro_pos_v1')||'null');if(location.hash&&!(p&&p.k))return;if(!p||!p.k){const l=JSON.parse(localStorage.getItem('alpaca_intro_last_v1')||'null');if(l&&l.k)p={k:l.k,off:0};}if(!p||!p.k)return;const h=heads.find(x=>x.dataset.k===p.k);if(!h)return;const go=()=>{const y=h.getBoundingClientRect().top+window.scrollY+(p.off||0);window.scrollTo({top:Math.max(0,y),behavior:'auto'});};go();setTimeout(go,300);setTimeout(go,1200);}catch(e){}})();
function load(){return ld(KEY,'[]')}
function store(list){sv(KEY,list)}
function render(){
  const list=load();const box=document.getElementById('notes');box.innerHTML='';
  if(!list.length){box.innerHTML='<div style="color:var(--mut);font-size:13px">还没有问题。</div>';return;}
  list.slice().reverse().forEach(it=>{
    const d=document.createElement('div');d.className='note'+(it.done?' answered':'');
    d.innerHTML='<div class="t"><span>'+(it.title||'')+' · '+it.when+'</span><span><a data-a="jump">跳转</a> <a data-a="done">'+(it.done?'未答':'已答')+'</a> <a data-a="del">删</a></span></div><div class="b"></div>';
    d.querySelector('.b').textContent=it.text;
    const ab=document.createElement('div');ab.className='ans';ab.hidden=!it.answer;ab.textContent=it.answer||'';d.appendChild(ab);
    const bb=document.createElement('div');bb.className='btns2';const gen=document.createElement('button');gen.textContent=it.answer?'重新生成解答':'生成解答';gen.title=SAMPLE?'用 Claude 生成这一题的解答':'只在 claude.ai 上打开的版本可用';gen.onclick=()=>{ab.hidden=false;answer(it,ab,gen);};bb.appendChild(gen);d.appendChild(bb);
    d.querySelectorAll('.t a').forEach(a=>a.onclick=()=>{
      const all=load();const i=all.findIndex(x=>x.k===it.k);if(i<0)return;
      if(a.dataset.a==='del')all.splice(i,1);
      if(a.dataset.a==='done')all[i].done=!all[i].done;
      if(a.dataset.a==='jump'&&it.id){location.hash='#'+it.id;return;}
      store(all);render();
    });
    box.appendChild(d);
  });
}
document.getElementById('save').onclick=()=>{
  const ta=document.getElementById('qtext');const text=ta.value.trim();if(!text)return;
  const list=load();const now=new Date();const when=now.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  list.push({k:Date.now()+Math.random(),id:cur.id,title:cur.title,text,when,done:false});
  store(list);ta.value='';render();
};
document.getElementById('clear').onclick=()=>{const b=document.getElementById('clear');if(load().length&&b.dataset.arm){store([]);render();delete b.dataset.arm;b.textContent='清空全部';}else{b.dataset.arm='1';b.textContent='再点一次确认清空';setTimeout(()=>{delete b.dataset.arm;b.textContent='清空全部';},3000);}};
document.getElementById('copy').onclick=async()=>{
  const list=load().filter(x=>!x.done);
  const out=['## ❓ 待答(从 HTML 复制,'+new Date().toLocaleDateString('zh-CN')+')',''].concat(list.map(x=>'- **['+x.title+']** '+x.text.replace(/\n/g,' '))).join('\n');
  const b=document.getElementById('copy');
  try{await navigator.clipboard.writeText(out);b.textContent='已复制 '+list.length+' 条';}
  catch(e){const ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');b.textContent='已复制 '+list.length+' 条';}catch(_){b.textContent='复制失败,手动选中';}ta.remove();}
  setTimeout(()=>b.textContent='复制全部为 Markdown',2000);
};
render();
