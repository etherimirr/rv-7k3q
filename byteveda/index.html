## A1 直线检测:Canny + Hough · Line detection with Canny and Hough 【预测,由初筛真题延伸】

> 提纲:先 Canny 拿边缘 → 每个边缘点对所有可能的线投票 → ρ = x cosθ + y sinθ → 票数峰值就是直线 → 概率 Hough 出线段 → LSD 不用调参

比方:每个边缘点都在喊「我可能在这些线上」,大家一起往投票箱里投,票最多的那条线就是真的。
<span class="en">Analogy: every edge pixel shouts "I could be on these lines," and the line with the most votes wins.</span>
为什么用 ρ、θ 而不用 y = kx + b:竖线的斜率是无穷大,没法投票;ρ 是原点到直线的距离,θ 是垂线的角度,两个都有界。
<span class="en">Why ρ and θ instead of slope and intercept: vertical lines have infinite slope; ρ and θ are bounded.</span>

```
图像空间                      参数空间 (θ 横轴, ρ 纵轴)
   y                          ρ
   │   ● ● ● ●  ← 一条线上的点   │  ~~~ 每个点变成一条正弦曲线
   │                           │   \ / \ /
   └──────── x                 │    ╳  ← 很多曲线交在同一点 (ρ*, θ*) = 那条线
```
> 🔤 ●= 边缘点;θ = 原点到直线垂线的角度;ρ = 原点到直线的距离;╳ = 投票峰值

小例子:点 (3, 4)。θ = 0° → ρ = 3;θ = 90° → ρ = 4;θ = 45° → ρ = (3 + 4)/√2 ≈ 4.95。同一条线上的所有点,会在同一个 (ρ, θ) 上投票。
<span class="en">Example: point (3, 4) votes ρ = 3 at 0°, 4 at 90°, about 4.95 at 45°; all points on one line vote for the same (ρ, θ).</span>

> First I get edges with <u>Canny</u>. Then each edge pixel votes for every line that could pass through it, parameterized as <u>ρ = x cos θ + y sin θ</u>, where θ is the angle of the normal and ρ the distance from the origin; this handles vertical lines, unlike slope-intercept. Votes go into a 2D accumulator, and <u>peaks</u> are lines, after non-maximum suppression. <u>Probabilistic Hough</u> votes with a random subset of points and returns segments with a minimum length and maximum gap, which is faster and gives endpoints. <u>LSD</u> grows regions of pixels with similar gradient direction and validates them statistically, so it needs almost no tuning.

这段在说什么:前处理 → 投票的参数化和原因 → 峰值 → 两个工程上更常用的变体。
<span class="en">What this does: preprocessing, the voting parameterization and why, peaks, and two practical variants.</span>

```python
import numpy as np

def hough_lines(edges, n_theta=180, top_k=2):
    # edges: 二值边缘图 (H, W),1 = 边缘点
    H, W = edges.shape
    diag = int(np.ceil(np.hypot(H, W)))          # ρ 的最大绝对值 = 对角线长
    thetas = np.deg2rad(np.arange(n_theta))      # θ 取 0..179 度,步长 1 度
    rhos = np.arange(-diag, diag + 1)            # ρ 步长 1 像素
    acc = np.zeros((len(rhos), n_theta), int)    # 累加器:行 = ρ,列 = θ
    ys, xs = np.nonzero(edges)                   # 所有边缘点坐标
    cos_t, sin_t = np.cos(thetas), np.sin(thetas)
    for x, y in zip(xs, ys):
        # 每个点对每个 θ 算 ρ = x cosθ + y sinθ,在 (ρ, θ) 格子里投一票
        r = np.round(x * cos_t + y * sin_t).astype(int) + diag
        acc[r, np.arange(n_theta)] += 1
    # 票数最多的格子 = 最多点共线的那条线(真实实现还要做局部极大值抑制)
    flat = np.argsort(acc.ravel())[::-1][:top_k]
    r_idx, t_idx = np.unravel_index(flat, acc.shape)
    return [(int(rhos[r]), int(np.rad2deg(thetas[t])), int(acc[r, t])) for r, t in zip(r_idx, t_idx)]

if __name__ == "__main__":
    import cv2
    img = np.zeros((50, 50), np.uint8)
    img[:, 10] = 1                                   # 竖线 x = 10 → θ = 0°, ρ = 10
    for i in range(50): img[i, i] = 1                # 对角线 y = x → θ = 135°, ρ = 0
    print("mine  (rho, theta_deg, votes):", hough_lines(img))
    cv = cv2.HoughLines(img * 255, 1, np.pi / 180, 30)
    print("opencv (rho, theta_deg):", [(float(r), round(float(np.rad2deg(t)))) for r, t in cv[:2, 0]])
```

已实跑(python3,2026-10-20),输出:
<span class="en">Run on this machine; output:</span>

```text
mine  (rho, theta_deg, votes): [(0, 135, 50), (10, 0, 50)]
opencv (rho, theta_deg): [(10.0, 0), (0.0, 135)]
```

结果:竖线 x = 10 得到 (ρ = 10, θ = 0°),对角线 y = x 得到 (ρ = 0, θ = 135°),每条 50 票;和 OpenCV 的 cv2.HoughLines 结果一致。
<span class="en">Result: the vertical line gives (10, 0°) and the diagonal (0, 135°) with 50 votes each, matching OpenCV.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 复杂度和分辨率 <span class="en">Cost and resolution?</span> | O(边缘点数 × θ 个数);θ 分得细定位准,但票会分散到相邻格子;一般 1 度、1 像素,再在峰值附近细化。<span class="en">O(edge points × θ bins); finer bins localize better but split votes; 1 degree and 1 pixel is typical, refined near peaks.</span> |
| 噪声多怎么办 <span class="en">Noisy edges?</span> | 先高斯平滑再 Canny;用梯度方向限制每个点只在附近几个 θ 投票,票更集中、更快;或者用 RANSAC 拟合(4.19)。<span class="en">Smooth first, restrict each point's votes to θ near its gradient direction, or fit with RANSAC.</span> |
| 圆怎么检测 <span class="en">Circles?</span> | 同样的投票思路,参数是 (a, b, r) 三维;OpenCV 用梯度方向把它降到二维(Hough gradient)。<span class="en">Same voting with (a, b, r); OpenCV uses gradient direction to reduce it to 2D.</span> |

## A2 判断两条线平行 · Are two lines parallel? 【真题 10-08】

> 提纲:先问线是什么形式 → 2D 叉积加角度容差 → 齐次坐标:交点在无穷远 → 3D 方向叉积、异面 → 图像里三维平行线交于消失点

比方:铁轨在地上是平行的,但照片里两条铁轨在远处会合;会合的那个点就是消失点。
<span class="en">Analogy: rails are parallel on the ground but meet in a photo; where they meet is the vanishing point.</span>

```
  2D:  d1 × d2 = |d1||d2| sinθ  ≈ 0 → 平行
  齐次:l = p1 × p2;  交点 x = l1 × l2 = (x, y, w);  w ≈ 0 → 交在无穷远 → 平行
  图像: ╲   ╱   两条 3D 平行线 → 交于消失点 v,方向 d ∝ K⁻¹ v
         ╲ ╱
          v
```
> 🔤 d = 方向向量;l = 直线的齐次表示 (a, b, c),对应 ax + by + c = 0;w = 齐次坐标第三维;K = 相机内参

小例子(4.2 代码已实跑):线 1 过 (0,0)、(4,2),线 2 过 (0,3)、(2,4),斜率都是 1/2;齐次交点 = (−24, −12, 0),第三维是 0,所以平行。把线 2 改成过 (2,5),交点 (−24, −12, 4) → (−6, −3),不平行。
<span class="en">Example: two lines of slope 1/2 meet at (−24, −12, 0), at infinity; change one and they meet at (−6, −3).</span>

> It depends on the representation. With direction vectors, the 2D cross product is |d1||d2| sin θ, so I normalize and compare <u>|sin θ| to a tolerance</u>, never to exact zero. In <u>homogeneous coordinates</u>, the line through two points is their cross product, and two lines meet at the cross product of the lines; if the <u>third coordinate is near zero</u>, they meet at infinity, so they're parallel. In 3D, parallel means the direction cross product is zero; lines that don't meet and aren't parallel are <u>skew</u>. The catch in images: lines parallel in 3D <u>meet at a vanishing point</u>, so to test 3D parallelism from a photo I check whether they share a vanishing point, or rectify the plane with a homography first.

这段在说什么:最直接的方法 → 最漂亮的方法 → 3D → 图像里的陷阱。陷阱那一段最能体现你懂视觉。
<span class="en">What this does: the direct method, the elegant one, 3D, then the image trap, which shows real vision understanding.</span>

```python
import numpy as np

def parallel_2d(p1, p2, q1, q2, tol_deg=1.0):
    # 方向向量 + 叉积:|d1 × d2| = |d1||d2| sinθ
    d1 = np.subtract(p2, p1); d2 = np.subtract(q2, q1)
    cross = d1[0] * d2[1] - d1[1] * d2[0]
    sin_t = abs(cross) / (np.linalg.norm(d1) * np.linalg.norm(d2))   # 归一化成 sinθ
    return sin_t < np.sin(np.deg2rad(tol_deg))                       # 和容差比,不和 0 硬比

def parallel_homog(p1, p2, q1, q2, tol=1e-6):
    # 齐次坐标:过两点的直线 l = p1 × p2;两条线的交点 x = l1 × l2
    h = lambda p: np.array([p[0], p[1], 1.0])
    l1 = np.cross(h(p1), h(p2)); l2 = np.cross(h(q1), h(q2))
    x = np.cross(l1, l2)
    # 第三个分量 ≈ 0 → 交点在无穷远 → 平行(先归一化,避免受数值大小影响)
    return bool(abs(x[2]) / np.linalg.norm(x) < tol), x

def parallel_3d(d1, d2, tol=1e-6):
    c = np.cross(d1, d2)                       # 3D 方向叉积为零向量 → 平行
    return bool(np.linalg.norm(c) / (np.linalg.norm(d1) * np.linalg.norm(d2)) < tol)

print(parallel_2d((0, 0), (4, 2), (0, 3), (2, 4)))      # 斜率都是 1/2 → True
print(parallel_2d((0, 0), (4, 2), (0, 3), (2, 5)))      # 斜率 1/2 和 1 → False
print(parallel_homog((0, 0), (4, 2), (0, 3), (2, 4)))   # 交点 (…, …, 0)
print(parallel_homog((0, 0), (4, 2), (0, 3), (2, 5)))   # 有限交点
print(parallel_3d([1, 2, 3], [2, 4, 6]), parallel_3d([1, 0, 0], [0, 1, 0]))
```

已实跑(python3,2026-10-20),输出:
<span class="en">Run on this machine; output:</span>

```text
True
False
(True, array([-24., -12.,   0.]))
(False, array([-24., -12.,   4.]))
True False
```

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 消失点有什么用 <span class="en">What are vanishing points for?</span> | K⁻¹v 给出 3D 方向;两个互相垂直方向的消失点满足 (v1 − c)·(v2 − c) = −f²(c 是主点),可以估焦距;也能估相机相对地面或墙面的旋转。<span class="en">K⁻¹v gives the 3D direction; two orthogonal vanishing points satisfy (v1 − c)·(v2 − c) = −f², which yields the focal length, and they give the camera's rotation relative to a floor or wall.</span> |
| 一堆线段怎么分组找平行族 <span class="en">Grouping many segments into parallel families?</span> | 在图像里按 Hough 的 θ 聚类只适合正对拍摄;透视下要对两两线段求交点,用 RANSAC 找被最多线段支持的消失点。<span class="en">Clustering by θ only works fronto-parallel; under perspective, intersect segment pairs and RANSAC for the vanishing point supported by the most segments.</span> |
| 容差怎么定 <span class="en">How to set the tolerance?</span> | 按检测噪声定:线段越短,角度误差越大;常用 1 度左右,或者用线段长度加权。<span class="en">From detector noise: shorter segments have larger angle error; about one degree, or weight by length.</span> |

## A3 RGB 和 HSV · RGB versus HSV 【真题 10-08】

> 提纲:RGB 是三种光的强度,颜色和亮度搅在一起 → HSV 分开色相、饱和度、亮度 → 光照变了主要动 V → 按颜色分割用 HSV → 两个坑

比方:RGB 像用红绿蓝三种颜料的量描述颜色;HSV 像说「什么颜色、多鲜艳、多亮」。
<span class="en">Analogy: RGB says how much of three paints; HSV says which color, how vivid, how bright.</span>
小例子:红色 (200, 0, 0) 变暗一半是 (100, 0, 0):RGB 里 R 掉了一半;HSV 里 H = 0°、S = 100% 都不变,只有 V 从 78% 降到 39%。
<span class="en">Example: dimming (200, 0, 0) to (100, 0, 0) halves R, but in HSV only V changes, from 78% to 39%.</span>

> RGB stores red, green and blue intensities, matching sensors and displays, but <u>color and brightness are entangled</u>: dim the light and all three change. HSV separates <u>hue</u>, which color, as an angle; <u>saturation</u>, how pure; and <u>value</u>, how bright. Lighting changes mostly move V, so thresholding on H and S is more robust; in RCRI, routes are grouped by hold color in HSV for exactly this reason. Two pitfalls: <u>red wraps around zero</u>, so it needs two hue ranges, and <u>hue is unstable at low saturation</u>, since gray has no hue.

这段在说什么:RGB 的问题 → HSV 怎么解决 → RCRI 实例 → 两个坑。HSV 识别那部分是队友写的,被追问时说清。
<span class="en">What this does: RGB's problem, HSV's fix, the RCRI example, two pitfalls; the HSV module was your teammate's, so say so if asked.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| OpenCV 的 H 范围 <span class="en">OpenCV's hue range?</span> | 8 位图里 H 是 0–179(角度除以 2),S、V 是 0–255;红色要取 0 附近和 179 附近两段。<span class="en">H is 0 to 179, degrees halved; S and V are 0 to 255; red needs two ranges.</span> |
| 还有哪些颜色空间 <span class="en">Other color spaces?</span> | LAB:欧氏距离接近人眼感知差异,做颜色比较;YUV/YCbCr:亮度和色度分开,视频压缩用,色度可以降采样。<span class="en">LAB for perceptual distances; YUV for video, where chroma can be subsampled.</span> |
| 相机里的颜色从哪来 <span class="en">Where does camera color come from?</span> | 每个像素只有一种颜色滤光片(Bayer 排列),去马赛克插值出 RGB,再做白平衡、色彩矩阵和 gamma。<span class="en">A Bayer filter gives one color per pixel; demosaicing, white balance, a color matrix and gamma produce RGB.</span> |

## A4 3D 数据结构 · 3D data structures 【真题 10-08】

> 提纲:按传感器原始输出分 → 深度图 → 点云 + KD 树 → 体素 / 八叉树 / 哈希 → TSDF 和网格 → 各自代价

| 结构 <span class="en">Structure</span> | 是什么 <span class="en">What it is</span> | 好处 <span class="en">Strength</span> | 代价 <span class="en">Cost</span> |
|---|---|---|---|
| 深度图 <span class="en">Depth map</span> | H×W 每个像素一个距离 <span class="en">One distance per pixel</span> | 有组织,能直接用 2D 卷积 <span class="en">Organized, works with 2D convs</span> | 只有一个视角 <span class="en">One viewpoint only</span> |
| 点云 <span class="en">Point cloud</span> | 无序的 N 个 xyz <span class="en">Unordered N×3 points</span> | 精确、省空间 <span class="en">Exact and compact</span> | 没有邻接关系,要建索引 <span class="en">No neighbors without an index</span> |
| KD 树 <span class="en">k-d tree</span> | 每层沿一个轴切一刀 <span class="en">Splits one axis per level</span> | 最近邻平均 O(log N) <span class="en">Nearest neighbor in about log N</span> | 动态插入麻烦 <span class="en">Awkward to update</span> |
| 体素 <span class="en">Voxels</span> | 3D 规则格子 <span class="en">A regular 3D grid</span> | O(1) 查找,能用 3D 卷积 <span class="en">O(1) lookup, 3D convs</span> | 内存是分辨率的立方 <span class="en">Memory grows cubically</span> |
| 八叉树 <span class="en">Octree</span> | 每个格子按需分 8 份 <span class="en">Split cells into 8 as needed</span> | 空的地方不细分,多分辨率 <span class="en">Coarse where empty, multi-resolution</span> | 访问要走树 <span class="en">Tree traversal per lookup</span> |
| 网格 <span class="en">Mesh</span> | 顶点 + 三角形下标 <span class="en">Vertices plus triangle indices</span> | 有表面和法向,能渲染 <span class="en">Surfaces, normals, renderable</span> | 拓扑难改,从数据生成要重建 <span class="en">Hard to edit topology, needs reconstruction</span> |

小例子:1 立方米空间用 1 cm 体素 = 100³ = 一百万个格子;用 1 mm 就是十亿个,所以大场景用稀疏哈希体素或八叉树。
<span class="en">Example: one cubic meter at 1 cm is a million voxels, at 1 mm a billion, which is why large scenes use sparse hashing or octrees.</span>

> Sensors give me <u>depth maps</u> or <u>point clouds</u>; back-projecting a depth map with the intrinsics gives a point cloud. To search a point cloud I build a <u>k-d tree</u>, so nearest-neighbor queries are about log N, which ICP, normals and clustering all need. For regular structure I use <u>voxels</u>, with O(1) lookup but cubic memory, so in practice <u>sparse voxel hashing or an octree</u>. For reconstruction, a <u>TSDF</u> volume fuses many depth frames and Marching Cubes extracts a <u>mesh</u>.

这段在说什么:从传感器给什么 → 怎么查 → 怎么规整 → 怎么重建,每种结构一句它解决什么问题。
<span class="en">What this does: from raw sensor data to search, regular grids and reconstruction, each with the problem it solves.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| KD 树怎么找最近邻 <span class="en">k-d tree nearest neighbor?</span> | 先走到查询点所在的叶子,记当前最近距离 r;回溯时只有查询点到切分面的距离小于 r 才进另一边。维度高了会退化。<span class="en">Descend to the leaf, record the best distance r, and only cross a split plane closer than r when backtracking; it degrades in high dimensions.</span> |
| 神经网络怎么吃点云 <span class="en">How do networks consume point clouds?</span> | PointNet:每个点共享 MLP,再对所有点做最大池化,结果和点的顺序无关;或者先体素化用稀疏 3D 卷积。<span class="en">PointNet applies a shared MLP per point and max-pools across points, order-invariant; or voxelize and use sparse 3D convs.</span> |

## A5 卷积滤波:高斯、均值、中值、Sobel · Filters: Gaussian, mean, median, Sobel 【预测】

> 提纲:线性滤波 = 卷积 → 均值和高斯去噪 → 中值去椒盐 → Sobel 求梯度

| 滤波 <span class="en">Filter</span> | 核或做法 <span class="en">Kernel or method</span> | 用途 <span class="en">Use</span> |
|---|---|---|
| 均值 <span class="en">Mean</span> | 3×3 全是 1/9 <span class="en">All 1/9</span> | 去噪,但边缘糊、有方块感 <span class="en">Denoise, blurs edges</span> |
| 高斯 <span class="en">Gaussian</span> | [[1,2,1],[2,4,2],[1,2,1]]/16 <span class="en">The same, binomial</span> | 去噪,更平滑,可分离成两个一维核 <span class="en">Smoother, separable into two 1D passes</span> |
| 中值 <span class="en">Median</span> | 窗口里取中位数(非线性)<span class="en">Window median, nonlinear</span> | 去椒盐噪声,保边缘 <span class="en">Salt-and-pepper noise, keeps edges</span> |
| Sobel <span class="en">Sobel</span> | Gx = [[−1,0,1],[−2,0,2],[−1,0,1]] <span class="en">Horizontal gradient kernel</span> | 求梯度,边缘方向和强度 <span class="en">Gradient magnitude and direction</span> |

小例子:一行像素 [10, 10, 255, 10, 10],中间是一个白噪点。3 点均值把它变成 (10 + 255 + 10)/3 = 91.7,噪点被抹开;中值取 [10, 255, 10] 的中位数 = 10,噪点直接消失。
<span class="en">Example: for [10, 10, 255, 10, 10], a 3-point mean gives 91.7 and smears the spike; the median gives 10 and removes it.</span>

> Linear filters are convolutions. A <u>mean</u> filter averages a window; a <u>Gaussian</u> weights the center more, gives smoother results and is <u>separable</u>, so a k×k blur costs 2k instead of k² per pixel. A <u>median</u> filter is nonlinear: it removes salt-and-pepper noise while keeping edges sharp. <u>Sobel</u> combines smoothing in one direction with a derivative in the other, giving Gx and Gy; magnitude √(Gx² + Gy²) and direction atan2(Gy, Gx).

这段在说什么:四种滤波各一句,加一个能说明中值为什么特别的小例子。
<span class="en">What this does: one line per filter, with an example showing why the median is special.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 怎么既去噪又保边 <span class="en">Denoise but keep edges?</span> | 双边滤波:权重同时看空间距离和颜色差,颜色差大的邻居权重小,所以不跨边平均;代价是慢,不是线性卷积。<span class="en">Bilateral filtering weights by both distance and intensity difference, so it doesn't average across edges; it's slower and nonlinear.</span> |
| 大核怎么快 <span class="en">Fast large kernels?</span> | 可分离核拆成两个一维;均值用积分图,任意大小 O(1);很大的核用 FFT。<span class="en">Separable kernels, integral images for box filters, FFT for very large kernels.</span> |

## A6 Canny 四步 · The four steps of Canny 【预测】

> 提纲:高斯平滑 → Sobel 求梯度大小和方向 → 非极大值抑制把边变细 → 双阈值 + 滞后连接

```
原图 ─▶ ① 高斯去噪 ─▶ ② 梯度 (大小, 方向) ─▶ ③ 沿梯度方向只留局部最大(边变成 1 像素宽)
     ─▶ ④ 强边 > 高阈值:留;弱边在两阈值之间:和强边相连才留;< 低阈值:丢
```
> 🔤 高阈值、低阈值常取 2:1 或 3:1

小例子:高阈值 100、低阈值 50。一段梯度为 70 的弱边如果连着一段 120 的强边就保留,孤零零一段 70 的就丢掉,这样断断续续的真边能连起来,孤立噪点被去掉。
<span class="en">Example: with thresholds 100 and 50, a weak 70 segment survives if connected to a strong 120 edge; an isolated 70 is dropped.</span>

> Canny has four steps: <u>Gaussian smoothing</u> to suppress noise; <u>Sobel gradients</u> for magnitude and direction; <u>non-maximum suppression</u> along the gradient direction so edges are one pixel wide; and <u>hysteresis thresholding</u>: strong edges are kept, weak edges are kept only if connected to strong ones. The Gaussian σ trades noise against detail, and the two thresholds trade broken edges against false ones.

这段在说什么:四步每步一个目的,最后两个参数各自的取舍。
<span class="en">What this does: one purpose per step, and the trade-off for each parameter.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 为什么要双阈值 <span class="en">Why two thresholds?</span> | 单阈值高了边断开,低了噪声多;双阈值让弱边「借」强边的可信度。<span class="en">One high threshold breaks edges and one low threshold admits noise; two let weak edges borrow confidence from strong ones.</span> |
| 阈值怎么自动定 <span class="en">Automatic thresholds?</span> | 常见做法是按梯度幅值的中位数取上下比例,或 Otsu 阈值作为高阈值。<span class="en">Set them from the median gradient magnitude, or use Otsu's threshold as the high one.</span> |

## A7 直方图均衡 · Histogram equalization 【预测】

> 提纲:用累计分布把灰度拉开 → s = round(255 × CDF(r)) → 全局版会放大噪声 → CLAHE 分块 + 限制对比度

比方:一张照片所有像素都挤在 50 到 100 的灰度里,看起来灰蒙蒙;均衡就是把它们摊到 0 到 255。
<span class="en">Analogy: pixels crammed into 50 to 100 look flat; equalization spreads them over 0 to 255.</span>
小例子:4 个像素 {50, 50, 100, 200},累计分布 50 → 0.5、100 → 0.75、200 → 1.0,映射成 50 → 128(127.5 四舍五入)、100 → 191、200 → 255。
<span class="en">Example: values 50, 50, 100, 200 have CDF 0.5, 0.75, 1.0, so they map to about 128, 191 and 255.</span>

> Histogram equalization maps each intensity through the <u>cumulative distribution</u>, s = 255 × CDF(r), so the output histogram is roughly flat and contrast is stretched. Globally it can over-amplify noise and wash out regions, so <u>CLAHE</u> equalizes small tiles, <u>clips the histogram</u> to limit contrast gain, and blends tiles with interpolation. For color images I'd apply it to the luminance channel only, like V or L, to avoid color shifts.

这段在说什么:公式和算例,全局版的问题,CLAHE 怎么修,彩色图怎么处理。
<span class="en">What this does: formula and example, the global version's problem, CLAHE's fix, and color handling.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 为什么不直接对 RGB 三个通道做 <span class="en">Why not each RGB channel?</span> | 三个通道映射不同,颜色会偏;转到 LAB 或 HSV 只处理亮度。<span class="en">Different mappings per channel shift hues; equalize only lightness in LAB or HSV.</span> |

## A8 形态学:腐蚀、膨胀、开、闭 · Morphology: erode, dilate, open, close 【预测】

> 提纲:二值图上用一个结构元素扫 → 腐蚀变瘦、膨胀变胖 → 开 = 先腐蚀后膨胀,去小白点 → 闭 = 先膨胀后腐蚀,补小黑洞

```
原图    ·██·        腐蚀(3×3)→ 只有周围全是白的才留  → 变瘦,小点消失
        ████        膨胀(3×3)→ 周围有一个白的就变白  → 变胖,小洞填上
        ·██· ●     开 = 腐蚀再膨胀:● 这种孤立小点被去掉,大块形状基本不变
```
> 🔤 █ = 前景(白);· = 背景;● = 噪点

> Morphology probes a binary mask with a structuring element. <u>Erosion</u> keeps a pixel only if the whole neighborhood is foreground, shrinking shapes and removing specks; <u>dilation</u> sets it if any neighbor is foreground, growing shapes and filling gaps. <u>Opening</u>, erode then dilate, removes small noise while keeping large shapes; <u>closing</u>, dilate then erode, fills small holes. I'd use them to clean a color-threshold mask, for example after HSV segmentation.

这段在说什么:两个基本操作,两个组合操作,一个真实用法(清理 HSV 分割的掩码)。
<span class="en">What this does: two primitives, two combinations, and a real use cleaning an HSV mask.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 形态学梯度 <span class="en">Morphological gradient?</span> | 膨胀 − 腐蚀,得到物体轮廓。<span class="en">Dilation minus erosion gives the outline.</span> |
| 灰度图能做吗 <span class="en">Grayscale?</span> | 能:腐蚀 = 窗口最小值,膨胀 = 窗口最大值。<span class="en">Yes: erosion is a window minimum, dilation a window maximum.</span> |

## A9 SIFT 和 ORB · SIFT and ORB 【预测】

> 提纲:找关键点 + 描述子 + 匹配 → SIFT:尺度空间、128 维浮点,准但慢 → ORB:FAST + 旋转 BRIEF,二进制、汉明距离,快 → 比值测试 + RANSAC

| 项目 <span class="en">Aspect</span> | SIFT <span class="en">SIFT</span> | ORB <span class="en">ORB</span> |
|---|---|---|
| 关键点 <span class="en">Keypoints</span> | 高斯差分(DoG)尺度空间的极值 <span class="en">DoG scale-space extrema</span> | FAST 角点 + 图像金字塔 <span class="en">FAST corners on a pyramid</span> |
| 方向 <span class="en">Orientation</span> | 梯度方向直方图的主方向 <span class="en">Dominant gradient orientation</span> | 灰度质心方向 <span class="en">Intensity centroid</span> |
| 描述子 <span class="en">Descriptor</span> | 4×4 格 × 8 方向 = 128 维浮点 <span class="en">4×4 cells × 8 bins = 128 floats</span> | 256 位二进制(旋转 BRIEF)<span class="en">256-bit binary, rotated BRIEF</span> |
| 匹配 <span class="en">Matching</span> | 欧氏距离 <span class="en">Euclidean distance</span> | 汉明距离,一条 XOR + popcount <span class="en">Hamming distance, XOR and popcount</span> |
| 取舍 <span class="en">Trade-off</span> | 准,对尺度旋转光照稳,慢 <span class="en">Accurate and robust, slow</span> | 快很多,适合实时和嵌入式 <span class="en">Much faster, suits real-time and embedded</span> |

> Feature matching has three parts: detect keypoints, describe them, match. <u>SIFT</u> finds extrema in a difference-of-Gaussians scale space, assigns a dominant orientation, and builds a <u>128-dimensional</u> gradient histogram descriptor, so it's scale- and rotation-invariant but slow. <u>ORB</u> uses FAST corners on an image pyramid and a <u>256-bit binary</u> descriptor matched by Hamming distance, much faster for real time on edge devices. Either way I filter matches with <u>Lowe's ratio test</u>, best over second-best below about 0.75 to 0.8, then <u>RANSAC</u> on a homography or fundamental matrix.

这段在说什么:三步框架,两个方法对比,最后是过滤错误匹配的两道关。
<span class="en">What this does: the three-step frame, the two methods compared, then two filters for bad matches.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 比值测试为什么有效 <span class="en">Why does the ratio test work?</span> | 正确匹配的最近邻明显比第二近的近;如果两个差不多,说明是重复纹理,模棱两可,丢掉。<span class="en">A true match is clearly closer than the runner-up; if they're close, it's ambiguous repeated texture, so drop it.</span> |
| 学习的特征 <span class="en">Learned features?</span> | SuperPoint 检测加描述,SuperGlue 或 LightGlue 用注意力做匹配,弱纹理和大视角下更稳,但要 GPU。<span class="en">SuperPoint plus SuperGlue or LightGlue are more robust in low texture and wide baselines but need a GPU.</span> |

## A10 针孔相机:内参、外参和投影算例 · The pinhole camera: intrinsics, extrinsics, projection 【预测】

> 提纲:世界点 → 外参 [R | t] 转到相机坐标 → 除以 Z → 内参 K 变成像素 → 算一个例子

比方:外参回答「相机站在哪、朝哪看」;内参回答「镜头放大多少、画面中心在哪」。
<span class="en">Analogy: extrinsics say where the camera stands and looks; intrinsics say how much the lens magnifies and where the center is.</span>

```
s·[u, v, 1]ᵀ = K [R | t] [X, Y, Z, 1]ᵀ

K = | fx  0  cx |
    |  0 fy  cy |
    |  0  0   1 |
```
> 🔤 fx、fy = 焦距(像素);cx、cy = 主点;R、t = 世界到相机的旋转和平移;s = 深度 Z

算例:fx = fy = 500,cx = 320,cy = 240;相机坐标下的点 (0.4, −0.2, 2.0) 米 → u = 500 × 0.4/2 + 320 = 420,v = 500 × (−0.2)/2 + 240 = 190(已用 python 核对)。
<span class="en">Example: with f = 500 and center (320, 240), the point (0.4, −0.2, 2.0) projects to (420, 190).</span>

> A world point is first moved into the camera frame by the <u>extrinsics</u>, rotation R and translation t. Then it's projected by <u>dividing by depth Z</u>, and the <u>intrinsic matrix K</u>, with focal lengths in pixels and the principal point, maps it to pixel coordinates. For example, with f = 500 and center (320, 240), a point 2 meters ahead, 0.4 right and 0.2 up lands at <u>(420, 190)</u>. The division by Z is why one image loses depth.

这段在说什么:三步(外参 → 除深度 → 内参),一个算例,最后一句点出单目为什么测不了深度。
<span class="en">What this does: three steps, one example, and why a single image loses depth.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 畸变 <span class="en">Distortion?</span> | 径向畸变 x' = x(1 + k1r² + k2r⁴ + …),桶形或枕形;切向畸变来自镜头没装正。去畸变在归一化坐标上做。<span class="en">Radial distortion scales by 1 + k1r² + k2r⁴, barrel or pincushion; tangential comes from lens misalignment; undistort in normalized coordinates.</span> |
| 反投影 <span class="en">Back-projection?</span> | 已知像素和深度:X = (u − cx)·Z/fx,Y = (v − cy)·Z/fy;深度图就是这样变成点云的。<span class="en">With depth: X = (u − cx)Z/fx, Y = (v − cy)Z/fy, which is how a depth map becomes a point cloud.</span> |

## A11 相机标定 · Camera calibration 【预测】

> 提纲:拍棋盘格多个姿态 → 每张图求一个单应 → 闭式解出 K → 再用 LM 优化所有参数含畸变 → 看重投影误差

比方:拿一把尺子(棋盘格,格子大小已知)从各个角度拍,反推出镜头的放大倍数和变形。
<span class="en">Analogy: photograph a ruler of known size from many angles and infer the lens's magnification and distortion.</span>

> I'd use <u>Zhang's method</u>: photograph a checkerboard with known square size in about 15 to 20 poses covering the whole frame and different tilts. Each image gives a homography from the board plane to the image; these constrain K, giving a <u>closed-form initial estimate</u>. Then <u>Levenberg–Marquardt</u> refines intrinsics, distortion and every pose by minimizing <u>reprojection error</u>. I'd accept it if the RMS error is well under a pixel, roughly below 0.5, and check that residuals have no pattern across the image.

这段在说什么:数据怎么采、怎么初始化、怎么精修、怎么判断好坏。
<span class="en">What this does: data collection, initialization, refinement, and how to judge quality.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 为什么要多角度 <span class="en">Why many tilts?</span> | 只拍正对的姿态,焦距和距离分不开(退化);倾斜的姿态才能约束 K。<span class="en">Fronto-parallel views can't separate focal length from distance; tilted views constrain K.</span> |
| 双目还要标什么 <span class="en">Stereo extras?</span> | 两个相机之间的 R、t(外参),然后做立体校正,让对应点在同一行。<span class="en">The R and t between cameras, then rectification so matches lie on the same row.</span> |

## A12 对极几何:E 和 F · Epipolar geometry, E and F 【预测】

> 提纲:一个像素在另一张图里只能落在一条线上 → x₂ᵀ F x₁ = 0 → E = [t]× R(归一化坐标)→ F = K₂⁻ᵀ E K₁⁻¹ → 自由度和求法

比方:左相机看到一个点,只知道它在一条射线上;这条射线在右相机里看是一条线,对应点一定在这条线上,搜索从二维变成一维。
<span class="en">Analogy: the left camera only knows the point is on a ray; that ray appears as a line in the right image, so the search drops from 2D to 1D.</span>

```
    C1 ●───────────────● C2      ← 基线
        ╲     X       ╱
         ╲   ●       ╱
          x1        x2 落在对极线 l2 = F x1 上
```
> 🔤 C1、C2 = 两个相机中心;X = 3D 点;x1、x2 = 两张图里的像;l2 = 对极线

> The epipolar constraint says the match of x₁ must lie on the line <u>l₂ = F x₁</u>, so <u>x₂ᵀ F x₁ = 0</u>. With calibrated, normalized coordinates the same relation uses the <u>essential matrix E = [t]× R</u>, and <u>F = K₂⁻ᵀ E K₁⁻¹</u>. F has 7 degrees of freedom and rank 2; E has 5. I'd estimate F with the <u>normalized eight-point algorithm</u> inside RANSAC, or E with the five-point algorithm, then decompose E into R and t up to scale.

这段在说什么:约束是什么、E 和 F 的关系、自由度、怎么求。
<span class="en">What this does: the constraint, how E and F relate, their degrees of freedom, and how to estimate them.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 为什么八点法要归一化 <span class="en">Why normalize in the eight-point method?</span> | 像素坐标几百、齐次坐标 1,矩阵病态;先平移到均值 0、缩放到平均距离 √2,解完再变回来。<span class="en">Pixel values in the hundreds next to a 1 make it ill-conditioned; center and scale to mean distance √2 first.</span> |
| 平移的尺度 <span class="en">Scale of translation?</span> | 单目两视图只能恢复 t 的方向,不知道多长;要靠已知尺寸、双目基线或 IMU。<span class="en">Two monocular views give t only up to scale; a known size, a stereo baseline or an IMU fixes it.</span> |

## A13 单应矩阵 · Homography 【预测】

> 提纲:平面到平面的 3×3 映射 → 8 个自由度,4 对点 → 什么时候成立:场景是平面,或相机纯旋转 → 用途

比方:斜着拍一张海报,单应矩阵能把它「拉正」成正对着拍的样子。
<span class="en">Analogy: a homography can straighten a poster photographed at an angle.</span>
小例子:把一个 2 × 1 的长方形映射成透视下的梯形,只要 4 个角点对应就能解出 H。
<span class="en">Example: four corner correspondences between a rectangle and its perspective trapezoid determine H.</span>

> A homography is a 3×3 matrix, defined up to scale, so <u>8 degrees of freedom</u>; each point pair gives two equations, so <u>four points</u> suffice. I'd solve it with DLT, stacking the equations and taking the <u>SVD null vector</u>, inside RANSAC. It's exact when the scene is a <u>plane</u> or the camera <u>only rotates</u>; for general 3D scenes with translation, you need F instead. Uses: panorama stitching, rectifying a plane, and augmented-reality overlays.

这段在说什么:定义、最少点数、怎么解(又用到 SVD)、什么时候成立、用途。
<span class="en">What this does: definition, minimum points, how to solve it with SVD again, when it holds, and uses.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| H 和 F 怎么选 <span class="en">H or F?</span> | 场景近似平面或基线很小时 F 退化,用 H;SLAM 初始化常两个都算,比较哪个误差小。<span class="en">If the scene is near-planar or the baseline tiny, F degenerates, so use H; SLAM initialization often fits both and compares.</span> |

## A14 双目测深 Z = fB/d · Stereo depth 【预测】

> 提纲:两只眼看同一个点,位置差(视差)越大越近 → Z = fB/d → 算例 → 误差随距离平方增长

比方:手指放在眼前,左右眼轮流闭,手指跳得很厉害;看远处的楼几乎不动。
<span class="en">Analogy: a finger close to your face jumps when you alternate eyes; a distant building barely moves.</span>

```
  左相机 ●────── B ──────● 右相机
          ╲              ╱
           ╲   Z        ╱
            ╲          ╱
               ● 点
  视差 d = x_left − x_right
```
> 🔤 B = 基线(两相机距离);f = 焦距(像素);d = 视差(像素);Z = 深度

算例:f = 700 像素,B = 0.12 米,d = 21 像素 → Z = 700 × 0.12 / 21 = 4.0 米;视差差 1 像素(d = 20)→ 4.2 米,误差 20 厘米。误差公式 δZ ≈ Z²/(fB) × δd = 16/84 ≈ 0.19 米。
<span class="en">Example: f = 700, B = 0.12 m, d = 21 px gives 4.0 m; one pixel less gives 4.2 m, about 20 cm error, matching Z²/(fB).</span>

> After rectification, a point's match is on the same row, and its horizontal shift is the <u>disparity d</u>. Similar triangles give <u>Z = fB/d</u>. With f = 700 pixels and a 12 cm baseline, 21 pixels of disparity is 4 meters, and a one-pixel error moves it to 4.2. Depth error grows with the <u>square of distance</u>, δZ ≈ Z²/(fB)·δd, so for long range you need a wider baseline, a longer focal length or sub-pixel matching.

这段在说什么:直觉 → 公式 → 算例 → 误差规律和怎么改善。
<span class="en">What this does: intuition, formula, example, and how error scales and improves.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 双目在哪里会失败 <span class="en">Where does stereo fail?</span> | 无纹理(白墙)、重复纹理、反光、遮挡区域匹配不上;结构光主动投图案能解决无纹理。<span class="en">Textureless walls, repeated patterns, reflections and occlusions; structured light projects texture to fix the first.</span> |
| 视差怎么算 <span class="en">How is disparity computed?</span> | 沿同一行用块匹配(SAD 或 NCC)找代价最小的位置;SGM 加平滑约束;深度学习方法用代价体积 + 3D 卷积。<span class="en">Block matching along the row with SAD or NCC; SGM adds smoothness; learned methods build a cost volume.</span> |

## A15 PnP · Perspective-n-Point 【预测】

> 提纲:已知 3D 点和它们在图里的像素,求相机位姿 → 最少 3 点(P3P,最多 4 个解,第 4 点消歧)→ EPnP + RANSAC → 再用重投影误差精修

比方:你认识房间里几个家具的位置,看一眼照片就能推出自己站在哪、朝哪看。
<span class="en">Analogy: knowing where some furniture is, you can tell from one photo where you stand and face.</span>

> PnP estimates the camera's <u>rotation and translation</u> from known 3D points and their 2D projections, given the intrinsics. <u>P3P</u> needs three points and gives up to four solutions, so a fourth disambiguates. In practice I'd run <u>EPnP</u>, which is linear in n, inside <u>RANSAC</u> to reject bad matches, then refine by minimizing reprojection error with Levenberg–Marquardt. It's used for AR, robot grasping and relocalizing in a known map.

这段在说什么:输入输出、最少点数、实际流程、用途。
<span class="en">What this does: inputs and outputs, minimum points, the practical pipeline, and uses.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 点都在一个平面上呢 <span class="en">All points coplanar?</span> | 可以用单应分解或专门的平面 PnP(IPPE);要注意平面情况下可能有两个相近的解。<span class="en">Use homography decomposition or planar PnP like IPPE, watching for two similar solutions.</span> |

## A16 ICP 和点云配准 · ICP and point-cloud registration 【预测】

> 提纲:两片点云对齐 → 找最近点当对应 → SVD 一步求最优 R、t(Kabsch)→ 迭代 → 要好的初值;粗配准用特征

比方:两张描在透明纸上的地图,先大概叠上,再一点点挪、转,直到线条最重合。
<span class="en">Analogy: two maps on tracing paper, roughly overlaid, then nudged and rotated until the lines match best.</span>

```
重复:
  ① 对源点云每个点,用 KD 树找目标里最近的点
  ② 去掉质心:H = Σ (p − p̄)(q − q̄)ᵀ
  ③ SVD: H = U Σ Vᵀ → R = V Uᵀ(det < 0 时把 V 最后一列取反),t = q̄ − R p̄
  ④ 变换源点云,误差不再下降就停
```
> 🔤 p = 源点;q = 对应的目标点;p̄、q̄ = 质心;R、t = 旋转和平移

> ICP alternates two steps: <u>match</u> each source point to its nearest target point with a k-d tree, then <u>solve the best rigid transform</u> for those matches in closed form with the <u>Kabsch</u> method: subtract centroids, take the SVD of the cross-covariance, R = VUᵀ with a determinant fix, and t from the centroids. Repeat until the error stops dropping. It converges only <u>locally</u>, so it needs a good initial guess, from odometry or from <u>global registration</u> with features like FPFH plus RANSAC. <u>Point-to-plane</u> ICP converges faster on smooth surfaces.

这段在说什么:两步交替、闭式解怎么来(又是 SVD)、局限和补救。
<span class="en">What this does: the two alternating steps, the closed form via SVD, the limitation and the remedy.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 为什么要检查行列式 <span class="en">Why the determinant check?</span> | SVD 可能给出反射(det = −1),不是合法旋转;把 V 最后一列取反修正。<span class="en">SVD may return a reflection with determinant −1; flip V's last column to get a rotation.</span> |
| 外点和部分重叠 <span class="en">Outliers and partial overlap?</span> | 距离太远的对应直接丢,或用鲁棒核(Huber)降权;要有足够重叠,否则会收敛到错的位置。<span class="en">Reject far correspondences or use a robust kernel; without enough overlap it converges wrongly.</span> |

## A17 网格和法向量 · Meshes and normals 【预测】

> 提纲:网格 = 顶点 + 三角形 → 面法向 = 两条边叉积 → 顶点法向 = 周围面法向加权平均 → 绕序决定朝向 → 点云法向用 PCA

小例子:三角形 v0 = (0,0,0)、v1 = (1,0,0)、v2 = (0,1,0),(v1 − v0) × (v2 − v0) = (0, 0, 1),朝 +z;把 v1、v2 顺序换掉法向就变成 (0, 0, −1)。
<span class="en">Example: for v0 at the origin, v1 on x and v2 on y, the cross product is (0, 0, 1); swapping v1 and v2 flips it.</span>

> A mesh stores a <u>vertex array</u> and <u>triangle indices</u>. A face normal is the normalized <u>cross product of two edges</u>, and the <u>winding order</u>, counter-clockwise by convention, decides which side is outside. A vertex normal is the <u>area-weighted average</u> of adjacent face normals, used for smooth shading. For point clouds without faces, the normal is the <u>smallest-eigenvalue eigenvector</u> of the local neighborhood's covariance, oriented toward the sensor. Meshes come from point clouds by Poisson reconstruction or TSDF plus Marching Cubes.

这段在说什么:存储、面法向、朝向、顶点法向、点云法向、怎么从点云得到网格。
<span class="en">What this does: storage, face normals, orientation, vertex normals, point-cloud normals, and how meshes are built.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 网格怎么简化 <span class="en">Mesh simplification?</span> | 边折叠 + 二次误差度量(QEM):每次折叠误差最小的边,保形状、减面数,做 LOD。<span class="en">Edge collapse with quadric error metrics removes the cheapest edges first, for levels of detail.</span> |
| 半边结构 <span class="en">Half-edge structure?</span> | 每条边拆成两条有向半边,存「下一条、对边、所属面」,查邻接是 O(1)。<span class="en">Each edge splits into two directed half-edges storing next, twin and face, for O(1) adjacency.</span> |

## A18 NeRF 和 3D Gaussian Splatting · NeRF and 3D Gaussian Splatting 【预测】

### 先搞懂:NeRF 是干啥的 · What NeRF actually does

**一句话**:给它几十张从不同角度拍的同一个场景的照片,它学会这个场景,然后能**生成任何新角度的照片**,包括你根本没站过的位置。
<span class="en">Given a few dozen photos of one scene from different angles, NeRF learns the scene and can render a photo from any new viewpoint.</span>

**为什么需要它**:普通照片只记录了"相机站在那儿看到的样子"。想在 VR 里绕着一个房间走、给房产做 3D 看房、给电影做特效、给机器人做数字孪生,就需要"任意角度都能看"。以前要用激光扫描或手工建模,NeRF 只要手机照片。
<span class="en">Photos only capture fixed viewpoints. VR walkthroughs, 3D house tours, film effects and digital twins need any viewpoint; NeRF gets there from ordinary photos instead of laser scans or manual modeling.</span>

**比方:一屋子有颜色的烟**。把整个场景想成房间里飘满了烟。每个点都有两样东西:**烟有多浓**(浓 = 这里有东西,比如杯子表面;稀 = 空气)和**烟是什么颜色**。NeRF 就是一个查表的神经网络:你问它"(x, y, z) 这个点、从这个方向看",它答"浓度多少、颜色是啥"。
<span class="en">Think of the scene as colored fog filling the room. Every point has a density (is something there?) and a color. NeRF is a neural network that answers: at point (x, y, z), seen from this direction, what is the density and the color?</span>

```
输入 5 个数                     网络 (MLP)            输出 4 个数
(x, y, z, 看的方向 θ, φ)  ──►  [ 8 层全连接 ]  ──►  (R, G, B, 浓度 σ)
```

**怎么生成一张照片(体渲染)**:新照片的每个像素,从相机打一条射线穿过这个像素,沿射线**取很多个点**(原论文每条射线约 64 个粗采样 + 128 个细采样),每个点问一次网络,然后**从前往后叠颜色**:前面越浓,后面被挡住得越多。
<span class="en">To render a pixel, shoot a ray from the camera through it, sample points along the ray, query the network at each, and composite colors front to back, where dense points in front block what's behind. This is volume rendering.</span>

```
相机 ●───────○──────────■──────────▲────►
           点1: 空气      点2: 红杯子    点3: 杯子后面的绿墙
           浓度低         浓度高         (大部分被杯子挡住)
```

**小例子算一遍**(α = 这个点"挡住光"的比例,T = 光走到这里还剩多少):

| 点 | 颜色 | α | 剩下的光 T | 这个点的贡献 = T × α |
|---|---|---|---|---|
| 1 空气 | 蓝 | 0.1 | 1.0 | 0.1 |
| 2 杯子 | 红 | 0.9 | 1.0 × 0.9 = 0.9 | 0.81 |
| 3 墙 | 绿 | 0.8 | 0.9 × 0.1 = 0.09 | 0.072 |

像素颜色 ≈ 0.1×蓝 + 0.81×红 + 0.072×绿 → **基本是红色**,和"相机看到杯子"一致。墙虽然浓,但光到它那儿只剩 9%,所以几乎看不见。
<span class="en">Pixel ≈ 0.1 blue + 0.81 red + 0.072 green, so it comes out red: the cup blocks the wall behind it.</span>

**怎么训练**:拿真实照片里的像素做答案。对每个像素用上面的方法"渲染"出一个颜色,和真照片的颜色比,差多少就反向传播改网络(MSE 损失)。因为每一步都可微,不需要任何 3D 标注,只要照片 + 每张照片的相机位置(一般用 COLMAP 做 SfM 算出来)。
<span class="en">Training compares each rendered pixel with the real photo pixel (MSE loss) and backpropagates; the whole renderer is differentiable, so it needs only photos plus camera poses, usually from COLMAP structure-from-motion.</span>

**两个关键小技巧**:
- **位置编码**:把 (x, y, z) 先变成一串不同频率的 sin/cos 再喂给网络,否则网络只学得出模糊的样子,学不出纹理细节。<span class="en">Positional encoding maps coordinates to sines and cosines of many frequencies so the MLP can learn fine detail.</span>
- **颜色看方向**:浓度只看位置(东西在哪不随你站哪变),颜色还看方向(这样能学出反光、高光)。<span class="en">Density depends only on position; color also depends on view direction, which captures reflections and highlights.</span>

**代价(为什么后来有 3DGS)**:
- **慢**:一张 800×800 的图有 64 万条射线,每条约 192 个点,就是约 1.2 亿次网络查询,原版渲染一张图要几十秒,训练一个场景要一两天(后来 Instant-NGP 用哈希网格降到几分钟)。<span class="en">Slow: 640K rays × ~192 samples ≈ 123M network queries per 800×800 image; training took a day or more until Instant-NGP's hash grids cut it to minutes.</span>
- **一个场景一个网络**,换场景要重训;默认只适合**静止场景**;相机位置不准就会糊。<span class="en">One network per scene, static scenes by default, and it blurs if camera poses are wrong.</span>
- **3DGS 的思路**:不再用网络"隐式"存场景,而是直接摆几百万个带颜色的 3D 高斯小椭球,渲染时像画三角形一样直接投影上屏(光栅化),所以能实时。下面的面试答法就是这两者的对比。<span class="en">3DGS stores the scene explicitly as millions of colored 3D Gaussians and rasterizes them, which makes rendering real-time.</span>

**和你的经历怎么接**:RCRI 和 E6792 都是"从图像出 2D 检测结果";NeRF 是"从图像出 3D 场景"。被问到可以说你理解它是可微渲染 + 逆向求解场景,但没在项目里做过,别说做过。
<span class="en">If asked: you understand it as differentiable rendering that inverts photos into a scene, but say clearly you haven't built one in a project.</span>

> 提纲:都是从多张带位姿的照片学一个能渲染新视角的 3D 场景 → NeRF:MLP + 体渲染,慢 → 3DGS:一堆 3D 高斯直接光栅化,实时

> <u>NeRF</u> trains an MLP that maps a 3D position and view direction to <u>color and density</u>, and renders each pixel by <u>volume rendering</u> along its ray, so it's high quality but slow because each pixel queries the network many times. <u>3D Gaussian Splatting</u> represents the scene as millions of <u>explicit 3D Gaussians</u> with position, covariance, opacity and color, and <u>rasterizes</u> them by projecting and blending, so it renders in <u>real time</u> and trains much faster. Both need camera poses, usually from structure-from-motion like COLMAP.

这段在说什么:一句共同目标,各一句怎么表示、怎么渲染、快慢。
<span class="en">What this does: one shared goal, then each method's representation, rendering and speed.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 无人机上能用吗 <span class="en">On a drone?</span> | 采集和重建可以离线做数字孪生或巡检建图;机上实时感知还是靠深度、点云和 SLAM。<span class="en">Offline for digital twins and inspection maps; onboard real-time perception still relies on depth, point clouds and SLAM.</span> |

## A19 RANSAC 拟合直线 · RANSAC line fitting 【预测】

> 提纲:随机取最少点(直线 2 个)→ 拟合 → 数内点 → 重复留最好的 → 用全部内点精修 → 迭代次数公式

比方:一堆点里混了乱点,每次随便抽两个人问「你们觉得线在哪」,看有多少人同意,最后信同意人数最多的那一组。
<span class="en">Analogy: repeatedly ask two random people where the line is and count how many agree; trust the most-agreed answer.</span>
迭代次数:N = log(1 − p) / log(1 − wˢ)。p = 0.99,内点比例 w = 0.7,s = 2 → N ≈ 6.8,7 次就够(已实跑)。
<span class="en">Iterations: with 99% confidence, 70% inliers and 2-point samples, about 7.</span>

```python
import numpy as np
rng = np.random.default_rng(0)
# 直线 y = 2x + 1 上 70 个带噪声的点 + 30 个乱点
x = rng.uniform(0, 10, 70); y = 2 * x + 1 + rng.normal(0, 0.2, 70)
pts = np.vstack([np.c_[x, y], rng.uniform([0, 0], [10, 25], (30, 2))])

best_in = None
for _ in range(100):                                  # 外点 30% 时 99% 把握只需约 7 次,这里多给
    i, j = rng.choice(len(pts), 2, replace=False)     # 最少 2 个点定一条线
    (x1, y1), (x2, y2) = pts[i], pts[j]
    if x1 == x2: continue
    a = (y2 - y1) / (x2 - x1); b = y1 - a * x1
    # 点到直线 ax - y + b = 0 的距离
    dist = np.abs(a * pts[:, 0] - pts[:, 1] + b) / np.hypot(a, 1)
    inl = dist < 0.5
    if best_in is None or inl.sum() > best_in.sum():
        best_in = inl
# 最后用全部内点做一次最小二乘精修
A = np.c_[pts[best_in, 0], np.ones(best_in.sum())]
a, b = np.linalg.lstsq(A, pts[best_in, 1], rcond=None)[0]
print(f"inliers {best_in.sum()}  a={a:.3f} b={b:.3f}")
A_all = np.c_[pts[:, 0], np.ones(len(pts))]
print("plain lstsq on all points:", np.round(np.linalg.lstsq(A_all, pts[:, 1], rcond=None)[0], 3))
print("iterations needed (p=0.99, w=0.7, s=2):", np.log(1 - 0.99) / np.log(1 - 0.7 ** 2))
```

已实跑(python3,2026-10-20),输出:
<span class="en">Run on this machine; output:</span>

```text
inliers 73  a=1.991 b=1.027
plain lstsq on all points: [1.434 4.077]
iterations needed (p=0.99, w=0.7, s=2): 6.839247698175309
```

结果:RANSAC 找到 73 个内点,a = 1.991、b = 1.027,接近真值 2 和 1;直接对全部点最小二乘被乱点拉到 a = 1.434、b = 4.077。
<span class="en">Result: RANSAC recovers a = 1.991 and b = 1.027, close to 2 and 1; plain least squares on all points is dragged to 1.434 and 4.077.</span>

> RANSAC repeatedly samples the <u>minimal set</u>, two points for a line, fits a model, and counts <u>inliers</u> within a distance threshold; it keeps the model with the most inliers and finally <u>refits with least squares</u> on all of them. The number of iterations is <u>log(1 − p)/log(1 − wˢ)</u>, so with 70% inliers, about 7 iterations give 99% confidence. On my test, plain least squares was dragged to a slope of 1.43, while RANSAC recovered 1.99.

这段在说什么:四步做法、迭代次数怎么算、用实跑结果对比普通最小二乘。
<span class="en">What this does: the four steps, the iteration count, and a run comparing it to plain least squares.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 阈值怎么定 <span class="en">How to set the threshold?</span> | 按噪声定,常取噪声标准差的 2 到 3 倍;太大会把外点算进来,太小真内点被拒。<span class="en">From noise, about 2 to 3 standard deviations; too large admits outliers, too small rejects inliers.</span> |
| 外点超过一半 <span class="en">More than half outliers?</span> | 迭代次数指数上升(w = 0.3 时约 49 次);用 PROSAC 按匹配质量优先抽样,或先用比值测试过滤。<span class="en">Iterations grow fast, about 49 at 30% inliers; PROSAC samples good matches first, or prefilter with the ratio test.</span> |

## 无人机最可能问的 8 道点云题
## P1. What is a point cloud, and how is it different from an image? · 点云是什么,和图像有什么不一样

> A point cloud is an <u>N by 3 array</u> of 3D points, sometimes with color or intensity. Unlike an image, it's <u>unordered, irregular and sparse</u>, so there are no free neighbors and I need a k-d tree or voxel grid. Its advantage is <u>true metric scale</u>, which is what you need for distances to obstacles. A depth camera gives an organized cloud, H by W by 3; a LiDAR gives an unorganized one.

这段在说什么:定义、三个特点和后果、好处、两种来源(9.1)。
<span class="en">What this does: definition, properties and consequence, benefit, two kinds.</span>

## P2. How do you turn a depth image into a point cloud? · 深度图怎么变成点云

> I invert the pinhole projection: for pixel (u, v) with depth Z, <u>X = (u − cx)·Z/fx</u> and <u>Y = (v − cy)·Z/fy</u>. With f = 500 and center (320, 240), pixel (420, 190) at 2 meters is (0.4, −0.2, 2.0). I convert depth units to meters first, drop zero depth, and vectorize over the whole image. To combine frames, I then transform it into the world frame with the pose.

这段在说什么:公式、一个能心算的例子、两个工程细节、下一步(9.2、9.3)。
<span class="en">What this does: formula, a mental-math example, two details, the next step.</span>

## P3. How do you estimate surface normals? · 法向量怎么估计

> For each point I take its <u>k nearest neighbors</u>, compute their <u>covariance</u>, and take the eigenvector with the <u>smallest eigenvalue</u>, the direction of least spread. The sign is ambiguous, so I <u>orient it toward the sensor</u>. The smallest eigenvalue over the sum gives a curvature, near zero on planes. The choice of k trades noise robustness against smoothing across edges.

这段在说什么:做法、为什么取最小、正负号、曲率、k 的权衡(9.6)。
<span class="en">What this does: method, why smallest, the sign, curvature, the trade-off in k.</span>

## P4. How would you find the ground plane robustly? · 怎么稳健地找出地面

> I'd use <u>RANSAC</u>: sample three points, get the normal by a <u>cross product</u>, count inliers within a few centimeters, keep the best, then refit with PCA. The iteration count is <u>log(1 − p)/log(1 − w³)</u>, about 11 for 70% inliers at 99% confidence. On a drone I'd constrain the normal near vertical so walls aren't chosen, and fit per region on uneven ground. Ground comes first because otherwise it links every obstacle into one cluster.

这段在说什么:四步、迭代次数、两个约束、为什么它是第一步(9.7)。
<span class="en">What this does: steps, iterations, two constraints, why first.</span>

## P5. Explain ICP. When does it fail? · 讲一下 ICP,什么时候会失败

> ICP alternates <u>nearest-neighbor correspondences</u> and a <u>closed-form rigid fit</u>: subtract centroids, SVD of H = Σ p′q′ᵀ, R = VUᵀ with a determinant check, t = q̄ − Rp̄. It only reaches a <u>local minimum</u>, so it fails with a <u>bad initial guess</u>, symmetric objects, low overlap, or degenerate scenes like a single plane or a long corridor. In a small test it recovered a 60-degree offset on a box but fell into the 180-degree symmetric solution from 120. The fixes are an <u>IMU or odometry prior</u>, <u>FPFH plus RANSAC</u> global registration, outlier rejection, and point-to-plane.

这段在说什么:两步、闭式解、四种失败、一个实跑例子、补救(9.9)。
<span class="en">What this does: two steps, closed form, failure modes, a measured example, remedies.</span>

## P6. How would you detect obstacles from a depth camera or LiDAR on a drone? · 无人机上怎么检测障碍物

> Transform the cloud to the <u>world frame</u> with the pose, then crop, <u>voxel-downsample</u> and remove outliers. Remove the <u>ground with RANSAC</u>, then <u>cluster</u> the rest with Euclidean clustering or DBSCAN and fit bounding boxes, tracked across frames. In parallel, insert the points as rays into an <u>occupancy map</u> like OctoMap, which separates occupied, free and unknown space for the planner. Everything has to fit the frame budget, about 33 milliseconds at 30 frames per second, so downsampling comes first.

这段在说什么:流水线一句一步,最后落到实时预算(9.13)。
<span class="en">What this does: the pipeline in order, ending on the real-time budget.</span>

## P7. Why is PointNet permutation invariant? · PointNet 为什么和点的顺序无关

> Because points are unordered, the output must not depend on their order. <u>PointNet</u> applies a <u>shared MLP</u> to every point independently and then takes a <u>max over points</u> per channel; max is symmetric, so any permutation gives the same global feature. <u>PointNet++</u> adds local context by grouping neighbors and applying PointNet hierarchically. Other options are <u>sparse 3D convolution</u> on voxels, or <u>projecting to range or bird's-eye images</u> for a 2D CNN, which is fastest.

这段在说什么:约束是什么、PointNet 怎么满足、局限和补法、另外两条路(9.12)。
<span class="en">What this does: the constraint, how PointNet meets it, its limit, two other routes.</span>

## P8. Have you worked with point clouds before? · 你做过点云吗(诚实回答,不编)

> Not in a project yet, and I want to be upfront about that. My closest work is <u>RCRI</u>, a two-person project detecting climbing holds in 2D images: we trained <u>YOLOv8 on GCP</u> and deployed it with <u>TensorRT on a Jetson Nano</u>, at 12 FPS for the first stage and 5 FPS for the full three-stage pipeline, so I know what an edge compute budget feels like. For 3D, I understand the standard pipeline, back-projection, world-frame transforms, downsampling, RANSAC ground removal, clustering, ICP and occupancy mapping, and I can derive the math, like normals from PCA and the SVD step in ICP. If I extended RCRI to 3D, I'd add a depth camera and <u>lift each 2D detection to 3D</u> with the median depth inside the box.

这段在说什么:先诚实说没做过 → 讲真实的相邻经验(RCRI,数字照实)→ 证明懂流程和数学 → 给一个具体的延伸思路,有底气但不夸大。
<span class="en">What this does: honest first, then the real adjacent experience with exact numbers, then proof of understanding, then a concrete extension; confident without overclaiming.</span>

# 篇六 · 押题 B:多模态视觉(如果是 Peter Tong)
> 每题先提纲(中文 + English),再给一段能直接说的英文(🗣)

## 12 道押题(点开每题看答案)

### B1. CLIP 是怎么训练的?为什么能零样本分类?

- 双塔编码,图和文进同一空间 · two towers map images and text into one space

- N×N 相似度矩阵,对角线是正样本,双向交叉熵 · symmetric cross-entropy over the similarity matrix

- 零样本:类别名写成句子,选最近的 · prompt class names and pick the nearest

> 🗣 CLIP trains an image encoder and a text encoder together. In each batch of N image-caption pairs, it computes an N-by-N similarity matrix and applies cross-entropy in both directions, so each image matches its own caption and not the others. Because images and text end up in one embedding space, I can classify zero-shot by turning class names into prompts like "a photo of a dog" and picking the closest one. I used exactly this on a Jetson, with the text embeddings cached.

### B2. CLIP 有什么弱点?为什么?

- 看不清细节:朝向、数量、小部件、相对位置 · misses orientation, counts, small parts, relations

- 原因:配文很少写这些,目标是整体对齐 · captions rarely mention them, objective is global alignment

- 证据:CLIP-blind pairs、MMVP · evidence from CLIP-blind pairs and MMVP

- 修法:混入 DINOv2 这类自监督特征、提高分辨率 · mix in self-supervised features, higher resolution

> 🗣 CLIP learns what matters for matching an image to its caption, and captions rarely mention orientation, counts, or small parts. So two images that differ in those ways can get almost the same embedding. The Eyes Wide Shut paper found these CLIP-blind pairs by looking for images CLIP thinks are similar but DINOv2 separates, and multimodal LLMs built on CLIP fail the same questions. Interleaving self-supervised features with CLIP features helps grounding without losing instruction following.

### B3. ViT 和 CNN 的区别?各自什么时候用?

- CNN:局部感受野、平移等变,数据少也能训 · locality and translation equivariance, data-efficient

- ViT:一开始就全局注意力,数据多时上限更高 · global attention from layer one, scales better

- 代价:注意力随 token 数平方增长 · attention is quadratic in tokens

- 边缘部署:CNN 或混合结构更省 · on the edge, CNNs or hybrids are cheaper

> 🗣 A CNN builds in locality and translation equivariance, so it learns well from less data and runs efficiently, which is why I used YOLOv8 on the edge. A ViT lets every patch attend to every other from the first layer, so it has weaker priors but scales better with data, and it is the default encoder for multimodal models. The cost is attention that grows quadratically with the number of tokens, which matters at high resolution.

### B4. 多模态大模型是怎么把图像接进大模型的?

- 编码器 → 投影层 → 视觉 token 拼在文字前 · encoder, projector, visual tokens prepended

- 两阶段:先训投影层对齐,再指令微调 · align the projector, then instruction-tune

- 取舍:分辨率 vs token 数;切图、重采样器 · resolution vs token count; tiling, resamplers

> 🗣 The common design is a vision encoder, usually a frozen CLIP or SigLIP ViT, a small projector, often a two-layer MLP, and the LLM. The projector maps each patch feature into the LLM's embedding space, and those visual tokens sit next to the text tokens. Training usually has two stages: first only the projector on image-caption pairs, then the projector and LLM on visual instruction data. The main tradeoff is resolution versus token count, handled with tiling or with learned-query resamplers like Q-Former, or Cambrian's Spatial Vision Aggregator.

### B5. 如果模型数不清图里有几个东西,你怎么改?

- 先定位问题在眼睛还是大脑:探针测编码器特征 · probe whether the encoder or the LLM is the bottleneck

- 眼睛:高分辨率、加自监督特征、保留空间结构的连接器 · higher res, SSL features, spatially aware connector

- 数据:合成可控的计数数据 · synthetic counting data with exact labels

- 系统:先跑检测器再数 · call a detector as a tool

> 🗣 First I would find where it breaks. I would train a simple linear probe on the encoder features to predict counts. If the probe fails, the information is lost in the encoder, so I would raise resolution, add self-supervised features, or use a connector that keeps spatial layout instead of pooling it away. If the probe works but the model still fails, the problem is in alignment or data, so I would add synthetic counting data where labels are exact. For a production drone system I would also consider calling a detector and counting its boxes.

### B6. 自监督视觉和 CLIP,哪个更好?

- CLIP 语义强,自监督结构和细节强 · CLIP is semantic, SSL is structural

- Web-SSL:同数据下自监督扩展性更好,7B 不饱和 · with the same data SSL scales better

- 实践:组合使用 · combine them

> 🗣 They capture different things. CLIP is strong at semantics because language tells it what matters, and self-supervised models like DINOv2 are strong at structure and correspondence. The Web-SSL study trained both on the same data and found self-supervised models scale better and reach CLIP-level VQA performance at billions of parameters, so the earlier gap was mostly data. In practice I would combine them, the way Cambrian evaluates many encoders and aggregates them.

### B7. 多模态模型为什么不懂多视角?怎么改?

- 训练数据多是单图;位置编码只有 2D · single-image data, 2D positions only

- 弱在遮挡下的跨视角对应和相机位姿 · weak at cross-view correspondence and pose

- 改法:3D 位置编码、几何约束、3D 数据自动出题、调用 SfM · 3D positional encodings, geometric supervision, auto-generated spatial QA, tools

> 🗣 Most training data is a single image with a caption, and the positional information is only 2D, so the model never learns that two views show the same object. Benchmarks like All-Angles show the weakest points are cross-view correspondence under occlusion and estimating rough camera pose. Classical vision already solves those with feature matching, RANSAC, and essential-matrix decomposition. I would bring that structure in: 3D-aware positional encodings from depth, a correspondence consistency loss, spatial questions generated automatically from 3D scans, or letting the model call SfM as a tool.

### B8. 扩散模型怎么工作?DiT 和 U-Net 区别?

- 加噪、学去噪、从噪声采样 · add noise, learn to denoise, sample from noise

- 隐空间做,省算力 · work in a latent space to save compute

- DiT 用 Transformer,adaLN 注入条件,扩展性好 · Transformer backbone, adaLN conditioning, scales well

- CFG 提高听话程度,降多样性 · CFG trades diversity for adherence

> 🗣 A diffusion model gradually adds Gaussian noise to data and trains a network to predict the noise at a random step, with a simple mean-squared error. To generate, it starts from noise and denoises step by step. Latent diffusion does this in an autoencoder's latent space to save compute. DiT replaces the U-Net with a Transformer over latent patches, injecting the timestep and class through adaptive layer norm, and it scales more predictably. Classifier-free guidance mixes conditional and unconditional predictions to follow the prompt more closely at the cost of diversity.

### B9. 为什么要把 VAE 换成表示编码器(RAE)?难在哪?

- VAE 隐空间维度低、没语义 · low-dimensional, purely reconstructive latents

- RAE:冻结的 DINOv2/SigLIP + 训练的解码器 · frozen encoder plus trained decoder

- 难点:高维;宽度要够、按维度调噪声、解码器加噪训练 · width, dimension-aware noise, noise-augmented decoder

- 结果:收敛更快,FID 1.51 / 1.13 · faster convergence, strong FID

> 🗣 The standard VAE latent is low-dimensional and learned only for reconstruction, so it carries little semantic structure. RAE keeps a pretrained encoder like DINOv2 or SigLIP frozen and trains only a decoder, so the latent space is both reconstructable and semantic. The hard part is that these latents are high-dimensional. The fixes are making the transformer at least as wide as the token dimension, shifting the noise schedule according to dimension, and training the decoder on noisy latents so it tolerates imperfect samples. It converges faster and reached about 1.5 FID without guidance on ImageNet.

### B10. 理解和生成能用一个模型吗?

- MetaMorph:大模型同时预测文字和连续视觉 token · predict text and continuous visual tokens

- 生成是理解的副产品,理解数据更有用 · generation emerges from understanding

- RAE 让理解和生成共用表示空间 · shared representation space

> 🗣 Recent work suggests yes. MetaMorph extends visual instruction tuning so the LLM also predicts continuous visual tokens, which a diffusion decoder turns into images, and generation appears as a by-product of better understanding with only a little generation data. Using a representation encoder like in RAE for both directions means the model can reason directly over what it generates.

### B11. 怎么判断一个多模态基准是不是在测视觉?

- 把图拿掉,看大模型还能答对多少 · blind test without the image

- 成对设计:同一问题,两张图答案不同 · paired questions with different answers

- 按能力拆分报告 · report per capability

> 🗣 I would first run the model without the image. If accuracy stays high, the benchmark is testing language priors, not vision, which is what Cambrian found for several popular benchmarks. Then I would prefer paired designs like MMVP, where the same question has different answers for two images, so guessing does not work. I did similar work on agent evaluation: I validated metrics against human judgments before trusting them, and reported results by category instead of a single score.

### B12. 这些研究对无人机实时感知有什么用?

- 大模型太慢,做高层理解和标注,不放在实时环 · use MLLMs offline or at low rate

- 实时环:CNN/小 ViT + TensorRT · real-time loop stays on efficient models

- 蒸馏:大模型教小模型 · distill into small models

- 空间理解和惊讶度思路可用于事件检测 · surprise-driven event detection

> 🗣 On a drone the real-time loop has a hard latency budget, so detection and tracking should stay on efficient models like a CNN or a small ViT optimized with TensorRT, which is what I did in my RCRI project. Multimodal models fit at a lower rate: describing scenes, answering operator questions, or labeling data offline. They are also good teachers for distilling into smaller models. The surprise idea from Cambrian-S maps well to drones too: only spend compute or memory when the scene changes unexpectedly.

### 40 秒英文版 · 40-second spoken version
> 🗣 A request comes in with a prompt, a target style and sometimes a reference image. Preprocessing builds the prompt from a template, normalizes the image and tokenizes the text. A CLIP text encoder turns the prompt into embeddings, which we cached for repeated prompts. The diffusion UNet then denoises a latent over a few dozen steps with a LoRA adapter for the style, and the VAE decodes it into pixels. Post-processing handles super-resolution and cleanup, and we save versioned outputs for the content team. My part was making this run in production: batching, mixed precision, caching, and fixing GPU memory and data issues. That cut end-to-end latency about 30 percent, I resolved more than 15 production failures, and three commercial projects reused the pipeline.

中文意思:输入、预处理、CLIP 编码(带缓存)、UNet 加 LoRA 去噪、VAE 解码、后处理、带版本交付;你负责让它在生产上跑得动:批处理、混合精度、缓存、修显存和数据问题;结果延迟降约 30%、修了 15+ 个故障、3 个以上商业项目复用。

## RCRI 的「双 sigmoid」bug(被问调试经历时讲)
- 发生了什么:后处理里,模型输出已经是 0–1 的概率 p,代码又过了一次 sigmoid。
- 为什么出事:sigmoid(p) 在 p∈[0,1] 时只能落在 0.5–0.73。大部分框原始概率很小,全被挤到 0.5 附近,置信度阈值失效。
- 现象:每张图只检出约 10 个 hold;修掉多余的 sigmoid 后,恢复到 40 多个。
- 同类坑:PyTorch 的 CrossEntropyLoss 自带 log_softmax,不能先手动 softmax。
<span class="en">In RCRI's post-processing the scores were already probabilities, and a second sigmoid squashed everything into 0.5 to 0.73, so the threshold stopped working and we only kept about 10 holds per image. Removing it brought detections back to 40-plus. Same class of bug as applying softmax before CrossEntropyLoss.</span>

可以说:我把文本塔的类别嵌入提前算好缓存起来,运行时只跑图像塔,所以零样本分类的实时开销只有一个 ViT 前向。我也体会到 CLIP 对细节不敏感,这和 Eyes Wide Shut 的结论一致。
<span class="en">I ran CLIP zero-shot on a Jetson: I precomputed and cached the text-tower embeddings, so at runtime only the image tower runs, and I profiled FP16 and TensorRT. In practice I saw CLIP miss fine details, which matches the Eyes Wide Shut finding.</span>

- RCRI(YOLOv8 + TensorRT,12 倍加速):对应「视觉模型上边缘设备」。Byte Veda 做无人机实时感知,这条最贴业务。训练在云上做,部署在边缘(别说成纯边缘)。

- TaskMap(论文二作,WSDM 2027 Findings 已接收):大模型的任务条件适配。可以接 MLLM 两阶段训练和高效微调的话题。可以说 accepted to WSDM 2027 Findings(11/3 通知,2027 年 2 月在香港开会)。

- Walmart 资助的 agent 评测研究:你设计过评测指标和基线。对应他做 MMVP、CV-Bench、All-Angles Bench 这些基准的思路:先怀疑基准本身(不看图能不能答对),再设计能真正测出能力的题。

- TikTok 评测平台:评测是一道「门」,模型过了才上线。也能接「怎么评一个多模态模型」。

别吹:E6792 的 kernels.cu 是课程发的,只能说你写了 host 端执行层。CLIP 那部分说「零样本推理和部署优化」,不说训练过 CLIP。

## 一页纸
- **开场主线**:让视觉模型在真实硬件上实时跑 → RCRI(mAP50 0.825,Jetson TensorRT FP16)→ E6792(CUDA host 层,TensorRT 12×,CLIP 零样本)→ 想往 3D 和多传感器走。
- **相机**:u = fx·X/Z + cx;K 是内参,[R|t] 是外参;标定用棋盘格 + 张正友法。
- **双目**:Z = f·B/d,视差越小越远、误差越大(误差 ∝ Z²)。
- **对极**:x'ᵀ F x = 0;E = [t]ₓR,F = K'⁻ᵀ E K⁻¹;8 点法 + RANSAC。
- **单应**:平面或纯旋转,H 是 3×3、8 自由度,4 对点。
- **PnP**:已知 3D 点和像素,求位姿;至少 3 点(P3P)+ RANSAC。
- **ICP**:找最近点 → SVD 求 R,t → 迭代;要好的初值,怕局部最优。
- **图像处理**:高斯/中值/Sobel;Canny 四步;Hough 用 ρ = x cosθ + y sinθ;HSV 把颜色和亮度分开。
- **点云**:无序、稀疏;深度图反投影 X = (u−cx)Z/fx;法向 = 邻域协方差最小特征向量;RANSAC 找地面。
- **多模态**:CLIP 对比学习、弱在细节(Eyes Wide Shut);MLLM = 编码器 + 投影 + LLM;多视角弱在跨视角对应和位姿,传统几何正好能补。
- **诚实边界**:kernels.cu 是课程发的,说「写了 host 端执行层」;RCRI 训练在云上;CLIP 是零样本推理和部署,没训练过。

        if(/^[A-Za-z0-9+.\- ]+$/.test(key)){const b=txt[m.index-1]||' ',a=txt[m.index+m[0].length]||' ';if(/[A-Za-z0-9_]/.test(b)||/[A-Za-z0-9_]/.test(a))continue;}

        const sp=document.createElement('span');sp.className='gl';sp.textContent=m[0];sp.dataset.d=G[key];frag.appendChild(sp);last=m.index+m[0].length;changed=true;}
      if(changed){frag.appendChild(document.createTextNode(txt.slice(last)));nd.replaceWith(frag);}
    });
  });
  const tip=document.getElementById('tip');
  main.addEventListener('mouseover',e=>{const t=e.target.closest('.gl');if(!t)return;const d=t.dataset.d;const i=d.indexOf(':');tip.innerHTML='<b></b> ';tip.querySelector('b').textContent=d.slice(0,i);tip.appendChild(document.createTextNode(d.slice(i+1)));tip.style.display='block';
    const r=t.getBoundingClientRect();let x=r.left,y=r.bottom+8;if(x+370>innerWidth)x=innerWidth-380;if(y+140>innerHeight)y=r.top-8-tip.offsetHeight;tip.style.left=x+'px';tip.style.top=y+'px';});
  main.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.gl'))tip.style.display='none';});
})();

/* ---- 右侧 Q&A:用 Claude 生成解答(只在 claude.ai 里打开的版本可用) ---- */
let SAMPLE=null;const sampleReady=(async()=>{await new Promise(r=>setTimeout(r,0));try{if(window.claude&&window.claude.use){SAMPLE=await window.claude.use('sample');}}catch(e){SAMPLE=null;}try{render();}catch(e){}})();
function secText(id){const h=document.getElementById(id);if(!h)return '';let t=[];let e=h.nextElementSibling;const lvl=+h.tagName[1];while(e){if(/^H[1-3]$/.test(e.tagName)&&(+e.tagName[1])<=lvl)break;if(!e.classList.contains('part'))t.push(e.innerText);e=e.nextElementSibling;}return t.join('\n').slice(0,6000);}
async function answer(it,box,btn){
  if(!SAMPLE){box.textContent='这个功能只在 claude.ai 上打开的版本可用。本地版请点「复制全部为 Markdown」发给我。';return;}
  const ctx=secText(it.id);btn.disabled=true;box.className='ans think';box.textContent='Claude 在想…(5–60 秒)';
  const prompt='你是在帮一位 2026 年 12 月毕业的哥大计算机工程硕士准备 Byte Veda(纽约,无人机实时感知 + 射频 + 网络安全)Computer Vision / 3D Perception Engineer 终面(11/5 周四 13:00,45 分钟现场,面试官是 lead CV engineer Peter,主题是 3D 建模、图像处理、计算机视觉;Peter 可能是做多模态视觉的 Peter Tong)。她正在读一份冲刺手册,看到下面这一节时提了一个问题。请用中文、零基础也能懂的口吻回答:先一句人话给结论,再展开解释,必要时给面试里可以直接说的一句英文原话。不要编造她的项目细节;涉及她的项目只引用手册原文。控制在 300 字以内。\n\n【她正在看的章节】'+(it.title||'')+'\n'+ctx+'\n\n【她的问题】'+it.text;
  try{const {text}=await SAMPLE(prompt,{onText:({text})=>{box.className='ans';box.textContent=text;}});
    const all=load();const i=all.findIndex(x=>x.k===it.k);if(i>=0){all[i].answer=text;store(all);}box.className='ans';box.textContent=text;}
  catch(e){box.className='ans';box.textContent=e&&e.text?e.text:(e&&e.code==='not_granted'?'你没有允许这个页面使用 Claude,所以生成不了。':'生成失败('+(e&&e.code||'unknown')+'),稍后再试或发给我。');}
  finally{btn.disabled=false;}
}

const KEY='byteveda_peter_qa_v1';

function setSec(h){cur={id:h.id,title:h.textContent.replace('＋问','').replace(/[☐✓] 掌握/,'').replace(/[☆★] (已)?收藏/,'').replace(/🔖 (稍后|待看)/,'').trim()};try{if(h.dataset.k)localStorage.setItem('byteveda_peter_last_v1',JSON.stringify({k:h.dataset.k,title:cur.title,when:Date.now()}));}catch(e){}document.getElementById('cursec').textContent='当前章节:'+cur.title;
  tl.querySelectorAll('a.cur').forEach(a=>a.classList.remove('cur'));const a=tl.querySelector('a[href="#'+h.id+'"]');if(a)a.classList.add('cur');}
function nearest(){let best=null;for(const h of heads){if(!h.isConnected)continue;const r=h.getBoundingClientRect();if(r.top<=120)best=h;else break;}if(best)setSec(best);}

(function(){try{const LAND="第 0 章";let _sv=null;try{_sv=JSON.parse(localStorage.getItem('byteveda_peter_pos_v1')||'null')||JSON.parse(localStorage.getItem('byteveda_peter_last_v1')||'null')}catch(e){}if(LAND&&!(_sv&&_sv.k)){const h=heads.find(x=>x.textContent.indexOf(LAND)>=0);if(h){const go=()=>{window.scrollTo({top:Math.max(0,h.getBoundingClientRect().top+window.scrollY-10),behavior:'auto'});try{h.scrollIntoView({block:'start',behavior:'auto'})}catch(e){}};go();setTimeout(go,300);setTimeout(go,1200);setTimeout(go,2500);return;}}let p=JSON.parse(localStorage.getItem('byteveda_peter_pos_v1')||'null');if(location.hash&&!(p&&p.k))return;if(!p||!p.k){const l=JSON.parse(localStorage.getItem('byteveda_peter_last_v1')||'null');if(l&&l.k)p={k:l.k,off:0};}if(!p||!p.k)return;const h=heads.find(x=>x.dataset.k===p.k);if(!h)return;const go=()=>{const y=h.getBoundingClientRect().top+window.scrollY+(p.off||0);window.scrollTo({top:Math.max(0,y),behavior:'auto'});};go();setTimeout(go,300);setTimeout(go,1200);}catch(e){}})();
function load(){return ld(KEY,'[]')}
function store(list){sv(KEY,list)}
function render(){
  const list=load();const box=document.getElementById('notes');box.innerHTML='';
  if(!list.length){box.innerHTML='<div style="color:var(--mut);font-size:13px">还没有问题。</div>';return;}
  list.slice().reverse().forEach(it=>{
    const d=document.createElement('div');d.className='note'+(it.done?' answered':'');
    d.innerHTML='<div class="t"><span>'+(it.title||'')+' · '+it.when+'</span><span><a data-a="jump">跳转</a> <a data-a="done">'+(it.done?'未答':'已答')+'</a> <a data-a="del">删</a></span></div><div class="b"></div>';
    d.querySelector('.b').textContent=it.text;
    const ab=document.createElement('div');ab.className='ans';ab.hidden=!it.answer;ab.textContent=it.answer||'';d.appendChild(ab);
    const bb=document.createElement('div');bb.className='btns2';const gen=document.createElement('button');gen.textContent=it.answer?'重新生成解答':'生成解答';gen.title=SAMPLE?'用 Claude 生成这一题的解答':'只在 claude.ai 上打开的版本可用';gen.onclick=()=>{ab.hidden=false;answer(it,ab,gen);};bb.appendChild(gen);d.appendChild(bb);
    d.querySelectorAll('.t a').forEach(a=>a.onclick=()=>{
      const all=load();const i=all.findIndex(x=>x.k===it.k);if(i<0)return;
      if(a.dataset.a==='del')all.splice(i,1);
      if(a.dataset.a==='done')all[i].done=!all[i].done;
      if(a.dataset.a==='jump'&&it.id){location.hash='#'+it.id;return;}
      store(all);render();
    });
    box.appendChild(d);
  });
}
document.getElementById('save').onclick=()=>{
  const ta=document.getElementById('qtext');const text=ta.value.trim();if(!text)return;
  const list=load();const now=new Date();const when=now.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});

document.getElementById('copy').onclick=async()=>{
  const list=load().filter(x=>!x.done);
  const out=['## ❓ 待答(从 HTML 复制,'+new Date().toLocaleDateString('zh-CN')+')',''].concat(list.map(x=>'- **['+x.title+']** '+x.text.replace(/\n/g,' '))).join('\n');

  catch(e){const ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');b.textContent='已复制 '+list.length+' 条';}catch(_){b.textContent='复制失败,手动选中';}ta.remove();}
  setTimeout(()=>b.textContent='复制全部为 Markdown',2000);
};
