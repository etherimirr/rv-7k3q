> 先看这一篇:时间、Peter 是谁、之前问过什么、怎么分配复习时间

## 时间、地点、形式
| 项目 | 内容 |

# 篇三 · 基础概念从零讲
> token、embedding、attention、Transformer、VAE、扩散、指标、量化:被问「X 是什么」先看这里

> 被问「X 是什么」时的统一答法:**一句话定义 → 打个比方 → 公式或一个小算例 → 优缺点 → 和你的项目怎么接**。每节最后的 🗣 是能直接说出口的英文版。
<span class="en">For any "what is X" question: one-line definition, an analogy, a formula or tiny worked example, pros and cons, then a link to your own project.</span>

## F1. Token 是什么 · What a token is

**一句话**:token 是模型一次"读进去"的最小单位。文字切成词或词的一部分,图像切成小方块(patch),每个 token 再变成一串数字(向量)喂给模型。
<span class="en">A token is the smallest unit a model reads. Text is split into words or word pieces, images into patches, and each token becomes a vector.</span>

**比方**:像拼乐高。模型不直接看整句话或整张图,而是看一块一块的积木;词表就是"积木种类表"。

**文字怎么切**:常用 BPE(字节对编码):从单个字符开始,把训练语料里最常一起出现的两块反复合并。常见词是一整个 token,生僻词被拆开,比如 unhappiness → un + happiness。
- 经验值:英文 1 个 token 约 4 个字母、约 0.75 个单词。<span class="en">Rule of thumb: one English token is about four characters, or three quarters of a word.</span>
- 词表大小:GPT-2 是 50,257;Llama 2 是 32,000;Llama 3 是 128,256。
- 每个 token 有一个编号(id),模型用编号去 embedding 表里查出它的向量(见 F2)。

**图像怎么切(ViT)**:224×224 的图切成 16×16 的小块,每边 224 / 16 = 14 块,共 14 × 14 = **196 个 patch token**,再加 1 个 [CLS] 分类 token,一共 197 个。每块 16×16×3 = 768 个像素值,拉平后过一个线性层变成向量。
<span class="en">ViT cuts a 224 by 224 image into 16 by 16 patches: 14 times 14 is 196 patch tokens, plus one CLS token. Each patch is flattened and linearly projected.</span>
- 多模态模型里图像 token 很多:LLaVA-1.5 用 CLIP ViT-L/14、336 分辨率,336 / 14 = 24,24 × 24 = **576 个图像 token**,比一句话的文字 token 多得多。所以"分辨率 vs token 数"是多模态的核心取舍。

**常被追问**:
- 为什么不直接按字母?序列太长,注意力代价随长度平方涨(见 F9)。为什么不按整词?词表会爆,还处理不了新词。BPE 是折中。
- 上下文长度 4K/128K 说的就是 token 数,不是字数。

> 🗣 A token is the basic unit a model processes. For text we use subword tokenization like BPE, so common words are one token and rare words are split into pieces; in English one token is roughly three quarters of a word. For images, a ViT cuts the picture into patches: a 224 by 224 image with 16 by 16 patches gives 196 tokens. Each token id is mapped to an embedding vector, and the context length of a model is counted in tokens.

## F2. Embedding 和向量相似度 · Embeddings and similarity

**一句话**:embedding 是把一个东西(词、图片块、整张图)变成一串数字,让**意思相近的东西数字也相近**。
<span class="en">An embedding turns an item into a vector so that similar meanings end up close together.</span>

**比方**:给每个词在地图上安个坐标。"猫"和"狗"挨得近,"猫"和"发动机"离得远。真实的地图不是 2 维,而是几百到几千维。

**怎么来的**:文字 embedding 就是一张大表,形状 = 词表大小 × 维度(比如 32,000 × 4096),token id 是第几行就取第几行,这张表跟着训练一起学。

**怎么比远近**:常用**余弦相似度** = 两个向量的点积 ÷ 各自长度的乘积,范围 −1 到 1。
- 例:a = [1, 0],b = [1, 1]。点积 = 1;|a| = 1,|b| = √2 ≈ 1.414;余弦 = 1 / 1.414 ≈ **0.707**(夹角 45°)。
- CLIP 就是让"图片向量"和"对应文字向量"的余弦相似度变高(见 F15)。

> 🗣 An embedding maps a token or an image to a dense vector so that semantically similar things are close. For text it's a learned lookup table of size vocabulary by dimension. We usually compare embeddings with cosine similarity, which is the dot product divided by the norms, and that's exactly what CLIP optimizes between image and text embeddings.

## F3. 神经元、全连接层和激活函数 · Neurons, linear layers, activations

**一句话**:一个全连接层就是 y = Wx + b(矩阵乘再加偏置);激活函数是夹在层之间的非线性"弯折"。
<span class="en">A linear layer computes y = Wx + b; an activation function adds the non-linearity between layers.</span>

**为什么必须有激活**:没有激活,两层线性叠起来 W₂(W₁x) = (W₂W₁)x,还是一层线性,叠一百层也只能画直线。加了激活才能拟合弯曲的复杂关系。
<span class="en">Without activations, stacked linear layers collapse into one linear map.</span>

| 激活 | 公式 | 输出范围 | 用在哪 | 毛病 |
|---|---|---|---|---|
| Sigmoid | 1 / (1 + e⁻ˣ) | (0, 1) | 二分类输出、门控 | 两头饱和,梯度消失 |
| Tanh | (eˣ − e⁻ˣ)/(eˣ + e⁻ˣ) | (−1, 1) | RNN | 同样饱和 |
| ReLU | max(0, x) | [0, ∞) | CNN 默认 | 负半边梯度为 0,可能"死神经元" |
| GELU | x · Φ(x)(Φ 是标准正态的累积分布) | 约 (−0.17, ∞) | Transformer(BERT、GPT、ViT) | 稍慢 |

小算例:sigmoid(0) = 0.5;sigmoid(2) ≈ 0.881;ReLU(−3) = 0,ReLU(3) = 3。

> 🗣 A linear layer is a matrix multiply plus a bias. Activations add non-linearity; without them any stack of linear layers is still one linear function. ReLU is the default in CNNs because it's cheap and doesn't saturate for positive inputs; Transformers usually use GELU, a smooth version. Sigmoid squashes to zero to one, which is useful for binary outputs but saturates and causes vanishing gradients in deep stacks.

## F4. Softmax 和交叉熵 · Softmax and cross-entropy

**一句话**:softmax 把一串任意分数(logits)变成加起来等于 1 的概率;交叉熵衡量"正确答案拿到的概率有多低",越低罚得越重。
<span class="en">Softmax turns raw scores into probabilities that sum to one; cross-entropy penalizes a low probability on the correct class.</span>

**softmax 算例**:logits = [2, 1, 0]。e² ≈ 7.389,e¹ ≈ 2.718,e⁰ = 1,总和 ≈ 11.107。概率 ≈ [**0.665, 0.245, 0.090**]。

**交叉熵**:loss = −log(正确类的概率)。
- 正确类拿到 0.8 → −ln 0.8 ≈ **0.223**(罚得轻)
- 正确类只拿到 0.1 → −ln 0.1 ≈ **2.303**(罚得重)

**常被追问**:
- 数值稳定:先把所有 logits 减去最大值再算 e 的指数,结果不变但不会溢出。
- PyTorch 的 CrossEntropyLoss 自带 log_softmax,输入要给原始 logits,别先手动 softmax(和你 RCRI 双 sigmoid 是同一类坑)。
- 为什么分类不用 MSE:softmax 配交叉熵时,梯度正好是"预测概率 − 真实标签",干净且不会因饱和变小。

> 🗣 Softmax exponentiates the logits and normalizes them so they sum to one. Cross-entropy is minus the log of the probability assigned to the correct class, so 0.8 costs about 0.22 while 0.1 costs about 2.3. Combined with softmax, its gradient is simply prediction minus label. In practice we subtract the max logit for numerical stability, and PyTorch's cross-entropy expects raw logits.

## F5. 梯度下降和反向传播 · Gradient descent and backpropagation

**一句话**:梯度告诉你"参数往哪个方向动,loss 涨得最快",梯度下降就是往反方向走一小步;反向传播是用链式法则从输出往回一层层算出每个参数的梯度。
<span class="en">The gradient points where the loss rises fastest; gradient descent steps the other way. Backpropagation computes all gradients with the chain rule, from the output backwards.</span>

**比方**:蒙着眼下山。用脚感受哪边往下(梯度),迈一步(学习率决定步子大小),重复。

**算例**:模型 y = w·x,loss = (y − t)²。x = 2,t = 4,w 初始 1。
1. 前向:y = 2,loss = (2 − 4)² = 4
2. 反向:dloss/dw = 2(y − t) · x = 2 × (−2) × 2 = −8
3. 更新(学习率 0.1):w ← 1 − 0.1 × (−8) = **1.8**
4. 再前向:y = 3.6,loss = 0.16,降了

**名词**:batch = 一次更新用多少样本;iteration = 更新一次;epoch = 把全部数据过一遍。1 万张图、batch 100 → 每个 epoch 100 次 iteration。
- 学习率太大:loss 震荡甚至变 NaN;太小:降得极慢。常配 warmup + 余弦衰减。
- 优化器:SGD 加动量(记住之前的方向);Adam = 动量 + 每个参数自己调步长,上手快;AdamW 把权重衰减单独拿出来,Transformer 常用。

> 🗣 Training minimizes a loss by gradient descent: compute the gradient of the loss with respect to each weight and step in the opposite direction, scaled by the learning rate. Backpropagation is just the chain rule applied from the output layer back to the input, reusing intermediate results. For example with y equals w x and squared error, the gradient is two times the error times x. Adam adds momentum and per-parameter step sizes, and AdamW is the usual choice for Transformers.

## F6. 过拟合、正则化和 Dropout · Overfitting and regularization

**一句话**:过拟合 = 把训练题背下来了,考新题就错。表现是训练 loss 一直降,验证 loss 先降后升。
<span class="en">Overfitting means memorizing the training set: training loss keeps falling while validation loss turns back up.</span>

**怎么治**:
- 更多数据、数据增强(翻转、裁剪、调颜色;RCRI 里你就做了增强)
- 权重衰减(L2):loss 里加 λ·Σw²,让权重别太大
- Dropout:训练时每次随机把一部分神经元(比如 p = 0.1 或 0.5)置 0,逼网络不依赖某几个;**推理时关掉**(PyTorch 里 model.eval())
- 早停:验证 loss 不再降就停
- 换小模型或加 BatchNorm

**偏差和方差**:欠拟合 = 偏差大(模型太简单,训练集都学不好);过拟合 = 方差大(对训练数据太敏感)。

> 🗣 Overfitting is when the model memorizes training data, so training loss keeps dropping but validation loss rises. Fixes are more data and augmentation, weight decay, dropout, early stopping, or a smaller model. Dropout randomly zeroes activations during training so the network can't rely on a few units, and it is turned off at inference.

## F7. BatchNorm 和 LayerNorm · Normalization layers

**一句话**:都是把数值"拉回均值 0、方差 1"再乘一个可学的缩放、加一个可学的平移,让训练更稳更快。区别是**沿哪个方向求平均**。
<span class="en">Both normalize to zero mean and unit variance, then apply a learned scale and shift. They differ in which axis they average over.</span>

| | BatchNorm | LayerNorm |
|---|---|---|
| 在哪个方向求均值 | 同一个通道,跨整个 batch(和空间位置) | 同一个样本,跨它所有特征 |
| 依赖 batch 吗 | 依赖,batch 太小就不准;推理时用训练时记下的滑动平均 | 不依赖,训练和推理一样 |
| 用在哪 | CNN | Transformer、RNN |

**为什么 Transformer 用 LayerNorm**:句子长短不一、batch 常常很小,而且推理时一次可能只有一个样本,BN 的统计量不靠谱。

> 🗣 BatchNorm normalizes each channel using statistics across the batch, which works well for CNNs but depends on batch size and uses running averages at inference. LayerNorm normalizes each sample across its own features, so it's independent of the batch and of sequence length, which is why Transformers use it.

## F8. 卷积和 CNN · Convolution and CNNs

**一句话**:卷积是拿一个小窗口(卷积核,比如 3×3)在图上滑,每个位置做"对应相乘再相加";同一个核在整张图上共用。
<span class="en">A convolution slides a small kernel over the image, computing a weighted sum at each position, with the same weights shared everywhere.</span>

**比方**:拿一个"竖边检测器"小印章在图上到处盖,哪里有竖边哪里就亮。

**两个好处**:局部性(像素只和邻居强相关)+ 权值共享(猫在左上角还是右下角都是猫),所以参数少、对平移不敏感。
**毛病**:感受野要靠堆层才变大,远处的关系看不到;这正是 ViT 用注意力来补的地方。

**两个必会公式**:
- 输出尺寸 = ⌊(W − K + 2P) / S⌋ + 1。例:224 输入、3×3 核、P = 1、S = 1 → 224;S = 2 → ⌊223 / 2⌋ + 1 = **112**
- 参数量 = K × K × 输入通道 × 输出通道 + 输出通道(偏置)。例:3×3、64 → 128 通道:3·3·64·128 + 128 = **73,856**

**池化**:2×2 最大池化取每个 2×2 小格的最大值,尺寸减半,没有参数。
**残差连接(ResNet)**:y = x + F(x),梯度能沿着"+ x"这条直路传回去,所以网络能堆到上百层。

> 🗣 A convolution slides a small learned kernel across the image and computes a weighted sum at each location, sharing the same weights everywhere. That gives locality and translation equivariance with very few parameters. Output size is W minus K plus 2P over S, plus one, and a 3 by 3 conv from 64 to 128 channels has about 74 thousand parameters. The weakness is a limited receptive field, which deep stacks, dilation or attention address. Residual connections let gradients flow through the identity path so very deep networks train.

## F9. Attention 背后的原理 · How attention works

**一句话**:attention 让每个 token 自己决定"该看谁、看多少",然后把被看的那些 token 的信息按比例混合进来。
<span class="en">Attention lets each token decide which other tokens to look at and how much, then mixes in their information by those weights.</span>

**比方:图书馆查资料**。
- **Q(Query,查询)**:你手里的问题,"我想找讲猫的书"
- **K(Key,键)**:每本书书脊上的标签
- **V(Value,值)**:书里真正的内容
- 拿问题和每个标签比相似度(Q·K),越像分数越高 → softmax 变成比例 → 按比例把各本书的内容(V)混在一起带走。

Q、K、V 都是同一个输入向量分别乘三个**可学的矩阵** W_Q、W_K、W_V 得到的,所以"该问什么、怎么贴标签、存什么内容"都是学出来的。

**公式**:Attention(Q, K, V) = softmax(Q·Kᵀ / √d_k) · V

**手算一遍**(3 个 token:The、cat、sat,维度 d_k = 2,看 "sat" 这个 token 怎么更新):
- sat 的 q = [1, 0]
- 三个 key:The = [0, 1],cat = [2, 0],sat = [1, 1]
- 点积 q·k:0,2,1
- 除以 √2 ≈ 1.414:0,1.414,0.707
- softmax:e⁰ = 1,e^1.414 ≈ 4.11,e^0.707 ≈ 2.03,总和 ≈ 7.14 → 权重 ≈ [**0.14, 0.58, 0.28**]
- 三个 value:The = [1, 0],cat = [0, 1],sat = [0.5, 0.5]
- 输出 = 0.14·[1, 0] + 0.58·[0, 1] + 0.28·[0.5, 0.5] ≈ **[0.28, 0.72]**
- 读法:"sat" 主要去看了 "cat"(谁坐下了?猫),新向量里混进了猫的信息。

**问:「sat 的 q = [1, 0]」是什么意思?**(11-04 她问的)
- q 是 "sat" 这个 token 发出的**问题向量**,表示"我想找什么样的信息"。
  <span class="en">q is the query vector of the token "sat": what kind of information it is looking for.</span>
- 它的来历:sat 先查表得到 embedding x(F2),再乘可学的矩阵 W_Q 得到 q = x · W_Q。比如 x = [1, 0.5],W_Q = [[1, 0], [0, 0]],乘出来就是 [1, 0]。
  <span class="en">It comes from multiplying the token's embedding by the learned matrix W_Q.</span>
- [1, 0] 只是为了手算编的 2 维数字。真实模型里每个头的 q 有 64 或 128 维,单独某一维没有人能读懂的含义。
  <span class="en">The two numbers are made up for hand calculation; real queries have 64 or 128 dimensions per head, and single dimensions are not human-readable.</span>
- 读法看**方向**:q 和哪个 k 方向越一致,点积越大,就越关注它。cat 的 k = [2, 0] 和 [1, 0] 同方向,点积 2,最关注;The 的 k = [0, 1] 和它垂直,点积 0,不关注;sat 自己的 k = [1, 1] 只有一半同向,点积 1,中等。
  <span class="en">What matters is direction: the more a key points the same way as the query, the larger the dot product and the more attention it gets.</span>
- 同一个 token 有三个不同的向量:q 是"我要找什么",k 是"我身上贴的标签",v 是"我能给出的内容"。所以 sat 的 q = [1, 0],k 却是 [1, 1]。
  <span class="en">One token has three different vectors: q is what it asks for, k is the label it offers, v is the content it gives.</span>

> 🗣 In the toy example, q equals one-zero is simply the query vector of the token "sat", obtained by multiplying its embedding by W_Q. The numbers are made up so we can compute by hand. What matters is its direction: "cat" has a key pointing the same way, so its dot product is the largest and "sat" attends mostly to "cat", while "The" has an orthogonal key and gets almost no attention.

**问:那 k 和 v 从哪来?**(11-04 她问的)
- 和 q 一样,都从**同一个** x 出来,只是乘的矩阵不同:q = x · W_Q,k = x · W_K,v = x · W_V。
  <span class="en">Same input x, three different learned matrices: q = x W_Q, k = x W_K, v = x W_V.</span>
- 接着上面的数:x = [1, 0.5]。
  - W_K = [[1, 0], [0, 2]] → k = [1×1 + 0.5×0, 1×0 + 0.5×2] = **[1, 1]**
  - W_V = [[0.5, 0], [0, 1]] → v = [0.5, 0.5] = **[0.5, 0.5]**
  - 正好就是例子里 sat 的 k 和 v。
- **三个矩阵所有词共用**:同一层里,The、cat、sat 都乘同一组 W_Q、W_K、W_V。每个词得到不同的 q、k、v,是因为它们的 x 不同。
  <span class="en">All tokens in a layer share the same three matrices; they get different q, k, v only because their inputs differ.</span>
- **矩阵是训练学出来的**:一开始随机,靠反向传播(F5)慢慢调成"什么该问、标签怎么贴、内容存什么"。
- 实际模型里还有三点:
  - x 不只是查表的词向量,还加了位置信息(F10);第二层以后的 x 是上一层的输出。
  - 多头注意力里每个头有自己的一组 W_Q、W_K、W_V(F9 变体)。
  - Cross-attention 里 q 来自一边(比如文字),k 和 v 来自另一边(比如图像特征),这是它和 self-attention 唯一的区别。
- 说明:例子里 The、cat 的数是为了好算直接写的,没有用这组矩阵倒推,别拿来对。

> 🗣 Keys and values come from the same input as the query, just through different learned matrices: k equals x times W_K and v equals x times W_V. All tokens in a layer share the same three matrices, so they differ only because their inputs differ. The matrices start random and are learned by backpropagation. In cross-attention the queries come from one sequence and the keys and values from another, for example text queries attending to image features.

**为什么除以 √d_k**:假设 q 和 k 的每一维均值 0、方差 1,点积是 d_k 项相加,方差变成 d_k。维度 64 时点积的标准差约 8,softmax 会被推到几乎 one-hot,梯度接近 0。除以 √d_k 把方差拉回 1。
<span class="en">With unit-variance entries, a dot product of d_k terms has variance d_k; dividing by root d_k brings it back to one so softmax doesn't saturate.</span>

**几个变体**:
- **Self-attention**:Q、K、V 来自同一段序列(句子看自己)。
- **Cross-attention**:Q 来自一边,K、V 来自另一边。例:文字去"查"图像特征,或翻译时译文去查原文。
- **Multi-head(多头)**:把维度切成几份,各算各的注意力再拼回来。例:d_model = 512、8 个头,每头 64 维。不同的头可以关注不同关系(语法、指代、位置)。
- **Causal mask(因果遮罩)**:GPT 生成时,在 softmax 前把"未来位置"的分数设成 −∞,保证第 i 个 token 只能看 1…i。

**代价**:每个 token 都要和每个 token 算一次,序列长 n,注意力矩阵是 n × n,计算 O(n²·d)、显存 O(n²)。长度翻倍,代价约翻 4 倍。这就是为什么图像 token 太多会很贵(F1)。

**和 CNN 比**:CNN 只看邻居,要堆很多层才看得到远处;attention 第一层就能看全局,但缺少"邻居更重要"这种先验,所以更吃数据。

> 🗣 Attention computes, for each token, a weighted average of the other tokens' values. Each token is projected into a query, a key and a value with learned matrices. The query is compared with every key by dot product, scaled by root d_k so the softmax doesn't saturate, and the softmax weights are used to mix the values. In self-attention all three come from the same sequence; in cross-attention the queries come from one modality and the keys and values from another. Multi-head attention runs several of these in parallel on smaller subspaces. The cost is quadratic in sequence length, which is why the number of image tokens matters so much in multimodal models.

## F10. 位置编码 · Positional encoding

**一句话**:attention 本身不知道顺序("猫咬狗"和"狗咬猫"对它是一样的一堆 token),位置编码就是给每个 token 加上"我在第几个"的信息。
<span class="en">Attention is order-blind, so positional encodings inject each token's position.</span>

三种常见做法:
- **正弦位置编码**(原版 Transformer):用不同频率的 sin/cos 生成一个向量,加到 embedding 上;不用学。
- **可学的位置编码**(BERT、ViT):每个位置一个可学的向量。ViT 换分辨率时要对它插值。
- **RoPE 旋转位置编码**(Llama 等):把 Q 和 K 按位置旋转一个角度,点积只和两者的**相对距离**有关,长文本外推更好。

和 NeRF 里的"位置编码"同名但目的不同:NeRF 那个是把坐标变成高频 sin/cos,让网络学得出细节。

> 🗣 Self-attention is permutation-invariant, so we add positional information. The original Transformer used fixed sinusoids, BERT and ViT learn a vector per position, and modern LLMs like Llama use RoPE, which rotates queries and keys so their dot product depends on relative distance.

## F11. 一层 Transformer 长什么样 · One Transformer block

**一句话**:一层 = 注意力(让 token 互相交流)+ 前馈网络 FFN(每个 token 自己再加工),两处都带残差连接和 LayerNorm。整个模型就是把这一层叠 N 次。
<span class="en">One block is attention for tokens to exchange information plus a feed-forward network applied to each token, each wrapped with a residual connection and LayerNorm.</span>

```
x ──► LayerNorm ──► 多头自注意力 ──► (+ x) ──► LayerNorm ──► FFN ──► (+) ──► 输出
 └──────────────────────────────────┘          └───────────────────┘
          残差                                           残差
```

- FFN:两层全连接,中间先放大约 4 倍再缩回,比如 512 → 2048 → 512,中间用 GELU。
- 上图是 Pre-LN(先归一化再进子层),现在大多用这种,训练更稳;原版论文是 Post-LN。
- 大部分参数在 FFN 里,不在注意力里。

> 🗣 A Transformer block has two sub-layers: multi-head self-attention, where tokens exchange information, and a position-wise feed-forward network, usually expanding the width by four with a GELU. Each sub-layer has a residual connection and LayerNorm, and most modern models apply the norm before the sub-layer for stability. The model is just N of these blocks stacked.

## F12. Encoder、Decoder 和 GPT 怎么生成 · Encoders, decoders and generation

**一句话**:encoder 双向看全句,适合"理解";decoder 只能看左边,适合"一个字一个字往下写"。
<span class="en">Encoders see the whole sequence and suit understanding; decoders only see the left context and suit generation.</span>

| 类型 | 代表 | 怎么训练 | 擅长 |
|---|---|---|---|
| 只有 encoder | BERT、ViT | 遮住 15% 的词让它猜(掩码语言模型) | 分类、检索、特征 |
| 只有 decoder | GPT、Llama | 预测下一个 token | 生成、对话 |
| encoder + decoder | 原版 Transformer、T5 | 输入编码,输出逐字生成,中间用 cross-attention | 翻译、摘要 |

**自回归生成**:输入"今天天气" → 输出下一个 token 的概率分布 → 选一个(比如"很")→ 把它接到输入后面 → 再预测下一个 → 直到出现结束符。
- **温度(temperature)**:logits 先除以 T 再 softmax。T < 1 更保守,T > 1 更随机,T 接近 0 就是每次挑最大的(贪心)。
- **top-k / top-p**:只在概率最高的 k 个、或累积概率到 p 的那几个里抽。
- **KV cache**:生成第 100 个 token 时,前 99 个的 K 和 V 不会变,存起来就不用重算,每步只算新 token 的。代价是显存随长度线性增长,这也是推理服务的主要瓶颈之一。

**LLM 训练三步**:预训练(海量文本预测下一个 token)→ 指令微调 SFT(人写的问答对)→ 对齐(RLHF 或 DPO,按人类偏好调)。

> 🗣 Encoder models like BERT use bidirectional attention and are trained by masked prediction, so they're good for understanding. Decoder-only models like GPT use causal attention and are trained to predict the next token, so they generate autoregressively, feeding each sampled token back in. Temperature and top-p control randomness. During generation we keep a KV cache so earlier keys and values aren't recomputed, which trades memory for speed.

## F13. ViT 和 CNN 怎么选 · ViT versus CNN

**一句话**:ViT 把图像切成 patch 当 token,直接用 Transformer;CNN 用卷积从局部往外看。
<span class="en">ViT treats image patches as tokens for a Transformer; a CNN builds up from local convolutions.</span>

- **归纳偏置**:CNN 天生知道"邻居相关、平移不变",数据少也能学好;ViT 没有这些先验,要大量数据(原论文在 ImageNet-21k 或 JFT-300M 上预训练才超过 ResNet)。
- **全局性**:ViT 第一层就能看全图;CNN 要堆层。
- **代价**:ViT 随 token 数平方涨,高分辨率很贵;CNN 随像素数线性涨,在 Jetson 这类边缘设备上更好部署(你 RCRI 用 YOLOv8,就是 CNN)。
- **折中**:Swin Transformer(窗口内做注意力)、ConvNeXt(把 CNN 现代化,性能追上 ViT,这是 Peter 导师 Saining Xie 的工作)。

> 🗣 ViT splits the image into patches and runs a standard Transformer, so it has global context from the first layer but weak inductive bias and needs a lot of pretraining data. CNNs have locality and translation equivariance built in, scale linearly with resolution and are easier to deploy on edge devices, which is why I used YOLOv8 on the Jetson. Hybrids like Swin, and modernized CNNs like ConvNeXt, sit in between.

## F14. 监督、自监督、对比学习 · Supervised, self-supervised, contrastive

**一句话**:监督 = 人给标签;自监督 = 从数据本身造题目(遮住一块让它补、两张增强图让它认出是同一张);对比学习是自监督的一种:**把配对的拉近,不配对的推远**。
<span class="en">Supervised learning uses human labels; self-supervised learning makes its own task from the data; contrastive learning pulls matching pairs together and pushes others apart.</span>

- **MAE**:遮掉图像 75% 的 patch,让模型补全像素。
- **DINO**:同一张图做两种增强,让学生网络的输出去对齐老师网络(老师是学生的滑动平均),不需要负样本。
- **对比学习的损失(InfoNCE)**:一个 batch 里有 N 对,算 N × N 的相似度矩阵,对角线是正确配对,对每一行做"N 选 1"的交叉熵。
- 为什么重要:标签贵,网上的无标签图和图文对几乎无限。

> 🗣 Self-supervised learning creates the training signal from the data itself, for example MAE masks 75 percent of patches and reconstructs them, and DINO matches a student to a momentum teacher across augmentations. Contrastive learning is a family where matched pairs are pulled together and everything else in the batch is pushed apart, typically with the InfoNCE loss, which is cross-entropy over a similarity matrix.

## F15. CLIP 和零样本 · CLIP and zero-shot

**一句话**:CLIP 有一个图像编码器和一个文字编码器,用约 4 亿对网上图文做对比学习,让配对的图和文字向量靠近。训练完,不用再训练就能分类:把类别写成句子,看图和哪句话最像。
<span class="en">CLIP trains an image encoder and a text encoder contrastively on about 400 million image-text pairs; zero-shot classification picks the caption most similar to the image.</span>

**零样本分类怎么做**:类别 = 猫、狗、鸟 → 写成 "a photo of a cat" 等 3 句 → 文字编码器出 3 个向量 → 图片出 1 个向量 → 算 3 个余弦相似度 → 最高的就是答案。你 E6792 里做的就是这个,文字向量提前算好缓存起来。
- zero-shot = 没见过这个任务的标注样本;few-shot = 只给几个例子。
- 弱点:细节、数数、方向、空间关系不行,因为图文对的文字很少描述这些(Peter 的 Eyes Wide Shut 就是讲这个,见篇四)。

> 🗣 CLIP has an image encoder and a text encoder trained contrastively on roughly 400 million image-caption pairs, so matching images and captions have high cosine similarity. For zero-shot classification you turn each class name into a prompt like "a photo of a cat", embed the prompts once, and pick the one closest to the image embedding. That's what I deployed in my GPU course project, with the text embeddings cached.

## F16. 预训练、微调、迁移学习和 LoRA · Pretraining, fine-tuning, LoRA

**一句话**:先在海量通用数据上学通用本领(预训练),再在你自己的小数据上调一调(微调)。从别的任务借来本领就叫迁移学习。
<span class="en">Pretrain on huge general data, then fine-tune on your small task data; borrowing knowledge across tasks is transfer learning.</span>

- 你 RCRI 就是迁移学习:从 COCO 预训练的 YOLOv8 开始,在攀岩点数据上微调。
- **全量微调**:所有参数都改,效果好但贵。
- **LoRA**:原权重 W 冻住不动,旁边加两个小矩阵 B·A(秩 r 很小),只训练它们。例:4096 × 4096 的矩阵有约 1,680 万参数;r = 8 时 A 是 8 × 4096、B 是 4096 × 8,共 65,536 个参数,约 **0.39%**。推理时可以把 B·A 合并回 W,不增加延迟。
- 冻住 backbone 只训分类头叫 linear probe(线性探测),常用来评估特征好不好。

> 🗣 Transfer learning starts from a model pretrained on large data and fine-tunes it on the target task; in my climbing project I fine-tuned a COCO-pretrained YOLOv8. LoRA freezes the original weights and learns a low-rank update B times A; for a 4096 by 4096 layer with rank 8 that's about 65 thousand trainable parameters instead of 16.8 million, and it can be merged back so inference cost doesn't change.

## F17. Autoencoder 和 VAE · Autoencoders and VAEs

**一句话**:autoencoder 把图压成一小串数字(潜变量 z)再还原回来;VAE 在此基础上要求这串数字**服从一个规整的分布**(标准正态),这样随便抽一个 z 也能解码出像样的图,所以 VAE 能**生成**。
<span class="en">An autoencoder compresses an input to a small latent code and reconstructs it. A VAE also forces the latent space to follow a standard normal distribution, so random samples decode to plausible images, which makes it generative.</span>

**比方**:普通 autoencoder 像把每张照片存进仓库的一个**精确货架号**,货架之间是空的,随便报一个号码,取出来是垃圾。VAE 要求每张照片存成"大概在这一片区域",而且所有区域都挤在仓库中央、互相重叠,所以随便指一个位置,取出来都像一张正常照片,相邻位置的照片也很像。

**结构**:
```
图 x ──► 编码器 ──► μ(均值), σ(标准差) ──► 抽样 z = μ + σ·ε ──► 解码器 ──► 还原图 x̂
                                              ε ~ N(0, 1)
```

**损失 = 重建损失 + KL 散度**:
- 重建:x̂ 和 x 越像越好(MSE 或交叉熵)
- KL:让编码器给出的分布 N(μ, σ²) 靠近标准正态 N(0, 1)。每一维 KL = ½(μ² + σ² − log σ² − 1)。μ = 0、σ = 1 时正好是 0。
- 两者合起来是 ELBO(证据下界)的负数,最小化它 = 最大化数据似然的下界。

**重参数化技巧**:直接"从 N(μ, σ²) 里抽一个数"这一步没法求导。改写成 z = μ + σ·ε,随机性全在 ε 里,μ 和 σ 就能正常反向传播。
<span class="en">Sampling isn't differentiable, so we write z = μ + σ·ε with ε from a standard normal; the randomness moves into ε and gradients flow through μ and σ.</span>

**在今天的模型里的位置**:Stable Diffusion 先用 VAE 把 512 × 512 × 3 的图压成 64 × 64 × 4 的潜变量(每边缩 8 倍,数字个数从 786,432 降到 16,384,约 48 倍),扩散过程在这个小空间里做,省很多算力,最后再用 VAE 解码器还原。Peter 参与的 **RAE** 就是把这个 VAE 换成冻结的表示编码器(如 DINOv2)+ 训练的解码器(见篇四)。

**毛病**:用 MSE 重建时 VAE 生成的图偏糊,因为它在"平均"所有可能;Stable Diffusion 的 VAE 额外加了感知损失和对抗损失来变清晰。

| | Autoencoder | VAE | GAN | 扩散模型 |
|---|---|---|---|---|
| 能生成吗 | 不行(潜空间有洞) | 能 | 能 | 能 |
| 清晰度 | — | 偏糊 | 清晰 | 清晰 |
| 训练 | 稳 | 稳 | 不稳,会模式崩塌 | 稳,但生成要多步,慢 |

> 🗣 An autoencoder compresses an input into a latent code and reconstructs it, but its latent space has gaps, so random codes decode to garbage. A VAE has the encoder output a mean and variance, samples z with the reparameterization trick, z equals mu plus sigma times epsilon, and adds a KL term that pulls each latent distribution toward a standard normal. The loss is reconstruction plus KL, the negative ELBO. That makes the latent space smooth enough to sample from. Today the main use is as the compressor in latent diffusion: Stable Diffusion's VAE maps 512 by 512 images to 64 by 64 by 4 latents, and RAE replaces that VAE with a frozen representation encoder.

## F18. GAN 和扩散模型(一分钟版) · GANs and diffusion in one minute

**GAN**:两个网络对打。生成器从噪声造假图,判别器分真假;生成器想骗过判别器。图很清晰,但训练不稳定,容易只会画几种图(模式崩塌)。
<span class="en">A GAN trains a generator against a discriminator; sharp results but unstable training and mode collapse.</span>

**扩散模型**:训练时把真图一步步加噪声(比如 1000 步)直到变成纯噪声,让网络学"这一步加了什么噪声"(预测噪声,MSE 损失);生成时从纯噪声出发,一步步把噪声减掉。稳定、多样、质量高,缺点是要多步所以慢(DDIM 等采样器能把步数降到几十步)。详细的从零讲解在篇四 4.1。
<span class="en">Diffusion adds noise over many steps during training and learns to predict the noise; generation denoises step by step from pure noise. Stable and high quality, but slow because of the many steps.</span>

> 🗣 GANs pit a generator against a discriminator and give sharp images but are unstable and prone to mode collapse. Diffusion models learn to reverse a gradual noising process by predicting the added noise, which trains stably and gives diverse high-quality samples, at the cost of many denoising steps at inference. Latent diffusion runs that process inside a VAE's latent space to save compute.

## F19. 评价指标 · Evaluation metrics

**分类和检测**:
- Precision(查准)= TP / (TP + FP):你说是的里面,真是的比例
- Recall(查全)= TP / (TP + FN):真是的里面,你找到的比例
- F1 = 2PR / (P + R)
- 算例:图里真有 100 个攀岩点,模型画了 90 个框,其中 80 个对 → P = 80/90 ≈ **0.889**,R = 80/100 = **0.80**,F1 ≈ **0.842**
- IoU = 两框交集面积 / 并集面积;mAP50 = IoU ≥ 0.5 算对时的平均精度(各类 AP 再平均);mAP50-95 = IoU 阈值从 0.5 到 0.95 每隔 0.05 取一次再平均,更严。你 RCRI 是 mAP50 0.825。
- 类别极不平衡时别只看 accuracy:99% 是负样本,全猜负也有 99%。

**图像质量**:PSNR = 10 · log₁₀(MAX² / MSE),单位 dB,越高越好;SSIM 比较亮度、对比度、结构,0 到 1,越接近 1 越像。

**语言模型**:困惑度 perplexity = e^(平均每个 token 的交叉熵),越低越好,可以理解为"每一步平均在几个词之间犹豫"。

> 🗣 Precision is the fraction of predicted positives that are correct, recall is the fraction of true positives we found, and F1 is their harmonic mean. For detection we match boxes by IoU, and mAP at 0.5 averages precision over recall levels and classes; my climbing-hold detector reached 0.825. For image restoration we use PSNR and SSIM, and for language models perplexity, the exponential of the average token cross-entropy.

## F20. 推理加速:量化、剪枝、蒸馏、TensorRT · Making inference fast

**一句话**:训练完的模型太大太慢,上设备前要"瘦身"。
<span class="en">Before deployment we shrink and speed up the trained model.</span>

- **量化**:用更少的位数存数字。FP32 每个数 4 字节 → FP16 2 字节 → INT8 1 字节。显存和带宽减半或减到 1/4,硬件上算得更快;INT8 需要用一小批校准数据定缩放范围,精度可能掉一点。
- **剪枝**:去掉不重要的权重或通道。
- **蒸馏**:让小模型(学生)去学大模型(老师)的输出分布,比只学硬标签效果好。
- **TensorRT**:NVIDIA 的推理引擎,做层融合(比如卷积 + BN + ReLU 合成一个 kernel)、选最快的 kernel、支持 FP16/INT8。你 E6792 实测 12 倍加速,RCRI 在 Jetson 上用 FP16。
- **延迟 vs 吞吐**:延迟 = 一张图要多久(实时无人机看这个);吞吐 = 每秒能处理多少张(批量服务看这个)。加大 batch 提吞吐但通常拉高延迟。

> 🗣 For deployment we quantize, prune or distill the model. Quantization stores weights and activations in FP16 or INT8 instead of FP32, cutting memory and bandwidth; INT8 needs calibration data. Distillation trains a small student on a large teacher's soft outputs. TensorRT fuses layers, auto-tunes kernels and runs in reduced precision; in my GPU course project it gave about a 12x speedup, and on the Jetson I ran YOLOv8 in FP16. For a drone, latency per frame matters more than throughput.

## F21. 多模态大模型是怎么"看图"的(串起来) · How a multimodal LLM sees, end to end

把上面的概念串成一条线,这是最可能被追问的"综合题":

```
图片 ──► 切 patch(F1)──► 视觉编码器 ViT/CLIP(F13, F15)──► 576 个视觉向量
                                                                │
                                                     投影层(2 层 MLP)
                                                                ▼
文字 ──► 分词 BPE(F1)──► embedding(F2)──► [视觉 token + 文字 token] ──► LLM decoder(F11, F12)──► 逐字生成回答
```

- 投影层的作用:把视觉向量"翻译"成 LLM 认识的维度和空间。
- 常见训练两阶段(LLaVA):先只训投影层做图文对齐,再放开 LLM 做指令微调。
- 弱点链条:视觉编码器丢了细节(CLIP 弱点)→ LLM 再聪明也答不对,这就是 Peter 的研究起点。

> 🗣 A typical multimodal LLM like LLaVA encodes the image with a CLIP ViT into a few hundred patch embeddings, projects them with a small MLP into the language model's embedding space, concatenates them with the text tokens, and lets the decoder generate the answer autoregressively. Training usually first aligns the projector, then instruction-tunes the whole model. If the vision encoder loses fine detail, the language model can't recover it, which is the starting point of Peter's work.

## F22. VLM:能看图又能说话的模型 · Vision-language models

**一句话**:VLM(Vision-Language Model)同时吃图片和文字。有的只判断"图和这句话配不配",有的能看着图用文字回答问题。
<span class="en">A VLM takes both images and text. Some only score whether an image and a caption match; others look at the image and answer in text.</span>

**比方**:
- **对比式 VLM(CLIP、SigLIP)像"配对裁判"**:给它一张图和几句话,它只告诉你哪句最配,自己不会说话。见 F15。
- **生成式 VLM(LLaVA、Qwen2-VL、GPT-4o)像"看图说话的人"**:图进去,一段文字出来。流程见 F21。

**生成式 VLM 的三块零件**:
- **视觉编码器**:通常是 CLIP 或 SigLIP 的 ViT,负责把图变成一串向量。
- **连接器**:把视觉向量翻译成 LLM 能读的样子。常见三种:
  - **MLP 投影**(LLaVA):两层全连接。简单,视觉 token 一个不少,全部送进 LLM。
  - **Q-Former**(BLIP-2):用 32 个可学的"提问向量"去 cross-attention 图像特征(F9),把几百个视觉 token 压成 32 个。省算力,但可能丢细节。
  - **Cross-attention 插层**(Flamingo):图像不进输入序列,而是在 LLM 层与层之间插 cross-attention 去"查"图像。
- **LLM**:负责理解指令、组织语言、生成回答(F12)。

**小算例:一张图占多少 token**
- LLaVA-1.5 用 CLIP ViT-L/14,输入 336×336:336 ÷ 14 = 24,24 × 24 = **576 个 token**。
- 想看清细节就把图放大。比如 672×672 切成 4 块,每块 576 个,再加一张缩略全图 576 个,一共 5 × 576 = **2880 个**。
- 注意力是 O(n²)(F9):token 从 576 涨到 2880 是 5 倍,注意力那部分算力约涨 25 倍。所以"分辨率 vs 算力"是 VLM 的核心取舍。

**常见弱点(Peter 的研究就在这)**:
- **幻觉**:说出图里根本没有的东西。
- **细粒度和空间**:数数、左右前后、方向、小物体,经常答错。
- 原因之一:CLIP 训练目标只要"图文配得上",不在乎这些细节,视觉编码器一开始就把细节丢了,LLM 再强也补不回来。
- 评测:VQAv2、MMBench 看综合能力;MMVP、CV-Bench 专门测这些视觉短板。

**常被追问**:
- MLP 和 Q-Former 怎么选?要细节、算力够选 MLP;token 预算紧(视频、多图、端侧)选压缩式。LLaVA-1.5 证明了简单的 MLP 效果就很好。
- 怎么减少幻觉?更好的视觉编码器(比如再拼一个 DINOv2 这类自监督特征)、更高分辨率、带"图里没有"负样本的指令数据、解码时让模型更依赖图像。

**和你的经历**:E6792 里你在 Jetson 上跑过 CLIP 零样本推理,这是对比式 VLM,真做过。生成式 VLM 你理解原理,没训练过,别说成做过。

> 🗣 There are two families of vision-language models. Contrastive ones like CLIP and SigLIP embed images and text into a shared space and score how well they match, which is great for zero-shot classification and retrieval. Generative ones like LLaVA put a vision encoder in front of a language model: the image becomes a few hundred patch tokens, a connector such as an MLP or a Q-Former maps them into the LLM's embedding space, and the LLM answers in text. The key trade-off is resolution versus compute, since more image tokens make attention quadratically more expensive. Their known weaknesses are hallucination and fine-grained spatial reasoning, often because the CLIP-style encoder never learned to keep those details.

## F23. VLA:从"看图说话"到"看图动手" · Vision-language-action models

**一句话**:VLA(Vision-Language-Action)= VLM 再往前一步。输入摄像头画面加一句指令,输出机器人该怎么动。
<span class="en">A VLA model takes camera images plus an instruction and outputs robot actions instead of text.</span>

**比方**:VLM 是"看着图告诉你杯子在哪",VLA 是"看着图伸手把杯子拿起来"。

**动作怎么从模型里出来**(两条路):
- **把动作变成 token**(RT-2、OpenVLA):机械臂每一步的动作是 7 个数,也就是末端 x、y、z 的位移,3 个旋转角,再加夹爪开合。每个数切成 256 档,每档当成一个 token,让 LLM 像预测下一个字一样预测动作。
- **直接输出连续动作**(π0):VLM 后面接一个"动作专家",用 flow matching(扩散的近亲,F18)一次生成一小段未来动作(action chunk),动作更平滑,适合精细操作。

**小算例:动作怎么变 token**
- 某一维动作范围是 [−1, 1],切 256 档,每档宽 2 ÷ 256 ≈ 0.0078。
- 想表达 0.30:(0.30 + 1) ÷ 0.0078 ≈ 166.4,落在第 **166 档**,模型就输出代表 166 的那个 token。
- 一步动作 7 维,就是 7 个 token;误差最多半档,约 0.004。

**为什么难**:
- **数据少**:图文对有几十亿,机器人轨迹最大的公开合集 Open X-Embodiment 也才约 100 万条,而且每台机器人长得不一样。
- **太慢**:几十亿参数的模型每秒只能出几次动作,底层控制(尤其飞控)要几百 Hz。
- **安全和验证**:端到端模型出错很难解释,也很难证明它不会撞。

**和无人机怎么接**:分层用。VLM/VLA 做上层慢速的任务理解和规划,比如"飞到红色屋顶上方再降低高度";底层的避障、姿态控制留给小而快的模型和传统控制器。

**常被追问**:
- VLA 和传统"感知 → 规划 → 控制"流水线比?VLA 能听懂开放式指令、泛化到没见过的物体;传统流水线每一步可解释、可调、可验证。现实中常常混用。
- 为什么 OpenVLA 视觉端要拼 SigLIP 和 DINOv2?SigLIP 懂语义,DINOv2 保留空间和几何细节,机器人两样都要。这和 Peter 那篇 Eyes Wide Shut 的结论一致。

**和你的经历**:VLA 你没训练过。你复现过 Ctrl-World(给机器人操作用的扩散世界模型),跑过 policy-in-the-loop rollout,可以用来说明你理解"模型输出动作、环境给反馈"这个闭环。

> 🗣 A VLA model extends a VLM so that it outputs actions. RT-2 and OpenVLA discretize each action dimension, like end-effector translation, rotation and gripper state, into 256 bins and predict them as tokens, so the language model's decoding machinery is reused for control. Pi-zero instead attaches an action expert that generates a continuous chunk of future actions with flow matching. The hard parts are scarce robot data, slow inference compared with control rates, and safety. On a drone I'd use it hierarchically: a VLM or VLA for slow, high-level task planning, and small fast models plus classical control for the real-time loop.

## F24. SLAM:一边画地图一边知道自己在哪 · Simultaneous localization and mapping

**一句话**:SLAM(Simultaneous Localization and Mapping)让机器人或无人机在陌生环境里一边建地图,一边算出自己在地图上的位置。
<span class="en">SLAM lets a robot build a map of an unknown place while estimating where it is in that map.</span>

**比方**:蒙着眼走进陌生房间,一边摸墙画平面图,一边记自己走到了哪。图画得准,位置才算得准;位置算得准,图才画得准。两件事互相依赖,所以必须"同时"做。

**先补相机基础(就是你在看的那页课件)**:
- 空间里一个点 X 拍到照片上,公式是 **x = K [R | t] X**。
- **K 是内参**:相机自己的属性,5 个数,即焦距 fx、fy,倾斜 s(一般是 0),主点 px、py(光轴打在照片上的位置,约等于图像中心)。换个位置拍,K 不变。
- **R、t 是外参**:相机在世界里的位姿,也就是转了多少(3 个角)和在哪(3 个平移),共 6 个数。
- 合起来 P = K[R | t] 是 3×4 矩阵,12 个数,但整体乘一个常数投影结果不变,所以是 **11 个自由度**(5 + 6 = 11)。
- **算一个点**:fx = fy = 500,px = 320,py = 240(640×480 的图)。相机坐标下一个点 (X, Y, Z) = (1, 0.5, 5) 米:
  - u = 500 × 1 ÷ 5 + 320 = **420**
  - v = 500 × 0.5 ÷ 5 + 240 = **290**
  - 读法:点越远(Z 越大)越靠近图像中心。这也是为什么单张图分不清"小东西在近处"还是"大东西在远处"。

**视觉 SLAM 的四个部件**:
- **前端(视觉里程计)**:每帧提特征点(比如 ORB),和上一帧匹配,用几何算出相机这一步怎么动的(本质矩阵 E,或已知 3D 点时用 PnP)。
- **后端优化**:前端每步都有小误差,后端把很多帧放一起做 Bundle Adjustment(同时微调所有相机位姿和 3D 点,让重投影误差最小),或者做位姿图优化。
- **回环检测**:认出"这地方我来过",把累积的漂移一下拉回来。常用词袋(DBoW)做图像检索。
- **建图**:输出稀疏点云(够定位用),或稠密地图(避障、重建用)。

**小算例:为什么要回环**:里程计每走 1 米偏 1%,绕一圈走 100 米就偏约 1 米;回到起点被认出来后,这 1 米误差会被分摊回整条轨迹。

**几个关键概念**:
- **单目的尺度问题**:一个摄像头算不出绝对大小,地图整体放大 2 倍也说得通。解决办法:双目、深度相机,或者加 IMU。
- **VIO(视觉惯性里程计)**:相机加 IMU。IMU 每秒几百次测加速度和角速度,能补上快速运动和画面模糊时的空档,还能给出真实尺度。无人机最常用,代表是 VINS-Mono。
- **特征点法 vs 直接法**:ORB-SLAM 提角点再匹配,稳、可以回环;DSO 这类直接法用像素亮度本身,能在缺纹理的地方工作,但怕光照变化。
- **激光 SLAM**:用 LiDAR 点云配准(比如 LOAM),精度高,设备贵、重。

**和深度学习的关系**:学出来的特征和匹配(SuperPoint 加 SuperGlue/LightGlue)比 ORB 更抗光照和视角变化;单目深度网络能给尺度先验;DROID-SLAM 把整个流程做成可微分的。但位姿怎么优化,大多还是几何那一套。

**常被追问**:
- 无人机为什么用 VIO 而不是纯视觉?飞得快、画面糊、会转得很猛,IMU 高频数据能顶上,还能解决尺度。
- Bundle Adjustment 在优化什么?把所有 3D 点按当前估计的相机位姿投回每张照片,和真实看到的位置比,把这个误差平方和降到最小。

**和你的经历**:SLAM 你没做过,别说成做过。可以说你懂相机模型和多视图几何(内参、外参、本质矩阵),也做过视觉模型在 Jetson 上的实时部署(RCRI、E6792)。如果问 SLAM 和感知怎么配合:SLAM 负责"我在哪",检测分割负责"周围有什么",两者合起来才能安全飞。

> 🗣 SLAM estimates the robot's pose and builds a map at the same time, because each depends on the other. In visual SLAM the front end tracks features between frames and estimates relative motion with the essential matrix or PnP, using the camera model x equals K times R-t times X, where K holds the five intrinsics and R and t the six extrinsics. The back end refines poses and points with bundle adjustment, and loop closure recognizes revisited places to remove drift. A monocular camera can't recover absolute scale, so drones usually fuse an IMU, which is visual-inertial odometry like VINS-Mono. Learned features such as SuperPoint and LightGlue now make matching more robust, while the optimization itself is still mostly geometric.

## F25. 目标检测和 YOLO · Object detection and YOLO

**一句话**:目标检测 = 在图里找出"有什么、在哪"。每个结果是一个框(x, y, 宽, 高)加一个类别和一个置信度。
<span class="en">Object detection finds what is in an image and where: each output is a box, a class label and a confidence score.</span>

**比方**:分类是"这张照片里有猫吗",检测是"把每只猫都圈出来,并标上是猫",分割是"把猫的每个像素都涂上颜色"。

**两大流派**:
- **两阶段**(Faster R-CNN):先由候选区域网络(RPN)提出几百个"可能有东西"的框,再逐个精细分类和修框。准,但慢。
- **单阶段**(YOLO、SSD、RetinaNet):一次前向直接出所有框和类别。快,适合实时。YOLO = You Only Look Once,"只看一眼"。
- **Transformer 检测**(DETR):用一组可学的查询向量直接"认领"物体,训练时用匈牙利匹配一一对应,不需要 NMS。慢一些、训练久。

**YOLO 的核心想法(以最早的 v1 算一遍)**:
- 把图切成 7 × 7 的格子。物体中心落在哪个格子,就由那个格子负责预测它。
- 每个格子预测 2 个框,每个框 5 个数(x、y、w、h、置信度),再加 20 个类别概率:2 × 5 + 20 = 30。
- 所以输出就是一个 **7 × 7 × 30** 的张量,一次前向全部出来。

**现代 YOLO(v8,你 RCRI 用的)**:
- **三段结构**:backbone 提特征(CSP 风格的 CNN)→ neck 融合不同尺度(FPN/PAN,把深层的语义和浅层的细节拼起来)→ head 输出框和类别。
- **三个尺度一起预测**:输入 640×640,步长 8、16、32 得到 80×80、40×40、20×20 三张特征图,共 6400 + 1600 + 400 = **8400 个候选预测**。小步长的那张专管小物体。
- **anchor-free**:早期 YOLO 先预设几种框的形状(anchor)再去微调;v8 直接预测"中心点到四条边的距离",少调一堆超参。
- **损失**:分类用 BCE,框回归用 CIoU 加 DFL(把边界位置当成一个分布来学)。

**IoU 算一遍**:框 A 从 (0,0) 到 (10,10),框 B 从 (5,5) 到 (15,15)。交集是 5 × 5 = 25,并集 = 100 + 100 − 25 = 175,IoU = 25 ÷ 175 ≈ **0.143**。

**NMS(非极大值抑制)**:同一个物体常被画出好几个重叠框,要去重。
- 按置信度从高到低排,留下最高的。
- 和它 IoU 超过阈值(常用 0.5 左右)的框删掉。
- 对剩下的重复,直到没框。
- 例子:A 0.9、B 0.8、C 0.7。IoU(A, B) = 0.7,删 B;IoU(A, C) = 0.1,C 是另一个物体,留下。结果 A、C。

**相关任务一句话版**:
- **语义分割**:每个像素一个类别,不分你我(所有人都是"人")。
- **实例分割**:每个物体单独一张掩码(Mask R-CNN、YOLOv8-seg)。
- **SAM**:给一个点或框当提示,就能分割出任意物体,不限类别。
- **多目标跟踪**:每帧先检测,再把框和上一帧的轨迹配对。SORT/ByteTrack 用卡尔曼滤波预测下一帧位置,再按 IoU 做匈牙利匹配。

**无人机上的难点**:物体很小(高空俯拍)、视角是俯视、机身晃动造成模糊、算力和功耗都紧。常见对策:提高输入分辨率或把大图切块检测(SAHI)、加一个步长 4 的高分辨率检测头、用 TensorRT 和 FP16/INT8 加速(F20)。

**常被追问**:
- 单阶段和两阶段怎么选?实时场景(无人机、视频)选单阶段;离线、对小物体精度要求极高时两阶段或 DETR 类更稳。
- 小物体为什么难?下采样 32 倍后,一个 20 像素的物体在最深的特征图上还不到一格,信息几乎没了,所以要靠浅层高分辨率特征和 FPN。
- mAP50 和 mAP50-95 的区别见 F19。

**和你的经历**:RCRI 是真做过的。你和队友从 COCO 预训练的 YOLOv8 出发,用攀岩点数据微调,训练在 GCP 上跑,导出 ONNX 再转 TensorRT FP16 部署到 Jetson Nano,实时跑到 12 FPS。E6792 里你还对比过 YOLOv4-Tiny 转 TensorRT 后约 12 倍的吞吐提升。

> 🗣 Object detection outputs boxes with class labels and confidences. Two-stage detectors like Faster R-CNN propose regions and then classify them, which is accurate but slow; one-stage detectors like YOLO predict everything in a single forward pass, which is why they're used for real time. YOLOv8 has a CNN backbone, an FPN-PAN neck that fuses multiple scales, and an anchor-free head that predicts at strides 8, 16 and 32, so a 640 input gives 8400 candidate predictions, which non-maximum suppression then deduplicates by IoU. In my climbing-route project we fine-tuned a COCO-pretrained YOLOv8 on GCP and deployed it on a Jetson Nano with TensorRT FP16 at about 12 frames per second. For drones the main challenges are small objects and tight compute, which I'd handle with higher-resolution heads or tiling plus low-precision TensorRT engines.

## F26. World model:在脑子里预演世界 · World models

**一句话**:world model 学的是"现在是这样,如果我做这个动作,世界下一刻会变成什么样",也就是学一个函数:下一状态 = f(当前状态, 动作)。
<span class="en">A world model learns how the world will change: given the current state and an action, it predicts the next state.</span>

**比方**:下棋高手在脑子里推演"我走这步,他会怎么走";开车时你预判"现在打方向盘,车会往左偏"。world model 就是给机器装一个这种"脑内模拟器"。

**为什么要它**:
- **在想象里试错**:真机器人、真无人机摔一次很贵,在模型里摔一万次不花钱。
- **做规划**:每一步先在模型里试很多条动作序列,挑结果最好的那条再执行。
- **生成训练数据**:造出罕见、危险的场景(比如突然冲出来的行人)。
- **评估策略**:把一个控制策略放进 world model 里跑,看它能不能完成任务,不用每次都上真机。

**三类主流做法**:
- **潜空间模型**(Dreamer 系列):先把画面压成一个小向量(F17 那种编码器),只在这个小向量上预测下一步和奖励,再在"想象"里训练策略。快、省算力。
- **视频生成式**(Sora、Genie、NVIDIA Cosmos、Ctrl-World):直接生成未来的画面,并且受动作控制。比如 Genie 里你按方向键,它生成下一帧。好看、直观,但很慢。
- **只在表征空间预测**(LeCun 的 JEPA、V-JEPA):不去生成像素,只预测"下一刻的特征"。理由是像素细节(树叶怎么晃)对决策没用,预测它是浪费。

**小算例:为什么长时预演会跑偏(误差累积)**:
- 假设每一步预测有 99% 是对的。
- 连续推 50 步:0.99⁵⁰ ≈ **0.61**,只剩约六成可信。
- 所以实际用法通常是"推演短一点、走一步就用真实观测纠正一次"。

**规划怎么用它(MPC,模型预测控制)**:
- 每一步随机想 100 条动作序列,每条往后推 10 步。
- 用 world model 算出每条的结果,打分,挑最好的一条。
- 只执行这条的第一步,拿到新的真实观测后重新来一遍。

**常被追问**:
- world model 和普通视频生成有什么区别?关键在"受动作控制"和"用来做决策"。视频生成只要好看,world model 要求"我换个动作,未来也跟着对应地变"。
- 和物理仿真器比?仿真器是人写的物理公式,准但难覆盖真实世界的复杂度;world model 从数据学,能覆盖复杂外观,但可能违反物理(物体凭空消失、穿模)。
- 最大难点?误差累积、物理一致性、生成太慢、很难评估"预测得对不对"。

**和无人机的连接**:在学出来的模拟器里练规划和避障策略;生成罕见天气、光照、障碍物数据;预测周围移动物体(鸟、其他飞机)下一刻在哪。

**和你的经历**:你复现过 **Ctrl-World**,一个给机器人操作用的扩散 world model,基于 Stable Video Diffusion,以机器人状态、任务和动作为条件生成未来视频。你跑通了它的三种推理模式:回放数据集轨迹、用键盘控制生成、把策略接进来做 policy-in-the-loop rollout;并在生成的视频上评估连贯性、控制响应和任务完成情况。这是复现,不是你提出的方法,说清楚就好。

> 🗣 A world model predicts how the environment evolves given an action, so an agent can practice, plan or be evaluated in imagination instead of in the real world. Latent models like Dreamer predict compact state vectors and train the policy inside them; video models like Genie, Cosmos or Ctrl-World generate future frames conditioned on actions; and JEPA-style models predict only future representations. The core difficulty is compounding error: even ninety-nine percent per-step accuracy decays to about sixty percent after fifty steps, so they're usually used for short-horizon planning with frequent real observations, as in model predictive control. I reproduced Ctrl-World, a diffusion world model for robot manipulation, and ran its policy-in-the-loop rollouts to evaluate how well generated futures followed the actions.

# 篇四 · 知识点:他那几篇论文讲的东西
> 从零讲:视觉编码器、MLLM 怎么接图、多视角空间、扩散和 RAE

## 视觉编码器:CLIP、ViT、自监督

### 1.1 视觉编码器(vision encoder)是干什么的

比方:大模型是一个只会读字的人。视觉编码器是它的「眼睛 + 翻译」:把一张图翻译成一串大模型能读的向量。

编码器翻得好不好,决定了大模型能不能看清细节。翻译漏掉的东西,大模型再聪明也找不回来。
<span class="en">The vision encoder is the eyes and the translator: it turns an image into vectors the LLM can read. Whatever it drops, the LLM can never recover.</span>

### 1.2 ViT(Vision Transformer)怎么工作

- 把图切成小方块(patch),比如 224×224 的图切成 16×16 的块,一共 14×14 = 196 块。

- 每块拉平,用一个线性层变成一个向量,叫 patch embedding。

- 加上位置编码(positional embedding),告诉模型每块在哪。

- 送进 Transformer,每块通过自注意力(self-attention)看所有其他块。

- 输出每块一个向量(patch tokens),有的模型还多一个 CLS 向量代表整张图。

和 CNN 的区别:CNN 从小窗口慢慢扩大视野(局部到全局)。ViT 第一层就能让任意两块互相看(一开始就是全局)。ViT 缺少 CNN 自带的「局部性」先验,所以要更多数据才训得好。
<span class="en">ViT splits the image into patches, embeds each patch, adds positions, and runs a Transformer so every patch can attend to every other patch from the first layer. It lacks the CNN's locality prior, so it needs more data.</span>

### 1.3 CLIP 是怎么训练的

比方:给你 4 亿张图和它们的配文,让你玩「连连看」:每张图要找到自己的那句话,不能连到别人的。

- 两个塔:图像编码器(ViT)和文本编码器(Transformer)。

- 一个 batch 里 N 张图、N 句话,算出 N×N 的相似度矩阵。

- 对角线是正确配对,要变大;其余是错配,要变小。这叫对比学习(contrastive learning),损失是 InfoNCE(两个方向的交叉熵)。

- 训完以后,图和文字在同一个空间里,所以能零样本分类(zero-shot):把类别名写成 "a photo of a dog",看图离哪句话最近。

SigLIP:把 softmax 换成每一对单独做 sigmoid 二分类。不用全 batch 归一化,省显存,大 batch 更好训。现在很多多模态模型用 SigLIP 当眼睛。
<span class="en">CLIP trains an image tower and a text tower so matching image-caption pairs are close and mismatched pairs are far, using a symmetric cross-entropy over the N×N similarity matrix. SigLIP replaces the softmax with a per-pair sigmoid, which scales to larger batches.</span>

### 1.4 CLIP 的弱点:《Eyes Wide Shut?》(他的一作)

核心发现:多模态大模型答错很简单的视觉题,根源常常在 CLIP 这只「眼睛」上,不在大模型。

为什么 CLIP 会看不清:

- 训练目标只要求「图和配文对得上」。配文很少写朝向、数量、细小部件,所以 CLIP 没动力去记这些。

- 它学的是「实例级」(instance-level)的整体语义:这是一只狗、在草地上。狗头朝左还是朝右,不影响配对,就被丢了。

他们怎么找证据:CLIP-blind pairs(CLIP 盲对)

- 找两张图:CLIP 觉得几乎一样(CLIP 向量很近)。

- 但纯视觉自监督模型 DINOv2 觉得它们不一样(DINOv2 向量很远)。

- 这种对子就是 CLIP 看不出的差别。人来看,差别很明显。

用这些对子做了 MMVP 基准(Multimodal Visual Patterns):对每对图问同一个简单问题,两张图答案不同。GPT-4V 在内的模型都答得很差,还会编出错误解释(幻觉)。

九类视觉模式(9 visual patterns),记住几个就行:朝向和方向、某个特征有没有、状态、数量、位置和相对关系、颜色和外观、结构和物理特性、文字、视角。

他们的修法:Mixture of Features(MoF),把 CLIP 特征和 DINOv2 这类自监督特征混在一起喂给大模型。

- Additive MoF:两种特征按比例加权相加。DINOv2 比例越高,看得越准,但听指令的能力变差。

- Interleaved MoF:两种特征的 token 交错排列,一起送进去。看得更准,而且不丢听指令的能力。

<span class="en">Eyes Wide Shut finds CLIP-blind pairs, images CLIP sees as nearly identical but DINOv2 separates, builds the MMVP benchmark from them, shows MLLMs fail on nine simple visual patterns, and proposes Mixture of Features: interleaving CLIP and self-supervised tokens improves grounding without hurting instruction following.</span>

### 1.5 自监督(self-supervised)视觉:DINO、MAE

- DINO / DINOv2:学生和老师两个网络看同一张图的不同裁剪,学生要输出和老师一样的东西。老师是学生参数的滑动平均(EMA)。不需要任何文字。学到的特征对形状、部件、对应关系很敏感。

- MAE(Masked Autoencoder):遮住 75% 的块,让模型补回像素。像做完形填空。

- 和 CLIP 的对比:CLIP 懂语义(这是什么),自监督懂结构(长什么样、在哪)。

他的另一篇:《Scaling Language-Free Visual Representation Learning》(Web-SSL)

- 问题:自监督在 VQA 上比 CLIP 差,是因为没有文字监督,还是因为训练数据不一样?

- 做法:用同一份数据(MetaCLIP 的图)分别训自监督和 CLIP。

- 结论:同样数据下,自监督随数据和模型变大涨得更好,做到 7B 参数还没饱和,在很多 VQA 和经典视觉任务上达到 CLIP 的水平。

- 一句话:不用文字也能学到够用的视觉表示,以前差在数据,不在语言。

<span class="en">Web-SSL trains self-supervised models and CLIP on the same MetaCLIP data and finds visual SSL scales better with data and model size, reaching CLIP-level VQA performance at up to 7B parameters. The earlier gap came from data, not from missing language supervision.</span>

## 图像怎么接进大模型(MLLM 架构)

### 2.1 标准三件套(LLaVA 式)

图片 ──► 视觉编码器(CLIP/SigLIP ViT,通常冻结)
│  输出 N 个 patch 向量(例如 576 个)
▼
连接器 / 投影层(projector,通常 2 层 MLP)
│  把每个向量变成大模型词向量的维度
▼
[视觉 token × N] + [文字 token] ──► 大语言模型(LLM) ──► 回答

比方:编码器是摄像头,投影层是「转接头」,把摄像头的插口转成大模型能插的口。

两阶段训练:

- 对齐预训练(alignment pretraining):只训投影层,用图片配文,让视觉 token 落到大模型能懂的位置。

- 视觉指令微调(visual instruction tuning):训投影层和大模型,用问答对话数据,让模型学会按指令回答关于图的问题。

<span class="en">The standard recipe is encoder, projector, LLM. Stage one trains only the projector on captions to align spaces. Stage two tunes projector and LLM on visual instruction data.</span>

### 2.2 关键取舍:token 数量 vs 分辨率

- 分辨率高,细节多,但 token 数按面积涨。336×336、patch 14 就是 576 个 token;放大一倍就是 4 倍。

- 大模型注意力的计算量随 token 数平方增长,上下文也有限。

- 常见办法:

- 切图(tiling / AnyRes):高清图切成几块分别编码,再加一张缩略图。

- 压缩 token:Q-Former、Perceiver Resampler,用一小组可学习的查询向量(learnable queries)通过交叉注意力去「问」图像特征,只留几十个 token。

- 池化:相邻 token 合并。

### 2.3 Cambrian-1(他的一作):以视觉为中心的 MLLM

出发点:大家改进多模态模型时,主要靠换更强的大模型。视觉这一边很少被认真研究。Cambrian-1 反过来,用大模型当「考官」,去评测各种视觉编码器。

- 评测 20 多种视觉编码器:语言监督的(CLIP、SigLIP)、自监督的(DINOv2、MAE)、其他强监督的,以及它们的组合。

- 重新审视基准:发现很多所谓多模态基准,不看图光靠大模型也能答对不少。所以做了视觉为中心的 CV-Bench,把经典视觉任务(数数、相对位置、深度先后、相对距离)改成问答题。

- Spatial Vision Aggregator(SVA):一种新连接器。

- 用一组可学习的查询向量,通过交叉注意力去聚合多个编码器的特征。

- 「空间感知」:每个查询只看图上对应的那一块区域,保留空间位置。

- 能接高分辨率特征,同时减少 token 数。

- 在大模型的多层里反复聚合,不只在输入时接一次。

- 数据:整理公开的指令微调数据(Cambrian-10M,精选出 7M),强调各数据源的配比要平衡,比单纯堆数据量重要。

- 全部开源:权重、代码、数据、评测方法。

<span class="en">Cambrian-1 uses the LLM as an interface to evaluate over 20 vision encoders, introduces the vision-centric CV-Bench, proposes the Spatial Vision Aggregator, a spatially aware connector with learnable queries that fuses high-resolution features from multiple encoders while cutting tokens, and stresses data source balancing.</span>

### 2.4 理解和生成用一个模型:MetaMorph(他的一作)

- Visual-Predictive Instruction Tuning(VPiT):在视觉指令微调上加一点:让大模型不仅输出文字 token,也输出连续的视觉 token(视觉编码器空间里的向量),再用扩散模型把这些向量画成图。

- 发现 1:生成能力是理解能力的副产品。理解变好了,只要很少的生成数据就能解锁画图。

- 发现 2:理解数据对两种能力都更有用,生成数据的帮助小一些。

- 结论:大模型本身可能就有很强的视觉「先验」。

<span class="en">MetaMorph's VPiT teaches an LLM to predict continuous visual tokens as well as text. Generation emerges as a by-product of better understanding, and understanding data helps both abilities more than generation data does.</span>

## 多视角和空间理解

### 3.1 为什么大模型不懂空间

比方:大模型像看了一辈子照片说明的人,知道「沙发旁边有台灯」这种话,但没在房间里走过。给它从三个角度拍的同一个房间,它很难对上「这是同一张沙发」。

- 训练数据大多是单张图 + 文字,很少要求跨图对应。

- 视觉 token 里的位置信息只是图像平面上的 2D 位置,没有深度,没有相机位姿。

### 3.2 《Seeing from Another Perspective》:All-Angles Bench

- 90 个真实场景,2100 多道人工标注的多视角问答。

- 六类任务:数数、属性识别、相对距离、相对方向、物体操作、相机位姿估计。

- 测了 27 个模型(含 Gemini-2.0-Flash、Claude-3.7-Sonnet、GPT-4o),和人差很远。

- 两个最弱点:

- 部分遮挡时的跨视角对应(cross-view correspondence):一个视角里被挡住一半,就认不出是同一个东西。

- 粗略相机位姿(coarse camera pose):说不出两张图的相机大概怎么转的。

这是你的强项接口:这两个弱点,正好是传统几何视觉解决的问题。跨视角对应 = 特征匹配(SIFT + RANSAC);相机位姿 = 本质矩阵分解、PnP。面试可以主动说:多模态模型可以借传统几何的结构,比如把对应点或估出来的位姿当额外输入,或者用这些几何约束做训练监督。
<span class="en">All-Angles Bench has over 2,100 human-annotated multi-view questions in 90 scenes across six tasks. MLLMs fall far behind humans, especially on cross-view correspondence under occlusion and coarse camera pose, which are exactly what classical feature matching and pose estimation solve.</span>

### 3.3 Cambrian-S:视频里的「空间超感知」(spatial supersensing)

他们把「看懂」分成四级,越往后越难:

- 语义感知(semantic perception):说出看到了什么。

- 流式事件认知(streaming event cognition):连续的视频里记住发生过什么。

- 隐式 3D 空间认知(implicit 3D spatial cognition):从像素推出背后的三维世界。

- 预测式世界建模(predictive world modeling):在脑子里建一个世界模型,用它来筛选和整理信息。

- VSI-SUPER 基准:两部分。VSR 是长视频里的空间回忆(东西放在哪);VSC 是连续空间计数(一路走来总共见过几把椅子)。视频可以任意长,靠无限加长上下文解决不了。

- VSI-590K 数据 + Cambrian-S 模型:在 VSI-Bench 上绝对提升 30%,通用能力不掉。但在 VSI-SUPER 上还是不行,说明光靠堆数据不够。

- 预测式感知(predictive sensing):训练一个自监督的「预测下一帧隐向量」的模块。预测错得越多(surprise,惊讶度越高),说明发生了新事情,就用来决定记住什么、在哪切分事件。在 VSI-SUPER 上明显超过商业模型。

比方:你走进熟悉的房间,不会每秒钟重新看一遍所有东西。只有出现意料之外的东西(惊讶),你才会注意并记下来。
<span class="en">Cambrian-S frames spatial supersensing in four stages, builds VSI-SUPER for arbitrarily long videos, scales data with VSI-590K for a 30-point gain on VSI-Bench, and shows that scale alone is not enough. Its predictive sensing module predicts the next latent frame and uses surprise to drive memory and event segmentation.</span>

### 3.4 如果他问「你怎么让模型更懂 3D」

- 输入层:加深度图或 3D 位置编码。比如把每个 patch 反投影到 3D 坐标,用 3D 坐标做位置编码。

- 编码器层:用多视角一致的特征,比如在多视角数据上训练,或加对应点一致性损失。

- 数据层:从 3D 扫描数据集(ScanNet 这类)自动生成空间问答:距离、方向、计数,答案由 3D 标注算出来,不靠人写。

- 系统层:让模型调用工具,比如先跑 SfM 或深度估计,再基于结果回答。

- 评测层:按任务类型拆开看,别只看总分。

## 扩散生成和 RAE

### 4.1 扩散模型(diffusion)从零讲

比方:往一杯清水里一点一点滴墨水,最后全黑。扩散模型学的是倒放:从全黑的墨水一步步变回清水。

- 前向加噪:真图 x₀ 逐步加高斯噪声,第 t 步是 x_t = √ᾱ_t·x₀ + √(1−ᾱ_t)·ε,最后接近纯噪声。

- 训练:随机取一个 t,给图加噪,让网络预测加进去的噪声 ε(或预测 v、或预测速度)。损失就是均方误差。

- 生成:从纯噪声出发,一步步用网络去掉噪声。

- Classifier-free guidance(CFG):同一步算两次,一次带条件(文字),一次不带,把差值放大。条件越听话,但多样性下降。

<span class="en">Diffusion adds Gaussian noise step by step and trains a network to predict that noise at a random step. Sampling runs the process in reverse. Classifier-free guidance amplifies the difference between conditional and unconditional predictions.</span>

### 4.2 隐空间扩散(latent diffusion)和 DiT

- 直接在像素上扩散太贵。先用自编码器(VAE)把图压成小的隐向量(比如 256×256×3 压成 32×32×4),在隐空间里扩散,最后再解码回像素。

- DiT(Diffusion Transformer):把去噪网络从 U-Net 换成 Transformer。隐向量切块成 token,时间步和类别通过 adaLN(自适应层归一化)注入。DiT 的作者之一就是 Saining Xie。

### 4.3 RAE:Representation Autoencoders(他参与,第 3 作者)

一句话:把扩散模型用的 VAE 换成「预训练视觉编码器(冻结)+ 新训的解码器」。

老 VAE 的三个问题:

- 骨干网络过时,和 Transformer 体系不统一。

- 隐空间维度低(每个位置 4 个或 16 个通道),信息容量小。

- 只靠重建训练,隐向量没有语义,限制了生成质量。

RAE 的做法:编码器用 DINOv2、SigLIP、MAE 这类现成的视觉编码器,冻结不动;只训一个解码器,把编码器的特征还原成像素。这样隐空间既能重建得好,又语义丰富。

难点:这些特征维度很高(比如每个 token 768 维),扩散 Transformer 在高维空间里不好训。他们分析了原因,给了三个办法:

- DiT 的宽度要至少和 token 维度一样大,否则学不会。

- 噪声日程要按维度调整(dimension-dependent noise schedule shift):维度高,同样的噪声强度破坏得少,所以要加更多噪声。

- 训练解码器时给输入加噪(noise-augmented decoding),让它能容忍扩散生成出来的不完美隐向量。

- 再加一个轻量但很宽的 DDT 头。

结果:ImageNet 256×256 不用 guidance 时 FID 1.51;用 guidance 时 256 和 512 分辨率都是 1.13。收敛更快,而且不需要额外的表示对齐损失(REPA 那类)。

FID 是什么:用一个预训练网络分别提取真图和生成图的特征,各自拟合一个高斯分布,算两个分布的距离。越低越好。
<span class="en">RAE replaces the VAE with a frozen pretrained representation encoder plus a trained decoder, giving semantically rich, high-dimensional latents. To make diffusion work there, the DiT width must match the token dimension, the noise schedule is shifted by dimension, and the decoder is trained with noise augmentation. It reaches 1.51 FID without guidance and 1.13 with guidance on ImageNet.</span>

### 4.4 RAE 扩到文生图(他一作)

- 编码器用冻结的 SigLIP-2,解码器在网络图、合成图、文字渲染数据上训。文字类要专门配数据。

- 规模变大后,框架反而可以简化:按维度调噪声仍然关键,但宽头和加噪解码的收益变得可以忽略。

- 和最强的 FLUX VAE 对比,模型从 0.5B 到 9.8B,RAE 预训练阶段全部更好。

- 在高质量数据上微调:VAE 版 64 个 epoch 后严重过拟合;RAE 版到 256 个 epoch 还稳定。

- 意义:理解和生成能在同一个表示空间里做,模型可以直接对自己生成的隐向量做推理,这为统一模型铺路。

## VLA:VLM 往机器人上再走一步(了解即可)
结论:周四不用专门学,能一分钟讲清就够。被问「多模态模型怎么用到机器人/无人机上」时用得上。

- **是什么**:VLA = Vision-Language-Action。输入图像 + 一句指令,直接输出机器人动作。 · VLA takes images and an instruction and outputs robot actions directly.
- **怎么做**:拿训好的 VLM,把动作也变成 token 让它预测。 · Start from a pretrained VLM and teach it to predict actions as tokens.
  - **RT-2**(Google DeepMind,2023):动作每个维度离散成 256 档,当文字 token 输出,和网上图文数据一起训。
  - **OpenVLA**(2024,7B,开源):视觉端把 SigLIP 和 DINOv2 的特征拼起来,语言模型是 Llama 2;在 Open X-Embodiment(约 97 万条机器人轨迹)上训。
  - **π0**(Physical Intelligence,2024):VLM 后面接一个「动作专家」,用 flow matching 一次输出一段连续动作(action chunk),适合灵巧、高频的控制。
- **难点**:机器人数据少且贵;推理慢,撑不住高频控制;换个环境就容易失败。 · Scarce robot data, latency for high-rate control, weak generalization.
- **和 Peter 方向的连接**:OpenVLA 混用 SigLIP + DINOv2,正是 Eyes Wide Shut 的结论:光有 CLIP 类的「语义眼睛」不够,要加自监督的「结构眼睛」。机器人抓东西最需要的方向、位置、部件,恰好是 CLIP 看不清的。
- **和无人机的连接**:实时控制环留给小而快的模型;VLA 适合上层慢速的任务规划,比如「飞到红色屋顶上方」。

> 🗣 A VLA model extends a vision-language model so it outputs robot actions instead of just text. RT-2 discretized actions into tokens and co-trained on web data. OpenVLA is a 7B open model whose vision encoder fuses SigLIP and DINOv2 features, which connects nicely to the Eyes Wide Shut finding that CLIP-style features alone miss spatial detail. π0 adds an action expert trained with flow matching to output continuous action chunks. The main challenges are scarce robot data, latency for high-rate control, and generalization. On a drone, I'd keep the real-time loop on small, fast models and use a VLA-style model for slower, high-level task planning.
