## 8.8 边界检测与 Hough 变换 · Boundary Detection and the Hough Transform

这一讲解决的问题:边缘检测给的是一堆零散的点,我们要的是完整的物体轮廓。三条路:用最小二乘把点拟合成直线或曲线;用主动轮廓(snake)从一个粗轮廓慢慢收紧到真实边界;用 Hough 变换让每个点「投票」,在杂乱和残缺的边缘里直接找出直线和圆。
<span class="en">Edge detection gives scattered points; we want object boundaries. Three tools: least-squares fitting, active contours (snakes), and the Hough transform, which lets every edge point vote for shapes.</span>

### 8.8.1 最小二乘拟合直线 · Least-squares line fitting

比方:一把尺子放在一堆钉子上,调到「离所有钉子都尽量近」的位置。
<span class="en">Analogy: lay a ruler over a set of nails so it is as close to all of them as possible.</span>

预处理流程:边缘检测,阈值化成二值边缘图,先收缩再扩张去掉孤立点,再细化成单像素宽。剩下的问题是从这些点得到边界。
<span class="en">Preprocess: edge detection, threshold, shrink and expand to remove isolated points, thin. Then go from edge pixels to boundaries.</span>

直线写成 y = mx + c,要找 m 和 c。能量 E 取所有点到直线「竖直距离」平方的平均:
<span class="en">Fit y = mx + c by minimizing the mean squared vertical distance.</span>

```
E = (1/N) Σ (y_i − m x_i − c)²
令 ∂E/∂m = 0, ∂E/∂c = 0,得到闭式解:
m = Σ (x_i − x̄)(y_i − ȳ) / Σ (x_i − x̄)²
c = ȳ − m x̄
```

![竖直距离最小二乘拟合直线](img/f395b34c7eb.jpg)

小例子:四个点 (0, 1), (1, 2), (2, 2), (3, 4)。x̄ = 1.5,ȳ = 2.25。x − x̄ 依次是 −1.5, −0.5, 0.5, 1.5;y − ȳ 依次是 −1.25, −0.25, −0.25, 1.75。分子 = 1.875 + 0.125 − 0.125 + 2.625 = 4.5,分母 = 2.25 + 0.25 + 0.25 + 2.25 = 5。m = 0.9,c = 2.25 − 0.9 × 1.5 = 0.9。拟合结果 y = 0.9x + 0.9。
<span class="en">Points (0,1), (1,2), (2,2), (3,4) give m = 4.5/5 = 0.9 and c = 0.9.</span>

致命问题:点排成接近竖直的一列时,竖直距离不是真正的距离,结果可能变成几乎水平的线,和正确答案差 90°。极端情况点全在 x = 2 上,分母 Σ(x − x̄)² = 0,直接除以零。
<span class="en">Failure: for near-vertical points, vertical distance is meaningless and the fit can come out nearly horizontal. For exactly vertical points the denominator is zero.</span>

### 8.8.2 改用垂直距离,以及拟合曲线 · Perpendicular distance and curve fitting

比方:量点到墙的距离,要垂直于墙量,不能斜着量。
<span class="en">Analogy: measure distance to a wall perpendicular to the wall, not at a slant.</span>

换一种直线写法:x sinθ − y cosθ + ρ = 0。θ 是直线和水平轴的夹角,ρ 是原点到直线的最短距离。这样 x_i sinθ − y_i cosθ + ρ 恰好就是点到直线的(带符号)垂直距离。
<span class="en">Use x sinθ − y cosθ + ρ = 0; then x_i sinθ − y_i cosθ + ρ is the signed perpendicular distance.</span>

```
E = (1/N) Σ (x_i sinθ − y_i cosθ + ρ)²
```

最小化它,就是二值图那一讲的「最小二阶矩轴」:直线过所有点的质心,方向沿着点分布最「长」的那个方向(协方差矩阵最大特征值对应的特征向量)。这叫总体最小二乘,对竖直线没有任何问题。
<span class="en">This is the axis of minimum second moment: the line passes through the centroid along the direction of greatest spread (top eigenvector of the covariance).</span>

小例子:点 (2, 0), (2, 1), (2, 2), (2, 3)。质心 (2, 1.5)。去中心后 Σx′² = 0,Σy′² = 2.25 + 0.25 + 0.25 + 2.25 = 5,Σx′y′ = 0。分布全在 y 方向,所以直线竖直,θ = 90°,方程是 x = 2。竖直距离法在这里除以零,垂直距离法轻松搞定。
<span class="en">For points on x = 2, the spread is all along y, so the fit is the vertical line x = 2, where the vertical-distance method divides by zero.</span>

拟合曲线,比如三次多项式 y = ax³ + bx² + cx + d:每个点代进去得到一个方程,n 个点得到 n 个方程,4 个未知数。点比未知数多,是超定线性方程组,写成 Xa = y。X 不是方阵,不能直接求逆。两边左乘 Xᵀ:
<span class="en">For a cubic, each point gives one linear equation in (a, b, c, d). With more points than unknowns we get an over-determined system Xa = y.</span>

```
XᵀX a = Xᵀ y   ⇒   a = (XᵀX)⁻¹ Xᵀ y,   X⁺ = (XᵀX)⁻¹ Xᵀ 叫伪逆
```

小例子(用伪逆验算 8.8.1 的直线):X 每行是 [x_i, 1],y = [1, 2, 2, 4]。XᵀX = [[14, 6], [6, 4]],Xᵀy = [18, 9]。行列式 = 56 − 36 = 20。m = (18×4 − 6×9)/20 = 0.9,c = (14×9 − 6×18)/20 = 0.9。和闭式解一致。
<span class="en">The pseudo-inverse on the same four points gives m = 0.9 and c = 0.9, matching the closed form.</span>

伪逆的好处是通用:任何「参数线性」的模型都能套,不用每次重新求导。它仍然最小化竖直距离,也仍然怕外点。
<span class="en">The pseudo-inverse works for any model linear in its parameters, but it still uses vertical distance and is still sensitive to outliers.</span>

### 8.8.3 主动轮廓(Snake) · Active contours

比方:在物体外面套一根橡皮筋,它会自己收紧,贴到物体边上停下。
<span class="en">Analogy: a rubber band placed around an object shrinks until it hugs the boundary.</span>

轮廓用 n 个控制点 v_i = (x_i, y_i) 表示,相邻点等距,用直线连起来。目标:轮廓靠近梯度大的像素(边),同时自身光滑。
<span class="en">The contour is n equally spaced control points. It should sit on high gradients and stay smooth.</span>

图像项:E_image = −Σ ||∇(n_σ * I)(v_i)||²。先把梯度强度平方再用高斯模糊,这样远处的边也能「吸」到轮廓,像一个势场。取负号是为了统一成最小化。
<span class="en">Image term: negative sum of blurred squared gradient magnitude; blurring lets distant edges attract the contour.</span>

内部项:E_contour = α E_elastic + β E_smooth。弹性项像橡皮筋,惩罚拉长;平滑项像钢片,惩罚弯折。
<span class="en">Internal term: α times elasticity (rubber band) plus β times smoothness (metal strip).</span>

```
E_elastic = Σ (x_{i+1} − x_i)² + (y_{i+1} − y_i)²
E_smooth  = Σ (x_{i+1} − 2x_i + x_{i−1})² + (y_{i+1} − 2y_i + y_{i−1})²
E_total   = E_image + E_contour
```

小例子:三个点 (0, 0), (1, 0), (2, 0)。弹性项 = 1 + 1 = 2,平滑项 = 0。把中间点抬到 (1, 1):弹性项变成 2 + 2 = 4,平滑项的 y 部分变成 (0 − 2 + 0)² = 4。两个内部项都变大,所以轮廓不爱打弯。
<span class="en">Lifting the middle of three collinear points raises elasticity from 2 to 4 and smoothness from 0 to 4.</span>

贪心算法:每轮先均匀重采样轮廓;对每个控制点,在小窗口 W 内找让 E_total 最小的位置挪过去;所有点总位移小于阈值就停。贪心不保证最优,遇到噪声可能打结。α 大时轮廓像硬橡皮筋;α 小时图像项占上风,能钻进两枚硬币之间的缝。
<span class="en">Greedy: resample, move each point within a window to minimize E_total, stop when total motion is small. Large α means stiffer; small α follows edges more closely.</span>

![α 大小不同时,轮廓包住两枚硬币的结果](img/fc0592634cb.jpg)

局限和扩展:需要好的初始化,离边太远就吸不过来,可能贴到别的物体上;可以加「形状先验」项;可以把收缩力换成膨胀力(balloon),从物体内部往外撑。应用:医学影像分割、Photoshop 磁性套索、视频里逐帧跟踪变形的嘴唇(上一帧结果当下一帧初值)。
<span class="en">Needs good initialization; can add shape priors or balloon forces. Used in medical segmentation, the magnetic lasso, and frame-to-frame tracking.</span>

### 8.8.4 Hough 变换找直线 · Hough transform for lines

比方:每个边缘点都是一个选民。它不知道自己属于哪条线,于是给「所有可能经过我的线」各投一票。真正的直线会得到最多票。
<span class="en">Analogy: each edge point votes for every line that could pass through it; the true line collects the most votes.</span>

拟合方法的三个难题:多余数据(哪些点该拿来拟合?)、残缺数据(只看到一部分)、噪声。Hough 一次解决三个,因为它根本不需要事先知道哪个点属于哪条线。
<span class="en">Fitting struggles with extraneous data, incomplete data and noise. Hough handles all three without assigning points to lines.</span>

核心是对偶:图像空间里点 (x_i, y_i) 满足 y_i = m x_i + c。反过来看,在参数空间 (m, c) 里这是一条直线 c = −x_i m + y_i,代表所有经过该点的线。同一条直线上的点,在参数空间里的直线交于同一个 (m, c)。**图像里的点对应参数空间的线,图像里的线对应参数空间的点。**
<span class="en">Duality: an image point maps to a line in parameter space; collinear points give lines meeting at one (m, c).</span>

![图像空间的点对应参数空间的线,共线点的线交于一点](img/fb31612137b.jpg)

算法:
<span class="en">Algorithm:</span>

```
1. 把参数空间量化成格子
2. 建累加器数组 A,全部置 0
3. 对每个边缘点,沿它在参数空间对应的曲线,经过的每个格子 +1
4. 找 A 的局部极大值(用非极大值抑制),每个峰就是一条直线
```

(m, c) 的问题:斜率 m 从负无穷到正无穷,竖直线根本放不进有限的数组。所以改用 x sinθ − y cosθ + ρ = 0,即 ρ = y cosθ − x sinθ。θ 在 [0, π) 内,|ρ| 不超过图像对角线,都有界。此时一个点在 (θ, ρ) 空间里对应一条正弦曲线。
<span class="en">Slope is unbounded, so use (θ, ρ): θ in [0, π) and |ρ| ≤ image diagonal. Each point becomes a sinusoid.</span>

![(ρ, θ) 参数化:每个点变成一条正弦曲线](img/f9f7365efcd.jpg)

注意写法差异:OpenCV 等常用 ρ = x cosθ + y sinθ,那里的 θ 是直线**法向**的角度;讲义的 θ 是直线**本身**的角度。两者差 90°,面试时说清楚用的是哪种。
<span class="en">OpenCV's ρ = x cosθ + y sinθ uses the normal angle; the lecture's θ is the line's own angle. They differ by 90°.</span>

小例子:三个点 (1, 1), (2, 2), (3, 3),θ 只取 0°, 45°, 90°, 135°,ρ = y cosθ − x sinθ。θ = 0°:ρ = 1, 2, 3(分散)。θ = 45°:ρ = 0.707 × (y − x) = 0, 0, 0(三票同格)。θ = 90°:ρ = −1, −2, −3。θ = 135°:ρ = −0.707 × (x + y) = −1.41, −2.83, −4.24。峰在 (45°, 0),得 3 票,就是直线 y = x。
<span class="en">Votes concentrate at (θ = 45°, ρ = 0) with 3 votes: the line y = x.</span>

累加器多大:640×480 的图对角线 800,ρ 取 [−800, 800]、1 像素一格是 1601 格,θ 取 1° 一格是 180 格,共约 28.8 万格。每个边缘点要投 180 票。
<span class="en">A 640×480 image with 1-pixel ρ bins and 1° θ bins needs about 288k cells; each edge point casts 180 votes.</span>

实操要点:格子太大,不同的线会被并成一条;格子太小,噪声让票分散,找不到峰。真实边不完全直,可以给一小块格子投票(中心权重大、四周小)。噪声会让一条线产生几个挨得很近的峰,要用非极大值抑制合并。
<span class="en">Bins too big merge lines; too small scatter votes. Vote into a small weighted patch; use NMS to merge nearby peaks.</span>

![真实图像:累加器里的正弦条纹和检出的直线](img/f4d36d6096e.jpg)

### 8.8.5 Hough 找圆,以及广义 Hough · Circles and the generalized Hough transform

比方:已知硬币半径,每个边缘点说「圆心一定在离我 r 远的某处」,大家画的圈交在同一点。
<span class="en">Analogy: with a known radius, each edge point says the center is somewhere at distance r from me; all those circles meet at the true center.</span>

圆:(x_i − a)² + (y_i − b)² = r²。半径 r 已知时,参数只有 (a, b),每个点在参数空间里投一个半径为 r 的圆。小例子:r = 5,边缘点 (5, 0), (0, 5), (3, 4) 各自画圆,三个圆都经过 (0, 0),峰就在圆心 (0, 0)。
<span class="en">With r known, each point votes along a circle in (a, b). For r = 5, points (5,0), (0,5), (3,4) all vote for the center (0,0).</span>

用上梯度方向能省很多:圆心一定在边缘点沿梯度方向距离 r 处,只是不知道在哪一侧。a = x_i ± r cosφ_i,b = y_i ± r sinφ_i,每个点只投 2 票。小例子:点 (3, 4),梯度方向 φ 满足 cosφ = 0.6、sinφ = 0.8,两个候选圆心是 (6, 8) 和 (0, 0)。图像空间多做点功(算准方向),参数空间就少做很多功。
<span class="en">With gradient direction, each point votes only twice: for (3, 4) the candidates are (6, 8) and (0, 0). More work in image space means less in parameter space.</span>

半径未知:累加器变成三维 (a, b, r),每个点要在一个圆锥面上投票。参数每多一个,累加器大小乘一次。比如每个参数 100 格,二维是 1 万格,三维就是 100 万格。所以 Hough 只适合参数少的简单形状。
<span class="en">Unknown radius means a 3D accumulator and voting on a cone. Each extra parameter multiplies the size, e.g. 10⁴ to 10⁶ cells.</span>

广义 Hough(GHT):形状写不出方程(比如手绘轮廓)时用。离线建模:选一个参考点 (x_c, y_c);对边界上每个点记下它的边缘方向 φ 和指向参考点的向量 r = (r, α);按 φ 分组存成 φ 表。检测时:对每个边缘点,用它的 φ 查表,按表里每个向量给可能的参考点位置投票,x_c = x_i + r cosα,y_c = y_i + r sinα。峰就是物体位置,遮挡一部分也能找到。
<span class="en">GHT: store, for each edge direction φ, the vectors to a reference point. At detection, look up φ and vote for reference-point locations. Works with partial occlusion.</span>

GHT 的限制:物体在图里要和模型同样大小、同样朝向。想支持缩放 s 和旋转 θ,累加器就变成四维 A(x_c, y_c, s, θ),内存和计算都太大,实际很少这么用。它还要求边缘位置和方向都很准。
<span class="en">GHT assumes the same scale and orientation; adding scale and rotation needs a 4D accumulator, usually impractical.</span>

### 8.8.6 实战:判断两条线是否平行 · Are two lines parallel?

比方:两根铁轨平行,意思是它们的「朝向」一样,只是位置错开。
<span class="en">Analogy: two rails are parallel when they share a direction and differ only in offset.</span>

这是 Byte Veda 初筛问过的方向。思路是:先把每条线变成一个**方向**,再比较方向。千万别比较斜率 m,竖直线的 m 是无穷大。
<span class="en">Turn each line into a direction and compare directions. Never compare slopes, since vertical lines have infinite slope.</span>

方法一,用 Hough 峰:两个峰 (θ1, ρ1)、(θ2, ρ2)。|θ1 − θ2| 小于容差(比如一到两个 θ 格子)就平行,它们之间的距离就是 |ρ1 − ρ2|。小例子:y = x 的峰在 (45°, 0);y = x + 2 上的点 (0, 2) 和 (1, 3) 都算出 ρ = 0.707 × (y − x) = 1.414,峰在 (45°, 1.414)。θ 相同所以平行,间距 1.414,正好等于 2/√2。
<span class="en">Hough peaks with equal θ are parallel and their distance is |ρ1 − ρ2|. y = x and y = x + 2 give (45°, 0) and (45°, 1.414); the distance 1.414 equals 2/√2.</span>

两个坑。第一,θ 在 0° 和 180° 处首尾相接:θ = 1° 和 θ = 179° 其实只差 2°。比较前把 179° 换成 −1°,同时 ρ 变号(θ 加 π 时 ρ 变成 −ρ)。第二,θ 相同、ρ 很近的两个峰,可能是同一条线被噪声劈成两个峰,要先做非极大值抑制或设最小 ρ 间隔再判断。
<span class="en">Pitfalls: θ wraps at 180° (1° and 179° differ by 2°, and ρ flips sign), and two close peaks may be one noisy line split in two.</span>

方法二,用拟合或线段端点:每条线得到一个方向向量 d1、d2(总体最小二乘的主方向,或线段两端点相减)。算叉积 d1 × d2 = d1x·d2y − d1y·d2x,除以两向量长度得到 sin(夹角)。接近 0 就平行。
<span class="en">With direction vectors, normalized cross product gives sin of the angle; near zero means parallel.</span>

小例子:线段 A 从 (0, 0) 到 (4, 2),d1 = (4, 2);线段 B 从 (1, 3) 到 (7, 6),d2 = (6, 3)。叉积 = 4×3 − 2×6 = 0,平行。A、B 所在直线的距离:点 (1, 3) 到 A 线的距离 = |1×1 − 3×2| / √5 = 5/√5 ≈ 2.24(A 方向单位化为 (2, 1)/√5)。再看线段 C 从 (0, 0) 到 (4, 3):叉积 = 4×3 − 2×4 = 4,|A| = √20 ≈ 4.47,|C| = 5,sin = 4/22.36 ≈ 0.179,夹角约 10.3°(26.57° 和 36.87° 之差),不平行。
<span class="en">A = (4,2) and B = (6,3) have cross product 0, so parallel, about 2.24 apart. A and C = (4,3) have sin ≈ 0.179, about 10.3°, not parallel.</span>

```
判断流程(伪代码)
1. Canny 得到边缘 → Hough 得到峰 (θ_k, ρ_k) → NMS 去重
2. 对每对峰:Δθ = 环绕处理后的 |θ1 − θ2|
3. Δθ < 容差 且 |ρ1 − ρ2| > 最小间隔 → 平行,间距 = |ρ1 − ρ2|
4. 若已有精确点集,用总体最小二乘方向向量的叉积复核
```

3D 追问:图像里平行,不等于世界里平行。透视投影下,世界中的平行线在图像上会汇聚到一个消失点(见成像那一讲)。只有当这些线所在平面平行于像平面时,图像里才仍然平行。要判断世界中的平行,可以看多条图像直线是否交于同一个消失点,或者用相机内参把直线反投影回 3D 再比方向。
<span class="en">Image-parallel is not world-parallel: under perspective, parallel 3D lines converge to a vanishing point. Check for a common vanishing point, or back-project with known intrinsics.</span>

### 8.8.x 面试怎么问 · Likely questions

**Q:How does the Hough transform detect lines, and why use the rho-theta parameterization?**
Hough 变换怎么检测直线,为什么用 ρ-θ 参数化?
> Each edge point votes for every line that could pass through it. In the slope-intercept form, a point becomes a line in m-c space, and collinear points produce lines that meet at one cell, which becomes a peak in the accumulator. The problem is that the slope is unbounded, so vertical lines cannot be represented. With rho equals x cos theta plus y sin theta, theta lives in zero to pi and rho is bounded by the image diagonal, so the accumulator is finite, and each point votes along a sinusoid. Then I find peaks with non-maximal suppression.

这段在说什么:点投票、峰即直线;ρ-θ 让参数有界,竖直线也能表示。
<span class="en">Points vote, peaks are lines; ρ-θ keeps parameters bounded.</span>

**Q:Given an image, how would you determine whether two lines in it are parallel?**
给一张图,怎么判断里面两条线是否平行?
> I would run Canny, then a Hough transform, and take the two peaks. Lines are parallel if their theta values agree within a tolerance of about one or two bins, and then the distance between them is the difference in rho. I handle the wrap-around at 180 degrees, where rho flips sign, and I merge peaks that are too close because noise can split one line into two. If I have the edge points, I refine each line with a total least squares fit and compare direction vectors with a normalized cross product, never raw slopes. If the question is about parallel in 3D, I would point out that perspective makes parallel world lines meet at a vanishing point, so I would check for a shared vanishing point or use the camera intrinsics.

这段在说什么:Hough 峰比 θ、ρ 差是间距,注意环绕和重复峰,3D 要看消失点。
<span class="en">Compare Hough θ, use ρ difference for spacing, watch wrap-around and duplicates, and use vanishing points for 3D.</span>

**Q:Why can ordinary least squares fail for line fitting, and what would you use instead?**
普通最小二乘拟合直线为什么会失败,换什么?
> Ordinary least squares minimizes vertical distance, so for a near-vertical line the error is dominated by the wrong direction and the fit can tilt badly; for a perfectly vertical line the slope formula divides by zero. Total least squares minimizes perpendicular distance: the line goes through the centroid along the principal eigenvector of the covariance. Least squares of any kind is also hurt by outliers, so with clutter I would use Hough or RANSAC to pick inliers first and then refine with total least squares.

这段在说什么:竖直距离会歪,用垂直距离(总体最小二乘);有外点先用 Hough 选内点。
<span class="en">Use perpendicular distance, and select inliers with Hough before refining.</span>

**Q:How does the Hough transform scale to circles and more complex shapes?**
Hough 变换扩展到圆和复杂形状时会怎样?
> For a circle with known radius, each point votes along a circle in center space; with gradient direction it votes only twice, which is a big saving. If the radius is unknown, the accumulator becomes three-dimensional and each point votes on a cone. Every additional parameter multiplies the accumulator size, so Hough is practical only for shapes with few parameters. For arbitrary shapes the generalized Hough transform uses a table indexed by edge direction, but adding scale and rotation makes it four-dimensional and usually too expensive. On a drone with tight compute, I would use the gradient trick and restrict parameter ranges.

这段在说什么:圆用梯度只投两票,参数越多累加器指数增长,广义 Hough 加缩放旋转就太贵。
<span class="en">Gradient direction cuts votes; each parameter multiplies cost; GHT with scale and rotation is expensive.</span>

## 8.9 SIFT 特征检测 · SIFT Detector

这一讲解决的问题:同一个物体在另一张图里被放大、旋转、遮住一半,怎么还能认出来。模板匹配要为每种角度和大小各做一个模板,根本算不过来。SIFT 的思路是:从图里挑出一批「有特色的小块」,给每块配一个和大小、方向、亮度都无关的签名,再拿签名去配对。
<span class="en">How do we find an object that appears rotated, rescaled and partly occluded? Instead of brute-force templates, SIFT detects distinctive local features and gives each one a scale-, rotation- and lighting-invariant signature for matching.</span>

### 8.9.1 什么样的点值得拿来配对 · What makes a point interesting

比方:在人群里认朋友,你记的是他的脸,不是他衣服上一条直线。
<span class="en">Analogy: you recognize a friend by the face, not by one straight seam on the shirt.</span>

讲义列了好特征的五个条件:周围内容丰富(亮度、颜色有变化);能算出签名;位置明确;签名不随旋转和缩放变;对光照不敏感。
<span class="en">A good feature has rich local content, a computable signature, a well-defined position, rotation/scale invariance, and insensitivity to lighting.</span>

边缘不行。放大以后图里到处是长得一样的边,而且沿着边滑动时外观不变,定不了位。角点能定位,但内容太少,只适合简单物体。
<span class="en">Edges are not unique and cannot be localized along their length. Corners localize well but are not descriptive enough for complex objects.</span>

Blob(斑块)是更好的选择。这里的 blob 不是「一块均匀颜色加清晰边界」,只是「一块有局部外观的区域」。它有固定位置,也有确定大小。一个 blob 要能用,得做到四件事:定位、定大小、定方向、算签名。
<span class="en">A blob, loosely meaning a patch with some local appearance, has a fixed position and a definite size. We need its location, size, orientation and a signature.</span>

### 8.9.2 用二阶导找 blob,顺便量出大小 · Blob detection and characteristic scale

比方:拿不同口径的筛子去筛豆子。每颗豆子只会卡在和它一样大的那个筛子上。
<span class="en">Analogy: sieves of different sizes; each bean gets caught by the sieve that matches its size.</span>

先在 1D 里看。对信号 f(x) 用高斯二阶导 ∂²n_σ/∂x² 去卷积(就是边缘检测里的「倒墨西哥帽」算子)。σ 越大,输出峰值越低,不公平。所以乘上 σ²,得到 σ 归一化输出:σ² · (∂²n_σ/∂x²) * f(x)。
<span class="en">Convolve with the second derivative of a Gaussian. Because the response shrinks as σ grows, multiply by σ² to get the σ-normalized response.</span>

![三个宽度不同的 blob,各自在不同 σ 下出现最强响应](img/fc8a74983da.jpg)

然后用一串 σ 去扫。对每个 blob,随着 σ 增大,响应先冒出一个尖峰,再慢慢消失。尖峰最强时的 σ 叫特征尺度(characteristic scale)σ*。σ* 和 blob 宽度成正比。
<span class="en">Sweep σ. For each blob a peak emerges and then fades. The σ of the strongest peak is the characteristic scale σ*, proportional to blob size.</span>

结果写成 (x*, σ*) = argmax over (x, σ) of |σ² ∂²n_σ/∂x² * f(x)|。x* 是位置,σ* 是大小。
<span class="en">(x*, σ*) is the extremum of the normalized response over space and scale: position and size together.</span>

小例子:讲义里 blob A、B、C 宽度比 1 : 2 : 3。若 A 的 σ* = 2,那么 B 的 σ* = 4,C 的 σ* = 6。反过来,看到 σ* 是 6,就知道这个 blob 比 σ* 为 2 的那个宽 3 倍。
<span class="en">Widths 1:2:3 give σ* of 2, 4, 6. The σ* ratio tells you the size ratio.</span>

2D 里换成 σ 归一化的高斯拉普拉斯,叫 NLoG:σ² ∇²n_σ,其中 ∇² = ∂²/∂x² + ∂²/∂y²。在 (x, y, σ) 三维堆栈里找局部极值。平坦区域在所有尺度上响应都低,没有极值,就不是 blob。
<span class="en">In 2D use the normalized Laplacian of Gaussian (NLoG) and find local extrema in the (x, y, σ) stack. Flat regions give no strong extremum, so no blob.</span>

注意:检测出的圆往往不贴着任何真实边界。blob 是数学意义上的,不是肉眼意义上的。只要能稳定重复检测出来就够了。
<span class="en">Detected circles often do not follow real boundaries. That is fine as long as detection is repeatable.</span>

### 8.9.3 尺度空间与 DoG 加速 · Scale space and the DoG trick

比方:把一张照片越看越模糊,就像人慢慢往后退。
<span class="en">Analogy: blurring more and more is like stepping back from the picture.</span>

尺度空间(scale space)就是把原图和一串不同 σ 的高斯分别卷积,叠成一摞:S(x, y, σ) = n_σ(x, y) * I(x, y)。σ 越大,图越糊,分辨率越低。
<span class="en">Scale space is the stack S(x, y, σ) of the image blurred by Gaussians of increasing σ.</span>

σ 怎么取:σ_k = σ₀ · s^k,k = 0, 1, 2, ...。每一层是上一层乘一个常数 s。
<span class="en">Scales are geometric: σ_k = σ₀ s^k.</span>

小例子:σ₀ = 1.6,s = √2 ≈ 1.414。四层依次是 1.6、2.26、3.2、4.53。每两层翻一倍(1.6 到 3.2)。
<span class="en">With σ₀ = 1.6 and s = √2: 1.6, 2.26, 3.2, 4.53; σ doubles every two levels.</span>

关键技巧:两个相邻高斯相减,差不多就是 NLoG 乘一个常数。
DoG = n_{sσ} − n_σ ≈ (s − 1) σ² ∇²n_σ
<span class="en">Difference of Gaussians approximates NLoG up to a factor (s − 1).</span>

所以不用另算拉普拉斯。尺度空间本来就要算,把相邻两层图相减就得到 NLoG 的近似。s = √2 时,常数是 0.414。所有层乘同一个常数,不影响找极值的位置。
<span class="en">No separate Laplacian is needed: subtract adjacent scale-space images. A constant factor does not move the extrema.</span>

![SIFT 流程:高斯尺度空间相邻层相减得到 DoG 堆栈](img/f20e2b7c215.jpg)

### 8.9.4 在 DoG 堆栈里找极值 · Extracting SIFT interest points

做法:把 DoG 堆栈当一个三维体,用 3×3×3 小窗滑过去。中心点的绝对值明显大于周围 26 个邻居(同层 8 个,上下层各 9 个),就算极值。这和角点检测里的非极大值抑制是一回事。
<span class="en">Slide a 3×3×3 window over the DoG volume. A center larger in magnitude than its 26 neighbors is an extremum, like non-maximum suppression.</span>

再用阈值去掉弱极值,压住噪声。剩下的就是 SIFT 兴趣点。每个点画成一个圆:圆心是位置,半径正比于 σ*。
<span class="en">Threshold out weak extrema to suppress noise. Each surviving point is drawn as a circle: center is position, radius ∝ σ*.</span>

![3×3×3 邻域找极值,得到候选兴趣点](img/fb668153afe.jpg)

代价:要算多层模糊和多层差分,比 Harris 角点慢。好处是一次拿到位置和大小两样东西。
<span class="en">Cost: many blur levels, slower than Harris. Benefit: position and size come out together.</span>

### 8.9.5 尺度和旋转归一化 · Scale and rotation invariance

尺度:同一个点在近景图和远景图里,NLoG 峰值出现在不同 σ。两个 σ* 的比值就是放大倍数。匹配前把两块都缩放到同一大小。
<span class="en">Scale: the same point peaks at different σ* in two images. Their ratio is the magnification, so we normalize before matching.</span>

小例子:左图某点 σ* = 2,右图对应点 σ* = 6。右图物体放大了 3 倍。把右边那块缩小 3 倍再比。
<span class="en">σ* = 2 vs 6 means a 3× zoom; shrink the right patch by 3 before comparing.</span>

旋转:在 blob 区域里每个像素算梯度方向 θ = tan⁻¹((∂I/∂y)/(∂I/∂x))。讲义里只用方向不用幅值,因为幅值受相机增益和光照影响。统计方向直方图,最高的那根柱子就是主方向(principal orientation)。
<span class="en">Rotation: build a histogram of gradient directions in the patch (magnitude ignored, since it depends on gain and lighting). The peak bin is the principal orientation.</span>

![梯度方向直方图,最高柱就是主方向](img/f96eb8f6bdf.jpg)

然后把这块转到主方向朝正北。现在任意两个 SIFT 特征都在同样大小、同样朝向下,可以直接比内容。
<span class="en">Rotate the patch so the principal orientation points north. Now any two features are directly comparable.</span>

### 8.9.6 SIFT 描述子和匹配 · SIFT descriptor and matching

比方:不记一张脸的每个像素,只记「左上区域纹理多朝哪边、右下区域多朝哪边」。
<span class="en">Analogy: instead of every pixel, remember which way the texture runs in each region.</span>

讲义版本:在归一化后的窗口里,每个像素算梯度方向。把窗口分成 4 个象限,每个象限做一个方向直方图,四个拼起来。这个拼接后的归一化直方图就是 SIFT 描述子。只用方向,所以对亮度变化不敏感。
<span class="en">Lecture version: split the normalized window into four quadrants, build a gradient-direction histogram per quadrant, and concatenate. Using directions only makes it insensitive to brightness.</span>

![四个象限的梯度方向直方图拼成描述子](img/fcc941f8e25.jpg)

比较两个描述子 H1、H2,讲义给了三种:
- L2 距离:d = √(Σ (H1(k) − H2(k))²)。越小越像,0 是完全一样。
- 归一化相关:先减均值,再算相关,除以两边能量。越大越像,1 是完全一样。
- 直方图交集:d = Σ min(H1(k), H2(k))。算的是两条直方图的重叠面积,越大越像。
<span class="en">Compare with L2 distance (smaller is better), normalized correlation (1 is perfect), or histogram intersection (larger overlap is better).</span>

小例子:H1 = [2, 1, 0, 1],H2 = [1, 1, 1, 1]。L2 = √(1 + 0 + 1 + 0) = √2 ≈ 1.41。交集 = 1 + 1 + 0 + 1 = 3。
<span class="en">L2 = √2 ≈ 1.41; intersection = 3.</span>

效果:大幅缩放、旋转 45°、90°、180° 都能配上很多点。物体被严重遮挡时,只要露出的部分有足够多特征配上,就能认出它,还能反推出位置、大小和朝向。应用包括全景拼接和自动拼贴。
<span class="en">SIFT survives large scale changes, any in-plane rotation, clutter and heavy occlusion. Applications include panoramas and collages.</span>

局限:SIFT 只对平面内的变化稳。3D 物体换视角时局部外观本身变了。讲义例子里,视角差 30° 匹配数大降,差 90° 几乎配不上。
<span class="en">Limitation: SIFT handles only small viewpoint changes on 3D objects. Matches drop sharply at 30° and almost vanish at 90°.</span>

### 8.9.x 面试怎么问 · Likely questions

**Q: Walk me through how SIFT detects keypoints.**
讲一下 SIFT 怎么检测关键点。
> First I build a Gaussian scale space by blurring the image with geometrically increasing sigmas. Then I subtract adjacent levels to get Difference of Gaussians, which approximates the scale-normalized Laplacian of Gaussian. I look for local extrema in a 3×3×3 neighborhood across space and scale, and threshold out weak responses. Each keypoint gets a position and a characteristic scale, then an orientation from the peak of the gradient-direction histogram.

这段在说什么:建尺度空间,相邻层相减得 DoG,三维找极值去弱点,再定主方向。
<span class="en">Scale space, DoG, 3D extrema with thresholding, then orientation.</span>

**Q: Why is SIFT scale invariant? Why multiply by σ²?**
SIFT 为什么尺度不变?为什么要乘 σ²?
> Without normalization the Laplacian response decays as sigma grows, so large blobs would always lose. Multiplying by sigma squared makes responses comparable across scales. Then the sigma where the response peaks, the characteristic scale, is proportional to the blob size. If the same feature peaks at sigma 2 in one image and sigma 6 in another, I know the zoom is 3×, and I resample the patch before computing the descriptor.

这段在说什么:σ² 让不同尺度能公平比较,峰值 σ 和大小成正比,比值就是缩放倍数。
<span class="en">σ² normalization makes scales comparable; σ* tracks size, and its ratio gives the zoom.</span>

**Q: SIFT vs Harris corners. When would SIFT fail?**
SIFT 和 Harris 比怎样?什么时候会失效?
> Harris gives well-localized corners but no scale, so it breaks when the camera moves closer or farther. SIFT adds scale and orientation and a descriptor that ignores gradient magnitude, so it handles zoom, rotation and lighting. It fails on large out-of-plane viewpoint changes of 3D objects, since local appearance itself changes; matches drop sharply by about 30 degrees. It is also heavier to compute.

这段在说什么:Harris 没尺度;SIFT 补了尺度、方向、描述子,但大视角变化和计算量是短板。
<span class="en">Harris lacks scale; SIFT adds it but struggles with large viewpoint change and is costly.</span>

和 Byte Veda 的联系:无人机绕物体飞,相邻帧视角变化小,SIFT 类特征可以稳定配对,用来做位姿估计和 3D 重建。视角跨度大时要靠相邻帧链式配对,不能指望首尾两帧直接配上。实时场景可以提一句会考虑更快的替代特征。
<span class="en">For drone 3D perception, consecutive frames have small viewpoint change, so SIFT-style matches feed pose estimation and reconstruction; chain matches across frames rather than across wide baselines.</span>

**Q: How do you compare two SIFT descriptors?**
两个 SIFT 描述子怎么比?
> A descriptor is just an array, so any histogram distance works. L2 distance is the simplest, where zero means identical. Normalized correlation subtracts the means and divides by the energies, so one is a perfect match. Histogram intersection sums the bin-wise minimum and measures overlap. In practice I take nearest neighbors in descriptor space and then verify the matches geometrically.

这段在说什么:L2、归一化相关、直方图交集三种,配完再做几何验证。
<span class="en">L2, normalized correlation or intersection, followed by geometric verification.</span>

> 补充(讲义没写,面试常问):Lowe 原版 SIFT 描述子是 4×4 个小格 × 每格 8 个方向 = 128 维,每个梯度按幅值和以关键点为中心的高斯加权投票,最后归一化、把大于 0.2 的值截断再归一化,用来抗光照变化。
<span class="en">Not in the notes but often asked: Lowe's SIFT descriptor is 4×4 cells × 8 orientations = 128 dimensions, magnitude- and Gaussian-weighted, normalized, clipped at 0.2, and renormalized for illumination robustness.</span>

## 8.10 图像拼接 · Image Stitching

这一讲解决的问题:相机原地转着拍几张有重叠的照片,怎么自动拼成一张全景图。流程是四步:用 SIFT 找对应点,算两图之间的几何变换(单应性),用 RANSAC 扔掉错配,最后变形对齐并融合掉接缝。
<span class="en">Given overlapping photos from a rotating camera, build a panorama: match features, estimate the homography, reject outliers with RANSAC, then warp and blend.</span>

### 8.10.1 从 2×2 到 3×3:齐次坐标 · From 2×2 matrices to homogeneous coordinates

比方:2×2 矩阵能把图转、拉、斜、翻,唯独不能「挪」。
<span class="en">Analogy: a 2×2 matrix can rotate, stretch, skew and flip an image, but it cannot slide it.</span>

图像变换分两类。滤波改的是亮度值(range)。变形(warp)改的是坐标(domain)。拼接只关心变形。
<span class="en">Filtering changes brightness values; warping changes coordinates. Stitching only needs warping.</span>

2×2 线性变换 p₂ = T p₁ 能做:缩放 [[a,0],[0,b]];旋转 [[cosθ, −sinθ],[sinθ, cosθ]];斜切 [[1, s_x],[0, 1]];镜像 [[−1,0],[0,1]]。它们的共同性质:原点不动;直线还是直线;平行线还是平行;可以连乘组合,T₃₁ = T₃₂ T₂₁。
<span class="en">2×2 maps cover scale, rotation, skew and mirror. Origin stays fixed, lines stay lines, parallels stay parallel, and they compose by matrix product.</span>

问题:平移 x₂ = x₁ + t_x 写不成 2×2 矩阵,因为原点必须动。解决办法是齐次坐标:把 (x, y) 写成 (x̃, ỹ, z̃),真实坐标是 x = x̃/z̃,y = ỹ/z̃。几何上,从原点穿过 (x, y, 1) 的整条直线(除原点)都代表同一个点。
<span class="en">Translation is not linear in 2D. Homogeneous coordinates (x̃, ỹ, z̃) with x = x̃/z̃ fix this; every point on a ray from the origin represents the same 2D point.</span>

平移就成了 3×3 矩阵:
[x₂, y₂, 1]ᵀ = [[1, 0, t_x],[0, 1, t_y],[0, 0, 1]] · [x₁, y₁, 1]ᵀ
<span class="en">Translation becomes a 3×3 matrix.</span>

小例子:点 (2, 3),t_x = 5,t_y = −1。乘出来是 (2 + 5, 3 − 1, 1) = (7, 2, 1),即 (7, 2)。
<span class="en">(2, 3) shifted by (5, −1) gives (7, 2).</span>

缩放、旋转、斜切、平移都能写成 3×3,一串操作可以先乘成一个矩阵再一次性作用。最后一行固定是 [0 0 1] 的叫仿射变换(affine),有 6 个自由参数。仿射下原点可以动,但直线还是直线、平行还是平行。
<span class="en">All of these compose into one 3×3 matrix. With last row [0 0 1] it is affine: 6 parameters, parallels preserved.</span>

### 8.10.2 单应性:平面到平面的投影 · The homography

比方:手电筒透过一块玻璃上的图案,投到墙上。玻璃上的点和墙上的点一一对应,这个对应就是单应性。
<span class="en">Analogy: a pattern on glass projected through a point onto a wall; the point-to-point mapping is a homography.</span>

把 3×3 矩阵最后一行也放开,就是投影变换,也叫单应性矩阵 H(homography):
[x̃₂, ỹ₂, z̃₂]ᵀ = H · [x̃₁, ỹ₁, z̃₁]ᵀ,H = [[h11,h12,h13],[h21,h22,h23],[h31,h32,h33]]
它描述「一个平面经过一个点投到另一个平面」。针孔相机拍一个平面,正是这件事。
<span class="en">Freeing the last row gives the projective transform H, which maps one plane to another through a point, exactly what a pinhole camera does to a scene plane.</span>

![单应性:平面 Π₁ 经过一点投到平面 Π₂](img/f5eb3e625ba.jpg)

H 只定义到一个比例。H 乘任意非零常数 k,除以 z̃ 后结果不变。所以 9 个元素只有 8 个自由度。
<span class="en">H is defined only up to scale, so 9 entries give 8 degrees of freedom.</span>

性质:原点可以动;直线还是直线;可以组合;但平行线不一定保持平行。铁轨在照片里汇到消失点,就是这个原因。
<span class="en">Lines map to lines and H composes, but parallel lines may converge. That is why vanishing points exist.</span>

小例子:H = [[1,0,0],[0,1,0],[0.1,0,1]],点 (2, 4)。x̃ = 2,ỹ = 4,z̃ = 0.1×2 + 1 = 1.2。真实坐标 (2/1.2, 4/1.2) ≈ (1.67, 3.33)。分母随 x 变化,所以离得越远缩得越多,平行线就会汇聚。
<span class="en">With h31 = 0.1, the point (2, 4) maps to about (1.67, 3.33); the x-dependent denominator makes parallels converge.</span>

什么时候 H 成立:
- 相机绕光心纯旋转拍的任意 3D 场景(全景拍摄就是这样);
- 拍的是一个平面,视角随便换;
- 场景很远,相对相机挪动的距离可以看成无穷远平面。
不成立的情况:场景近、深度变化大、而且相机换了位置。
<span class="en">H is valid for pure rotation about the center of projection, for a planar scene from any viewpoint, or for a distant scene. It fails for nearby scenes with depth variation seen from different positions.</span>

多张图都绕同一光心拍时,各自到参考平面的 H 可以连乘(例如 H_P1 · H_12)。所以不管场景多复杂,都能对齐到同一平面。
<span class="en">With a shared center of projection, homographies chain, so all images map onto one plane regardless of scene complexity.</span>

### 8.10.3 用对应点解 H · Computing the homography

每一对对应点 (x_s, y_s) ↔ (x_d, y_d) 给两个方程:
x_d = (h11 x_s + h12 y_s + h13) / (h31 x_s + h32 y_s + h33)
y_d = (h21 x_s + h22 y_s + h23) / (h31 x_s + h32 y_s + h33)
两边乘分母,整理成关于 h 的线性方程:
[x_s, y_s, 1, 0, 0, 0, −x_d x_s, −x_d y_s, −x_d] · h = 0
[0, 0, 0, x_s, y_s, 1, −y_d x_s, −y_d y_s, −y_d] · h = 0
<span class="en">Each correspondence gives two equations linear in the 9 entries of h after multiplying through by the denominator.</span>

8 个自由度,每对点 2 个方程,所以最少 4 对点。实际把所有 N 对都堆起来,得到 2N×9 的矩阵 A,解 A h = 0。点越多越稳。
<span class="en">Minimum 4 pairs; in practice stack all N pairs into a 2N×9 matrix A and solve A h = 0.</span>

小例子:有 50 对匹配,A 就是 100×9。方程比未知数多得多,是超定系统,一般没有精确解,只能求最小二乘。
<span class="en">50 matches give a 100×9 overdetermined system.</span>

h = 0 是平凡解,没用。利用比例自由,规定 ‖h‖² = 1。问题变成:
min ‖A h‖² = hᵀAᵀA h,约束 hᵀh = 1
用拉格朗日乘子:L = hᵀAᵀA h − λ(hᵀh − 1),对 h 求导令其为 0,得 AᵀA h = λ h。这是特征值问题。代回去 L 的值就是 λ,所以取 AᵀA 最小特征值对应的特征向量。把它的 9 个数排回 3×3 就是 H。
<span class="en">Fix ‖h‖ = 1 to avoid the trivial solution. The Lagrangian gives AᵀA h = λh, so h is the eigenvector of AᵀA with the smallest eigenvalue.</span>

为什么这样做:变成线性问题,一次特征分解就解完,不用迭代。代价:它对错配非常敏感,一个离谱的点就能把 H 拉歪。所以要配 RANSAC。
<span class="en">It is closed-form and fast, but least squares is very sensitive to bad matches, hence RANSAC.</span>

### 8.10.4 RANSAC:让错配投不了票 · RANSAC for outliers

比方:一屋子人里混了几个说谎的。随机抽几个人编个故事,看有多少人附和。附和的人最多的那个故事最可信。
<span class="en">Analogy: pick a few people at random, form a story, and count how many others agree. The story with the most supporters wins.</span>

SIFT 会配错:两个点局部长得一样,但不是场景里的同一个点。这种错配叫外点(outlier),正确的叫内点(inlier)。算 H 之前分不出谁对谁错。
<span class="en">SIFT produces outliers: points that look alike but are not the same scene point. We cannot tell them apart before fitting.</span>

RANSAC(随机抽样一致)步骤:
1. 随机抽 s 个点,s 是拟合模型的最少点数;
2. 用这 s 个点拟合模型;
3. 数一数全部数据里有多少点误差在 ε 以内,记为内点数 M;
4. 重复 N 次;
5. 选 M 最大的模型,再用它的全部内点重新拟合一次。
算单应性时 s = 4,ε 是可接受的对齐误差(像素)。
<span class="en">Sample the minimum set, fit, count inliers within ε, repeat N times, keep the model with most inliers, then refit on all its inliers. For a homography s = 4.</span>

![直线拟合:最小二乘被外点拉歪,RANSAC 找到 20 个内点的那条线](img/f8d7f9ab579.jpg)

讲义的直线例子:最小二乘拟合所有点,线被拉歪。RANSAC 每次抽 2 个点画线,第一次 4 个内点,第二次 3 个,迟早抽到两个都在真线上的点,这时内点有 20 个。最后用这 20 个点重拟合。
<span class="en">In the lecture's line example, least squares is skewed; RANSAC eventually samples two true points and finds 20 inliers, then refits.</span>

讲义说外点少于 50% 时 RANSAC 就能工作。要抽多少次,常用估算(讲义没给,面试常问):N = log(1 − p) / log(1 − wˢ),w 是内点比例,p 是想要的成功概率。
<span class="en">RANSAC works when outliers are under 50%. A common estimate (not in the lecture) is N = log(1 − p) / log(1 − wˢ).</span>

小例子:w = 0.5,s = 4,p = 0.99。wˢ = 0.0625,1 − 0.0625 = 0.9375。N = ln 0.01 / ln 0.9375 = −4.605 / −0.0645 ≈ 71.4,取 72 次。直线 s = 2 时 wˢ = 0.25,N = −4.605 / ln 0.75 = −4.605 / −0.288 ≈ 16.0,取 17 次。s 越小,需要的次数越少。
<span class="en">w = 0.5, p = 0.99: 72 iterations for a homography (s = 4), 17 for a line (s = 2).</span>

### 8.10.5 变形:要反向映射 · Warping: forward vs backward

正向映射:拿源图每个像素,用 T 算它去哪。问题一:落点不在像素中心。问题二:目标图有些像素没人落进来,出现空洞。
<span class="en">Forward warping sends each source pixel through T; it lands between pixels and leaves holes.</span>

反向映射:先把源图四个角正向映射,得到目标图的边界框。然后对目标图每个像素,用 T⁻¹ 回源图找值。落在像素之间就取最近邻,或者用周围像素插值。这样每个目标像素都有值,保证没有空洞。
<span class="en">Backward warping: map the four corners to get the output bounding box, then for every output pixel apply T⁻¹ and sample the source with nearest neighbor or interpolation. No holes.</span>

![反向映射:目标图每个像素用 T⁻¹ 回源图取值](img/f7274b1d50e.jpg)

三张图拼接时,选中间那张做参考。用 H₂₁ 把图 1 的角映过去得到边界框,再用 H₁₂ 反向取值。图 3 同理。
<span class="en">With three images, use the middle one as reference; forward-map corners for bounds, then backward-map to fill.</span>

### 8.10.6 融合掉接缝 · Blending

对齐后叠在一起,接缝很明显。原因是曝光不同、拍摄间光照变了、镜头暗角(vignetting,画面边缘偏暗)。直接取平均还是能看到接缝,人眼对沿直线的亮度跳变特别敏感。
<span class="en">Aligned images still show seams from exposure differences, lighting changes and vignetting. Plain averaging still leaves visible seams.</span>

加权融合:I_blend = (w₁ I₁ + w₂ I₂) / (w₁ + w₂)。权重从 1 平滑过渡到 0,而不是一刀切。拼接时用距离变换算权重:像素离图像边缘越远,权重越大,因为越靠里越可信(也越不受暗角影响)。
<span class="en">Weighted blending with smooth weights. For stitching, weights come from the distance transform: pixels farther from an image's edge get higher weight.</span>

小例子:某像素离图 1 边缘 30 像素,离图 2 边缘 10 像素。I₁ = 100,I₂ = 140。I = (30×100 + 10×140) / 40 = 4400 / 40 = 110。越靠近图 1 内部,结果越接近图 1 的亮度。
<span class="en">Distances 30 and 10, brightness 100 and 140, give (3000 + 1400) / 40 = 110.</span>

![距离变换加权融合后接缝消失](img/fa33186e683.jpg)

### 8.10.x 面试怎么问 · Likely questions

**Q: How many point correspondences do you need for a homography, and how do you solve for it?**
单应性最少要几对点?怎么解?
> A homography has nine entries but is defined only up to scale, so it has eight degrees of freedom. Each correspondence gives two linear equations, so the minimum is four pairs. With more pairs I stack them into a 2N by 9 matrix A and solve A h equals zero with the norm of h fixed to one. The solution is the eigenvector of A transpose A with the smallest eigenvalue, which is the same as the last right singular vector from an SVD of A.

这段在说什么:8 自由度,每对点 2 个方程,最少 4 对;多了就做约束最小二乘,取最小特征值的特征向量。
<span class="en">8 DOF, 4 pairs minimum, constrained least squares via the smallest eigenvector.</span>

**Q: Explain RANSAC. How many iterations do you need?**
讲讲 RANSAC,要跑多少轮?
> RANSAC repeatedly samples the minimum number of points, four for a homography, fits a model, and counts how many points agree within a pixel threshold. After N rounds it keeps the model with the most inliers and refits it on all of them. The number of rounds follows from log of one minus p over log of one minus w to the s, where w is the inlier ratio. For a homography with half the matches wrong and 99 percent confidence that is about 72 rounds.

这段在说什么:抽最少点拟合、数内点、选票数最多的再重拟合;轮数由内点率和样本数决定。
<span class="en">Sample, fit, count inliers, keep the best, refit; iteration count depends on inlier ratio and sample size.</span>

和 Byte Veda 的联系:无人机视觉里,特征匹配加 RANSAC 是位姿估计的标配。实时系统里 RANSAC 轮数直接决定延迟,所以要尽量提高内点率(更好的匹配筛选)和用最小样本模型。

**Q: When is a homography the right model, and when does it break?**
什么时候能用单应性?什么时候不行?
> A homography is exact when the camera only rotates about its center of projection, or when the scene is a single plane, or when the scene is far away compared with the camera motion. It breaks when the camera translates and the scene is close with significant depth variation, because points at different depths shift by different amounts. That parallax is exactly what stereo and structure from motion exploit to recover depth.

这段在说什么:纯旋转、平面、远景三种情况成立;近景加平移有视差就不成立,而视差正是 3D 重建的信息来源。
<span class="en">Valid for pure rotation, planes or distant scenes; parallax breaks it but is what 3D reconstruction uses.</span>

和 Byte Veda 的联系:无人机高空俯拍地面可以近似成平面,用单应性做地图拼接;低空绕建筑飞有明显视差,就要上本质矩阵或 SfM。

**Q: Why use backward warping instead of forward warping?**
为什么用反向映射?
> Forward warping pushes each source pixel to the output, but it lands between pixel centers and some output pixels never get a value, which leaves holes. Backward warping loops over output pixels instead and pulls each one from the source through the inverse transform, so every output pixel is filled. Non-integer locations are handled with nearest neighbor or bilinear interpolation.

这段在说什么:正向会留空洞;反向遍历目标像素回源图取值,保证填满。
<span class="en">Forward leaves holes; backward fills every output pixel via the inverse map.</span>

## 8.11 人脸检测 · Face Detection

这一讲解决的问题:在一张图里把每张人脸框出来,而且要快到能在手机取景时实时跑。做法是三件套:用 Haar 特征描述一个窗口,用积分图让特征算得飞快,用 SVM 判断这个窗口是不是人脸。讲义只考虑正脸。
<span class="en">Find every face in an image fast enough for a live camera preview. Haar features describe a window, the integral image makes them cheap, and an SVM decides face or non-face. The lecture assumes frontal faces.</span>

### 8.11.1 滑窗框架和好特征的要求 · Sliding windows and what a good feature needs

比方:拿一个相框在照片上一格一格挪,每挪一下问一句「框里是脸吗」。
<span class="en">Analogy: slide a picture frame across the photo and ask "is this a face?" at every position.</span>

流程:取一个固定大小的窗口,按光栅顺序扫过整张图。每个位置从窗口里抽一个特征向量 f,交给分类器判 Yes / No。要找不同大小的脸,就换不同大小的窗口再扫一遍。
<span class="en">Raster-scan a fixed window, extract a feature vector f at each position, and classify it. Repeat with other window sizes for other face sizes.</span>

用途很广:手机相机按人脸调对焦、曝光、白平衡(大脸优先);搜索引擎按「有没有脸」过滤结果;售货机估年龄性别推荐商品;门禁和监控。
<span class="en">Applications: camera autofocus/exposure/white balance, face filters in image search, targeted vending machines, access control and surveillance.</span>

好特征要满足两条。第一,能区分脸和非脸。第二,算得极快,因为一张图有上百万个窗口要判。
<span class="en">A good feature must discriminate face from non-face and be extremely fast, since millions of windows must be evaluated.</span>

为什么不用学过的特征:边缘和角点描述性太弱。SIFT 擅长配「同一个东西」,但这里要的是区分「一类东西」,人脸之间差别很大。按眼睛、鼻子、嘴分别做模板再检查相对位置,以前试过,效果有限。
<span class="en">Edges and corners are too weak. SIFT matches the same object, not a category. Part templates for eyes, nose and mouth had limited success.</span>

### 8.11.2 Haar 特征 · Haar features

比方:一块一半白一半黑的板子,盖到图上,算「白下面的亮度总和减黑下面的亮度总和」。
<span class="en">Analogy: a half-white, half-black board laid on the image; the response is the sum under white minus the sum under black.</span>

Haar 滤波器来自 Haar 小波,本质是方波。每个滤波器只有两个值:白 = +1,黑 = −1。所以做相关时不需要乘法:
V_A[i, j] = Σ(白区像素) − Σ(黑区像素)
<span class="en">Haar filters are two-valued (+1 white, −1 black), so the correlation needs no multiplications.</span>

一组滤波器(H_A, H_B, H_C, H_D, ...)在同一位置的响应拼起来,就是这个位置的特征向量 f[i, j]。最简单的左白右黑相当于一个很大的 x 方向一阶导;上白下黑是 y 方向一阶导;白黑白像 x 方向二阶导(类似拉普拉斯);越往后阶数越高。
<span class="en">Stacking responses gives the feature vector. The simplest filters act like large first derivatives in x and y; later ones resemble second and higher derivatives.</span>

![同一个 Haar 滤波器在不同图上的响应:人脸 64,噪声约 0](img/fc5834bc7a4.jpg)

讲义的例子:同一个左右分半的滤波器,放在半边脸上响应 64,放在噪声上约 0,放在苹果上 16,放在狗上 −127。说明 Haar 特征对图案的方向很敏感。
<span class="en">Lecture example: the same filter gives 64 on a face, about 0 on noise, 16 on an apple, −127 on a dog. Haar features are sensitive to pattern direction.</span>

多尺度:每个尺度一整套滤波器,尺度越大滤波器越大,用来找更大的脸。
<span class="en">Each scale has its own filter set; larger filters find larger faces.</span>

代价:直接算的话,一个 N×M 的滤波器每个像素要 N×M − 1 次加法。比如 24×24 就是 575 次,而且每个像素要算很多个滤波器、很多个尺度。
<span class="en">Direct cost is N×M − 1 additions per pixel, per filter, per scale; 575 for a 24×24 filter.</span>

### 8.11.3 积分图:任意矩形求和只要 3 次加减 · The integral image

比方:提前把「从左上角到每个格子」的累计和记在小本子上。之后问任意矩形的和,翻四个数就够了。
<span class="en">Analogy: precompute running totals from the top-left corner; any rectangle sum then needs just four lookups.</span>

定义:积分图 II 在某像素的值 = 原图里它左上方(含自己)所有像素之和。
<span class="en">II at a pixel is the sum of all pixels above and to the left, inclusive.</span>

一次光栅扫描就能算完。在像素 A 处,B 在上,C 在左,D 在左上:
II_A = II_B + II_C − II_D + I_A
减 II_D 是因为 D 那块被 B 和 C 各算了一次,重复了。
<span class="en">One raster pass: II_A = II_B + II_C − II_D + I_A; subtract D because it was counted twice.</span>

矩形求和:P 是矩形右下角,Q 是矩形上方那一格,S 是矩形左方那一格,R 是左上斜角外那一格。
Sum = II_P − II_Q − II_S + II_R
R 被减了两次,所以加回一次。只要 3 次加减,和矩形多大无关。
<span class="en">Rectangle sum = II_P − II_Q − II_S + II_R: three operations regardless of rectangle size.</span>

![用积分图四个角求矩形和](img/faeed609be6.jpg)

讲义数字:Sum = 3490 − 1137 − 1249 + 417 = 1521。
<span class="en">Lecture numbers: 3490 − 1137 − 1249 + 417 = 1521.</span>

小例子,自己验一遍。原图
```
1 2 3
4 5 6
7 8 9
```
积分图
```
 1  3  6
 5 12 21
12 27 45
```
验递推:II(2,2) = 3 + 5 − 1 + 5 = 12,对。右下 2×2 块(5, 6, 8, 9)的和应为 28。用公式:P = 45,Q = 6,S = 12,R = 1。45 − 6 − 12 + 1 = 28,对。
<span class="en">Check: the bottom-right 2×2 block sums to 28, and 45 − 6 − 12 + 1 = 28.</span>

Haar 响应:左右分半的滤波器是两个矩形,共用中间一条边,一共只需要 6 个角点、7 次加减。讲义算出 (2061 − 329 + 98 − 584) − (3490 − 576 + 329 − 2061) = 1246 − 1182 = 64。更复杂的滤波器块数多一点,但仍然和滤波器大小无关。
<span class="en">A two-rectangle Haar filter costs 7 additions; the lecture example gives 1246 − 1182 = 64. Cost stays independent of filter size.</span>

积分图每张图只算一次,所有滤波器、所有尺度都复用它。575 次加法变成 7 次。
<span class="en">Compute the integral image once per image and reuse it for all filters and scales.</span>

### 8.11.4 最近邻分类器 · Nearest neighbor classifier

比方:新来一个人,看他最像训练集里的谁,就跟谁一个阵营。
<span class="en">Analogy: a newcomer joins the side of whoever in the training set he most resembles.</span>

把 n 维 Haar 特征看成 n 维空间里的点。训练集里有很多人脸点和非人脸点。新窗口算出特征,用 L2 距离找最近的训练点,把它的标签拿过来。
<span class="en">Treat features as points in n-D space; label a new window with the class of its L2-nearest training point.</span>

![最近邻的误报:猫脸的最近邻是人脸](img/f48d8b94204.jpg)

问题一:误报(false positive)。猫脸长得像脸,最近邻是一张人脸,被判成人脸。注意它其实离那张人脸并不近。办法是大量增加非人脸样本,让像脸但不是脸的东西更可能落到非人脸旁边。
<span class="en">False positives: a cat's nearest neighbor is a human face, though not very close. Adding many more non-face examples helps.</span>

问题二:训练集越大越准,但也越慢。每个像素都要搜一遍最近邻。K-D 树能加速,但面对上百万像素仍然太贵。
<span class="en">Bigger training sets are more accurate but slower; even K-D trees are too expensive for millions of windows.</span>

所以换思路:提前在两团点之间放一个分界面,新点只看在哪一侧。
<span class="en">Instead, precompute a decision boundary and just check which side a point falls on.</span>

### 8.11.5 支持向量机 · Support vector machine

比方:在两群人中间修一条路,路要修得尽量宽,两边谁都不碰到。
<span class="en">Analogy: build the widest possible road between two crowds without touching anyone.</span>

线性分界:wᵀf + b = 0。2D 里是一条线,3D 里是一个平面,n 维里是一个 n−1 维超平面。wᵀf + b > 0 判为脸,< 0 判为非脸。
<span class="en">Linear boundary wᵀf + b = 0: a line in 2D, a plane in 3D, a hyperplane in n-D. Positive means face.</span>

能把两类分开的线有很多条,但新样本的判定会因线而异。衡量好坏用安全区(safe zone):把分界线往两边加粗,直到碰到第一个样本点,这个宽度叫间隔(margin)ρ。选间隔最大的那条。
<span class="en">Many boundaries separate the data. The margin ρ is how wide the boundary can grow before touching a point. Pick the maximum-margin boundary.</span>

![最大间隔:贴在安全区边上的点就是支持向量](img/f8748ea411d.jpg)

贴在安全区边上的那几个点叫支持向量(support vector)。分界线和间隔只由它们决定,其余训练点可以全部扔掉。
<span class="en">Points touching the safe zone are support vectors. The boundary depends only on them.</span>

训练:k 张训练图,Haar 特征 f₁...f_k,标签 λ_i = +1(脸)或 −1(非脸)。约束合成一条:
λ_i (wᵀf_i + b) ≥ ρ/2
支持向量取等号。在这个约束下找使 ρ 最大的 w、b,有现成数值方法(讲义提到 MATLAB 的 svmtrain)。每个尺度单独训一个分类器。
<span class="en">Constraint λ_i (wᵀf_i + b) ≥ ρ/2, with equality for support vectors. Solve numerically for w, b maximizing ρ; one classifier per scale.</span>

判别:d = wᵀf + b。
- d ≥ ρ/2:脸
- 0 < d < ρ/2:可能是脸
- −ρ/2 < d < 0:可能不是脸
- d ≤ −ρ/2:不是脸
<span class="en">Classify by d = wᵀf + b against ±ρ/2, with "probably" zones inside the margin.</span>

小例子:2D 特征,w = (1, 1),b = −3,ρ/2 = 1。
f = (3, 2):d = 3 + 2 − 3 = 2 ≥ 1,脸。
f = (2, 1.5):d = 0.5,可能是脸。
f = (1, 1):d = −1 ≤ −1,不是脸。
每个窗口只要一次点积,比最近邻快得多。
<span class="en">With w = (1, 1), b = −3: d = 2 (face), 0.5 (probably face), −1 (not face). One dot product per window.</span>

结果和局限:对电影片段跑检测,每张脸周围会冒出好几个框,因为相邻像素和相邻尺度都被判成脸。可以用非极大值抑制合并成一个。侧脸可以靠多训几个分类器,每个负责一小段角度。
<span class="en">Each face gets several overlapping boxes from nearby positions and scales; merge them with non-maximum suppression. Handle non-frontal faces with extra classifiers per pose range.</span>

### 8.11.x 面试怎么问 · Likely questions

**Q: What is an integral image and why does it make Haar features fast?**
积分图是什么?为什么能让 Haar 特征变快?
> An integral image stores at each pixel the sum of all pixels above and to the left, inclusive. It is built in one raster pass with II at A equal to II at B plus II at C minus II at D plus the pixel value. After that, the sum over any rectangle takes four lookups and three additions, no matter how large the rectangle is. A two-rectangle Haar feature then costs seven additions instead of N times M minus one.

这段在说什么:积分图一次扫描建好,任意矩形求和三次加减,Haar 特征的成本和尺寸无关。
<span class="en">One pass to build, constant-time rectangle sums, size-independent Haar cost.</span>

和 Byte Veda 的联系:积分图(summed-area table)是实时系统常用的技巧,任何「大量窗口求均值或求和」的场景都能用,比如无人机上做快速局部亮度归一化或盒式滤波。

**Q: Why use an SVM instead of nearest neighbor here?**
这里为什么用 SVM 不用最近邻?
> Nearest neighbor needs a large training set to avoid false positives, like a cat face whose nearest neighbor is a human face, but a large set makes every query slow, and we have millions of windows. An SVM precomputes a linear boundary, so classifying a window is a single dot product plus a bias. It also picks the boundary with the maximum margin, which generalizes better, and the boundary depends only on the support vectors.

这段在说什么:最近邻准了就慢;SVM 一次点积判完,最大间隔泛化更好。
<span class="en">NN trades speed for accuracy; SVM is one dot product with a max-margin boundary.</span>

**Q: What are support vectors and what is the margin?**
支持向量和间隔是什么?
> The margin is how far the decision boundary can be widened on both sides before it touches a training point. The SVM chooses w and b to maximize it, subject to lambda i times w transpose f i plus b being at least rho over two. The training points that sit exactly on the edge of that safe zone are the support vectors. Removing any other point does not change the classifier.

这段在说什么:间隔是安全区宽度,支持向量是贴边的点,只有它们决定分界面。
<span class="en">Margin is the safe-zone width; support vectors sit on its edge and alone define the boundary.</span>

**Q: Your detector fires several boxes on each face. How do you fix it?**
一张脸上出好几个框怎么办?
> Neighboring positions and neighboring scales all produce features that land on the face side, so detections cluster. I would apply non-maximum suppression: keep the window with the strongest score, the largest d, and suppress overlapping windows around it. This is the same idea as non-maximum suppression in corner detection.

这段在说什么:相邻位置和尺度都会被判中,用非极大值抑制只留分数最高的框。
<span class="en">Use non-maximum suppression keeping the highest-scoring window.</span>

## 8.12 辐射度量与反射 · Radiometry and Reflectance

这一讲解决的问题:图上一个像素的亮度,到底在告诉我们场景里那个点的什么信息。像素亮度同时取决于光照、表面朝向、材质三样东西,一个测量值对多个未知数,问题严重欠约束。所以先把「光有多亮、面被照得多亮、面看起来多亮」三个量定义清楚,再看材质怎么把入射光变成出射光。
<span class="en">What does one pixel's brightness say about the scene point? Intensity depends on illumination, surface orientation and reflectance, so the problem is under-constrained. We first define radiometric quantities, then model reflectance.</span>

### 8.12.1 立体角和三个辐射量 · Solid angle and radiometric quantities

比方:手电筒有多亮(光源),桌面被照得多亮(照度),你看桌面觉得多亮(辐亮度),是三件不同的事。
<span class="en">Analogy: how bright the flashlight is, how strongly the desk is lit, and how bright the desk looks are three different things.</span>

立体角是 2D 角度在 3D 的推广。面元 dA 离点 P 距离 r,倾斜 θ,先算它被「压扁」后的面积(透视缩短面积)dA' = dA cosθ,再除以 r²:
dω = dA cosθ / r²,单位是球面度 sr。半球是 2π sr,整个球是 4π sr。
<span class="en">Solid angle dω = dA cosθ / r², in steradians. A hemisphere is 2π, a sphere 4π.</span>

小例子:dA = 0.01 m²,正对着(θ = 0),r = 1 m,dω = 0.01 sr。挪到 r = 2 m,dω = 0.0025 sr,变成四分之一。
<span class="en">0.01 m² at 1 m head-on subtends 0.01 sr; at 2 m it is a quarter of that.</span>

四个量:
- 光通量 Φ:一个立体角内发出的功率,单位 W。
- 辐射强度 J = dΦ/dω:光源每单位立体角发出多少,单位 W/sr。这是点光源的「亮度」。
- 辐照度 E = dΦ/dA:每单位面积接收多少,单位 W/m²。这是表面「被照得多亮」。
- 辐亮度 L = d²Φ / (dA cosθ_r · dω):每单位透视缩短面积、每单位立体角发出多少,单位 W m⁻² sr⁻¹。这是表面「看起来多亮」。
<span class="en">Flux Φ (W), radiant intensity J (W/sr), irradiance E (W/m²), radiance L (W m⁻² sr⁻¹).</span>

由定义推出点光源照在面上:E = J cosθ / r²。照度和光源强度成正比,和距离平方成反比(1/r² 衰减),还和 cosθ 成正比:光从正上方来最亮,掠射(90°)时为 0。
<span class="en">From a point source, E = J cosθ / r²: inverse-square fall-off and a cosine factor.</span>

小例子:J = 100 W/sr,r = 2 m,θ = 60°。E = 100 × 0.5 / 4 = 12.5 W/m²。距离拉到 4 m,E = 100 × 0.5 / 16 = 3.125 W/m²,正好四分之一。
<span class="en">J = 100, r = 2, θ = 60° gives 12.5 W/m²; doubling r gives 3.125.</span>

辐亮度为什么要除两样东西:传感器往后退,它对每个点张的立体角变小,收到的光变少;面元变大,收到的光变多。为了定义一个只和表面本身有关的亮度,要同时按面积和立体角归一化。L 还和观察方向有关,也和材质有关。
<span class="en">Radiance normalizes by both foreshortened area and solid angle, so it describes the surface itself; it still depends on viewing direction and material.</span>

### 8.12.2 场景辐亮度和图像辐照度 · Scene radiance and image irradiance

比方:相机像一个漏斗,把场景某一小块发出的光全部收进来,倒在一个像素上。
<span class="en">Analogy: the lens funnels all light from a scene patch onto one pixel.</span>

设镜头到像面距离 f(有效焦距),镜头直径 d,场景面元 dA_s 在深度 z,偏离光轴角度 α,法线与视线夹角 θ,像素面积 dA_i。四个方程:
(1) 面元和像素对镜头中心张同一个立体角:dA_s / dA_i = (cosα / cosθ)(z / f)²
(2) 镜头对面元张的立体角:dω_L = (π d² / 4) · cosα / (z / cosα)²
(3) 镜头收到的通量:d²Φ = L · dA_s cosθ · dω_L
(4) 这些通量全落到像素上:dΦ = E · dA_i
联立得到:
E = L · (π / 4) · (d / f)² · cos⁴α
<span class="en">Combining equal solid angles, the lens solid angle, the radiance definition and energy conservation gives E = L (π/4)(d/f)² cos⁴α.</span>

![四个方程联立出图像辐照度公式](img/f13868a4fb0.jpg)

三个结论:
- 像素亮度和场景辐亮度成正比。场景亮一倍,像素亮一倍。
- d/f 是有效 F 数的倒数。F 数 N = f/d,E ∝ 1/N²。
- 画面边缘按 cos⁴α 变暗。视场小时影响小;复合镜头会专门设计来减小这个衰减。
<span class="en">E is proportional to L, scales with 1/N², and falls off as cos⁴α toward the image edge.</span>

小例子:光圈从 f/4 开到 f/2,N 减半,E 变 4 倍。偏离光轴 α = 30°,cos30° ≈ 0.866,四次方约 0.5625,边上只有中心亮度的 56%。α = 20° 时 cos⁴ ≈ 0.78。
<span class="en">f/4 to f/2 gives 4× irradiance. At α = 30°, cos⁴α ≈ 0.56.</span>

一个反直觉的事实:像素亮度和深度 z 无关,公式里根本没有 z。原因是两个效应互相抵消:相机离远了,一个像素看到的场景面积按 z² 变大;但场景每个点对镜头张的立体角按 1/z² 变小,每个点送进来的光变少。
<span class="en">Image brightness does not depend on depth. A pixel sees a larger area (∝ z²) but receives less light from each point (∝ 1/z²); the two cancel.</span>

![离远了:看到的面积变大,每点送进镜头的光变少,两者抵消](img/fb7815167d7.jpg)

### 8.12.3 BRDF:材质的完整描述 · The BRDF

比方:BRDF 是一张查表:「光从这个方向来,从那个方向看,能看到多少」。
<span class="en">Analogy: the BRDF is a lookup table: light from here, viewed from there, how much comes back.</span>

方向用天顶角 θ 和方位角 φ 表示。入射方向 (θ_i, φ_i),观察方向 (θ_r, φ_r)。
f(θ_i, φ_i, θ_r, φ_r) = L(θ_r, φ_r) / E(θ_i, φ_i),单位 1/sr。
它是四维函数,完整描述一个点的反射性质。远处同样的光照、同样的视角下,几个球看起来不一样,唯一原因就是 BRDF 不同。
<span class="en">BRDF = radiance out / irradiance in, a 4D function with unit 1/sr. It fully describes reflectance.</span>

性质:
- 非负:f ≥ 0。
- Helmholtz 互易性:光源和相机对调,f 不变。来自能量守恒。
- 各向同性材质:绕法线转表面,外观不变,BRDF 降成三维 f(θ_i, θ_r, φ_r − φ_i)。拉丝金属、砂纸打磨过的表面、蝴蝶翅膀、孔雀羽毛是各向异性的,仍是四维。
<span class="en">Non-negative, reciprocal (swap source and camera), and 3D for isotropic surfaces. Brushed metal and butterfly wings are anisotropic.</span>

两种反射机制:表面反射(在界面上反射,即镜面反射,看起来有光泽,如镜子、玻璃);体反射(光进到材料内部,被颗粒多次折射反射后从各个方向出来,即漫反射,看起来哑光,如陶土、纸)。像素亮度 = 体反射 + 表面反射。木地板、喷漆罐两者都有,叫混合反射。
<span class="en">Surface (specular) reflection at the interface gives gloss; body (diffuse) reflection from inside gives a matte look. Intensity is their sum.</span>

### 8.12.4 朗伯模型和理想镜面 · Lambertian and ideal specular models

朗伯模型(体反射):从任何方向看都一样亮。BRDF 是常数:
f = ρ_d / π,ρ_d 是反照率(albedo),0 是全黑,1 是全白。
代入照度:L = (ρ_d / π) · (J / r²) · (n · s),n 是法线,s 是光源方向。
<span class="en">Lambertian: constant BRDF ρ_d/π, so L = (ρ_d/π)(J/r²)(n·s), independent of view direction.</span>

![朗伯面:光源越斜,各方向一起变暗,但始终各向相同](img/fd3c1fce4e4.jpg)

小例子:ρ_d = 0.6,J = 100 W/sr,r = 2 m,光源与法线成 60°(n · s = 0.5)。L = (0.6 / 3.1416) × (100 / 4) × 0.5 ≈ 0.191 × 12.5 ≈ 2.39 W m⁻² sr⁻¹。光源转到正上方,n · s = 1,L 翻倍约 4.77。
<span class="en">ρ_d = 0.6, J = 100, r = 2, n·s = 0.5 gives L ≈ 2.39; overhead light doubles it.</span>

理想镜面(表面反射):入射光全部反射到一个方向 r,r 是 s 关于 n 的对称方向,反射角等于入射角。只有视线 v = r 时才看得到光。BRDF 是两个 δ 函数之积:
f = δ(θ_i − θ_r) δ(φ_i + π − φ_r) / (cosθ_i sinθ_i)
第一个 δ 保证天顶角相等,第二个保证方位角相对,分母保证能量守恒。
<span class="en">Ideal mirror: all light goes to the specular direction; the BRDF is a product of deltas normalized by cosθ_i sinθ_i.</span>

在球上的样子:朗伯球最亮的点是法线正对光源的点 p,等亮线对应入射角相同的点。镜面球只在一个点 q 亮,q 的法线是 v 和 s 的角平分线。
<span class="en">A Lambertian sphere is brightest where the normal faces the light; a mirror sphere lights up only at q, whose normal bisects v and s.</span>

### 8.12.5 粗糙表面 · Rough surfaces

比方:远看平整的墙,放大是一堆朝向各异的小镜子或小哑光片。
<span class="en">Analogy: a smooth-looking wall is, up close, many tiny tilted facets.</span>

微面元模型:表面平均法线 n,每个小面元有自己的倾角 α,α 服从高斯分布 p(α, σ) = (1 / (σ√(2π))) e^(−α² / 2σ²)。σ 就是粗糙度,σ = 0 是完全平整。
<span class="en">Microfacet model: facet tilt α is Gaussian with standard deviation σ, the roughness.</span>

Torrance-Sparrow(每个面元是镜子):f = ρ_s / ((n · s)(n · v)) · p(α, σ) · G(s, n, v)。G 是几何衰减,考虑面元之间互相遮挡视线(masking)和投影子(shadowing)。σ = 0 时退化成理想镜面。σ 越大,高光从一个点扩成越来越宽的光斑;很粗糙时最亮点会偏离 q,落在 q 和 p 之间。
<span class="en">Torrance-Sparrow: mirror facets with masking/shadowing term G. σ = 0 is a perfect mirror; larger σ spreads the highlight, and its peak drifts off q.</span>

![粗糙度变大,镜面高光从一个点扩成光斑](img/fedc194e15a.jpg)

Oren-Nayar(每个面元是朗伯):f = (ρ_d / π)(A + B · max(0, cos(φ_r − φ_i)) · sinα · tanβ),其中 A = 1 − σ² / (2(σ² + 0.33)),B = 0.45σ² / (σ² + 0.09),α = max(θ_i, θ_r),β = min(θ_i, θ_r)。σ = 0 时 A = 1,B = 0,退化成朗伯。适合石膏、陶土、砖。
<span class="en">Oren-Nayar: Lambertian facets; reduces to Lambert at σ = 0. Fits plaster, clay and brick.</span>

小例子:σ = 0.3,σ² = 0.09。A = 1 − 0.09 / 0.84 ≈ 0.893,B = 0.0405 / 0.18 = 0.225。
<span class="en">σ = 0.3 gives A ≈ 0.893, B = 0.225.</span>

效果:σ 越大,球看起来越「平」,尤其光源和相机同方向时。满月看起来像一个平的圆盘而不是有明暗的球,一种解释就是月面很粗糙。
<span class="en">Rougher Lambertian spheres look flatter; this is the proposed reason the full moon looks like a flat disc.</span>

### 8.12.6 双色反射模型 · The dichromatic model

颜色规律:表面反射的颜色 = 光源颜色。体反射的颜色 ≈ 物体颜色 × 光源颜色(材料吸收了部分波长)。
<span class="en">Surface reflection keeps the illuminant color; body reflection is roughly object color times illuminant color.</span>

所以像素颜色是两个颜色向量的线性组合:
[R, G, B]ᵀ = m_b · c_b + m_s · c_s
c_b 是体反射颜色,c_s 是表面反射颜色,m_b、m_s 是各自的强度。同一种材质的物体,所有像素颜色都落在 c_b 和 c_s 张成的平面上,叫双色平面。
<span class="en">Pixel color = m_b c_b + m_s c_s; all pixels of one material lie on the dichromatic plane.</span>

![像素颜色是体反射色和表面反射色的线性组合](img/f9873863547.jpg)

小例子:c_b = (0.8, 0.2, 0.1)(偏红),c_s = (0.3, 0.3, 0.9)(偏蓝的光),m_b = 0.5,m_s = 0.4。像素 = (0.4 + 0.12, 0.1 + 0.12, 0.05 + 0.36) = (0.52, 0.22, 0.41)。只要知道 c_b 和 c_s,就能反解出 m_b = 0.5、m_s = 0.4。
<span class="en">With known c_b and c_s, each pixel can be decomposed back into m_b and m_s.</span>

把物体所有像素画进 RGB 空间,分布像一个歪的 T:一条边是体反射方向,另一条是表面反射方向,顶端还有通道饱和造成的截断。从两条边估出 c_b 和 c_s,就能把每个像素拆开,得到一张只有体反射的图和一张只有高光的图。高光会随光源移动、浮在物体上,对视觉算法是干扰;体反射给出真实的明暗,后面可以用来恢复 3D 形状。
<span class="en">Pixels form a skewed T in RGB space. Estimating the two edges lets us split the image into body and specular layers; the body layer gives true shading for shape recovery.</span>

### 8.12.x 面试怎么问 · Likely questions

**Q: Does an object get darker in the image as it moves away from the camera?**
物体离相机越远,图上会越暗吗?
> No, not for an extended surface. Image irradiance is L times pi over four times d over f squared times cos to the fourth alpha, and depth does not appear. Moving away, each pixel sees an area that grows with z squared, but each scene point sends light into a lens solid angle that shrinks with one over z squared, so the two cancel. What does change brightness is the scene radiance, the aperture through the F-number, and the cos to the fourth fall-off toward the image edge.

这段在说什么:像素亮度和深度无关,面积变大和立体角变小抵消;真正影响亮度的是辐亮度、光圈和 cos⁴α。
<span class="en">Brightness is depth-independent; radiance, aperture and cos⁴α matter.</span>

和 Byte Veda 的联系:无人机远近飞过同一面墙,墙的灰度应该基本不变,这是光度一致性(photometric consistency)假设的物理依据。画面边缘的 cos⁴ 暗角要先做标定校正,否则会干扰特征匹配和稠密重建。

**Q: What is a BRDF and what properties does it have?**
BRDF 是什么?有什么性质?
> The BRDF is the ratio of outgoing radiance in a viewing direction to incoming irradiance from a lighting direction. It is a four-dimensional function of two zenith and two azimuth angles, with units of one over steradian. It is non-negative and satisfies Helmholtz reciprocity, so swapping the light and the camera gives the same value. For isotropic materials it drops to three dimensions, because only the azimuth difference matters.

这段在说什么:出射辐亮度比入射辐照度,四维,非负,互易,各向同性时降为三维。
<span class="en">Ratio of radiance to irradiance; 4D, non-negative, reciprocal, 3D if isotropic.</span>

**Q: Lambertian vs specular. Why do most vision algorithms assume Lambertian surfaces?**
朗伯和镜面的区别?为什么很多视觉算法假设朗伯?
> A Lambertian surface has a constant BRDF of albedo over pi, so it looks equally bright from every direction and its radiance depends only on n dot s. That makes a point look the same in every camera view, which is what stereo matching, optical flow and multi-view reconstruction rely on. A specular surface reflects into a single direction, so highlights move when the camera moves and break correspondence. In practice I would detect or remove highlights, for example with the dichromatic model, before matching.

这段在说什么:朗伯面各视角一样亮,满足多视图匹配的前提;镜面高光随视角移动,会破坏对应关系,要先处理。
<span class="en">Lambertian looks the same from all views, enabling correspondence; specular highlights move and must be handled.</span>

和 Byte Veda 的联系:无人机拍玻璃幕墙、金属屋顶、水面时,镜面反射会让 SfM 和稠密重建出错,这类区域需要掩膜或做高光分离。

**Q: How can you separate specular highlights from a color image?**
怎么从彩色图里把高光分离出来?
> Under the dichromatic model, each pixel color is a linear combination of the body reflection color and the illuminant color. For a uniform material the pixels form a skewed T in RGB space, one arm along the body color and one along the illuminant color. I estimate those two vectors from the arms, then project each pixel onto them to get the body and specular coefficients, which gives a diffuse image and a highlight image.

这段在说什么:像素颜色是体反射色和光源色的线性组合,估出两个方向后逐像素分解。
<span class="en">Estimate the two color vectors from the skewed T and decompose each pixel.</span>

## 8.13 光度立体 · Photometric Stereo

这一讲解决的问题:相机不动,只换灯的方向拍几张照片,能不能算出物体每个点的朝向(法向量),再拼出 3D 形状。一张图不够,因为一个亮度对应无穷多种朝向;多盏灯就能把答案锁死。
<span class="en">Keep the camera fixed, switch among several known light directions, and recover the surface normal at every pixel. One image is ambiguous; multiple lights make the normal unique, and integrating normals gives 3D shape.</span>

### 8.13.1 梯度空间和反射图 · Gradient space and reflectance map

比方:反射图就是一张「朝向 → 亮度」的查询表。你告诉它面朝哪边,它告诉你会有多亮。
<span class="en">Analogy: the reflectance map is a lookup table from orientation to brightness.</span>

表面写成 z = f(x, y)。梯度 (p, q) 定义为 p = −∂z/∂x,q = −∂z/∂y。法向量 N = (p, q, 1),单位法向量 n = (p, q, 1) / √(p² + q² + 1)。所以法向量只要两个数 (p, q) 就能表示。
<span class="en">With p = −∂z/∂x and q = −∂z/∂y, the normal is N = (p, q, 1). Two numbers describe any orientation.</span>

几何上,在 z = 1 处放一块平面,叫梯度空间(pq 平面)。把法向量延长,和这块平面的交点就是 (p, q)。上半球每个方向对应平面上唯一一个点。光源方向也能这样写成 (pₛ, qₛ)。
<span class="en">Extend the normal until it hits the plane z = 1; the hit point is (p, q). Light directions are written the same way as (pₛ, qₛ).</span>

Lambertian 表面(漫反射,从哪个角度看都一样亮)的亮度只和入射角 θᵢ 有关。把相机增益、光源强度、反照率(albedo,表面有多白)合成常数并归一化后,得到 I = cos θᵢ = n · s。代入梯度写法:
R(p, q) = (p pₛ + q qₛ + 1) / ( √(p² + q² + 1) · √(pₛ² + qₛ² + 1) )
<span class="en">For a Lambertian surface, after normalizing constants, I = cos θᵢ = n · s, which gives the reflectance map R(p, q) above.</span>

![反射图上的等亮度线,最亮点就是光源方向](img/fef11701abd.jpg)

小例子:光源在正上方,(pₛ, qₛ) = (0, 0),此时 R = 1 / √(p² + q² + 1)。法向量 (p, q) = (0.75, 0):√(1 + 0.5625) = 1.25,R = 1 / 1.25 = 0.8。但所有满足 p² + q² = 0.5625 的点都给出 0.8,也就是半径 0.75 的一整个圆。
<span class="en">Overhead light: R = 1/√(p² + q² + 1). (0.75, 0) gives 0.8, but so does every point on the circle of radius 0.75.</span>

这个圆就是等亮度线。一般情况下,和光源成同一夹角的法向量构成一个圆锥,圆锥和 pq 平面相交得到圆锥曲线(圆、椭圆、抛物线或双曲线)。亮度为 0 的线是直线 p pₛ + q qₛ + 1 = 0。
<span class="en">Normals at equal angle to the source form a cone; its intersection with the pq plane is a conic, the iso-brightness contour. Zero brightness is the line p pₛ + q qₛ + 1 = 0.</span>

结论:一个像素只给一个亮度,只能把法向量限制在一条曲线上。所以单张图恢复不出朝向。
<span class="en">One intensity only restricts the normal to a curve, so a single image cannot recover orientation.</span>

### 8.13.2 多盏灯锁定法向量 · Using multiple lights

比方:一个目击者只说「在离车站 1 公里的地方」,是一个圆;第二个人再给一个圆,剩两个交点;第三个人一说,位置就唯一了。
<span class="en">Analogy: like locating a point from three distance circles.</span>

Woodham 1980 年提出的做法:相机不动,依次开 K 盏方向已知的灯,拍 K 张图。每盏灯有自己的反射图 Rᵢ(p, q)。每个像素有 K 个亮度,对应 K 条等亮度线,它们的交点就是法向量。
<span class="en">Woodham (1980): fixed camera, K known lights turned on in sequence. Each gives a contour in its own reflectance map; their intersection is the normal.</span>

讲义的例子:第一盏灯测到 0.9,无穷多解;第二盏测到 0.7,两条曲线交出两个解;第三盏测到 0.4,只剩一个解。
<span class="en">Lecture example: 0.9 gives infinite solutions, adding 0.7 leaves two, adding 0.4 leaves one.</span>

![三条等亮度线交于唯一的一点](img/f0a6d99a967.jpg)

需要几盏灯取决于材质。Lambertian 三盏就够。带高光的、各向异性的要更多。最糟是完美镜面:每盏灯只照亮一个方向的法向量,理论上要无穷多盏灯。
<span class="en">Lambertian needs 3 lights; specular or anisotropic materials need more; a perfect mirror would need infinitely many.</span>

### 8.13.3 Lambertian 情况的线性解 · The Lambertian closed form

比方:三个方程三个未知数,直接解线性方程组。
<span class="en">Analogy: three equations, three unknowns, solve the linear system.</span>

把反照率 ρ 留作未知数:Iᵢ = (ρ/π) n · sᵢ。三盏灯写成矩阵:I = S N,其中 S 是 3×3 光源矩阵(每行一个 sᵢ),N = (ρ/π) n。解为 N = S⁻¹ I。然后 n = N / ‖N‖,ρ/π = ‖N‖。法向量和反照率一起出来,所以表面有花纹也没关系。
<span class="en">Iᵢ = (ρ/π) n · sᵢ, so I = S N with N = (ρ/π) n. Then N = S⁻¹ I, n = N/‖N‖ and albedo ρ/π = ‖N‖. Texture is handled automatically.</span>

小例子:s₁ = (0, 0, 1),s₂ = (0.6, 0, 0.8),s₃ = (0, 0.6, 0.8)。测到 I = (0.4, 0.428, 0.464)。
第 1 行:N_z = 0.4。
第 2 行:0.6 N_x + 0.8 × 0.4 = 0.428,所以 N_x = 0.108 / 0.6 = 0.18。
第 3 行:0.6 N_y + 0.32 = 0.464,所以 N_y = 0.144 / 0.6 = 0.24。
‖N‖ = √(0.0324 + 0.0576 + 0.16) = √0.25 = 0.5。于是 n = (0.36, 0.48, 0.8),反照率项 ρ/π = 0.5。对应梯度 p = 0.36/0.8 = 0.45,q = 0.48/0.8 = 0.6。
<span class="en">Worked example: N = (0.18, 0.24, 0.4), ‖N‖ = 0.5, so n = (0.36, 0.48, 0.8) and ρ/π = 0.5.</span>

什么时候失效:S 不可逆。三盏灯和表面点共面时,一个光源方向是另外两个的线性组合,S 奇异。讲义举了户外的例子:春分秋分时太阳沿赤道面走,任何地点都在这个平面上,用太阳做光度立体就解不出来。
<span class="en">It fails when S is singular, i.e. the light directions are coplanar with the point. Outdoors at the equinox the sun moves in one plane, so solar photometric stereo breaks.</span>

灯多于 3 盏(K > 3)时,S 是 K×3,不能求逆。用最小二乘:N = (SᵀS)⁻¹ Sᵀ I(伪逆)。多余的灯还能保证:就算某个点被自身遮挡、几盏灯照不到,也至少剩 3 个非零亮度。
<span class="en">With K > 3 lights, use least squares N = (SᵀS)⁻¹SᵀI. Extra lights also guarantee at least three unshadowed readings per point.</span>

一个顺带的结论:Lambertian 表面同时开几盏灯,等价于一盏「等效光源」,方向和强度就是各灯向量 kᵢ sᵢ 的和。例如 s₁ = (0.6, 0, 0.8) 和 s₂ = (−0.6, 0, 0.8) 各强度 1,和为 (0, 0, 1.6),等于正上方一盏强度 1.6 的灯。面光源也能这样看。
<span class="en">For Lambertian surfaces, several simultaneous lights equal one effective source equal to the vector sum Σ kᵢ sᵢ.</span>

### 8.13.4 标定法:不知道 BRDF 怎么办 · Calibration-based photometric stereo

比方:不会写这种油漆的反光公式,那就刷一个同样油漆的球,拍下来当字典查。
<span class="en">Analogy: if you cannot write the paint's reflectance formula, paint a sphere with it and use it as a dictionary.</span>

BRDF(双向反射分布函数,描述表面把一个方向的光反射到另一个方向的能力)常常写不出解析式。解法:做一个已知形状(球)、材质相同的标定物体。依据「朝向一致性」:同一材质、同一光照下,法向量相同的点亮度相同。
<span class="en">When the BRDF has no simple model, use a calibration sphere of the same material. Orientation consistency: same normal, same lighting, same brightness.</span>

步骤:用同样 K 盏灯拍球 K 张图;球的轮廓已知,每个像素的法向量能直接算出;建一张查找表,键是 K 元组 (I₁, …, I_K),值是 (p, q)。再拍目标物体,每个像素拿自己的 K 元组去查表。
<span class="en">Capture K images of the sphere, compute its normals from its known geometry, build a table (I₁…I_K) → (p, q), then look up each pixel of the target.</span>

![标定球和目标瓶子用同一种喷漆](img/f747c880f66.jpg)

代价:每种材质要一个标定球。讲义里多种油漆的鱼玩具用了 14 盏灯,每种漆一个球,靠颜色决定每个点查哪张表。好处是不需要任何反射模型,对塑料、喷漆零件很实用。
<span class="en">Cost: one calibration object per material. The multi-paint fish toy used 14 lights and picked the table by pixel color.</span>

### 8.13.5 从法向量到深度 · Shape from normals

比方:知道每一步路的坡度,从起点一步步累加就能画出整条山路的高度。
<span class="en">Analogy: knowing the slope of every step, sum them up to get the height profile.</span>

由 p = −∂z/∂x、q = −∂z/∂y,深度要靠积分:z(x, y) = z(x₀, y₀) + ∫ (−p dx − q dy),参考点深度设为 0。前提是表面连续。遇到深度跳变,两侧法向量都知道,但跳了多少算不出来。
<span class="en">Integrate z = z₀ + ∫(−p dx − q dy) from a reference point set to 0. Requires continuity; depth jumps are unrecoverable.</span>

朴素算法:z(0,0) = 0;先沿第一列用 q 积分,再沿每一行用 p 积分。小例子(一行):p = −0.5, −0.5, 0.2,依次 z = 0 → 0.5 → 1.0 → 0.8。
<span class="en">Naive scan: integrate down the first column with q, then along each row with p. Example: z = 0, 0.5, 1.0, 0.8.</span>

问题:法向量有噪声,不同积分路径到同一点会得到不同深度。多路径取平均是土办法。更好的是最小二乘:找 z 使 D = ∬ [ (∂z/∂x + p)² + (∂z/∂y + q)² ] dx dy 最小。
<span class="en">Noisy normals make the result path-dependent. Better: least squares, minimizing D over the whole image.</span>

Frankot-Chellappa 在傅里叶域一步求解。设 Z、P、Q 是 z、p、q 的傅里叶变换,令 ∂D/∂Z = 0,得 Z̃(u, v) = (i u P(u, v) + i v Q(u, v)) / (u² + v²),再做逆傅里叶变换得到 z̃。每个频率独立算,两次 FFT 就完成,很快。
<span class="en">Frankot-Chellappa solves it in the Fourier domain: Z̃ = (iuP + ivQ)/(u² + v²), then inverse FFT. Two FFTs, very fast.</span>

![法向量图、深度图和渲染结果](img/fd516f7e34b.jpg)

还有一个系统性误差:互反射。凹面(比如碗)上的点除了被灯照,还被碗的其他部分照亮。结果是反照率被高估,形状被算浅。讲义给的修正是迭代:用当前形状估计互反射,从图里减掉,再做光度立体,直到收敛。
<span class="en">Interreflections in concave regions make albedo too high and shape too shallow. Fix: iteratively estimate and subtract interreflections, then re-solve.</span>

### 8.13.x 面试怎么问 · Likely questions

**Q: How does photometric stereo work, and why do you need at least three lights?**
光度立体怎么工作?为什么至少要三盏灯?
> I keep the camera fixed and capture images under several known light directions. For a Lambertian surface each intensity is albedo times n dot s, so with three lights I get a 3×3 linear system I = S N. Solving N = S⁻¹ I gives a vector whose direction is the normal and whose length is the albedo. One light only constrains the normal to a curve, two leave two candidates, and three make it unique.

这段在说什么:Lambertian 下每个亮度是一个线性方程,三个方程解出法向量和反照率,少于三个有歧义。
<span class="en">Each intensity is one linear equation; three give the normal and albedo uniquely.</span>

**Q: When does it fail in practice?**
实际中什么时候会失败?
> First, when the light directions are coplanar with the surface point, the source matrix is singular. Second, shadows and occlusion remove measurements, so I use more than three lights and least squares. Third, specular or non-Lambertian materials break the model; then I either use more lights or a calibration sphere of the same material as a lookup table. Finally, concave regions suffer from interreflections, which make the shape look shallower.

这段在说什么:灯共面、阴影、非 Lambertian 材质、互反射,四种失败和对应办法。
<span class="en">Coplanar lights, shadows, non-Lambertian BRDFs and interreflections, each with a fix.</span>

**Q: Given a normal map, how do you get a depth map?**
有了法向量图,怎么得到深度图?
> Normals give the gradients p and q, so depth is their integral. Naive path integration accumulates noise and depends on the path. I would solve a least-squares problem that finds the surface whose gradients best match the measured ones, for example with Frankot-Chellappa, which does it in closed form with two FFTs. It assumes a continuous surface, so depth discontinuities need separate handling.

这段在说什么:法向量是深度的导数,用最小二乘(傅里叶域)积分,比单路径积分抗噪。
<span class="en">Normals are depth derivatives; integrate with least squares in the Fourier domain.</span>

和 Byte Veda 的联系:光度立体只给相对形状,对绝对尺度和深度跳变无能为力,需要可控光照,所以户外无人机很少直接用。但它的细节精度高,可以和立体视觉或深度相机融合:深度相机给粗形状和尺度,法向量补细节。
<span class="en">For drones, photometric stereo needs controlled light and lacks absolute scale, but its fine normals can refine coarse depth from stereo or ToF.</span>

## 8.14 由明暗恢复形状 · Shape from Shading

这一讲解决的问题:只有一张图、一盏已知的灯、已知且均匀的材质,能不能从明暗变化恢复 3D 形状。这个问题严重欠约束,所以要先加假设(表面光滑、边界已知),再把假设写成能量函数去优化。
<span class="en">Recover 3D shape from a single shaded image with known lighting and uniform known reflectance. The problem is badly under-constrained, so we add smoothness and boundary assumptions and solve an energy minimization.</span>

### 8.14.1 为什么一张图不够 · Why one image is not enough

比方:只告诉你「这块墙亮度 0.8」,你知道它和灯成多少度,但不知道朝左偏还是朝上偏。
<span class="en">Analogy: brightness tells you the angle to the light, not which way the surface tilts.</span>

上一讲的反射图 R(p, q) 告诉我们:每个法向量对应一个亮度。反过来,一个亮度对应反射图上一整条等亮度线。每个像素有一个测量值,却有两个未知数(法向量的两个自由度)。N×N 的图有 N² 个已知数和 2N² 个未知数。
<span class="en">One intensity maps to a whole iso-brightness contour. An N×N image gives N² measurements for 2N² unknowns.</span>

光度立体靠多盏灯补约束。这一讲只有一张图,只能靠先验假设。
<span class="en">Photometric stereo adds lights; shape from shading must add priors instead.</span>

### 8.14.2 人眼也在用假设 · Human perception relies on assumptions

比方:人看一张月球照片,倒过来看,环形山就变成了小山包。图没变,变的是脑子里假设的灯的位置。
<span class="en">Analogy: flip a crater photo upside down and it becomes a mound, because the brain assumes light comes from above.</span>

Ramachandran 的实验揭示了几条人眼的默认假设:
1. 光从上方来。上亮下暗的圆被看成凸起,上暗下亮的被看成凹坑。
2. 全场只有一个光源方向。两排圆一起看时,一排看成凸,另一排必然被看成凹。
3. 边界决定解释。明暗相同的条带,换个轮廓就从「三根圆柱」变成「波纹板」。
4. 熟悉的形状优先。凹进去的人脸面具,我们仍然看成凸脸,宁可认为光从下面来。
<span class="en">Ramachandran's demos: light from above, one global light direction, boundaries shape the interpretation, and familiar shapes (the hollow mask) override the lighting prior.</span>

![左边看成凸起,右边看成凹坑,只因假设光从上来](img/f80f5da0d83.jpg)

启发:算法也要有类似的假设。讲义选了两条:表面光滑,遮挡边界上的法向量已知。
<span class="en">Lesson for algorithms: we also need priors. The lecture uses smoothness and known normals at occluding boundaries.</span>

### 8.14.3 换一种法向量表示:立体投影 · Stereographic projection (f, g)

比方:pq 空间像一张从头顶往下拍的地图,越靠近地平线的方向被拉得越远,地平线本身在无穷远。fg 空间换了个拍摄点,把整个半球塞进一个半径 2 的圆。
<span class="en">Analogy: pq space stretches near-horizontal normals to infinity; fg space squeezes the whole hemisphere into a disc of radius 2.</span>

pq 的问题:法向量和视线夹角 θ 接近 90° 时,p 或 q 趋于无穷。偏偏物体轮廓上的点 θ 就是 90°,数值上没法算。
<span class="en">In pq space, p or q blow up as θ approaches 90°, exactly at the object outline.</span>

立体投影:从 z = −1 这一点出发,连线穿过单位法向量的尖端,和 z = 1 平面的交点记为 (f, g)。由相似三角形:
f = 2p / (1 + √(1 + p² + q²)),g = 2q / (1 + √(1 + p² + q²))
<span class="en">Project from z = −1 through the tip of the unit normal onto the plane z = 1 to get (f, g), with the formulas above.</span>

![pq 空间和 fg 空间的对比](img/fd3acc5d474.jpg)

小例子:p = 0.75, q = 0 时,√(1 + 0.5625) = 1.25,f = 1.5 / 2.25 ≈ 0.667。p = 1 时,f = 2 / (1 + 1.414) ≈ 0.828。p → ∞ 时 f → 2。法向量 (1, 0, 0) 对应 (f, g) = (2, 0),(0, 1, 0) 对应 (0, 2)。所以可见半球的全部法向量都落在半径 2 的圆里,有界,好算。
<span class="en">p = 0.75 gives f ≈ 0.667, p = 1 gives f ≈ 0.828, and p → ∞ gives f → 2. All visible normals lie within radius 2.</span>

反射图也相应写成 Rₛ(f, g):给定光源和 BRDF,输入 (f, g),输出亮度。
<span class="en">The reflectance map becomes Rₛ(f, g).</span>

### 8.14.4 两个约束写成一个能量 · Constraints as an energy

比方:像拼图时同时满足两条规则。一是每块的颜色要和图样对上,二是相邻两块要接得顺。
<span class="en">Analogy: each piece must match the picture, and neighbors must fit smoothly.</span>

第一,遮挡边界。物体轮廓处表面弯过去背对相机,法向量 n 同时垂直于视线 v 和图像边缘方向 e。两者都已知,所以 n = e × v。这些边界法向量在整个求解过程中固定不动,当作边界条件。
<span class="en">At the occluding boundary, n ⊥ v and n ⊥ e, so n = e × v. These normals are fixed as boundary conditions.</span>

![遮挡边界上的法向量可以直接算出](img/f4eaff0f66c.jpg)

第二,图像亮度约束:每个像素的亮度应该等于反射图在该点法向量处的值。误差 e_r = ∬ (I(x, y) − Rₛ(f, g))² dx dy。
<span class="en">Image irradiance constraint: I(x, y) should equal Rₛ(f, g). Penalize e_r = ∬ (I − Rₛ)².</span>

第三,光滑约束:f、g 在空间上变化慢。误差 e_s = ∬ (f_x² + f_y² + g_x² + g_y²) dx dy,下标表示偏导。
<span class="en">Smoothness constraint: penalize e_s = ∬ (f_x² + f_y² + g_x² + g_y²).</span>

总能量 e = e_s + λ e_r。λ 大表示更相信亮度测量。迭代中可以逐步增大 λ,先求一个光滑的大致形状,再逐步贴近数据。
<span class="en">Total energy e = e_s + λ e_r. Larger λ trusts the data more; λ can be increased over iterations.</span>

### 8.14.5 Ikeuchi-Horn 迭代算法 · The numerical iterative solution

比方:每个像素先抄一下邻居的平均值,再按自己的亮度误差微调一下,反复做到不再变化。
<span class="en">Analogy: each pixel copies its neighbors' average, then nudges itself to fix its brightness error, repeated until stable.</span>

离散化:像素 (i, j) 的光滑误差用和右邻、下邻的差的平方表示,亮度误差是 (I_ij − Rₛ(f_ij, g_ij))²。总误差 e = Σ Σ (e_s,ij + λ e_r,ij)。每个 f_kl 只出现在 4 项里(自己那项两次,上邻和左邻各一次),所以对 f_kl 求导很简单。
<span class="en">Discretize with finite differences. Each f_kl appears in only four terms, so its derivative is local.</span>

令 ∂e/∂f_kl = 0 和 ∂e/∂g_kl = 0,整理成迭代式(n 是迭代次数):
f_kl⁽ⁿ⁺¹⁾ = f̄_kl⁽ⁿ⁾ + λ (I_kl − Rₛ(f_kl⁽ⁿ⁾, g_kl⁽ⁿ⁾)) · ∂Rₛ/∂f
g_kl⁽ⁿ⁺¹⁾ = ḡ_kl⁽ⁿ⁾ + λ (I_kl − Rₛ(f_kl⁽ⁿ⁾, g_kl⁽ⁿ⁾)) · ∂Rₛ/∂g
其中 f̄、ḡ 是上下左右四邻居的平均。初始化:边界用已知法向量,其余设为 (0, 0)。迭代到相邻两次变化小于阈值。
<span class="en">Update = neighbor average plus λ × brightness error × reflectance-map gradient. Boundary normals fixed, interior initialized to (0, 0).</span>

小例子:光源在正上方。由 fg 公式可以推出 n_z = (4 − f² − g²) / (4 + f² + g²),所以 Rₛ = (4 − f²)/(4 + f²)(取 g = 0)。设邻居平均 f̄ = 0.2,当前 f = 0.2,λ = 1,测得亮度 I = 0.9。
Rₛ(0.2) = 3.96 / 4.04 ≈ 0.980,误差 I − Rₛ ≈ −0.080。
∂Rₛ/∂f = −16f / (4 + f²)² = −3.2 / 16.32 ≈ −0.196。
更新:f = 0.2 + 1 × (−0.080) × (−0.196) ≈ 0.216。
像素比预测暗,算法就让这个面更倾斜一点,这正符合直觉。
<span class="en">Worked example: predicted 0.980 but measured 0.9, so the update tilts the surface from f = 0.2 to about 0.216, making it darker.</span>

得到所有像素的 (f, g) 后,换回 (p, q),再用上一讲的「由法向量求深度」(比如 Frankot-Chellappa)积分出深度图。
<span class="en">Convert (f, g) back to (p, q) and integrate to depth as in photometric stereo.</span>

![合成花瓶恢复得好,人像在眼睛鼻子处变差](img/f6623a7a62d.jpg)

局限:花瓶这种光滑物体效果好;人像在眼睛、鼻子处法向量变化剧烈,违背光滑假设,结果变差。真实图片需要处理反照率变化(眉毛、眼睛和皮肤反照率不同)。再先进的算法也只能处理漫反射物体,抛光金属这类高光表面不行。
<span class="en">Works on smooth objects, degrades where normals change fast. Real images need albedo handling, and specular surfaces remain out of reach.</span>

讲义最后还提到 Adelson 的棋盘阴影错觉:A、B 两格亮度相同,人却觉得 A 更暗。原因是人眼假设光照缓慢变化,先估计出阴影再「扣掉」它,感知到的是反射率而不是原始亮度。
<span class="en">Adelson's checker-shadow illusion: the brain discounts slowly varying illumination and perceives reflectance, not raw intensity.</span>

### 8.14.x 面试怎么问 · Likely questions

**Q: Why is shape from shading ill-posed, and how do classical methods make it solvable?**
为什么由明暗恢复形状是病态问题?经典方法怎么让它可解?
> Each pixel gives one intensity, but a surface normal has two degrees of freedom, so one intensity only constrains the normal to an iso-brightness curve. Classical methods add priors: the surface is smooth, and normals on the occluding boundary are known because they are perpendicular to both the viewing direction and the image edge. Then we minimize a smoothness term plus lambda times a brightness-error term, and solve it iteratively with the boundary normals fixed.

这段在说什么:一个亮度两个未知数,靠光滑先验和边界条件补上,写成能量迭代求解。
<span class="en">One measurement, two unknowns; smoothness plus boundary normals make it solvable.</span>

**Q: Why use the stereographic (f, g) parameterization instead of (p, q)?**
为什么用 (f, g) 而不用 (p, q)?
> In gradient space, p and q go to infinity as the normal approaches 90 degrees from the viewing direction. That happens exactly on the occluding boundary, which is where our known boundary conditions live. Stereographic projection maps the whole visible hemisphere into a disc of radius 2, so every normal, including boundary normals, has finite coordinates and the iteration stays numerically stable.

这段在说什么:pq 在轮廓处是无穷大,fg 把所有法向量压进半径 2 的圆,边界条件才能用。
<span class="en">fg keeps boundary normals finite, which the boundary conditions require.</span>

**Q: What assumptions does it make, and where would it break on real data?**
它做了哪些假设?真实数据上哪里会失败?
> It assumes a single distant known light, a known uniform BRDF, usually Lambertian, and a smooth surface. It breaks on sharp creases where normals change quickly, on texture or albedo changes that get misread as shape, on specular materials, and when the lighting is unknown or comes from many directions, like outdoors. That is why in practice we prefer methods with more constraints, such as stereo or active depth sensing.

这段在说什么:已知单光源、均匀漫反射、表面光滑;遇到折角、纹理、高光、未知光照就失败。
<span class="en">Known single light, uniform Lambertian, smooth surface; it fails on creases, texture, specularity and unknown lighting.</span>

和 Byte Veda 的联系:无人机户外拍摄时光照未知、材质不均,经典由明暗恢复形状很难直接用。但「明暗携带形状信息」这个思想仍然有用:单目深度网络其实也在隐式利用明暗线索,面试时可以把这一讲当作理解单目深度为什么能工作、又为什么会出错的理论基础。
<span class="en">For outdoor drones the classical method is impractical, but shading cues are what monocular depth networks implicitly exploit; this lecture explains why they work and when they fail.</span>
