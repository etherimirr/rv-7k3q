<script type="text/markdown" id="src"># 篇八 · FPCV 课程精华(Nayar,First Principles of Computer Vision)
> 押题 A(相机、几何、图像处理)的底子:成像、滤波、边缘、Hough、SIFT、标定、立体、光流、SfM、分割。先看 8.2、8.5–8.8、8.17–8.18、8.20

Columbia Shree Nayar 的 FPCV 网课(fpcv.cs.columbia.edu),按 24 本官方讲义逐讲整理:每讲的核心概念、课堂幻灯片截图、面试怎么问。
<span class="en">Notes on Shree Nayar's First Principles of Computer Vision: core ideas per lecture, slide screenshots, and likely interview questions.</span>

> 和 Byte Veda 最相关的几讲:8.8 边界检测与 Hough(初筛真题方向)、8.10 拼接与 RANSAC、8.16 结构光与 ToF、8.17 相机标定、8.18 双目与对极几何、8.19 光流、8.20 SfM。

> **导论 · Introduction**

## 8.1 计算机视觉导论 · Introduction to Computer Vision

这一讲解决的问题:计算机视觉到底在做什么,为什么难,为什么在深度学习时代还要学「第一性原理」。它也给出整门课的地图:成像、特征、单视角 3D、多视角 3D、感知五个模块。
<span class="en">What is computer vision, why is it hard, and why learn first principles in the deep learning era? The lecture also maps the course: imaging, features, single-view 3D, multi-view 3D, and perception.</span>

### 8.1.1 视觉系统由什么组成 · Elements of a vision system

比方:视觉系统像一个看完一桌菜后写菜单的人。光照亮桌子,眼睛(相机)拍下一张平面图,大脑(软件)写出「这里有面包、奶酪、两瓶酒」。
<span class="en">Analogy: a vision system is someone who looks at a table and writes the menu. Light hits the scene, a camera records a 2D image, and software writes a description.</span>

![视觉系统的基本组成:光照、3D 场景、相机、视觉软件、场景描述](img/f727c1ee5cd.jpg)

四个环节:光照(没有光就没有视觉)、三维场景(把一部分光反射给相机)、相机(把 3D 场景变成 2D 图像)、视觉软件(从图像得出对场景的符号化描述)。描述可以很粗,比如有哪些物体;也可以很细,比如面包新不新鲜。
<span class="en">Lighting, a 3D scene, a camera that forms a 2D image, and software that produces a symbolic scene description, coarse or fine.</span>

什么是计算机视觉,不同人有不同定义:
- David Marr:自动化人类的视觉过程。
- 也有人看作一种信息处理任务。
- Berthold Horn(《Robot Vision》作者):把成像过程反过来。
- 还有人说:图形学的逆问题。图形学是给定 3D 模型和光照,渲染出 2D 图;视觉是给定 2D 图,反推 3D 模型。
<span class="en">Definitions: automating human vision (Marr), information processing, inverting image formation (Horn), or inverse graphics.</span>

### 8.1.2 图像就是一堆数字 · An image is an array of numbers

比方:你一眼看出照片里是两个小男孩在玩水。计算机拿到的却是一张写满数字的表格,要从表格里读出同样的东西。
<span class="en">Analogy: you instantly see two boys playing with water; the computer gets a spreadsheet of numbers and must read the same story from it.</span>

![同一张照片在计算机眼里只是一个数字矩阵](img/f6e7541e278.jpg)

图像是像素(pixel,picture element 的缩写)组成的数组。通常每个像素记录对应场景点的亮度和颜色。讲义强调像素可以更丰富:还可以记录距离(深度),将来甚至能记录材质是塑料、金属还是木头。
<span class="en">An image is an array of pixels, usually storing brightness and color, but pixels can also store depth and, in the future, material.</span>

小例子:一张 640 × 480 的灰度图有 640 × 480 = 307,200 个数,每个数是 0 到 255 的整数。彩色图每个像素有 R、G、B 三个数,就是 921,600 个数。我们要从这些数里推出「有几个人、在干什么、离多远」。
<span class="en">A 640×480 gray image is 307,200 numbers; in color, 921,600. From these we must infer people, actions and distances.</span>

这就是视觉难的地方。讲义总结 50 年研究的经验:视觉是难题;它是多学科的,涉及光学、电子工程、材料、计算机、神经科学、心理学;但已经有很多成功应用。
<span class="en">Fifty years of research teach that vision is hard and multidisciplinary, yet many applications already work.</span>

### 8.1.3 为什么 2D 到 3D 天生有歧义 · Why going from 2D to 3D is ambiguous

比方:手电筒照出的一个影子,可能是近处的小东西,也可能是远处的大东西。只看影子分不出来。
<span class="en">Analogy: a shadow could come from a small object nearby or a large one far away; the shadow alone cannot tell.</span>

成像把 3D 投到 2D,一整条射线上的点都落到同一个像素上。下一讲的透视投影公式是 x = f·X/Z。小例子:取 f = 1,点 (1, 1, 2) 投到 (0.5, 0.5);点 (2, 2, 4) 也投到 (0.5, 0.5)。大小加倍、距离加倍,图上完全一样。所以「从图像反推 3D」是欠定问题,一定要靠额外信息:第二个视角、运动、光照模型,或者对世界的先验假设。
<span class="en">Projection collapses each ray to one pixel: with f = 1, (1,1,2) and (2,2,4) both map to (0.5, 0.5). Recovering 3D is under-constrained and needs extra cues or priors.</span>

![立方体堆:盯着一个顶点看,它可以是凸的也可以是凹的](img/f4aae9d3ce9.jpg)

人脑也逃不开这个歧义。讲义里的立方体堆,盯着一个顶点,会在「凸出来」和「凹进去」两种解释之间来回翻。把一张「大土丘中间有小坑」的照片倒过来,会看成「大坑中间有小土丘」,因为我们默认光从上面来。
<span class="en">Humans face the same ambiguity: the cube stack flips between convex and concave, and an upside-down mound looks like a crater because we assume light comes from above.</span>

### 8.1.4 人眼不是好的模仿对象 · Human vision is the wrong thing to copy

比方:人眼像一位经验丰富但不带尺子的老师傅,看得快、适应性强,但量不准,而且错了也不知道。
<span class="en">Analogy: human vision is a seasoned craftsman without a ruler: fast and adaptable, but imprecise and unaware of its own mistakes.</span>

人脑大约 60% 以某种方式参与视觉处理。信号从视网膜经视神经到外侧膝状体,再到视觉皮层,不同区域分别处理形状、颜色、运动。但我们远没有它的「电路图」,所以没法照抄,只能重新发明。
<span class="en">About 60% of the brain is involved in vision, but we lack its circuit diagram, so we reinvent rather than copy.</span>

而且照抄也不划算。人眼偏定性不偏定量:问你一支笔多少毫米,只能粗估。工厂自动化、医学影像、自动驾驶都要精确测量。
<span class="en">Human vision is qualitative; factory automation, medical imaging and driving need precise measurement.</span>

人眼还会出错,而且没有提示。讲义的例子:Fraser 螺旋其实是一组同心圆;Adelson 棋盘阴影里 A、B 两块灰度完全一样,但我们觉得 A 更暗,因为大脑先估计了光照再做补偿;Kanizsa 三角形里根本没有三角形,只有三个对齐的缺口圆盘。最后这个说明「看到」和「感知」是两回事。
<span class="en">Illusions show human vision fails silently: Fraser's spiral is concentric circles; Adelson's checker squares A and B are identical in brightness; the Kanizsa triangle does not exist. Seeing is not perceiving.</span>

![Adelson 棋盘阴影:A 和 B 实际亮度相同](img/f7a441fa027.jpg)

还有强迫透视(forced perspective):房间其实不是长方体,越往里天花板越高。站在两头的两个人身高几乎一样,看起来却一高一矮。大脑默认房间是方的,于是把距离差错算成了身高差。
<span class="en">Forced perspective: a tapered room makes two people of nearly equal height look very different, because the brain assumes the room is a box.</span>

为什么这对工程有用:棋盘阴影其实说明了大脑在做「光照补偿」,把反射率和光照分开。这正是后面辐射度学、光度立体要用数学做的事。
<span class="en">The checker illusion reveals the brain separating reflectance from illumination, which later lectures on radiometry and photometric stereo do explicitly.</span>

### 8.1.5 深度学习时代为什么还学第一性原理 · Why first principles still matter

比方:能用一条公式写清楚的物理现象,不必花一百万张图去让网络「猜」出来。
<span class="en">Analogy: if physics gives you the formula, you do not need a million images for a network to guess it.</span>

讲义给了四个理由:
1. 能用第一性原理精确简洁描述的现象,再去训练网络学它既费力又没必要。
2. 网络效果不好时,第一性原理是你理解原因的唯一希望。
3. 复杂映射需要海量训练数据,收集起来很难甚至不可能。这时可以用基于物理的模型合成训练数据。
4. 好奇心:想知道东西为什么这样工作。
<span class="en">Four reasons: don't learn what physics already states; first principles explain failures; physics-based models can synthesize training data; and curiosity.</span>

课程地图:模块 1 成像(成像、传感、二值图、图像处理);模块 2 特征与边界(边缘、边界、SIFT、拼接、人脸检测);模块 3 单视角 3D(光度立体、明暗恢复形状、对焦/离焦测深、主动照明);模块 4 多视角 3D(双目立体、光流、运动恢复结构);模块 5 感知(跟踪、分割、识别、神经网络)。只需要线性代数和微积分基础。
<span class="en">Module 1 imaging, 2 features and boundaries, 3 single-view 3D, 4 multi-view 3D (stereo, optical flow, SfM), 5 perception. Prerequisites: linear algebra and calculus.</span>

应用一览(讲义列举):视觉引导机器人和工业检测、车牌识别等 OCR、虹膜和人脸识别、多摄像头跟踪、光学鼠标(低分辨率高帧率相机追踪桌面纹理)、Kinect 动作捕捉、AR 人脸建模、火星车、自动驾驶(可见光、红外、深度相机)、遥感、医学影像。
<span class="en">Applications: robot guidance and inspection, OCR, biometrics, tracking, the optical mouse, Kinect, AR, Mars rovers, driverless cars, remote sensing, medical imaging.</span>

### 8.1.x 面试怎么问 · Likely questions

**Q: Why should we still care about classical, physics-based vision when deep learning works so well?**
深度学习这么好用,为什么还要关心经典的、基于物理的视觉?
> Physics gives you exact models for free, like projection, lens blur or sensor noise, so you don't need data to learn them. When a network fails, the first-principles model is how you debug it, for example noticing that a failure is really motion blur or bad calibration. Physics-based models can also synthesize training data when real data is expensive. In 3D perception the best systems combine both: geometry for structure and learning for the hard perceptual parts.

这段在说什么:物理模型免费且精确,能帮助调试网络,能合成数据;3D 感知里最好的是几何加学习的组合。
<span class="en">Physics is exact, helps debug, and generates data; combine geometry and learning.</span>

和 Byte Veda 的联系:无人机 3D 感知里相机模型、标定、三角化、SLAM 都是几何,网络负责检测和深度先验,面试时可以说自己两边都能做。

**Q: Why is recovering 3D from a single image an ill-posed problem?**
为什么从单张图恢复 3D 是一个不适定问题?
> Perspective projection maps every point on a ray through the camera center to the same pixel, so depth is lost. A small near object and a large far object can produce identical images. To recover 3D you need extra constraints: a second view as in stereo, camera motion as in structure from motion, a lighting model as in shape from shading, or learned priors about the world.

这段在说什么:同一射线上的点投到同一像素,必须引入第二视角、运动、光照模型或先验。
<span class="en">Depth is lost along rays; add views, motion, lighting models or priors.</span>

**Q: How would you define computer vision in one sentence?**
用一句话定义计算机视觉。
> I'd say it is the inverse of image formation: given 2D images, recover a description of the 3D world, its geometry, materials, lighting and what the objects are. Graphics goes from models to images, and vision goes from images back to models. That framing is useful because it tells you exactly which information the camera threw away and what you need to get it back.

这段在说什么:视觉是成像的逆过程,也是图形学的逆问题;这个视角帮你看清丢了什么信息。
<span class="en">Vision inverts image formation, the reverse of graphics.</span>

**Q: How does an optical mouse track motion, and where else is that idea used?**
光学鼠标怎么追踪运动?这个思路还用在哪?
> Inside the mouse is a tiny vision system: a low-resolution camera with a very high frame rate looking at the surface texture. Between consecutive frames the texture shifts only slightly, so matching the two frames gives the displacement, which moves the cursor. High frame rate keeps the motion between frames small, which makes the matching easy and robust. The same principle is optical flow, and downward-facing flow sensors on drones use it to estimate velocity over the ground.

这段在说什么:低分辨率高帧率相机比较相邻帧的纹理位移;本质是光流,无人机的下视光流传感器也是这个原理。
<span class="en">Match texture between fast consecutive frames; it is optical flow, as in drone downward flow sensors.</span>

和 Byte Veda 的联系:实时系统里「提高帧率让帧间运动变小」常常比用更复杂的匹配算法更划算。

> **模块 1 成像与基础处理 · Imaging**

## 8.2 成像 · Image Formation

这一讲解决的问题:三维世界里的一个点,落到二维照片上的哪里、有多清楚。先用最简单的针孔相机推出透视投影公式,再换成透镜,讲清楚对焦、虚化、景深、光圈之间的取舍,最后看镜头畸变和超广角相机。
<span class="en">Where does a 3D scene point land in the 2D image, and how sharp is it? We derive perspective projection from the pinhole camera, then move to lenses (focus, blur, depth of field, aperture), and finish with lens distortions and wide-angle cameras.</span>

### 8.2.1 针孔相机和透视投影 · Pinhole camera and perspective projection

比方:在黑屋子墙上扎一个小孔,对面墙上就出现一幅倒立的外景。每个场景点只有一条光线能穿过小孔,所以像是清楚的。
<span class="en">Analogy: a pinhole in a dark room's wall projects an inverted, sharp picture on the opposite wall, because each scene point sends just one ray through the hole.</span>

![针孔成像:以针孔为原点,z 轴沿光轴,像平面在距离 f 处](img/f29957f588b.jpg)

坐标系原点放在针孔,z 轴沿光轴。针孔到像平面的距离叫有效焦距 f。场景点 (x_o, y_o, z_o),由相似三角形得到透视投影方程:
x_i / f = x_o / z_o,  y_i / f = y_o / z_o
z_o 就是这个点的深度。
<span class="en">With the origin at the pinhole and image plane at distance f, similar triangles give x_i/f = x_o/z_o and y_i/f = y_o/z_o. z_o is the depth.</span>

小例子:f = 50 mm,点在 (1 m, 0.5 m, 5 m)。x_i = 50 × 1/5 = 10 mm,y_i = 50 × 0.5/5 = 5 mm。同一方向上推到 10 m 远,(2 m, 1 m, 10 m) 也投到 (10 mm, 5 mm)。
<span class="en">f = 50 mm: (1, 0.5, 5) m maps to (10, 5) mm, and so does (2, 1, 10) m. Depth is lost along each ray.</span>

这个小例子说明了一件核心的事:一条过针孔的射线上所有点投到同一个像素,深度丢了。单张图恢复 3D 天生是欠定的,后面的立体视觉、运动恢复结构都在想办法把深度找回来。
<span class="en">Every point on a ray through the pinhole hits the same pixel, so a single image cannot give depth. Later lectures (stereo, SfM) recover it.</span>

两个直接推论。第一,3D 直线投影后还是直线:直线和针孔确定一个平面,这个平面和像平面的交线就是像。第二,放大率 m = f / z_o,和深度成反比。针孔像是倒立的,所以 m 为负。面积的放大率是 m²。
<span class="en">Lines map to lines (the line and pinhole span a plane). Magnification m = f/z_o, inversely proportional to depth, negative for an inverted image; area scales by m².</span>

放大率随深度变,带来很多现象。物体的深度变化比它到相机的距离小很多时,可以当作整体同一个放大率。自拍时脸离镜头近,鼻子比耳朵近得多,所以鼻子被放大得更多,显得特别大。
<span class="en">If depth variation is small relative to distance, magnification is roughly constant. In selfies it is not, so the nose looks too big.</span>

### 8.2.2 消失点 · Vanishing point

比方:站在铁轨中间往远处看,两条平行的铁轨在地平线上汇成一点。
<span class="en">Analogy: parallel train tracks seem to meet at one point on the horizon.</span>

3D 里一组平行线,在图像里汇聚到同一个点,叫消失点。它的位置只取决于这组线的方向,和线在哪里无关。
<span class="en">A set of parallel 3D lines converges to one image point, the vanishing point, which depends only on their direction.</span>

![找消失点:过针孔作一条和铁轨平行的线,它穿过像平面的位置就是消失点](img/f460b90c561.jpg)

求法:过针孔作一条同方向的线。设方向是 (l_x, l_y, l_z),点 P = (l_x, l_y, l_z) 就在这条线上。把 P 做透视投影:
(x_vp, y_vp) = (f · l_x / l_z,  f · l_y / l_z)
<span class="en">Draw the parallel line through the pinhole; project its direction vector: (x_vp, y_vp) = (f l_x/l_z, f l_y/l_z).</span>

小例子:f = 50 mm,铁轨方向 (1, 0, 2)。x_vp = 50 × 1/2 = 25 mm,y_vp = 0。如果方向是 (1, 0, 0),也就是和像平面平行,l_z = 0,消失点在无穷远。这时两条线在图像里仍然平行。
<span class="en">Direction (1, 0, 2) gives (25, 0) mm. If l_z = 0 (lines parallel to the image plane) the vanishing point is at infinity and the image lines stay parallel.</span>

反过来用:图像里两条线如果交于一点,把交点反投影回去,就得到它们在 3D 里共同的方向 (x_vp, y_vp, f)。两组不同方向的平行线各给一个消失点,连起来是地平线。
<span class="en">In reverse, a vanishing point (x_vp, y_vp) back-projects to the 3D direction (x_vp, y_vp, f).</span>

### 8.2.3 针孔大小和透镜成像 · Pinhole size and the thin lens

比方:针孔越小像越清楚,但太小会因为衍射又糊掉,而且进光少得可怜。透镜就是一个「能收很多光的大针孔」。
<span class="en">Analogy: a smaller pinhole is sharper until diffraction blurs it again, and it gathers very little light. A lens is a big pinhole that still focuses.</span>

讲义给的最优针孔直径 d ≈ 2√(f λ),λ 取可见光平均波长 550 nm。小例子:f = 50 mm,f λ = 50 × 0.00055 = 0.0275 mm²,开方约 0.166 mm,d ≈ 0.33 mm。讲义里的熨斗大厦针孔照片曝光要 12 秒,对视觉应用完全不能接受。
<span class="en">Optimal pinhole d ≈ 2√(fλ); for f = 50 mm and 550 nm, d ≈ 0.33 mm. Exposures are long (12 s in the lecture's example).</span>

透镜做的还是透视投影,镜心扮演针孔。点 P_o 发出的所有光线被折射后汇聚到 P_i。物距 o、像距 i 满足高斯透镜公式:
1/i + 1/o = 1/f
<span class="en">A lens performs the same perspective projection, with its center acting as the pinhole, but collects far more light. Gaussian lens law: 1/i + 1/o = 1/f.</span>

小例子(讲义原例):f = 50 mm,o = 300 mm。1/i = 1/50 − 1/300 = 5/300,i = 60 mm。物体在无穷远时 1/o = 0,i = f。所以拿透镜对着远处路灯,看纸上成清楚像的位置,就量出了焦距。
<span class="en">f = 50, o = 300 gives i = 60 mm. For o = ∞, i = f, which is how to measure f with a distant lamp.</span>

透镜放大率 m = h_i / h_o = i / o。两片透镜串联时总放大率是两者相乘:m = (i₂/o₂)(i₁/o₁)。挪动两片透镜就能在不改总长的情况下改放大率,这就是变焦。
<span class="en">Lens magnification is i/o; two lenses multiply, and moving them changes magnification: zoom.</span>

光圈:透镜实际通光的圆盘,直径 D。f 数 N = f / D。小例子:50 mm 镜头 f/2,D = 25 mm;收到 f/8,D = 6.25 mm,通光面积变成 1/16。
<span class="en">Aperture diameter D = f/N. A 50 mm lens at f/2 has D = 25 mm; at f/8, 6.25 mm and 1/16 the area.</span>

一个反直觉的事实:把透镜挡掉一部分(讲义用胶带贴成十字),像变暗了,但仍然是清楚的。因为没挡住的那部分透镜照样把光聚到同一点。所以镜头上有灰尘或水滴,照片通常也还能对上焦。
<span class="en">Blocking part of a lens dims the image but keeps it in focus, which is why dust on a lens rarely ruins focus.</span>

### 8.2.4 虚化、景深和超焦距 · Defocus, depth of field and hyperfocal distance

比方:透镜只能让一个距离上的平面完全对焦。离开这个平面的点,光线汇不到一点,在传感器上摊成一个小圆斑。
<span class="en">Analogy: only one plane is in perfect focus; other points spread into a blur disc on the sensor.</span>

![虚化圆直径的推导:由高斯公式写出 i 和 i',代入相似三角形](img/f482a7f214d.jpg)

由相似三角形,b / D = |i' − i| / i'。再用高斯公式消掉像距,得到虚化圆直径:
b = (f² / N) · |o − o'| / (o' (o − f))
o 是对焦距离,o' 是该点实际距离。b 和 1/N 成正比:光圈越大,离焦的东西越糊。
<span class="en">Blur diameter b = (f²/N)·|o − o'| / (o'(o − f)). It scales with D, so with 1/N.</span>

小例子:f = 50 mm,N = 2,对焦在 o = 1000 mm,物体在 o' = 1500 mm。b = 2500 × 500 / (2 × 1500 × 950) = 1,250,000 / 2,850,000 ≈ 0.44 mm。光圈收到 N = 8,b ≈ 0.11 mm,正好是 1/4。
<span class="en">f = 50 mm, N = 2, focus at 1 m, object at 1.5 m: b ≈ 0.44 mm. At N = 8 it drops 4× to about 0.11 mm.</span>

景深:传感器像素有大小 c。只要 b < c,看起来就同样清楚。b 小于 c 的那段物距范围 o₁ 到 o₂ 叫景深。讲义的结论是 o₂ − o 比 o − o₁ 长:物体靠近镜头时,虚化增长得更快,所以焦点后面的清晰范围更大。
<span class="en">Depth of field is the range of object distances where b < pixel size c. It extends further behind the focus plane than in front.</span>

超焦距 h:对焦在 h 时,从 h 附近一直到无穷远都清楚。令 o₂ = ∞,得 h = f² / (N c) + f。小例子:手机镜头 f = 4 mm,N = 2,像素 c = 0.002 mm。h = 16 / 0.004 + 4 = 4004 mm,约 4 m。早期定焦手机就是把焦点固定在超焦距上。
<span class="en">Hyperfocal distance h = f²/(Nc) + f. For f = 4 mm, N = 2, c = 2 µm, h ≈ 4 m. Early fixed-focus phones were set there.</span>

![光圈从大到小:景深变深,但画面变暗](img/f856ce2ae31.jpg)

核心取舍:大光圈(N 小)画面亮、曝光短,但景深浅;小光圈(N 大)景深深,但画面暗、曝光长。讲义的实验里三幅画分别在 1 m、1.5 m、2 m,f = 50 mm 对焦 1 m。N = 2 时只有 1 m 那幅清楚;收到 N = 16 几乎全清楚,但非常暗。
<span class="en">Trade-off: wide aperture means bright, short exposure, shallow DoF; narrow aperture means deep DoF but dark, long exposure.</span>

镜头倾斜时,对焦面不再和传感器平行,由 Scheimpflug 条件确定:把像平面和透镜平面延长交于 Q,对焦面也过 Q。车载相机要看清前方路面这种倾斜平面时有用。
<span class="en">With a tilted lens, the focus plane follows the Scheimpflug condition (image plane, lens plane and focus plane meet in one line); useful for imaging a road surface.</span>

### 8.2.5 镜头的毛病和广角成像 · Lens aberrations and wide-angle imaging

比方:单片透镜画面中间好、边上差,所以真实镜头要堆六到十几片透镜互相抵消毛病。
<span class="en">Analogy: one lens is sharp only in the center, so real lenses stack many elements to cancel each other's flaws.</span>

渐晕(vignetting):多片透镜口径不一,离轴的光更容易被挡,画面四角变暗。可以先拍一张均匀白板测出来,再逐像素补偿。
<span class="en">Vignetting: off-axis rays get clipped by the lens stack, darkening corners; calibrate with a flat white target and compensate.</span>

色差(chromatic aberration):折射率随波长变,所以焦距也随波长变。蓝光折得最多,红光最少。黑白文字的边缘会出现彩边。
<span class="en">Chromatic aberration: refractive index depends on wavelength, so blue bends most and red least, giving colored fringes.</span>

几何畸变:径向畸变让离中心越远的点被推得越远,形成桶形;切向畸变是轻微的扭转。广角镜头桶形畸变明显,直线拍成了曲线。只要事先标定出畸变,就能用软件映射回纯透视图,直线重新变直。
<span class="en">Radial distortion pushes points outward with distance from center (barrel); tangential distortion twists slightly. Once calibrated, software can undistort back to a pure perspective image.</span>

![桶形畸变校正前后:校正后直线变直,视野边界不再是矩形](img/f270f49ac52.jpg)

半球视野用透视投影需要无穷大的像平面,所以鱼眼镜头故意引入畸变,把 180° 视野压进一块小传感器。理光 Theta 用两个背靠背的鱼眼拼成全景球。也可以用曲面镜:双曲面镜把指向焦点 1 的光反射到焦点 2,相机放在焦点 2,就得到一个超过半球、仍满足单视点的图像。
<span class="en">Fisheye lenses deliberately distort to squeeze a hemisphere onto the sensor; two back-to-back fisheyes give a full sphere. Hyperbolic or parabolic mirrors give beyond-hemisphere views from a single viewpoint.</span>

为什么强调单视点:只有所有光线过同一个中心,才能不知道场景 3D 结构就把任意一块图重新映射成透视图。
<span class="en">A single viewpoint lets any part of the image be remapped to a perspective view without knowing scene depth.</span>

### 8.2.x 面试怎么问 · Likely questions

**Q: Write down the pinhole projection model. What information is lost?**
写出针孔投影模型。成像丢掉了什么信息?
> With the camera center at the origin and the image plane at distance f, a point (X, Y, Z) projects to x = f·X/Z and y = f·Y/Z. Every point along the same ray through the center maps to the same pixel, so absolute depth and scale are lost. Magnification is f/Z, which is why far objects look small and parallel lines converge. To get depth back you need a second view, motion, known object size, or an active sensor.

这段在说什么:x = fX/Z,同一射线上的点重合,深度和尺度丢失,需要多视角或先验找回。
<span class="en">x = fX/Z; depth and scale are lost along each ray.</span>

和 Byte Veda 的联系:无人机单目相机就是这个模型,单目只能恢复到一个尺度因子,所以要配 IMU、双目或已知尺寸的目标来定尺度。

**Q: Given two lines in an image, how can you tell whether they are parallel in 3D?**
图像里有两条线,怎么判断它们在 3D 里是否平行?
> Parallel 3D lines meet at a common vanishing point in the image. With intrinsics known, the vanishing point (x_vp, y_vp) back-projects to the 3D direction (x_vp, y_vp, f). So I intersect the two image lines, back-project the intersection, and compare it to the directions I expect. If a third line from the same structure passes through the same point, that is strong evidence they share a direction. Lines parallel to the image plane stay parallel in the image, with the vanishing point at infinity.

这段在说什么:3D 平行线共享一个消失点;交点反投影得到方向;和像平面平行的线在图里仍然平行。
<span class="en">Shared vanishing point; back-project it for the 3D direction; lines parallel to the image plane stay parallel.</span>

**Q: What is the trade-off between aperture, exposure and depth of field?**
光圈、曝光和景深之间怎么取舍?
> The f-number is N = f/D. A small N means a large aperture, so more light and a shorter exposure, but the blur disc is proportional to 1/N, so depth of field gets shallower. A large N gives a deep depth of field but needs a longer exposure, which causes motion blur on a moving platform, or more gain and therefore more noise. For a robot or drone I usually prefer a short focal length focused near the hyperfocal distance, so everything beyond a few meters stays sharp.

这段在说什么:N 小进光多但景深浅,N 大景深深但曝光长;移动平台怕运动模糊,常用超焦距对焦。
<span class="en">Small N: bright, shallow DoF. Large N: deep DoF, long exposure. Use hyperfocal focus on moving platforms.</span>

**Q: What lens distortions do you need to correct before doing 3D geometry?**
做 3D 几何之前要校正哪些镜头畸变?
> Mainly radial distortion, which is barrel-shaped in wide-angle lenses, and a smaller tangential component. They break the straight-line-to-straight-line property of perspective projection, so line detection, vanishing points and epipolar geometry all go wrong. I calibrate the distortion with a known pattern and undistort the images first. Vignetting and chromatic aberration matter less for geometry but affect photometric methods.

这段在说什么:径向和切向畸变会破坏直线保直线,先标定再去畸变;渐晕和色差主要影响光度方法。
<span class="en">Correct radial and tangential distortion first, since they break line-preservation.</span>

## 8.3 图像传感 · Image Sensing

这一讲解决的问题:透镜在传感器上形成的是光,计算机要的是数字。中间这一步怎么做,会引入哪些噪声,能测多宽的亮度范围,颜色怎么测,相机输出的数字和真实亮度是什么关系。
<span class="en">How is the optical image turned into numbers? What noise does that add, how wide a brightness range can a sensor capture, how is color measured, and how do pixel values relate to true scene brightness?</span>

### 8.3.1 硅、CCD 和 CMOS · Silicon, CCD and CMOS

比方:每个像素是一只接雨的桶。光子是雨滴,落进硅里打出电子,桶里攒了多少电子就代表多亮。
<span class="en">Analogy: each pixel is a bucket; photons are raindrops that knock out electrons in silicon, and the electron count measures brightness.</span>

硅原子被能量足够的光子击中会释放一个电子,形成电子空穴对。所以硅本身就把光变成了电荷,剩下的工作只是把电荷读成电压再转成数字。
<span class="en">Silicon releases an electron per absorbed photon of enough energy, so sensing reduces to reading out charge as voltage and digitizing it.</span>

CCD(电荷耦合器件):每个像素有一个势阱收集电子。读出时每一行把电荷整体交给下一行,像救火时排成一排传水桶("bucket brigade")。到最底下一行再横着一格一格传到末端,统一转成电压,再经模数转换器(ADC)变成数字。
<span class="en">CCD: charge is shifted row by row like a bucket brigade to a single output node, converted to voltage, then digitized by an ADC.</span>

CMOS:每个像素自带一个电子转电压的小电路,可以直接按地址读任意像素。只关心一小块区域时,只读那几个像素,帧率就能高很多。代价是电路占了地方,感光面积变小。
<span class="en">CMOS: each pixel has its own charge-to-voltage circuit, so pixels can be read directly, and a small region can be read out much faster. The circuit reduces light-sensitive area.</span>

![CMOS:每个像素内部完成光子到电子、电子到电压的转换](img/fb88a9bab72.jpg)

为了不浪费照到电路上的光,每个像素顶上有一片微透镜,把整个像素面积的光汇到感光区。微透镜下面是颜色滤片,再下面才是势阱。消费相机大多用 CMOS,因为它更灵活。
<span class="en">A microlens on each pixel funnels light onto the photodiode, above a color filter. CMOS dominates consumer cameras for its flexibility.</span>

分辨率不会无限涨:像素做到和光的波长(约半微米)差不多大时,再缩小也不会提高真实分辨率。讲义举的例子是 1800 万像素传感器,像素边长约 1.25 µm。
<span class="en">Once pixels approach the wavelength of light, about 0.5 µm, shrinking them further does not add true resolution.</span>

### 8.3.2 噪声从哪来 · Sources of noise

比方:就算天上的雨下得完全均匀,每个桶每分钟接到的雨滴数也会上下浮动。这种浮动和桶的质量无关,是雨本身的随机性。
<span class="en">Analogy: even steady rain lands in a bucket a random number of drops per minute; that randomness belongs to the rain, not the bucket.</span>

讲义把噪声分成几类:
- 光子散粒噪声(photon shot noise):光子到达本身是随机的,和场景亮度有关。
- 读出噪声(read noise):电子转电压时电路引入,只和传感器质量有关。
- 量化噪声(quantization noise):ADC 把连续电压取整引入。
- 暗电流(热)噪声:没有光时,温度也会产生电子。
- 固定模式噪声(fixed pattern noise):每个像素做出来响应略有不同。
<span class="en">Shot noise (scene dependent), read noise (sensor dependent), quantization noise (ADC), dark current or thermal noise, and fixed pattern noise from pixel-to-pixel variation.</span>

散粒噪声服从泊松分布:P(k) = λᵏ e^(−λ) / k!。它最重要的性质是方差等于均值。所以标准差是 √λ,信噪比也是 √λ。亮的地方噪声绝对值更大,但相对噪声更小。λ 较大时泊松分布接近高斯。
<span class="en">Shot noise is Poisson: variance equals the mean λ, so std and SNR are both √λ. Brighter regions have more absolute noise but better SNR.</span>

![泊松分布:均值越大越宽,λ ≥ 10 时近似高斯](img/ff03efb1c87.jpg)

小例子:一个像素平均收到 100 个光子,标准差是 10,信噪比 10。亮度提到 10000 个光子,标准差 100,信噪比 100。亮度乘以 100,信噪比只乘以 10。
<span class="en">100 photons: std 10, SNR 10. 10000 photons: std 100, SNR 100. 100× the light buys only 10× the SNR.</span>

读出噪声用高斯分布描述,和场景亮度无关;传感器好,高斯就窄。量化步长为 Δ 时,量化噪声方差是 Δ²/12。8 位输出 Δ = 1 个灰度级时,方差约 0.083,标准差约 0.29 级,现代 10 到 12 位相机里基本可以忽略。
<span class="en">Read noise is Gaussian and brightness independent. Quantization noise has variance Δ²/12; for Δ = 1 level that is about 0.083, negligible at 10 to 12 bits.</span>

暗电流只在长曝光时明显,比如天文摄影要曝光几分钟,所以要给传感器降温。固定模式噪声可以标定:测出每个像素的增益,以后每次测量都除以它。
<span class="en">Dark current matters only for long exposures, hence cooled astronomy sensors. Fixed pattern noise is removed by calibrating per-pixel gain.</span>

### 8.3.3 动态范围 · Dynamic range

比方:桶有容量。雨太大桶会满(饱和),雨太小又分不清是雨还是噪声。能测的最大值和最小值之比就是动态范围。
<span class="en">Analogy: a bucket overflows in heavy rain and cannot tell light rain from noise; the ratio between those limits is the dynamic range.</span>

公式:动态范围 = 20 log₁₀(B_max / B_min),单位分贝。B_max 是势阱装满时对应的光能,B_min 是在噪声中还能分辨出来的最小光能。
<span class="en">Dynamic range = 20 log₁₀(B_max/B_min) dB, with B_max set by the full well and B_min by the noise floor.</span>

![常见成像系统的动态范围:人眼 120 dB,数码相机约 72 dB,数字视频约 33 dB](img/ff701a05716.jpg)

小例子:讲义表里数码相机是 4096 : 1。log₁₀ 4096 ≈ 3.61,乘 20 得 72.2 dB。人眼 1,000,000 : 1,是 20 × 6 = 120 dB。自己设计一个:势阱装 10000 个电子,噪声底 10 个电子,比值 1000,动态范围 60 dB。
<span class="en">4096:1 gives 72.2 dB; 10⁶:1 gives 120 dB. A 10000 e⁻ well over a 10 e⁻ noise floor gives 60 dB.</span>

视频相机动态范围更低:要连续快速拍,曝光时间短,收到的光少,而读出噪声不变,信噪比就低了。
<span class="en">Video cameras have lower dynamic range: short exposures collect less light while read noise stays the same.</span>

### 8.3.4 颜色怎么测 · Sensing color

比方:像素本身是色盲,只会数电子。要知道颜色,只能在它头上戴一片有色眼镜。
<span class="en">Analogy: a pixel is color-blind and only counts electrons; to see color it must wear a tinted filter.</span>

量子效率 q(λ) = 产生的电子通量 / 波长 λ 的光子通量。对光谱分布 p(λ),像素输出 I = ∫ q(λ) p(λ) dλ。一个数 I 对应无数种 p(λ),所以单个像素测不出光谱。硅在约 1100 nm 以上几乎透明,400 nm 以下几乎不透光。
<span class="en">Quantum efficiency q(λ). Output I = ∫ q(λ)p(λ) dλ, one number for a whole spectrum, so many spectra give the same I.</span>

颜色不是物理量,是人对 400 到 700 nm 光的反应。人眼的视网膜有视杆细胞(只管亮度,暗光下工作)和三种视锥细胞(分别对应红、绿、蓝)。三种视锥只给出三个数 (R, G, B)。所以很多不同的光谱会被看成同一种颜色,这些光谱叫同色异谱(metamers)。Young 的实验说明,用三种波长的光混合,就能造出几乎所有人能看到的颜色。这就是相机和屏幕只用红绿蓝三种滤片的原因。
<span class="en">Color is a human response. Three cone types give three numbers, so different spectra can look identical (metamers). Young showed three primaries reproduce nearly all perceivable colors, which justifies RGB cameras.</span>

两种做法。分色棱镜(dichroic prism)把光分成三路,配三块传感器,每个像素都有完整 RGB,但又大又难对齐。更常见的是单传感器加颜色滤片马赛克(Bayer 阵列,每 2×2 里有两个绿、一个红、一个蓝)。每个像素只测一种颜色,缺的两种用邻居插值补,这一步叫去马赛克(demosaicing)。
<span class="en">A dichroic prism with three sensors is bulky; most cameras use one sensor with a Bayer color filter mosaic and interpolate the missing colors (demosaicing).</span>

![Bayer 马赛克:原始图每个像素只有一种颜色,插值后得到彩色图](img/f5a0fd3b998.jpg)

小例子:一个红色像素四周上下左右是四个绿色像素,读数 100、110、90、100。最简单的双线性插值给它的绿色值 = (100 + 110 + 90 + 100) / 4 = 100。边缘处这样平均会产生彩边,所以好的算法会沿边缘方向插值。
<span class="en">A red pixel with green neighbors 100, 110, 90, 100 gets green = 100 by bilinear interpolation; naive averaging causes color fringes at edges.</span>

### 8.3.5 相机响应函数和 HDR · Camera response and HDR

比方:相机输出的灰度值像被「美颜」过的读数。为了在有限的位数里塞下更大的亮度范围,厂家故意把亮的部分压缩得更狠。
<span class="en">Analogy: pixel values are deliberately "beautified" readings; manufacturers compress bright values more to fit a wide range into few bits.</span>

像素收到的亮度 B = I × 曝光量,曝光量是光圈面积乘积分时间,这一步是线性的。之后经过电压转换、ADC、去马赛克和厂家加的非线性映射,最终输出 M = f(B)。f 叫相机响应函数,单调但通常不是线性的,俗称 gamma 曲线。
<span class="en">Image brightness B = I × exposure is linear. The camera output M = f(B), the response function, is monotonic but usually nonlinear (a gamma curve).</span>

怎么标定:拍一张 Macbeth 色卡。底行灰块的反射率已知,从 3.1% 到 90%。色卡被均匀照亮时,灰块亮度之比等于反射率之比,画出 B 和 M 的关系,归一化到最亮为 1,就是响应函数。这叫辐射标定(radiometric calibration)。标定后就能把相机「线性化」,知道场景亮度(差一个整体比例)。
<span class="en">Photograph a Macbeth chart with known gray reflectances (3.1% to 90%) under uniform light; plotting known B against measured M gives the response. This radiometric calibration linearizes the camera up to scale.</span>

HDR:线性化之后,一张 8 位图在 255 处饱和。连拍几张不同曝光(包围曝光,exposure bracketing),短曝光保住亮处,长曝光保住暗处。最简单的合成是直接相加,四张 8 位图加起来最大值是 1020,等效响应曲线是非线性的,亮处被压缩。之后再做色调映射(tone mapping)显示出来。
<span class="en">HDR by exposure bracketing: short exposures keep highlights, long ones keep shadows. Summing four 8-bit images (max 1020) yields a compressive virtual response; tone mapping then displays it.</span>

![多次曝光相加得到的等效响应:亮处被压缩,最大值 1020](img/f750f31beb9.jpg)

小例子:四张曝光倍数 1、2、4、8,每张输出 min(e·P, 255)。场景亮度 P = 20:20、40、80、160,和是 300。P = 100:100、200、255、255,和是 810。P 从 20 涨到 100 是 5 倍,和只涨了 2.7 倍。亮处被压缩了,但两处都没有丢信息。
<span class="en">Exposures 1, 2, 4, 8: P = 20 sums to 300, P = 100 sums to 810. Five times the brightness gives 2.7 times the output: compression without total loss.</span>

局限:多次曝光要求拍摄期间场景和相机都不动。有运动物体就会出现重影(ghosting)。讲义给的解法是单次曝光 HDR:在传感器上给不同像素配不同透光率(assorted pixels),暗像素旁边总有一个没暗的,饱和像素旁边总有一个没饱和的,再用图像处理恢复 HDR。
<span class="en">Bracketing assumes a static scene; motion causes ghosting. Single-shot HDR uses pixels with different sensitivities (assorted pixels) and reconstructs HDR from one frame.</span>

### 8.3.x 面试怎么问 · Likely questions

**Q: What are the main noise sources in an image sensor, and how do they scale with brightness?**
图像传感器的主要噪声有哪些?它们和亮度是什么关系?
> Photon shot noise comes from the random arrival of photons and is Poisson, so its variance equals the signal and SNR grows as the square root of the signal. Read noise is Gaussian and independent of brightness, so it dominates in dark regions. Quantization noise has variance delta squared over twelve and is small at 10 to 12 bits. Dark current matters for long exposures, and fixed pattern noise is removed by per-pixel gain calibration.

这段在说什么:散粒噪声随亮度、信噪比按 √ 增长;读出噪声固定,暗处占主导;量化、暗电流、固定模式噪声各有处理方法。
<span class="en">Shot noise grows with signal (SNR ∝ √signal); read noise is constant and dominates in the dark.</span>

和 Byte Veda 的联系:无人机为了防运动模糊只能短曝光,光子少,散粒和读出噪声都更明显,所以低光下要权衡曝光、增益和去噪。

**Q: CCD vs CMOS, which would you choose for a real-time robot?**
CCD 和 CMOS,实时机器人你选哪个?
> CMOS. Each pixel converts charge to voltage itself, so I can read a region of interest at a much higher frame rate, and CMOS is cheaper and lower power. CCD shifts all charge through a single output, which gives uniform pixels but less flexibility. The trade-off for CMOS is a smaller light-sensitive area per pixel, which microlenses partly recover. One thing I would also check, though it is outside this lecture, is whether the CMOS sensor has a global shutter, because a rolling shutter distorts fast motion.

这段在说什么:选 CMOS,能读局部区域、帧率高、功耗低;注意感光面积和快门方式(卷帘快门不在讲义范围,是延伸)。
<span class="en">CMOS for ROI readout, speed and power; check global vs rolling shutter for fast motion.</span>

**Q: How does a single-sensor color camera produce RGB at every pixel?**
单传感器彩色相机怎么让每个像素都有 RGB?
> Each pixel sits under one color filter in a Bayer mosaic, so the raw image has only one color per pixel. Demosaicing interpolates the two missing colors from neighbors, for example bilinearly, or along edges to avoid color fringes. Because only three filters are used, many different spectra map to the same RGB, which are called metamers; that is fine for human viewing but limits material analysis.

这段在说什么:Bayer 马赛克加去马赛克插值;三通道会产生同色异谱。
<span class="en">Bayer mosaic plus demosaicing; RGB cannot distinguish metamers.</span>

**Q: How would you capture a high dynamic range scene, and what can go wrong?**
怎么拍高动态范围场景?会出什么问题?
> First I calibrate the camera response so pixel values are linear in brightness. Then I bracket exposures, short ones for highlights and long ones for shadows, and merge them, ignoring saturated and very dark pixels. The risk is motion between frames, which causes ghosting, so for moving scenes I would use single-shot HDR with assorted pixel sensitivities, or align the frames before merging.

这段在说什么:先辐射标定线性化,再包围曝光合成;动态场景会重影,改用单次曝光 HDR 或先对齐。
<span class="en">Linearize, bracket and merge; avoid ghosting with single-shot HDR or alignment.</span>

## 8.4 二值图像 · Binary Images

这一讲解决的问题:一张只有 0 和 1 的图里,怎么认出每个物体、算出它在哪、朝哪个方向。工厂流水线、二维码、电路板检测都靠这一套。它简单、快、稳,而且很多算法能边读传感器边算完。
<span class="en">Given an image with only 0s and 1s, how do we separate the objects, and find each one's size, position and orientation? It is simple, fast and robust, and much of it can be computed while the sensor is being read out.</span>

### 8.4.1 怎么得到二值图 · Thresholding

比方:把一张灰度照片按「比某个亮度亮就涂白,否则涂黑」重新描一遍。
<span class="en">Analogy: repaint a gray photo as pure white wherever it is brighter than some level, and black elsewhere.</span>

公式:b(x, y) = 1,当 g(x, y) ≥ T;否则 b(x, y) = 0。g 是灰度图,T 是阈值。b 叫特征函数(characteristic function),意思是「这个点属不属于物体」的指示器。
<span class="en">b(x, y) = 1 if g(x, y) ≥ T, else 0. b is the characteristic (indicator) function of the object.</span>

T 怎么选?画灰度直方图(横轴是 0 到 255 的亮度,纵轴是该亮度的像素个数)。如果直方图有两个峰,一个是背景,一个是物体,T 就放在两峰之间的谷底。
<span class="en">Pick T from the gray-level histogram: with one mode for background and one for objects, put T in the valley between them.</span>

局限:物体材质不同时,同一个物体上有亮有暗,还有高光和纹理,一个阈值切不干净。讲义的解法是控制光照:物体放在半透明台面上,从下面打光(背光,backlighting)。拍出来几乎直接就是二值图。
<span class="en">Mixed materials, shading and highlights break a single threshold. If you control lighting, backlight the objects from beneath a translucent surface and the raw image is almost binary.</span>

### 8.4.2 面积和位置:零阶矩和一阶矩 · Area and centroid

比方:把物体剪成一块厚度均匀的薄板。面积就是板有多重,中心就是用一根手指能把它托平的那个点。
<span class="en">Analogy: cut the object out of a uniform thin sheet. Area is its weight; the centroid is where one fingertip balances it.</span>

离散图里设每个像素面积为 1,b_ij 是第 i 行第 j 列的值:
- 面积 A = Σ_i Σ_j b_ij(零阶矩)
- 中心 x̄ = (1/A) Σ Σ x · b_ij,ȳ = (1/A) Σ Σ y · b_ij(一阶矩)
<span class="en">Area is the zeroth moment, A = ΣΣ b_ij. The center of area comes from the first moments divided by A.</span>

小例子:物体是一个 4×2 的长条,占据 x = 1, 2, 3, 4 和 y = 1, 2,共 8 个像素。A = 8。x̄ = (1+2+3+4)×2 / 8 = 20/8 = 2.5。ȳ = (1×4 + 2×4) / 8 = 12/8 = 1.5。
<span class="en">A 4×2 bar at x = 1..4, y = 1..2: A = 8, x̄ = 2.5, ȳ = 1.5.</span>

面积在物体平移、旋转后不变,所以能直接拿来区分少数几种零件。中心告诉机械臂去哪里抓。
<span class="en">Area is invariant to translation and rotation, so it can tell a few parts apart. The centroid tells a robot where to grasp.</span>

### 8.4.3 朝向:最小二阶矩轴 · Orientation from the axis of least second moment

比方:拿着那块薄板绕一根轴转。绕某根轴转起来最省力,这根轴就定义为物体的朝向。
<span class="en">Analogy: spin the sheet about an axis. The axis that is easiest to spin about defines the orientation.</span>

![最小二阶矩轴:每个点到轴的距离 r 的平方和最小](img/f439d024a78.jpg)

要最小化 E = ∬ r² b(x, y) dx dy,r 是点到轴的垂直距离。直线不用 y = mx + b,因为竖直线时 m 会变成无穷大。改用 x sinθ − y cosθ + ρ = 0,θ 和 ρ 都是有限值。此时点到线的距离就是 r = |x sinθ − y cosθ + ρ|。
<span class="en">Minimize E = ∬ r² b dx dy. Use the line form x sinθ − y cosθ + ρ = 0 instead of y = mx + b, since m blows up for vertical lines. Then r = |x sinθ − y cosθ + ρ|.</span>

推导分三步:
1. 对 ρ 求导令其为 0,得到 A(x̄ sinθ − ȳ cosθ + ρ) = 0。结论:轴一定穿过中心 (x̄, ȳ)。
2. 把坐标原点挪到中心,x' = x − x̄,y' = y − ȳ。E 变成 E = a sin²θ − b sinθ cosθ + c cos²θ。其中 a = ΣΣ x'² b,b = 2 ΣΣ x'y' b,c = ΣΣ y'² b。
3. 对 θ 求导令其为 0,得到 tan 2θ = b / (a − c)。
<span class="en">Setting dE/dρ = 0 shows the axis passes through the centroid. Shifting to centroid coordinates gives E = a sin²θ − b sinθcosθ + c cos²θ, and dE/dθ = 0 gives tan 2θ = b/(a − c).</span>

tan 2θ 有两个解,相差 90°。一个让 E 最小,一个让 E 最大。用二阶导判断:d²E/dθ² = (a − c) cos 2θ + b sin 2θ,大于 0 的那个是最小。最终朝向写成 θ = atan2(b, a − c) / 2。
<span class="en">The two solutions are perpendicular: one minimizes E, one maximizes it. The second-derivative test picks θ = atan2(b, a − c)/2 as the minimum.</span>

接着用 8.4.2 的长条算一遍。x' 取值 −1.5, −0.5, 0.5, 1.5,每个出现 2 次:a = 2 × (2.25 + 0.25 + 0.25 + 2.25) = 10。y' 都是 ±0.5:c = 8 × 0.25 = 2。左右上下对称,所以 b = 0。tan 2θ = 0 / 8 = 0,θ = 0 或 90°。二阶导在 θ = 0 时是 a − c = 8 > 0,所以朝向是水平的,和长条的长边一致。
<span class="en">For the bar: a = 10, c = 2, b = 0, so θ = 0 or 90°. At θ = 0 the second derivative is 8 > 0, so the axis is horizontal, along the long side.</span>

### 8.4.4 圆度和不变量 · Roundedness and invariant features

比方:E_min 和 E_max 越接近,物体越像一个圆盘,往哪个方向转都一样费劲。
<span class="en">Analogy: the closer E_min is to E_max, the more disc-like the object is.</span>

圆度 = E_min / E_max,E_min = E(θ1),E_max = E(θ2)。长条的例子:E(0) = c = 2,E(90°) = a = 10,圆度 = 2/10 = 0.2,很扁。圆盘的圆度是 1,而且它没有唯一的轴,因为过中心的任何轴二阶矩都一样。
<span class="en">Roundedness = E_min / E_max. The bar gives 2/10 = 0.2. A disc gives 1.0 and has no unique axis.</span>

![扳手、胶水瓶、圆球:二值化后标出中心和轴,圆度分别是 0.19、0.49、1.0](img/f74468c69c6.jpg)

面积、E_min、E_max 都不随平移和旋转变化,可以当识别特征。中心和 θ 则给出位姿,让机械臂去抓。
<span class="en">Area, E_min and E_max are invariant features for recognition. The centroid and θ give the pose for grasping.</span>

工程上的小技巧:不用先求中心再算二阶矩。先对图像原点算 a' = ΣΣ x² b,b' = 2 ΣΣ xy b,c' = ΣΣ y² b,最后再换算:a = a' − A x̄²,b = b' − 2A x̄ ȳ,c = c' − A ȳ²。验算长条:a' = 2 × (1 + 4 + 9 + 16) = 60,60 − 8 × 2.5² = 60 − 50 = 10,和上面一致。
<span class="en">Accumulate moments about the image origin, then convert: a = a' − A x̄², and similarly for b and c. For the bar, 60 − 50 = 10, matching the direct result.</span>

为什么这样做:传感器逐个像素往外读时,A、Σx、Σy、a'、b'、c' 都能累加。图读完的那一刻,所有几何量就有了,不用再扫第二遍。
<span class="en">All sums can be accumulated during sensor readout, so every property is ready the moment the last pixel arrives.</span>

另外值得记住:a、b/2、c 正好组成物体像素坐标的协方差矩阵 [[a, b/2], [b/2, c]]。最小二阶矩轴就是这个矩阵最大特征值对应的特征向量方向,也就是 PCA 的第一主轴。
<span class="en">The matrix [[a, b/2], [b/2, c]] is the scatter matrix of the object pixels; the axis of least second moment is its principal eigenvector, the first PCA axis.</span>

### 8.4.5 多个物体:连通域和邻接定义 · Connected components and connectedness

比方:同一块颜色里你能不抬笔一路走到的地方,算同一个物体。
<span class="en">Analogy: everything you can reach without lifting the pen, staying on the same value, is one object.</span>

定义:A、B 两点之间若有一条路径,路径上 b 值不变,就说它们连通。连通域(connected component)是这种点的最大集合。
<span class="en">Two points are connected if a path joins them along which b is constant. A connected component is a maximal set of such points.</span>

关键问题是「邻居」怎么定义。4 连通只算上下左右;8 连通再加 4 个对角。两者都会违反 Jordan 曲线定理(一条闭合曲线把平面分成里外两个连通区域)。看这个 3×3 小块:
```
0 1 0
1 0 1
0 1 0
```
4 连通:四个 1 互不相连,得到 4 个物体;中间的 0 也和外面断开,得到 2 块背景。没有闭合环却有一个洞,矛盾。8 连通:四个 1 连成一个环,但中间的 0 又能斜着走到外面。有闭合环却没有洞,也矛盾。
<span class="en">4-connectedness gives four objects yet two backgrounds (a hole without a closed loop). 8-connectedness gives one ring yet a single background (a closed loop without a hole). Both violate Jordan's curve theorem.</span>

解法是引入不对称:6 连通,只保留一条对角线方向的两个对角邻居。上面的小块就变成两段线段加一块背景,符合定理。效果上相当于把方格网当成六边形网格用。
<span class="en">Fix: 6-connectedness keeps only one pair of diagonal neighbors. The patch becomes two line segments and one background. This makes the square grid behave like a hexagonal grid.</span>

![不对称的 6 邻域让方格网表现得像六边形网格](img/f66737f22ca.jpg)

### 8.4.6 两遍扫描的顺序标记 · Sequential labeling

比方:按读书的顺序(从左到右、从上到下)给每个像素贴标签,只看已经贴过的邻居。发现两张标签其实是同一个物体时,先记在小本上,第二遍统一改。
<span class="en">Analogy: label pixels in reading order, looking only at already-labeled neighbors; note any "these two labels are the same" in a table and fix them in a second pass.</span>

规则(A 是当前像素,只看它的上、左、左上三个邻居):
- A = 0:背景。
- A = 1 且三个邻居都是 0:给新标签。
- 左上有标签:抄左上的。
- 只有上或只有左有标签:抄那个。
- 上和左都有标签但不一样:随便抄一个,在等价表里记下「两者等价」。
扫完后第二遍把等价的标签合并。只看上、左、左上,本身就是不对称的 6 连通。
<span class="en">Look only at the top, left and top-left neighbors. On a conflict, take one label and record the equivalence; a second pass resolves it. Using these three neighbors already builds in 6-connectedness.</span>

小例子,一个 U 形:
```
1 0 1
1 1 1
```
第一行:(1,1) 得标签 1,(1,3) 得标签 2。第二行:(2,1) 上面是 1,抄 1。(2,2) 左上是 1,抄 1。(2,3) 上面是 2、左边是 1、左上是 0,冲突:记 2 ≡ 1,填 1。第二遍把所有 2 改成 1,整个 U 是一个物体。
<span class="en">For a U shape, the two arms get labels 1 and 2; the bottom-right pixel sees both, records 2 ≡ 1, and the second pass merges them into one object.</span>

另一种写法是区域生长(region growing):找到一个没标过的 1 当种子,把它的邻居、邻居的邻居一路染成同一个标签,染完再找下一个种子。顺序标记只要两遍光栅扫描,更省内存、更容易做成流水线。
<span class="en">Region growing floods from a seed instead. Sequential labeling needs just two raster passes and streams well.</span>

### 8.4.7 迭代修改与骨架 · Iterative modification and skeletons

比方:像剥洋葱一样一层层削薄物体,但规定不许把一个物体削成两半,也不许削出新洞。
<span class="en">Analogy: peel the object layer by layer, but never split it in two or open a new hole.</span>

欧拉数 E = 物体个数 − 洞的个数。字母 B 是 1 − 2 = −1,i 是 2 − 0 = 2,n 是 1。整图欧拉数等于各个不重叠区域之和。所以一个只动局部、不改局部欧拉数的操作,不会改变整图的结构。一张图里写着 "B i",欧拉数是 −1 + 2 = 1。
<span class="en">Euler number = bodies − holes: B is −1, i is 2, n is 1. It adds over non-overlapping regions, so a local operation that preserves it locally preserves the whole image's topology.</span>

在六边形网格上,每个像素有 6 个邻居,共 2⁶ = 64 种邻域。按「中心从 0 变 1 时欧拉数变多少」分成四类:N+1、N0、N−1、N−2。N0 最重要:改中心像素不产生新物体也不产生新洞,叫保守操作。
<span class="en">With 6 neighbors there are 64 patterns, falling into four classes N+1, N0, N−1, N−2 by the Euler change when the center flips 0→1. N0 patterns are safe to modify.</span>

规则写成:a_ij = 1 表示像素邻域属于选定集合 S,b_ij 是当前值,新值 c_ij 由 (a, b) 决定。四种输入各配一个 0/1 输出,共 2⁴ = 16 种算法。取 S = N0 时有两个最有用:c = a OR b 是安全膨胀(讲义算法 7);c = b AND NOT a 是安全细化(讲义算法 4)。反复做细化直到没有像素能改,就得到骨架。
<span class="en">Each rule maps (a_ij, b_ij) to c_ij, giving 16 algorithms. With S = N0, "c = a OR b" grows objects safely and "c = b AND NOT a" thins them; repeat thinning until nothing changes to get the skeleton.</span>

![在 N0 上反复细化,蝴蝶变成骨架,欧拉数不变](img/fdad921d71e.jpg)

为什么快:每个像素只看自己的邻居,所以可以大量并行。只要同时修改的像素不在彼此邻域里就行。方格网上把像素分成三组(field),一组一组并行处理。
<span class="en">Operations are local, so many pixels can be updated in parallel as long as they are not neighbors; on a square grid three interleaved fields suffice.</span>

### 8.4.x 面试怎么问 · Likely questions

**Q: How would you find the orientation of a blob in a binary image?**
二值图里一个斑块的朝向怎么求?
> I compute the centroid from first moments, then the central second moments a, b and c. The orientation is the axis of least second moment, θ = ½·atan2(b, a − c). This is the same as the principal eigenvector of the pixel covariance matrix, so PCA gives the same answer. The ratio E_min/E_max also tells me how elongated it is, and if it is close to 1 the orientation is ill-defined.

这段在说什么:先求中心,再用二阶中心矩算 tan 2θ;它等价于对像素坐标做 PCA,圆度接近 1 时朝向没意义。
<span class="en">Centroid, then central second moments; equivalent to PCA; unreliable for round blobs.</span>

和 Byte Veda 的联系:无人机找降落标记或地面目标时,二值化后用矩算位置和朝向,每帧只要一次扫描,很适合实时。

**Q: Explain connected component labeling. What is the difference between 4- and 8-connectivity?**
讲一下连通域标记,4 连通和 8 连通有什么区别?
> Two-pass sequential labeling scans the image in raster order and looks only at already-visited neighbors. If two different labels meet, it records them as equivalent and merges them in a second pass, often with union-find. 4-connectivity uses only the edge neighbors, 8-connectivity adds diagonals. Neither is fully consistent: with either one you can get a closed loop without a hole or a hole without a loop. The usual fix is to use 8-connectivity for the foreground and 4 for the background, or an asymmetric 6-neighborhood.

这段在说什么:两遍扫描加等价表;4 和 8 连通都会违反 Jordan 定理,前景背景用不同连通性或 6 连通来补救。
<span class="en">Two passes plus an equivalence table; both 4 and 8 violate Jordan's theorem; mix them or use 6-connectivity.</span>

**Q: How do you choose a threshold to binarize an image?**
二值化的阈值怎么选?
> I look at the gray-level histogram. If it is bimodal, one peak for background and one for the object, I put the threshold in the valley between them; Otsu's method automates that choice. If the materials vary or the lighting is uneven, one global threshold fails, so I would control the lighting, for example with backlighting, or use a local adaptive threshold.

这段在说什么:双峰直方图取谷底;光照或材质不均时改光照或用局部阈值。
<span class="en">Use the histogram valley; fix lighting or go adaptive when one global threshold fails.</span>

**Q: How would you skeletonize a shape without breaking it apart?**
怎么把一个形状细化成骨架又不让它断开?
> I peel boundary pixels iteratively, but only remove a pixel when its neighborhood pattern does not change the Euler number, meaning no new body and no new hole is created. Because each decision is local, I can update many pixels in parallel, as long as no two updated pixels are neighbors. I repeat until nothing changes, and what remains is the skeleton.

这段在说什么:只删不改变欧拉数的像素,局部规则可并行,迭代到不动为止。
<span class="en">Remove only Euler-preserving pixels, in parallel, until convergence.</span>

## 8.5 图像处理(一) · Image Processing I

这一讲解决的问题:拿到一张有噪声、有模糊的图,怎么把它变成更干净、更好分析的图,以及怎么在图里找到一个给定的小图案。核心工具是卷积:先讲为什么大量操作都是卷积,再讲线性滤波、非线性滤波和模板匹配。
<span class="en">How do we turn a noisy or blurry image into one that is cleaner and easier to analyze, and how do we find a given pattern in it? The core tool is convolution, followed by linear filters, non-linear filters and template matching.</span>

### 8.5.1 像素处理与线性移不变系统 · Pixel processing and LSIS

比方:像素处理就是给每个像素单独调色,完全不看邻居。
<span class="en">Analogy: pixel processing recolors each pixel on its own, ignoring its neighbors.</span>

公式是 g(x, y) = T(f(x, y))。f 是原图在 (x, y) 的亮度,T 是一个固定的映射。变暗是 f − 128,变亮是 f + 128,反色是 255 − f,降对比度是 f / 2,升对比度是 f × 2(超出 255 会饱和成白色)。彩色转灰度是 0.3R + 0.6G + 0.1B。
<span class="en">g = T(f) per pixel: darken, lighten, invert (255 − f), contrast scaling, and gray = 0.3R + 0.6G + 0.1B.</span>

小例子:像素 f = 100,反色得 255 − 100 = 155。彩色像素 (R, G, B) = (200, 100, 50),灰度 = 60 + 60 + 5 = 125。
<span class="en">Invert 100 gives 155. RGB (200, 100, 50) gives gray 125.</span>

更重要的是 LSIS(linear shift invariant system,线性移不变系统)。线性:输入 αf1 + βf2,输出就是 αg1 + βg2。移不变:输入平移 a,输出也平移 a,形状不变。
<span class="en">LSIS: linear (αf1 + βf2 maps to αg1 + βg2) and shift invariant (shifting the input by a shifts the output by a).</span>

为什么在乎它:理想镜头的失焦就是一个 LSIS。场景变亮,清晰图和失焦图都按比例变亮;物体平移,两张图一起平移。所以失焦图 = 清晰图经过某个 LSIS 处理。
<span class="en">Defocus through an ideal lens is an LSIS: brightness scales linearly and scene motion shifts both images equally.</span>

### 8.5.2 卷积与冲激响应 · Convolution and impulse response

比方:卷积就是拿一把「加权尺子」在信号上滑,每到一个位置,算一次加权和。
<span class="en">Analogy: slide a weighted ruler along the signal and take a weighted sum at each position.</span>

连续形式:g(x) = ∫ f(τ) h(x − τ) dτ。步骤是:把 h 翻转成 h(−τ),平移 x 得到 h(x − τ),和 f(τ) 相乘,积分得到 g(x) 这一个数。x 从负无穷滑到正无穷,就得到整条 g。
<span class="en">Flip h, shift by x, multiply with f, integrate. Sweep x to get the whole output.</span>

关键结论:**LSIS 一定是卷积,卷积一定是 LSIS**。讲义证明了后半句:线性靠积分可以拆开,移不变靠换元 μ = τ − a。
<span class="en">Every LSIS is a convolution and every convolution is an LSIS.</span>

怎么知道黑盒里的 h?输入单位冲激 δ(x)(无限窄、无限高、面积为 1)。筛选性质:δ 和任何函数 b 卷积,结果还是 b。所以输入 δ,输出就是 h,叫冲激响应。成像系统里叫 PSF(point spread function,点扩散函数),例如对人眼输入一颗遥远的星星,视网膜上的光斑就是人眼的 PSF。
<span class="en">Feed in a unit impulse; the output is h, the impulse response. In optics it is the point spread function (PSF), e.g. the retinal image of a distant star.</span>

两个性质很实用:交换律 a * b = b * a,结合律 (a * b) * c = a * (b * c)。所以先卷 h1 再卷 h2,等价于直接卷一个 h1 * h2。
<span class="en">Convolution is commutative and associative, so a cascade h1 then h2 equals one filter h1 * h2.</span>

离散 2D 形式:g[i, j] = Σ_m Σ_n f[m, n] h[i − m, j − n]。h 在图像处理里叫 mask、kernel 或 filter。做法:把 h 上下、左右各翻一次,中心对准 [i, j],对应相乘再求和。
<span class="en">Discrete 2D: flip the kernel in both axes, center it at [i, j], multiply and sum.</span>

![离散卷积:核翻转后盖在图上,乘加得到一个输出像素](img/f869a9298a1.jpg)

小例子(1D):f = [0, 0, 10, 10, 10, 0, 0],h = [1, 1, 1] / 3(对称核,翻转不变)。输出中间几位依次是 3.33, 6.67, 10, 6.67, 3.33。方波被磨成了梯形,这就是平滑。
<span class="en">A 3-tap mean filter turns the step [0,0,10,10,10,0,0] into a ramp 3.33, 6.67, 10, 6.67, 3.33.</span>

翻转容易忘。讲义例子:核里只有右下角是 1,翻转两次后跑到左上角,所以输出图是原图往右下平移,而不是往左上。
<span class="en">A kernel with a single 1 in the bottom-right corner shifts the image down and right, because of the double flip.</span>

边界问题:核盖到图像外面怎么办?三种补救:不处理边界(输出变小)、补常数(比如平均亮度)、镜像补边。讲义直说这些都是凑合,因为图外本来就没有测量值。
<span class="en">Border problem: ignore borders, pad with a constant, or pad by reflection. All are hacks.</span>

### 8.5.3 线性滤波:盒子核与高斯核 · Box and Gaussian filters

比方:盒子核像方形海绵,一块一样硬;高斯核像中间厚四周薄的软垫。
<span class="en">Analogy: a box filter is a uniform square sponge; a Gaussian is a pad that is thick in the middle and thin at the edges.</span>

盒子核:5×5 全是 1。每个输出是 25 个像素之和,亮度约放大 25 倍。例如原来平均 100,输出约 2500,8 位图会被截到 255,整张图发白。解决:每格改成 1/25,**核权重之和必须为 1**。
<span class="en">A 5×5 box of ones makes the image about 25× brighter and saturates. Normalize: weights must sum to 1.</span>

盒子核大了(21×21)会出现沿横竖方向的块状伪影,因为它的边是硬的直角边。换成中间高、四周平滑下降、旋转对称的核,结果就自然了。这个「模糊核」用高斯来写:
<span class="en">A large box filter produces blocky, axis-aligned artifacts. A rotationally symmetric fuzzy kernel looks natural; formalize it as a Gaussian.</span>

```
n_σ[i, j] = 1/(2πσ²) · exp( −(i² + j²) / (2σ²) )
核尺寸经验值:K ≈ 2πσ
```

σ 越大越模糊。高斯在无穷远才到 0,所以要截断。小例子:σ = 2,K ≈ 2π × 2 ≈ 12.6,取奇数 13,用 13×13 的核。
<span class="en">Larger σ blurs more. Rule of thumb K ≈ 2πσ; σ = 2 gives about 13×13.</span>

![σ = 4 的高斯核卷积后的平滑效果](img/fec04f1b2da.jpg)

高斯的大优点:**可分离**。exp(−(m² + n²)/2σ²) = exp(−m²/2σ²) · exp(−n²/2σ²),所以一个 K×K 的 2D 高斯 = 先横向 1D 高斯,再纵向 1D 高斯,结果完全一样。
<span class="en">The 2D Gaussian is separable: one K×K pass equals a horizontal 1D pass followed by a vertical 1D pass.</span>

代价对比(每个像素):2D 要 K² 次乘法、K² − 1 次加法;两次 1D 只要 2K 次乘法、2(K − 1) 次加法。K = 13 时是 169 次乘法对 26 次,约省 6.5 倍。核越大越划算。
<span class="en">Cost per pixel: K² vs 2K multiplications. For K = 13 that is 169 vs 26.</span>

### 8.5.4 非线性滤波:中值与双边 · Median and bilateral filters

比方:中值滤波像去掉最高分和最低分只看中间;双边滤波像只听「和你观点相近」的邻居。
<span class="en">Analogy: median filtering ignores extreme scores; bilateral filtering only listens to neighbors who are similar to you.</span>

高斯平滑去椒盐噪声(随机的纯黑纯白点)有两个毛病:噪声只被抹开没被去掉;边缘也被一起抹糊。
<span class="en">Gaussian smoothing does not remove outliers, it smears them, and it blurs edges.</span>

中值滤波:取 K×K 窗口内所有值,排序,取中间那个作为输出。小例子:3×3 窗口值为 10, 12, 255, 11, 13, 9, 10, 12, 11(中心 255 是白噪点)。排序后 9, 10, 10, 11, 11, 12, 12, 13, 255,中值 11。若用均值,得 343 / 9 ≈ 38.1,噪点把结果拉偏了。
<span class="en">Median of the 3×3 window is 11, while the mean is about 38.1. The outlier is rejected by the median.</span>

排序这一步不是线性的,所以中值滤波不能写成卷积。它对椒盐噪声很好,K = 3 就够。但低光下每个像素都带噪声时,要用大窗口(如 K = 11),细节也跟着丢了。
<span class="en">Sorting makes it non-linear. Great for salt-and-pepper noise; for dense low-light noise it needs large windows and loses detail.</span>

双边滤波(bilateral filter):在空间高斯之外,再乘一个亮度高斯,让和中心像素亮度差很多的邻居权重变小。
<span class="en">Bilateral filter: multiply the spatial Gaussian by a brightness Gaussian so that dissimilar neighbors get low weight.</span>

```
g[i,j] = (1/W_sb) Σ_m Σ_n f[m,n] · n_σs[i−m, j−n] · n_σb( f[m,n] − f[i,j] )
W_sb   = Σ_m Σ_n n_σs[i−m, j−n] · n_σb( f[m,n] − f[i,j] )   (每个像素都要重算)
```

小例子:中心亮度 100,两个邻居离中心一样远。A 在边缘同侧,亮度 102;B 在边缘另一侧,亮度 200。σb = 10。A 的亮度权重 exp(−2² / 200) = exp(−0.02) ≈ 0.98;B 的是 exp(−100² / 200) = exp(−50),约等于 0。所以 B 几乎不参与平均,边缘被保住。
<span class="en">With σb = 10, a neighbor differing by 2 keeps weight 0.98, one differing by 100 gets about exp(−50) ≈ 0. The edge survives.</span>

![高斯 vs 双边:同样 σs = 2,双边去噪且保住了头发和眼睛](img/f35c9dccaae.jpg)

参数怎么调:σs 越大越平滑,σs = 8 时出现「水彩画」效果。σb 趋于无穷时亮度高斯变平,双边就退化成普通高斯平滑。代价:核随像素变,不能用卷积,也不能用 FFT 加速。
<span class="en">Larger σs gives a painterly look; σb → ∞ reduces to plain Gaussian smoothing. The kernel changes per pixel, so no convolution or FFT shortcut.</span>

### 8.5.5 模板匹配与归一化互相关 · Template matching and NCC

比方:拿一张小贴纸在大图上挪,看哪里贴得最严丝合缝。
<span class="en">Analogy: slide a small sticker over the image and find where it fits best.</span>

最直接的打分是平方差和 SSD:E[i, j] = Σ_m Σ_n (f[m, n] − t[m − i, n − j])²。展开成 f² + t² − 2ft 三项。最小化 E 主要靠最大化最后一项,就是互相关:R_tf[i, j] = Σ_m Σ_n f[m, n] t[m − i, n − j]。
<span class="en">Minimizing SSD amounts to maximizing the cross-correlation term Σ f·t.</span>

互相关和卷积长得几乎一样,区别是**互相关不翻转**。这个差别让两者性质不同,例如卷积满足交换律,互相关一般不满足。
<span class="en">Correlation is convolution without the flip, and the two have different properties.</span>

问题:亮的区域天然得分高。讲义的 1D 例子里,和模板形状最像的信号 A 反而得分最低,因为 B、C 整体更亮。解决是归一化互相关 NCC:
<span class="en">Raw correlation favors bright regions. Normalized cross-correlation fixes this.</span>

```
N_tf[i,j] = Σ f[m,n] t[m−i,n−j] / sqrt( Σ f²[m,n] · Σ t²[m−i,n−j] )
```

小例子:模板 t = [1, 2, 1]。区域 A = [1, 2, 1](形状一样),区域 C = [5, 5, 5](只是亮)。原始互相关:A 得 1 + 4 + 1 = 6,C 得 5 + 10 + 5 = 20,C 赢了,错。NCC:A 得 6 / sqrt(6 × 6) = 1;C 得 20 / sqrt(75 × 6) = 20 / 21.2 ≈ 0.94。A 赢,对了。
<span class="en">Raw scores: A = 6, C = 20 (wrong). NCC: A = 1.0, C ≈ 0.94 (right).</span>

![模板匹配:在扑克牌里找国王的脸](img/fcdcd216b44.jpg)

局限:模板必须和目标大小、方向一致。目标被旋转或缩放,就要准备一堆模板,这也是后面 SIFT 要解决的问题。
<span class="en">Limitation: the template must match scale and orientation; rotation or scaling needs many templates.</span>

### 8.5.x 面试怎么问 · Likely questions

**Q:What is the difference between convolution and correlation, and when does it matter?**
卷积和互相关有什么区别,什么时候有影响?
> Convolution flips the kernel before sliding it; correlation does not. For a symmetric kernel like a Gaussian or a box, the two give the same result. For an asymmetric kernel, like a shift kernel or a Sobel derivative, the sign or direction flips. Convolution is commutative and associative, which lets me merge a cascade of filters into one kernel; correlation is what I actually use for template matching.

这段在说什么:翻不翻转是唯一区别,对称核无所谓,非对称核方向会反。
<span class="en">The only difference is the flip; it matters for asymmetric kernels.</span>

**Q:Why is Gaussian blur usually implemented as two 1D passes?**
为什么高斯模糊通常拆成两次 1D?
> The 2D Gaussian factors into a product of a function of x and a function of y, so it is separable. Filtering rows with a 1D Gaussian and then columns gives exactly the same output as the full 2D kernel. The cost per pixel drops from K squared to 2K multiplications, so for a 13 by 13 kernel that is 169 versus 26. On a drone running perception in real time, that kind of saving is what keeps preprocessing inside the frame budget.

这段在说什么:可分离让成本从 K² 降到 2K,实时系统里很关键。
<span class="en">Separability cuts cost from K² to 2K, which matters for real-time pipelines.</span>

**Q:How would you remove noise without blurring edges?**
怎么去噪又不糊边?
> It depends on the noise. For salt-and-pepper outliers I would use a small median filter, since sorting rejects extreme values. For dense sensor noise I would use a bilateral filter: it multiplies a spatial Gaussian with a brightness Gaussian, so pixels across an edge get almost zero weight. The cost is that the kernel changes at every pixel, so it cannot be done as a single convolution or with an FFT. If σ_b goes to infinity it becomes a plain Gaussian blur.

这段在说什么:椒盐用中值,普通噪声用双边;双边贵在每像素重算核。
<span class="en">Median for outliers, bilateral for dense noise; bilateral is per-pixel and not a convolution.</span>

**Q:Why use normalized cross-correlation for template matching?**
模板匹配为什么要用归一化互相关?
> Raw cross-correlation grows with the brightness of the image patch, so a bright flat region can outscore the true match. NCC divides by the energy of the patch and the template, so it measures shape similarity rather than brightness. In a drone setting where exposure changes from frame to frame, that invariance to brightness is important.

这段在说什么:NCC 除以能量,只比形状不比亮度。
<span class="en">NCC divides out energy so it compares shape, not brightness.</span>

## 8.6 图像处理(二):傅里叶与采样 · Image Processing II: Fourier and Sampling

这一讲解决的问题:换一个角度看图像,把它拆成一堆不同频率的正弦波。在这个「频域」里,卷积变成乘法,滤波、去运动模糊都更好做;同时它还能回答「像素要多密才不丢信息」这个采样问题。
<span class="en">View an image as a sum of sinusoids. In the frequency domain convolution becomes multiplication, which makes filtering and deblurring easier, and it explains how densely we must sample to avoid aliasing.</span>

### 8.6.1 傅里叶变换:把信号拆成正弦波 · The Fourier transform

比方:一段和弦可以拆成几个单音。傅里叶变换就是给信号做「拆音」。
<span class="en">Analogy: a chord can be split into individual notes; the Fourier transform does this for signals.</span>

基本零件是正弦波 f(x) = A sin(2πux + φ)。A 是振幅,u 是频率(每单位长度几个周期),φ 是相位(往左右挪了多少),周期 T = 1/u。小例子:u = 0.1 周期/像素,周期就是 10 个像素。
<span class="en">Building block: A sin(2πux + φ) with amplitude A, frequency u, phase φ, period T = 1/u. u = 0.1 cycles/pixel means a 10-pixel period.</span>

傅里叶的结论:任何周期函数都能写成无穷多个不同频率正弦波的加权和。方波只取前 8 个分量相加,就已经很像方波了。
<span class="en">Any periodic function is a weighted sum of sinusoids; eight terms already approximate a square wave well.</span>

![方波拆成振幅谱和相位谱](img/fcaf1abacc9.jpg)

```
正变换:F(u) = ∫ f(x) e^(−i2πux) dx
逆变换:f(x) = ∫ F(u) e^(+i2πux) du
欧拉公式:e^(iθ) = cos θ + i sin θ
振幅 |F(u)| = sqrt(Re² + Im²),相位 φ(u) = atan2(Im, Re)
```

F(u) 是复数,因为它要同时装下振幅和相位。正反变换之间来回切换不丢任何信息。
<span class="en">F(u) is complex because it stores both amplitude and phase. Switching between domains loses nothing.</span>

几个要背的变换对:cos(2πkx) 变成 ±k 处两个实数冲激;sin 变成 ±k 处两个虚数冲激,符号相反;常数 1 变成 u = 0 处一个冲激;冲激 δ(x) 变成一条平线(所有频率等量);方波(盒子核)变成 sinc,边走边振荡;高斯变成高斯,宽度和 1/a 成正比。
<span class="en">Key pairs: cos to two real deltas, sin to two imaginary deltas, constant to a delta at zero, delta to a flat line, box to sinc, Gaussian to Gaussian.</span>

最后一条体现「反比缩放」:空间里越宽,频域里越窄,反过来也一样。还有一个面试常考的性质:n 阶导数的傅里叶变换等于 (i2πu)ⁿ F(u)。也就是说,求导会放大高频,所以求导前要先平滑。
<span class="en">Inverse scaling: wider in space means narrower in frequency. Differentiation multiplies by (i2πu)ⁿ, boosting high frequencies.</span>

2D 图像里有两个频率 u(x 方向)和 v(y 方向)。显示时通常只画 log|F|,中心是零频,越往外频率越高。图像里的直边会在频谱上产生一条垂直于这条边的亮线。
<span class="en">In 2D there are frequencies u and v. Display log|F| with zero frequency at the center; straight edges create bright lines perpendicular to them.</span>

### 8.6.2 卷积定理 · The convolution theorem

比方:空间里的卷积是「滑动乘加」,很慢;到了频域,它就变成「逐个频率相乘」,很快。
<span class="en">Analogy: slow sliding multiply-add in space becomes a simple per-frequency product in the Fourier domain.</span>

```
g(x) = f(x) * h(x)    ⇔    G(u) = F(u) · H(u)
g(x) = f(x) · h(x)    ⇔    G(u) = F(u) * H(u)
```

证明思路:把卷积代进傅里叶积分,双重积分拆成两个单积分,换元 y = x − τ,一个是 F(u),一个是 H(u)。
<span class="en">Proof: substitute the convolution into the Fourier integral and split the double integral into F(u)·H(u).</span>

用法:要算 f * h,就先 FT 得 F 和 H,相乘得 G,再逆变换得 g。好处有两个。一是快:FFT 有很快的算法,核很大时比空间卷积便宜得多。二是看得懂:任何空间里设计的滤波器,都能直接看它对每个频率做了什么。
<span class="en">Compute F·H then invert. It is faster for large kernels because of the FFT, and it reveals what a filter does to each frequency.</span>

小例子(量级):一个 31×31 的核,空间卷积每个像素要 961 次乘法。用 FFT,每个像素的代价只和 log(像素数) 同量级,1024×1024 的图 log₂ 约为 20。核越大,频域越划算。
<span class="en">A 31×31 kernel costs 961 multiplications per pixel in space; FFT cost per pixel scales like log N, about 20 for a 1024×1024 image.</span>

高斯平滑在频域里怎么看:带噪信号的频谱里,有用信号是中间的尖峰,噪声是两侧的高频小鼓包。高斯核的频谱还是高斯,是一个低通滤波器。两者相乘,小鼓包被压掉,逆变换后信号就干净了。
<span class="en">Gaussian smoothing seen in frequency: the Gaussian's spectrum is a low-pass Gaussian; multiplying removes the high-frequency noise bumps.</span>

![频域相乘:高斯低通把噪声鼓包压掉](img/f1d3b1760bc.jpg)

### 8.6.3 频域滤波:低通、高通和相位 · Filtering in the frequency domain

比方:频谱像一个同心圆靶,中心是「大块颜色」,外圈是「细节和边」。
<span class="en">Analogy: the spectrum is a target; the center holds broad shading, the outer rings hold detail and edges.</span>

低通:只保留频谱中心一块,逆变换后图变模糊。切口越小越糊。切口边缘太硬会出现块状和振铃伪影,原因和盒子核一样:频域里的硬边对应空间里的 sinc 振荡。
<span class="en">Low-pass keeps the center: blur. A sharp cutoff causes ringing, just like a box filter.</span>

高通:挖掉中心,只留外圈。平坦区域全没了,只剩亮度快速变化的地方,也就是边和角。这提示边缘检测器本质上是高通滤波器,下一讲就从这里出发。
<span class="en">High-pass removes the center and leaves edges and corners, hinting that edge detectors are high-pass filters.</span>

噪声图的频谱在高频也很强。这意味着「去噪」和「保边」天生打架:两者都住在高频。
<span class="en">Noise has strong high frequencies, which is why denoising fights with edge preservation.</span>

相位比振幅更重要。讲义实验:保留梦露照片的振幅、把相位全设为 0,逆变换后完全认不出来;反过来保留相位、把振幅换成一堆自然图的平均振幅,还能清楚认出梦露。结构信息主要在相位里。
<span class="en">Phase matters more: zeroing phase destroys the image, while keeping phase with an average magnitude stays recognizable.</span>

混合图像(hybrid image):把梦露低通、爱因斯坦高通,两张相加。近看是爱因斯坦(高频细节),走远了人眼的 PSF 把高频滤掉,就只看到梦露。
<span class="en">Hybrid image: low-passed Monroe plus high-passed Einstein. Up close you see Einstein; far away the eye's PSF filters out high frequencies and you see Monroe.</span>

### 8.6.4 反卷积与维纳滤波 · Deconvolution and Wiener filtering

比方:运动模糊像把墨水在纸上抹了一道。反卷积是想把抹开的墨水收回来,但纸上的灰尘也会被一起放大。
<span class="en">Analogy: motion blur smears ink; undoing it also amplifies the dust on the paper.</span>

模型:拍照时手抖,g = f * h。f 是清晰场景,h 是运动模糊的 PSF(可以用手机里的 IMU 加速度计估出来),g 是拍到的图。频域里 G = F · H,所以最直接的恢复是 F′ = G / H,再逆变换。
<span class="en">Model g = f * h with h estimated from the IMU. Naive deconvolution: F′ = G / H, then invert.</span>

没有噪声时效果很好。加上噪声 η 就崩了,恢复出来全是雪花。原因有两条:H 在某些频率等于 0,除以 0 根本恢复不了;运动模糊是低通,高频处 H 很小,而噪声在高频很大,除完被放大很多倍。
<span class="en">With noise it fails: where H = 0 nothing is recoverable, and at high frequencies a tiny H divides large noise.</span>

![忽略噪声直接除以 H,噪声被严重放大](img/f769055ed96.jpg)

维纳反卷积在 G/H 后面乘一个衰减因子:
<span class="en">Wiener deconvolution multiplies G/H by an attenuation factor.</span>

```
F′(u,v) = G(u,v)/H(u,v) · 1 / ( 1 + NSR(u,v) / |H(u,v)|² )
NSR = 噪声功率 / 信号功率;实际常取一个常数 λ
```

NSR 大或 |H| 小时,因子变小,这个频率就少恢复一点。小例子:某高频 H = 0.01,取讲义用的 λ = 0.002。直接除是放大 1/0.01 = 100 倍。维纳:|H|² = 0.0001,NSR/|H|² = 20,因子 1/21,总放大 100/21 ≈ 4.8 倍。低频处 H = 1,因子 1/1.002 ≈ 1,几乎不动。
<span class="en">At H = 0.01 with λ = 0.002, naive gain is 100 but Wiener gain is about 4.8; at H = 1 the factor is about 1.</span>

讲义里 λ = 0.002 恢复出的图有一点颗粒感和振铃,但比拍到的模糊图清楚得多。
<span class="en">With λ = 0.002 the result has slight grain and ringing but is much sharper.</span>

### 8.6.5 采样定理与混叠 · Sampling and aliasing

比方:用快门拍转动的车轮,拍得太慢,轮子看起来像倒着转。这就是混叠。
<span class="en">Analogy: a wagon wheel filmed too slowly appears to spin backwards; that is aliasing.</span>

传感器把镜头形成的连续图像变成离散像素,就是采样。讲义的例子:同样的采样频率,低频正弦恢复得不错;高频正弦每个周期只采到一个点,恢复出来是一条平线,信息全丢,还可能造出原来没有的频率。图像里的表现是摩尔纹(Moiré)。
<span class="en">Sampling can lose information and create false frequencies. In images this shows up as Moiré patterns.</span>

![同样的采样密度,高频信号被采成一条平线](img/f2611b1a06e.jpg)

数学上,采样 = 连续信号乘上冲激串(Shah 函数,间隔 x₀)。冲激串的傅里叶变换还是冲激串,间隔 1/x₀。空间相乘等于频域卷积,所以采样后频谱 F(u) 被复制成一串,每隔 1/x₀ 一份。
<span class="en">Sampling multiplies by an impulse train of spacing x₀, whose transform is an impulse train of spacing 1/x₀, so the spectrum is replicated every 1/x₀.</span>

奈奎斯特定理:如果原信号最高频率 u_max ≤ 1/(2x₀),副本之间不重叠,用一个矩形窗切出一份再逆变换,就能**无损**恢复原信号。1/(2x₀) 叫奈奎斯特频率。如果 u_max 更高,副本重叠,重叠区里多出来的频率就是混叠,无法还原。
<span class="en">Nyquist: if u_max ≤ 1/(2x₀), copies do not overlap and the signal is perfectly recoverable. Otherwise copies overlap and alias.</span>

![u_max 超过奈奎斯特频率时,频谱副本重叠](img/fab81c25ef8.jpg)

小例子:像素间距 x₀ = 1,奈奎斯特频率 0.5 周期/像素。周期 4 像素的条纹(u = 0.25)安全。周期 1.5 像素的条纹(u ≈ 0.667)超了,它会被折叠成 |0.667 − 1| ≈ 0.333,看起来像周期 3 像素的假条纹。周期正好 1 像素(u = 1)会被折叠到 0,也就是讲义里那条平线。
<span class="en">With x₀ = 1, a 4-pixel period is safe; a 1.5-pixel period aliases to about a 3-pixel period; a 1-pixel period aliases to zero frequency.</span>

相机怎么防混叠:第一,每个像素有感光面积,本身就是一个盒子平均,相当于先低通再采样;第二,在传感器前加光学低通滤波器(抗混叠滤波器),把奈奎斯特频率以上的成分先砍掉。核心思想都是**先模糊,再采样**。
<span class="en">Cameras fight aliasing with area-sampling pixels (a box low-pass) and an optical anti-aliasing filter: blur before you sample.</span>

### 8.6.x 面试怎么问 · Likely questions

**Q:State the convolution theorem and explain why it is useful.**
讲一下卷积定理,它有什么用?
> Convolution in the spatial domain equals multiplication in the frequency domain, and multiplication in space equals convolution in frequency. Practically, for a large kernel I can FFT the image and the kernel, multiply, and inverse FFT, which is much cheaper than sliding the kernel. It also lets me read off what a filter does: a Gaussian is a low-pass filter because its transform is another Gaussian centered at zero frequency.

这段在说什么:卷积变乘法,大核用 FFT 更快,也能看清滤波器砍掉哪些频率。
<span class="en">Convolution becomes multiplication; FFT is faster for big kernels and shows the filter's frequency effect.</span>

**Q:What is aliasing and how do you prevent it?**
什么是混叠,怎么避免?
> Sampling replicates the spectrum every one over the sampling interval. If the signal has frequencies above half the sampling rate, the Nyquist frequency, the copies overlap and high frequencies fold back as false low frequencies, like Moiré patterns. You prevent it by low-pass filtering before sampling: pixels already average over their area, and many cameras add an optical anti-aliasing filter. The same rule applies when I downsample an image in a pipeline: blur first, then subsample, otherwise thin structures like wires or rails turn into fake patterns.

这段在说什么:超过奈奎斯特就折叠成假频率,办法是先低通再采样,下采样同理。
<span class="en">Frequencies above Nyquist fold back; low-pass before sampling or downsampling.</span>

**Q:Why does naive deconvolution amplify noise, and how does Wiener deconvolution help?**
为什么直接反卷积会放大噪声,维纳滤波怎么解决?
> Naive deconvolution divides G by H. A motion-blur PSF is low-pass, so H is tiny or zero at high frequencies, while sensor noise is strong there, so the division blows the noise up. Wiener deconvolution multiplies by one over one plus NSR over H squared, which shrinks the gain wherever the noise-to-signal ratio is high or H is small. In practice NSR is set to a constant. For a drone, the PSF can come from the IMU, which is the same idea the lecture uses for phone camera shake.

这段在说什么:H 小的高频被除爆,维纳按信噪比自动减小增益。
<span class="en">Small H at high frequency explodes noise; Wiener lowers the gain where NSR is high.</span>

## 8.7 边缘检测 · Edge Detection

这一讲解决的问题:把一张图变成一组「亮度突变」的点,也就是边缘,并给出每个边缘点的位置、强度和方向。路线是:一阶导(梯度)、二阶导(拉普拉斯)、两者结合的 Canny,最后用同样的导数思想找角点(Harris)。
<span class="en">Turn an image into points where intensity changes rapidly, with position, strength and orientation. Path: gradient, Laplacian, Canny, then corners with Harris.</span>

### 8.7.1 边缘是什么,好检测器要满足什么 · What is an edge

比方:画家几笔线条就能画出一座雕塑。边缘很稀疏,但信息量很大。
<span class="en">Analogy: an artist conveys a sculpture with a few strokes. Edges are sparse but information-rich.</span>

边缘就是一个小窗口里亮度沿某个方向快速变化的地方。物理成因有四种:表面法向突变(两个面拼接成折角)、深度突变(前面物体挡住后面)、表面反射率突变(瓶子上印的字)、光照突变(影子边界)。
<span class="en">Edges come from surface-normal, depth, reflectance and illumination discontinuities.</span>

真实边缘不是干净的阶跃,而是带噪声、被离散化的阶跃。理论推导统一用阶跃模型。
<span class="en">Real edges are noisy and discrete; theory uses the step-edge model.</span>

检测器要输出三样:位置(最好亚像素)、强度、方向。性能要求三条:检测率高(不漏也不多报)、定位准、对噪声不敏感。这三条后面会互相打架。
<span class="en">Outputs: position, magnitude, orientation. Requirements: high detection rate, good localization, low noise sensitivity.</span>

### 8.7.2 一阶导:梯度算子 · Gradient operators

比方:在山坡上找最陡的地方,坡度最大处就是边。
<span class="en">Analogy: the edge is where the hillside is steepest.</span>

1D 里,一阶导数的极值就是边缘位置,极值大小就是边缘强度。上升沿是正峰,下降沿是负峰,取绝对值后都变成峰。
<span class="en">In 1D, extrema of the first derivative mark edges; the absolute value gives location and strength.</span>

![一阶导的极值、二阶导的过零点都标出边缘](img/f2d59e72217.jpg)

2D 用梯度 ∇I = (∂I/∂x, ∂I/∂y)。竖直边只有 x 分量,水平边只有 y 分量,斜边两个都有。
<span class="en">2D gradient ∇I = (∂I/∂x, ∂I/∂y). Vertical edges have only an x component.</span>

```
强度  S = ||∇I|| = sqrt( (∂I/∂x)² + (∂I/∂y)² )
方向  θ = arctan( (∂I/∂y) / (∂I/∂x) )      (梯度方向垂直于边缘走向)
```

小例子:某像素 ∂I/∂x = 3,∂I/∂y = 4。强度 sqrt(9 + 16) = 5,方向 arctan(4/3) ≈ 53.1°。边缘本身沿着和它垂直的方向延伸。
<span class="en">Ix = 3, Iy = 4 gives magnitude 5 and direction about 53.1°; the edge runs perpendicular to that.</span>

离散图上用有限差分,至少要 2×2 窗口。像素间距 ε 不知道也无所谓,所有像素被同一个常数缩放,不影响方向。
<span class="en">Discrete images use finite differences over at least a 2×2 window; unknown pixel spacing only scales everything.</span>

常见算子从小到大:Roberts(2×2,沿对角线求导)、Prewitt(3×3)、Sobel 3×3、Sobel 5×5。小算子定位好但怕噪声,Roberts 只用 4 个数,坏一个结果就错。大算子相当于「小算子再卷一个平滑核」,抗噪好但定位差,因为会被远处内容干扰。
<span class="en">Roberts, Prewitt, Sobel 3×3 and 5×5: small means good localization but noise-sensitive; large means robust but poorly localized.</span>

![梯度算子对比:越大越抗噪、越难定位](img/ffaa35a93fe.jpg)

小例子:Sobel x 核(已翻转,按相关来用)是 [−1 0 1; −2 0 2; −1 0 1]。3×3 图块每行都是 [10, 10, 50]。输出 = 1×40 + 2×40 + 1×40 = 160。除以权重 8 得 20,正好等于「两像素跨度涨 40」的每像素斜率。
<span class="en">Sobel-x on rows [10, 10, 50] gives 160; divided by 8 that is 20 per pixel, the true slope.</span>

最后要阈值化。单阈值 T:大于等于 T 是边,小于不是。滞后阈值用两个 T0 < T1:低于 T0 不是边,高于 T1 一定是边,夹在中间的只有挨着「确定边」时才算边。小例子:T0 = 50、T1 = 100,强度 70 的像素旁边有个 120,算边;如果它周围都在 50 以下,就丢掉。
<span class="en">Hysteresis with T0 < T1: in-between pixels count only if a neighbor is a definite edge. With T0 = 50 and T1 = 100, a 70 next to a 120 is kept.</span>

阈值化后的边缘图还是零散的点。人眼会自动连成曲线,计算机不会,这就是下一讲边界检测要做的事。
<span class="en">Thresholded edges are still scattered; grouping them into curves is the next lecture's job.</span>

### 8.7.3 二阶导:拉普拉斯,以及噪声怎么办 · Laplacian and noise

比方:一阶导看「坡有多陡」,二阶导看「坡度从变陡转为变缓的那个拐点」。
<span class="en">Analogy: the first derivative measures steepness; the second derivative finds where steepening turns into flattening.</span>

边缘处一阶导是峰,二阶导从正跳到负,穿过 0,叫过零点(zero-crossing)。2D 用拉普拉斯 ∇²I = ∂²I/∂x² + ∂²I/∂y²。它只给位置,不给方向。
<span class="en">At an edge the second derivative crosses zero. The Laplacian ∇²I gives location only, no orientation.</span>

```
离散拉普拉斯核:           更准确(对方向不敏感)的版本:
      0  1  0                   1   4   1
(1/ε²) 1 −4  1        (1/6ε²)   4 −20   4
      0  1  0                   1   4   1
```

小例子(1D):f = [10, 10, 10, 50, 90, 90, 90]。中心差分一阶导 (f[i+1] − f[i−1])/2 在 i = 2, 3, 4 依次是 20, 40, 20,峰在 i = 3。二阶导 f[i+1] − 2f[i] + f[i−1] 在 i = 2, 3, 4 依次是 40, 0, −40,过零点也在 i = 3。两种方法找到同一个边。
<span class="en">First derivative 20, 40, 20 peaks at i = 3; second derivative 40, 0, −40 crosses zero at i = 3.</span>

噪声是大麻烦。噪声到处都在快速变化,而我们恰好在找快速变化。直接对带噪阶跃求导,边缘完全淹没。解决办法是先高斯平滑再求导。
<span class="en">Noise is rapid change everywhere, so raw derivatives bury the edge. Smooth with a Gaussian first.</span>

![先高斯平滑再求导,边缘处出现干净的峰](img/f12849ca8e2.jpg)

省一步的技巧:求导和高斯卷积都是线性的,可以交换顺序。∇(n_σ * f) = (∇n_σ) * f,先把高斯求导做成一个核(DoG,高斯导数),再和图卷一次。同理 ∇²(n_σ * f) = (∇²n_σ) * f,这个核叫 LoG(高斯拉普拉斯),形状像倒过来的墨西哥草帽。
<span class="en">Because both are linear, differentiate the Gaussian once: derivative of Gaussian, and Laplacian of Gaussian (the inverted Mexican hat).</span>

梯度 vs 拉普拉斯:梯度给位置、强度、方向,靠找极大值加阈值,要两次卷积加一步非线性(开方);拉普拉斯只给位置,靠找过零点,一次卷积,完全线性。
<span class="en">Gradient: location, magnitude, direction; two convolutions plus a non-linear step. Laplacian: location only; one linear convolution.</span>

### 8.7.4 Canny 边缘检测器 · Canny edge detector

比方:Canny 是「先用梯度找方向,再沿这个方向用二阶导精确定位」,两家之长都拿了。
<span class="en">Analogy: Canny uses the gradient to find the direction, then the second derivative along that direction to localize.</span>

讲义里的步骤:
<span class="en">Steps as given in the lecture:</span>

```
1. 高斯平滑:n_σ * I
2. Sobel 求梯度:∇(n_σ * I)
3. 每个像素算梯度强度 ||∇(n_σ * I)||
4. 每个像素算梯度方向 n̂ = ∇(n_σ * I) / ||∇(n_σ * I)||
5. 沿 n̂ 方向算 1D 二阶导 ∂²(n_σ * I)/∂n̂²
6. 找过零点,就是边缘位置
```

为什么沿梯度方向做 1D 二阶导:只看和边垂直的那条线,不受旁边无关像素干扰。注意,沿 n̂ 的二阶导过零,等价于「梯度强度在 n̂ 方向上取局部最大」。所以教科书里常写成「非极大值抑制 + 滞后阈值」,和这里是同一件事的两种说法。
<span class="en">A zero-crossing of the second derivative along n̂ is the same as a local maximum of gradient magnitude along n̂, which is why textbooks describe Canny as non-maximum suppression plus hysteresis.</span>

σ 是唯一的主参数,控制尺度。σ = 1 边很多,σ = 2 少一些,σ = 4 只剩大轮廓。好比砖墙:高分辨率下砖上的小孔也是边,平滑后只剩砖缝。
<span class="en">σ selects scale: σ = 1 gives many edges, σ = 4 only major contours, like brick pores versus brick borders.</span>

![Canny 在 σ = 1, 2, 4 下的结果](img/f9136df2e19.jpg)

讲义顺带讲了几个视错觉(Hering、咖啡馆墙、凸起棋盘):直线看起来弯、平行线看起来斜。结论是人眼对边缘和角点的感知有系统偏差。
<span class="en">Illusions such as Hering and Café Wall show that human edge perception is biased.</span>

### 8.7.5 Harris 角点与非极大值抑制 · Harris corners and NMS

比方:平地上往哪走都不变;在墙边只有一个方向会撞墙;在墙角两个方向都会撞墙。
<span class="en">Analogy: on flat ground nothing changes; along a wall one direction changes; in a corner two directions change.</span>

角点是两条边相交的地方,也就是小窗口里亮度在两个方向上都快速变化。做法:把窗口里每个像素的 (Ix, Iy) 画到一个平面上。平坦区是原点附近一小团;边缘区多出一条细长的条;角点区多出两条不同方向的条。
<span class="en">Plot each pixel's (Ix, Iy). Flat: a small cluster. Edge: one long streak. Corner: two streaks.</span>

用一个以原点为中心的椭圆去拟合这团点,看两个半轴 λ1(长)和 λ2(短)。方法和二值图求二阶矩一样:
<span class="en">Fit an ellipse centered at the origin using second moments; λ1 and λ2 are the semi-axes.</span>

```
a = Σ Ix²,  b = 2 Σ Ix·Iy,  c = Σ Iy²      (W 是以像素为中心的窗口)
λ1 = Emax = ½ [ a + c + sqrt( b² + (a − c)² ) ]
λ2 = Emin = ½ [ a + c − sqrt( b² + (a − c)² ) ]
```

这两个 λ 就是结构张量 [[ΣIx², ΣIxIy], [ΣIxIy, ΣIy²]] 的两个特征值,和教科书的写法一致。
<span class="en">These λ are the eigenvalues of the structure tensor, matching the textbook formulation.</span>

判读:两个都小是平坦;λ1 大 λ2 小是边;两个都大是角点。
<span class="en">Both small: flat. One large: edge. Both large: corner.</span>

![λ1、λ2 的大小区分平坦、边缘、角点](img/fc4b82329fc.jpg)

Harris 把两个数合成一个响应:R = λ1λ2 − k(λ1 + λ2)²,k 取 0.04 到 0.06(经验值)。R 大于阈值就是角点。
<span class="en">Harris response R = λ1λ2 − k(λ1 + λ2)² with k between 0.04 and 0.06.</span>

小例子(k = 0.05):边缘区 a = 100, b = 0, c = 1,得 λ1 = 100、λ2 = 1,R = 100 − 0.05 × 101² = 100 − 510.05 ≈ −410,负的,是边。角点区 a = c = 100, b = 0,λ1 = λ2 = 100,R = 10000 − 0.05 × 200² = 8000,很大,是角点。平坦区 a = c = 1,R = 1 − 0.05 × 4 = 0.8,很小。
<span class="en">Edge: R ≈ −410. Corner: R = 8000. Flat: R = 0.8.</span>

角点附近一片像素的 R 都很大,要用非极大值抑制(NMS)挑出真正的峰:拿 k×k 窗口滑过响应图,中心是窗口内最大值就保留,否则抑制。这个方法很通用,Hough 找峰也用它。
<span class="en">R is large around each corner, so use non-maximal suppression: keep a pixel only if it is the maximum in its window. Hough peak finding uses the same trick.</span>

### 8.7.x 面试怎么问 · Likely questions

**Q:Walk me through the Canny edge detector.**
讲一下 Canny 边缘检测。
> First smooth the image with a Gaussian of width sigma to suppress noise. Then compute the gradient, for example with Sobel, and get the magnitude and orientation at every pixel. Next, along the gradient direction, keep only points where the magnitude is a local maximum, which is the same as a zero-crossing of the second derivative along that direction. Finally apply hysteresis thresholding with a low and a high threshold, so weak edges survive only if they connect to strong ones. Sigma sets the scale: small sigma gives fine detail, large sigma gives only major contours.

这段在说什么:平滑、梯度、沿梯度方向取极大、双阈值,σ 控制尺度。
<span class="en">Smooth, gradient, thin along the gradient, hysteresis; σ sets scale.</span>

**Q:Gradient versus Laplacian for edge detection: what are the trade-offs?**
梯度和拉普拉斯检测边缘各有什么优劣?
> The gradient gives location, strength and orientation, but needs two convolutions and a non-linear magnitude step, plus a threshold. The Laplacian is a single linear convolution and finds edges as zero-crossings, but gives no orientation and is very sensitive to noise because it is a second derivative. In practice both are applied to a Gaussian-smoothed image, using derivative-of-Gaussian or Laplacian-of-Gaussian kernels so the smoothing and differentiation happen in one pass.

这段在说什么:梯度信息多但非线性,拉普拉斯简单但没方向且怕噪声,都要先高斯。
<span class="en">Gradient is richer, Laplacian is simpler but noisier; both need Gaussian smoothing.</span>

**Q:How does the Harris corner detector decide a pixel is a corner?**
Harris 怎么判断一个像素是角点?
> In a window around the pixel I collect the image gradients and build the second-moment matrix of Ix squared, Ix Iy, and Iy squared. Its two eigenvalues describe how the gradients spread: both small is flat, one large is an edge, both large is a corner. Harris avoids computing eigenvalues explicitly with R equals determinant minus k times trace squared, k around 0.04 to 0.06, then thresholds R and applies non-maximal suppression. For drone visual odometry, these corners are good points to track because they are localized in both directions.

这段在说什么:看梯度分布的两个特征值,两个都大是角点,再做 NMS;角点适合跟踪。
<span class="en">Both eigenvalues large means corner; threshold R and apply NMS. Corners are good for tracking.</span>
