## 8.15 由散焦求深度 · Depth from Defocus

这一讲解决的问题:镜头只能对准一个距离,离这个距离越远的东西越糊。反过来,量出每个点糊了多少,就能算出它有多远。单张图分不清「本来就糊」和「因为失焦才糊」,所以要用多张不同对焦设置的图。
<span class="en">Blur grows with distance from the focal plane, so measuring blur gives depth. A single image cannot separate inherent blur from defocus, so we use several images with different focus settings.</span>

### 8.15.1 模糊圆和点扩散函数 · Blur circle and PSF

比方:手电筒对着墙,离焦时光斑变成一个圆盘,离得越偏圆盘越大。
<span class="en">Analogy: an out-of-focus point becomes a disc, larger the further it is from focus.</span>

高斯透镜公式:1/f = 1/i + 1/o。f 是焦距,o 是物距,i 是清晰成像的像距。传感器不在 i 而在 s 处时,点变成直径 b 的模糊圆。由相似三角形:b = D |1 − s/i|,D 是光圈直径。
<span class="en">Gaussian lens law 1/f = 1/i + 1/o. With the sensor at s instead of i, the blur circle diameter is b = D |1 − s/i|.</span>

![传感器偏离像平面,点变成模糊圆](img/f4ecf3a3e14.jpg)

两点结论:b 只和物距有关,和点离光轴多远无关,所以同一深度的平面糊得一样。b 和 D 成正比,所以控制模糊有两个旋钮:移动传感器,或者改光圈。
<span class="en">b depends only on object distance, not on off-axis position. b is proportional to D, so blur is controlled by sensor position or aperture.</span>

模糊圆内的光强分布叫点扩散函数(PSF,也就是镜头的脉冲响应)。理想镜头是圆盘形(pillbox),圆内常数 4/(πb²),保证总能量不变。实际上有衍射、像差、像素积分,PSF 更像高斯。经验上取 σ ≈ b/2。
<span class="en">The PSF is the light distribution in the blur circle. Ideally a pillbox of height 4/(πb²); in practice closer to a Gaussian with σ ≈ b/2.</span>

### 8.15.2 散焦就是低通滤波 · Defocus as a low-pass filter

比方:散焦像给照片磨皮,大轮廓保留,细纹理被抹平。
<span class="en">Analogy: defocus is like skin smoothing; large shapes stay, fine texture disappears.</span>

如果一小块区域深度近似不变,散焦图像 f = f₀ * h,即清晰图卷积 PSF。在傅里叶域是相乘:F(u, v) = F₀(u, v) · H(u, v)。高斯的傅里叶变换还是高斯,所以散焦压低高频、保留低频。
<span class="en">Within a patch of constant depth, f = f₀ * h, so F = F₀ · H. A Gaussian H attenuates high frequencies: defocus is low-pass.</span>

![散焦在频域里是乘一个高斯](img/f80e2d26fb5.jpg)

推论有两个。第一,判断对焦要看高频。第二,没有纹理的表面清晰和模糊看起来一样,无法求深度。卷积模型只在局部成立,因为深度变化时 PSF 随位置变,不再是平移不变系统。
<span class="en">Focus must be judged from high frequencies, and textureless surfaces carry no depth signal. The convolution model only holds locally.</span>

### 8.15.3 由对焦求深度:扫一遍焦点 · Depth from focus

比方:转动对焦环,盯着一小块看它什么时候最清楚,记下那一刻的刻度。
<span class="en">Analogy: turn the focus ring, watch a patch, and note the setting where it is sharpest.</span>

做法:改变传感器位置 s,拍一组图,叫焦点堆栈(focal stack)。对每个小块找到最清晰的那一张,用它的 s 代入透镜公式:o = s f / (s − f)。
<span class="en">Capture a focal stack over sensor positions s. For each patch, find the sharpest frame and compute o = s f / (s − f).</span>

讲义的例子:f = 50 mm,最清晰在 s = 51.25 mm。o = 51.25 × 50 / 1.25 = 2050 mm = 2.05 m。传感器只挪了 1 毫米多,焦平面却在场景里移了好几米。所以精细控制光学就能覆盖很大的场景,也能用在显微镜上(移动载物台几微米)。
<span class="en">Lecture example: f = 50 mm, s = 51.25 mm gives o = 2.05 m. Tiny sensor motion sweeps the focal plane over large distances.</span>

![焦点堆栈里找最清晰的一张,代入透镜公式](img/f96cbae0de7.jpg)

怎么衡量「清晰」:用二阶导量高频。普通拉普拉斯 ∂²I/∂x² + ∂²I/∂y² 的两项可能正负抵消,所以用改进拉普拉斯 ∇²_M I = |∂²I/∂x²| + |∂²I/∂y²|。对焦度量 M(x, y) 是在 (2K+1)×(2K+1) 小窗口里把它累加。窗口要小(如 3×3),深度图的空间分辨率才高。
<span class="en">Use the modified Laplacian |I_xx| + |I_yy| summed over a small window as the focus measure, to avoid x and y terms cancelling.</span>

小例子:一个 3×3 区域,中心 10,左右都是 20,上下都是 0。I_xx = 20 − 2×10 + 20 = 20,I_yy = 0 − 20 + 0 = −20。普通拉普拉斯 = 0,看起来「完全不清晰」;改进拉普拉斯 = 40,正确反映出强烈的纹理。
<span class="en">Example: I_xx = 20, I_yy = −20. The Laplacian is 0, but the modified Laplacian is 40.</span>

### 8.15.4 高斯插值:用三张图找到峰值 · Gaussian interpolation

比方:只量了三个时刻的气温,用一条抛物线连起来,就能估出最高温出现在什么时候。
<span class="en">Analogy: fit a curve through three temperature readings to estimate when the peak occurred.</span>

问题:只拍 N 张图,深度就只能取 N 个离散值,深度图像台阶。拍更多图又慢。讲义观察到:对焦度量随 s 的变化像一条高斯曲线,M = M_p exp(−½ ((s − s̄)/σ_M)²)。取对数后是关于 s 的二次式,用最大的三个测量值就能解出 M_p、σ_M、s̄。
<span class="en">With N frames, depth is quantized to N levels. The focus measure vs s is Gaussian-like; taking logs gives a quadratic, so the three largest samples determine the peak s̄.</span>

等间隔 Δ 时,峰值位置可以写成 s̄ = s₂ + Δ (ln M₁ − ln M₃) / (2 (ln M₁ − 2 ln M₂ + ln M₃))(由讲义的一般闭式解在等间隔下化简)。
<span class="en">For equal spacing Δ, s̄ = s₂ + Δ (ln M₁ − ln M₃) / (2 (ln M₁ − 2 ln M₂ + ln M₃)).</span>

小例子:s = 33, 33.5, 34 mm,测得 ln M = 3.885, 4.585, 4.285。分子 3.885 − 4.285 = −0.4,分母 2 × (3.885 − 9.170 + 4.285) = 2 × (−1.0) = −2.0。s̄ = 33.5 + 0.5 × (−0.4)/(−2.0) = 33.6 mm。假设焦距 32 mm:插值后 o = 33.6 × 32 / 1.6 = 672 mm;不插值直接取 33.5,o = 33.5 × 32 / 1.5 ≈ 714.7 mm,差了 4 厘米多。
<span class="en">Example: peak at 33.6 mm instead of 33.5 mm; with an assumed f = 32 mm, depth changes from about 715 mm to 672 mm.</span>

![不插值是台阶,插值后表面平滑](img/f1d4a9a176a.jpg)

代价:通常要 10 到 20 张图,对实时系统太多。这就引出了只用两张图的「由散焦求深度」。
<span class="en">Depth from focus typically needs 10 to 20 images, too many for real time.</span>

### 8.15.5 由散焦求深度:两张图解出模糊量 · Depth from defocus with two images

比方:同一张底片用两种磨砂玻璃看,两次模糊程度的「比例」你是知道的,于是能反推出底片本身和每次的模糊量。
<span class="en">Analogy: view the same picture through two diffusers whose blur ratio you know, and solve for both blurs.</span>

只要知道模糊圆直径 b,就能直接求深度:由 b/D = (i − s)/i 得 i = Ds/(D − b),代入透镜公式得 o = s f / (s − f + b · (f/D)),其中 f/D 是光圈数(F-number)。
<span class="en">Knowing b gives depth directly: o = s f / (s − f + b (f/D)), where f/D is the F-number.</span>

小例子:f = 50 mm,f/D = 2(D = 25 mm),s = 51 mm。若 b = 0(正好清晰),o = 51 × 50 / 1 = 2550 mm。若测得 b = 0.02 mm,o = 2550 / (1 + 0.04) ≈ 2452 mm。
<span class="en">Example: b = 0 gives 2.55 m; b = 0.02 mm gives about 2.45 m.</span>

难点在于一张图里有两个未知数:清晰图 f 和 PSF 宽度 σ。两张不同对焦的图有三个未知数 f、σ₁、σ₂,还是少一个方程。补救:两张图只改光圈,不动传感器。因为 b = D |1 − s/i|,所以 σ₁/σ₂ = D₁/D₂,这是已知的第三个方程。
<span class="en">One image: unknowns f and σ. Two images: f, σ₁, σ₂, still one short. Changing only the aperture gives σ₁/σ₂ = D₁/D₂, the third equation.</span>

![两种光圈拍两张,模糊比例等于光圈比例](img/f5935830608.jpg)

Pentland 的朴素解法:在频域相除,清晰图 F 被消掉:G₁/G₂ = H₁/H₂。代入高斯,取对数得 σ₁² − σ₂² = (ln G₂ − ln G₁) / (2π²(u² + v²))。配合 σ₁/σ₂ = D₁/D₂ 解出 σ。例如 D₁/D₂ = 2,则 σ₁ = 2σ₂,3σ₂² 等于右边;若右边算出 0.75,σ₂ = 0.5,σ₁ = 1。问题是要用高频,而高频最受噪声影响,所以不稳定。
<span class="en">Pentland: divide in Fourier domain to cancel F, take logs, and solve with the aperture ratio. It relies on noisy high frequencies, so it is unstable.</span>

更稳的是基于重建的方法(Favaro 2003):找 σ₁ 和 f 使 E = ‖g₁ − h_σ₁ * f‖² + ‖g₂ − h_{σ₁D₂/D₁} * f‖² 最小,再由 b₁ = 2σ₁ 求深度。改动传感器位置拍两张也行,公式需要相应修改,原理不变。
<span class="en">Reconstruction-based DFD (Favaro 2003) minimizes the reconstruction error over σ₁ and f, then b₁ = 2σ₁ gives depth.</span>

实时系统:Nayar 1996 用分光镜把一束光分给两块传感器,两块离镜头的距离略有差别,同时拍到两张不同对焦的图,做到 30 帧每秒。因为无纹理表面没法用,系统还投射一个细密的光图案,保证到处都有纹理。这已经是主动照明的思路了,下一讲展开。
<span class="en">Nayar 1996: a beam splitter feeds two offset sensors for 30 fps DFD, plus a projected fine pattern to add texture, bridging to active illumination.</span>

### 8.15.x 面试怎么问 · Likely questions

**Q: How can you estimate depth from blur? Why does a single image not suffice?**
怎么从模糊估计深度?为什么一张图不够?
> Blur diameter is b equals D times one minus s over i, and through the thin lens law it maps directly to object distance. But a blurry patch could be a sharp image of a blurry texture or a defocused image of a sharp one; with one image I have two unknowns, the sharp patch and the blur width. Using two images with known aperture sizes gives the ratio of blur widths, which closes the system so I can solve for the blur and then the depth.

这段在说什么:模糊量能换算成深度,但单图分不清纹理本身和散焦,两张已知光圈的图补上约束。
<span class="en">Blur maps to depth, but one image confounds texture with defocus; two known apertures fix it.</span>

**Q: Depth from focus vs depth from defocus, what is the trade-off?**
由对焦求深度和由散焦求深度怎么取舍?
> Depth from focus sweeps the focal plane through a stack of 10 to 20 images and picks, per pixel, the setting with the highest focus measure, such as the sum of modified Laplacian. It is robust but slow, and I refine the peak with a Gaussian fit on the top three measurements. Depth from defocus needs only two images and estimates relative blur, so it can run at video rate, but it is more sensitive to noise and to the PSF model.

这段在说什么:对焦法稳但要很多张,散焦法两张就够能实时,但对噪声和 PSF 模型更敏感。
<span class="en">Focus sweep is robust but slow; defocus is fast but noise- and model-sensitive.</span>

**Q: Which focus measure would you use, and why not the plain Laplacian?**
用什么对焦度量?为什么不用普通拉普拉斯?
> Defocus is a low-pass filter, so sharpness shows up as high-frequency energy, which second derivatives capture. The plain Laplacian can cancel when the x and y second derivatives have opposite signs, so I use the absolute values summed, the modified Laplacian, accumulated over a small window like 3 by 3 to keep spatial resolution.

这段在说什么:清晰度就是高频能量,用两项取绝对值的改进拉普拉斯避免抵消,小窗口保分辨率。
<span class="en">Sharpness is high-frequency energy; the modified Laplacian avoids cancellation.</span>

和 Byte Veda 的联系:无人机相机一般是固定焦距、景深很大,散焦线索弱,所以较少直接用来测深。但两点值得提:手机的自动对焦就是在线跑「由对焦求深度」;无纹理表面没信号这件事,和被动双目在白墙上失败是同一个原因,解决办法也一样,打主动纹理光。
<span class="en">Drone cameras have deep depth of field, so defocus cues are weak. But autofocus is online depth from focus, and the textureless failure mode matches passive stereo, with the same fix: projected texture.</span>

## 8.16 主动照明方法:结构光与飞行时间 · Active Illumination Methods

这一讲解决的问题:被动相机只能看,主动方法自己往场景里打光。打一个点、一条线、一组编码条纹,或者一束调制过的光,就能直接、精确地测出每个点的深度。这正是结构光相机和 ToF 深度相机(包括车载激光雷达)的原理。
<span class="en">Instead of passively observing, active methods project controlled light (points, stripes, coded patterns or modulated light) to measure depth directly and precisely. This is the principle behind structured-light cameras, ToF cameras and lidar.</span>

### 8.16.1 从光度立体到光度采样 · From photometric stereo to photometric sampling

比方:光度立体是三盏灯问路,光度采样是一圈灯一起问,问得多就能连材质一起猜出来。
<span class="en">Analogy: photometric stereo asks three lights; photometric sampling asks a whole ring of them, enough to infer the material too.</span>

光度立体(8.13)假设 BRDF 已知,三盏灯求法向量。光度采样(Nayar 1989)只假设 BRDF 的模型形式已知(漫反射加高光),参数未知,于是用更多光源,同时求出法向量和反射参数。每个点可以是漫反射、镜面或两者混合。
<span class="en">Photometric sampling assumes a BRDF model with unknown parameters (diffuse plus specular) and uses many lights to estimate both normals and reflectance parameters per point.</span>

一个细节:光源前面加漫射板。完美镜面半球需要无穷多点光源才能让每个点都有读数;加漫射板后每个点光源变成面光源,亮度函数互相重叠,少量光源就能覆盖所有法向量。
<span class="en">A diffuser turns point sources into overlapping area sources, so even a mirror hemisphere gets readings everywhere.</span>

Debevec 团队的 Light Stage 把这个思路做到极致:大量可控 LED 加高速相机,每秒几千张,能实时捕捉人的形状和反射属性,用于好莱坞的重打光(relighting)。光源较远时,新光照下的图像就是已拍图像的线性组合。
<span class="en">Debevec's Light Stage uses many LEDs and high-speed cameras for real-time shape and reflectance capture; distant relighting is a linear combination of captured images.</span>

### 8.16.2 三角测量:打一个点,打一条线 · Triangulation with a point or a stripe

比方:你站在 A 点用激光笔指着墙上一点,朋友在 B 点看到这个光点。两条视线一交,点的位置就定了。两人之间的距离叫基线。
<span class="en">Analogy: a laser from A and a viewer at B; the two rays intersect at the 3D point. The distance between them is the baseline.</span>

点扫描:坐标原点放在相机针孔。激光射线已知:(x − x₀)/a = (y − y₀)/b = (z − z₀)/c。相机看到亮点在 (xᵢ, yᵢ),透视投影给出视线:x = xᵢ z/f,y = yᵢ z/f。两条线的交点就是 (x, y, z)。实际中先拍一张不开激光的背景图 I_B,再拍开激光的 I_P,相减后亮点一目了然,取质心。
<span class="en">Point scanning: intersect the known laser ray with the camera ray x = xᵢz/f, y = yᵢz/f. Subtract a background image to find the spot and use its centroid.</span>

代价:一张图只测一个点。640×480 的深度图要 307,200 张,按 30 帧每秒要 10,240 秒,约 3 小时。
<span class="en">One image per pixel: 307,200 images, about 3 hours at 30 fps.</span>

光条法(light striping):投影仪打出一个光平面 Ax + By + Cz + D = 0。它和场景相交成一条曲线。曲线上每个亮点的视线和光平面求交:把 x = xᵢz/f、y = yᵢz/f 代入平面方程,得
z = −D f / (A xᵢ + B yᵢ + C f)
再代回求 x、y。
<span class="en">Light striping: intersect each camera ray with the projected light plane, giving z = −Df / (A xᵢ + B yᵢ + C f).</span>

![相机射线和光平面求交得到 3D 点](img/fbeb6beed9b.jpg)

小例子:光平面 x + 0.5z − 0.5 = 0(A = 1, B = 0, C = 0.5, D = −0.5),f = 500 像素,亮点在 xᵢ = 150, yᵢ = 0。z = 0.5 × 500 / (150 + 250) = 250 / 400 = 0.625 m。x = 150 × 0.625 / 500 = 0.1875 m。验算:0.1875 + 0.3125 − 0.5 = 0。
<span class="en">Example: z = 250/400 = 0.625 m, x = 0.1875 m, which satisfies the plane equation.</span>

代价:一张图测一列。640 列要 640 张,30 帧每秒约 21 秒。能不能一次打多条?不行。相机看到一条亮线,不知道它是投影仪的第几列,场景深度复杂时每种对应都能给出一个看似合理的点。这就是对应歧义,也是后面所有编码方法要解决的核心问题。
<span class="en">One image per column: 640 images, about 21 s. Projecting several stripes at once is ambiguous: which projector column made this curve? Coding solves exactly this correspondence problem.</span>

### 8.16.3 编码结构光:二进制、格雷码、多色 · Coded structured light

比方:给每一列发一个「身份证号」,一位一位地拍出来。拍完几张图,每个像素读出自己的号码,就知道是哪一列照亮了它。
<span class="en">Analogy: give each projector column an ID number, transmitted one bit per image; each pixel reads its ID across the images.</span>

二进制编码(Posdamer 1981):7 条光条编号 1 到 7,用 3 位二进制表示。第 k 张图只打开第 k 位为 1 的光条。某个像素在三张图里是 亮、暗、亮,读出 101,就是第 5 条。n 张图能区分 2ⁿ − 1 条(全 0 码不用,因为全暗没信息)。8 张图可以区分 255 条。
<span class="en">Binary coding: n images distinguish 2ⁿ − 1 stripes. On-off-on reads 101, stripe 5. Eight images give 255 stripes.</span>

![三张二进制图案区分 7 条光条](img/f2131617be1.jpg)

小例子:要区分 640 列,需要 ⌈log₂(641)⌉ 张。2⁹ = 512 < 641,2¹⁰ = 1024 ≥ 641,所以 10 张。比光条法的 640 张少了 64 倍。
<span class="en">640 columns need ⌈log₂ 641⌉ = 10 images instead of 640.</span>

光渗(light bleeding)问题:投影仪和相机景深有限,图案边缘会模糊。在亮暗交界处,像素既不亮也不暗,阈值一判就可能错。错一位,光条号可能差很远,深度就错很多。7 条的普通二进制一共有 10 处交界。
<span class="en">Light bleeding: blur at on/off transitions makes thresholding unreliable, and one wrong bit can jump the stripe index far. Plain binary for 7 stripes has 10 transitions.</span>

格雷码(Inokuchi 1984):重新给光条编号,让相邻光条只差一位。7 条的格雷码依次为 001, 011, 010, 110, 111, 101, 100。交界从 10 处降到 6 处。而且相邻光条只差一位,交界处判错时,结果最多偏到隔壁那一条,误差有界。计算方法:g = n XOR (n >> 1),例如 n = 5 = 101,101 XOR 010 = 111。
<span class="en">Gray code makes adjacent stripes differ in one bit: transitions drop from 10 to 6, and a boundary error only moves to the neighboring stripe. g = n XOR (n >> 1).</span>

![格雷码把交界数从 10 降到 6](img/f949afdc945.jpg)

k 进制(彩色)编码:每位用 k 种亮度或颜色。n 张图能区分 kⁿ 条,若其中一个级别是全黑,则是 kⁿ − 1 条。用红绿蓝三色(Caspi 1998),7 条只要 2 张图:第一张绿、第二张蓝,读出 (1, 2),就是第 5 条。640 列用三色需要 ⌈log₃ 641⌉ = 6 张(3⁵ = 243,3⁶ = 729)。
<span class="en">k-ary coding distinguishes kⁿ (or kⁿ − 1) stripes in n images. RGB codes 7 stripes in 2 images; 640 columns in 6.</span>

代价:颜色多了,投影仪和相机的光谱带宽都宽,物体本身也有颜色。红光打在深蓝色物体上几乎没有反射。所以彩色编码只适合灰色物体为主的场景。
<span class="en">More colors are hard to tell apart due to broad spectral bands and object color; red on deep blue returns nothing. Works best on gray scenes.</span>

### 8.16.4 连续图案:强度比与相移 · Intensity ratio and phase shifting

比方:不再发离散的身份证号,而是让亮度本身随列号连续变化。像温度计一样,读出亮度就读出了列号。
<span class="en">Analogy: instead of discrete IDs, brightness itself encodes the column, like reading a thermometer.</span>

强度比法(Carrihill 1985):第一张打线性斜坡 L₁(从亮到 0),第二张打均匀光 L₂。像素亮度 I₁ = ρL₁,I₂ = ρL₂,ρ 包含反照率、法向量和相机增益,未知。相除后 ρ 消掉:I₁/I₂ = L₁/L₂,这个比值随列号单调变化,直接查出 x_p。只要 2 张图。例如 L₁ 从 255 降到 0,L₂ = 255,测得 I₁ = 60, I₂ = 120,比值 0.5,就是中间那一列。缺点:对噪声敏感,要高动态范围相机;8 位投影仪只有 256 级,超过 255 列就有相邻列亮度相同。
<span class="en">Intensity ratio: ramp plus uniform image; the ratio cancels unknown albedo and maps monotonically to the column. Only 2 images, but noise-sensitive and limited by projector bit depth.</span>

相移法(Wust 1991,工业里用得最多):投影余弦条纹 L₁(x_p) = a + b + b cos(2πx_p/P),P 是周期,a 是未知的环境光。像素亮度 I₁ = ρa + ρb + ρb cos(2πx_p/P),三个未知数:ρa、ρb、x_p。于是再打两张相位平移 −2π/3 和 +2π/3 的图案,得到 I₂、I₃。三个方程三个未知数,解得
x_p = (P / 2π) · tan⁻¹( √3 (I₂ − I₃) / (2I₁ − I₂ − I₃) )
<span class="en">Phase shifting: three cosine patterns shifted by 2π/3. Unknowns ρa, ρb and x_p; the closed form is x_p = (P/2π) atan(√3(I₂ − I₃)/(2I₁ − I₂ − I₃)).</span>

为什么成立(自己推一遍):记 θ = 2πx_p/P,A = ρ(a + b),B = ρb。I₂ − I₃ = B[cos(θ − 2π/3) − cos(θ + 2π/3)] = 2B sinθ sin(2π/3) = √3 B sinθ。2I₁ − I₂ − I₃ = 2B cosθ − 2B cosθ cos(2π/3) = 3B cosθ。所以 √3(I₂ − I₃)/(2I₁ − I₂ − I₃) = tanθ。A 和 B 都消掉了,环境光和反照率不影响结果。
<span class="en">Derivation: numerator gives √3 B sinθ, denominator 3B cosθ, so the ratio is tanθ and ambient light and albedo cancel.</span>

![三幅相移余弦图案和求列号的公式](img/fa6ecd7f6e4.jpg)

小例子:A = 100,B = 50,真实 θ = 60°。I₁ = 100 + 50 cos60° = 125;I₂ = 100 + 50 cos(−60°) = 125;I₃ = 100 + 50 cos180° = 50。代入:√3 × 75 / (250 − 125 − 50) = √3 × 75 / 75 = √3,tan⁻¹(√3) = 60°。若周期 P = 30 列,x_p = 30 × 60/360 = 5,即一个周期内的第 5 列。
<span class="en">Example: I = (125, 125, 50) gives tanθ = √3, θ = 60°, so x_p = 5 within a period of 30 columns.</span>

两点实践提醒(讲义之外的常识,面试常追问):实现时用 atan2 才能得到 0 到 2π 的完整相位;余弦是周期的,只能知道「周期内第几列」,还要配合格雷码或多频条纹做相位展开(unwrapping),确定是第几个周期。
<span class="en">Beyond the lecture: use atan2 for the full phase range, and phase repeats every period, so combine with Gray code or multi-frequency patterns to unwrap it.</span>

### 8.16.5 方法对比与难题 · Comparison and open problems

比方:点扫描最慢最稳,连续图案最快最娇气,编码法居中。
<span class="en">Analogy: point scanning is slowest and safest, continuous patterns fastest and most fragile, coding sits in between.</span>

所需图像数(N×M 为图像大小,N 为列数,k 为颜色数):
```
方法                      图像数
点扫描                    N·M
光条                      N
二进制编码                ⌈log₂(N+1)⌉
k 进制(彩色)编码        ⌈log_k(N+1)⌉
强度比                    2
相移                      3
```
<span class="en">Images needed: NM, N, ⌈log₂(N+1)⌉, ⌈log_k(N+1)⌉, 2 and 3 respectively.</span>

取舍:强度比和相移最省图,但依赖精确的亮度值,相机和投影仪都要做辐射标定(radiometric calibration,让亮度读数和真实光强对得上)。离散编码只需判断亮或暗,更抗噪。实际系统(如 Omron 的电路板 3D 检测)把板子切成小块,逐块做相移,几秒得到整板 3D 模型。数字米开朗基罗项目用结构光把大卫像扫到 1/4 毫米精度。
<span class="en">Fewer images means more reliance on exact intensities and radiometric calibration; binary codes only need on/off decisions. Omron PCB inspection uses tiled phase shifting; the Digital Michelangelo scan reached 1/4 mm.</span>

结构光仍然搞不定的材质:镜面(反射光不朝相机)、半透明如大理石(次表面散射,光从旁边冒出来)、雾和浑水(介质衰减并自己发亮)、透明玻璃(光直接穿过)、头发(一根比一个像素还细)。
<span class="en">Open problems: specular, subsurface scattering, participating media, transparent objects and hair.</span>

### 8.16.6 飞行时间:脉冲与连续调制 · Time of flight

比方:蝙蝠喊一声听回声,回声越晚,东西越远。ToF 用光代替声音。
<span class="en">Analogy: bat echolocation, but with light instead of sound.</span>

光速约 3×10⁸ m/s,所以时间精度要求极高。讲义里伽利略的灯笼实验:两人相距 1000 m,往返 2000 m 只需约 6.6 微秒,远快于人的反应,注定失败。
<span class="en">Light is fast: 2000 m takes about 6.6 μs, far below human reaction time, which doomed Galileo's lantern experiment.</span>

脉冲调制:发一个又短又亮的光脉冲,用纳秒级秒表测回波延迟 Δt,深度 d = c·Δt/2(往返除以 2)。小例子:1 ns 的计时误差对应 3×10⁸ × 10⁻⁹ / 2 = 0.15 m。这就是为什么需要纳秒级电子学。
<span class="en">Pulse ToF: d = cΔt/2. A 1 ns timing error equals 15 cm of depth, hence nanosecond electronics.</span>

连续调制:光源亮度按 cos(ωt) 随时间调制(调的是亮度,和光的波长无关)。回波 L_scene = O + A cos(ωt − φ),O 是环境光,A 是衰减,φ 是相位差。传感器在曝光时间内把回波和参考信号 S_ref = cos(ωt − δ) 相乘积分(相当于随时间改变增益),得到 I(δ) = P + Q cos(δ − φ)。三个未知数 P、Q、φ,所以取三个参考相位 δ₁, δ₂, δ₃ 测三次。
<span class="en">Continuous-wave ToF: correlate the returned signal with a reference of phase δ to get I(δ) = P + Q cos(δ − φ); three δ values solve for P, Q and φ.</span>

由相位求深度:d = c · φ / (4πf),其中 f = ω/2π 是调制频率。讲义的例子:φ = π,f = 30 MHz,d = 3×10⁸ × π / (4π × 3×10⁷) = 3×10⁸ / 1.2×10⁸ = 2.5 m。
<span class="en">Depth from phase: d = cφ/(4πf). φ = π at 30 MHz gives 2.5 m.</span>

![由相位差求深度,φ = π 和 30 MHz 时 d = 2.5 m](img/ffa009b3bfe.jpg)

两个值得说出口的推论:
1. 相位最多到 2π,所以无歧义量程是 c/(2f)。30 MHz 时是 3×10⁸ / 6×10⁷ = 5 m,5.5 m 处的物体会被读成 0.5 m。提高频率精度更高但量程更短,常用多频率组合解决。
2. 取 δ = 0, 2π/3, 4π/3 时,三个读数和相移结构光的三个方程形式完全相同,所以 φ 也是 tan⁻¹(√3(I₂ − I₃)/(2I₁ − I₂ − I₃))。验算:P = 100, Q = 50, φ = π,得 I = (50, 125, 125),分子为 0、分母为 −150,atan2 给出 π。同一套三步相移数学,结构光用在空间上,ToF 用在时间上。
<span class="en">Unambiguous range is c/(2f), 5 m at 30 MHz. With δ = 0, 2π/3, 4π/3, the math is identical to structured-light phase shifting: space versus time.</span>

应用:车载 ToF(激光雷达)机械旋转扫描得到 360° 点云,能看清远处的车和行人,一度比整车还贵。近距离的 ToF 相机(如 PMD)用面阵传感器一次拍出整幅深度图,已经进入手机和平板。讲义强调 ToF 相对结构光的最大优势:远距离也能保持高精度。
<span class="en">Automotive lidar scans mechanically for 360° point clouds; short-range ToF cameras use pixel arrays and are in phones. ToF keeps accuracy at long range, unlike triangulation.</span>

### 8.16.x 面试怎么问 · Likely questions

**Q: Compare structured light and time-of-flight depth sensing. When would you choose each?**
比较结构光和 ToF 深度感知,什么场景选哪个?
> Structured light triangulates: it projects known patterns, solves the correspondence between camera pixels and projector columns, and intersects the camera ray with the projector plane. It gives very high accuracy at short range, which is why it dominates PCB inspection and face scanning, but accuracy falls with distance and it needs a baseline. Time of flight measures the round-trip time or the phase of modulated light, so it needs no baseline and stays accurate at long range. I would pick structured light for close-range, high-detail capture and ToF or lidar for room-scale or outdoor range.

这段在说什么:结构光靠三角测量,近处极准但随距离变差;ToF 测时间或相位,无需基线,远距离也准。
<span class="en">Triangulation is precise up close; ToF needs no baseline and works at long range.</span>

**Q: Why use Gray code instead of plain binary patterns?**
为什么用格雷码而不是普通二进制?
> Projector and camera defocus blur the pattern edges, so pixels at on-off transitions are easy to misclassify, and one wrong bit in plain binary can jump the stripe index far away. Gray code orders the codes so neighboring stripes differ in exactly one bit. That reduces the number of transitions, from 10 to 6 for seven stripes, and a misread at a boundary only moves you to the adjacent stripe, so the depth error stays bounded.

这段在说什么:交界处易判错,格雷码让相邻只差一位,交界更少,错了也只错到隔壁。
<span class="en">Fewer transitions, and boundary errors stay local.</span>

**Q: Derive how three-step phase shifting recovers the projector column.**
推导三步相移怎么求出投影仪列号。
> Each pixel sees I equals A plus B cos of theta plus a known shift, where A includes ambient light and albedo, B is the modulation, and theta is two pi x over P. With shifts of minus, zero and plus two pi over three, I2 minus I3 equals root three B sin theta and 2 I1 minus I2 minus I3 equals 3 B cos theta. Their ratio gives tan theta, so A and B cancel. Then x equals P over two pi times theta, and I use atan2 plus Gray code or multiple frequencies to unwrap the period.

这段在说什么:三个方程消去环境光和反照率,比值就是 tanθ,再换算成列号并做相位展开。
<span class="en">Three equations cancel ambient and albedo, the ratio is tanθ, then unwrap.</span>

**Q: A continuous-wave ToF camera at 30 MHz reads 0.5 m on an object you know is far away. What happened?**
30 MHz 的连续波 ToF 读出 0.5 m,但物体明明很远,怎么回事?
> Phase wraps every two pi, so the unambiguous range is c over 2f, which is 5 meters at 30 megahertz. An object at 5.5 meters produces the same phase as one at 0.5 meters. The fix is to measure at two or more modulation frequencies and pick the distance consistent with all of them, trading some frame rate for range. Multipath and strong ambient light are other common error sources to check.

这段在说什么:相位卷绕,量程只有 c/2f = 5 m,5.5 m 被读成 0.5 m,用多频率解决。
<span class="en">Phase wrapping limits range to c/2f; use multiple frequencies.</span>

和 Byte Veda 的联系:无人机做 3D 感知,常见选择是被动双目、ToF 或激光雷达。户外强阳光会淹没投影图案,所以结构光多用于室内近距离;ToF 和激光雷达在户外和远距离更稳,但要注意量程卷绕和功耗。被动双目在白墙这类无纹理面会失败,主动红外散斑正是为此而加。能把对应问题、三角测量、相位测量串起来讲,就能覆盖这类岗位的深度传感器问题。
<span class="en">For drones: sunlight washes out projected patterns, so structured light suits indoor close range; ToF and lidar are more robust outdoors but watch phase wrapping and power. Active IR texture rescues stereo on textureless surfaces.</span>

## 8.17 相机标定 · Camera Calibration

这一讲解决的问题:照片里的点只有像素坐标,机器人要的是毫米级的真实 3D 坐标。要把两者连起来,得知道相机在世界里的位置朝向(外参),还得知道相机怎么把 3D 点投到像素上(内参)。求出这两组参数的过程就叫相机标定。最后用两台标定好的相机做最简单的立体视觉,把深度算出来。
<span class="en">Images measure pixels, but robots need metric 3D coordinates in a world frame. Calibration recovers the camera's external parameters (pose) and internal parameters (how 3D points map to pixels). Two calibrated cameras then give depth through simple stereo.</span>

### 8.17.1 从 3D 到像素:内参矩阵 · Forward model and the intrinsic matrix

比方:内参就是相机的「出厂规格」,焦距多长、像素多密、画面中心在哪。换个房间拍照它也不变。
<span class="en">Analogy: intrinsics are the camera's factory specs. They do not change when you move the camera.</span>

前向成像模型分两步。第一步,把世界坐标 x_w 换成相机坐标 x_c(坐标变换)。第二步,用透视投影把 x_c 变成像素 (u, v)。
<span class="en">The forward imaging model has two steps: world-to-camera coordinate transformation, then perspective projection to pixels.</span>

![前向成像模型:世界坐标经外参到相机坐标,再经内参到像素](img/f8cce8d5019.jpg)

透视投影本来是 x_i = f · x_c / z_c,单位是毫米。传感器量的是像素,所以乘上像素密度 m_x、m_y(每毫米几个像素),再加上主点 (o_x, o_y)。主点是光轴扎穿传感器的那个像素,一般不在正中间。
<span class="en">Perspective projection gives millimetres. Multiply by pixel densities m_x, m_y and add the principal point (o_x, o_y), where the optical axis pierces the sensor.</span>

最后合并成:u = f_x · x_c / z_c + o_x,v = f_y · y_c / z_c + o_y,其中 f_x = m_x · f,f_y = m_y · f,单位是像素。四个内参就是 (f_x, f_y, o_x, o_y)。像素可以是长方形,所以 f_x 不一定等于 f_y。
<span class="en">u = f_x x_c/z_c + o_x and v = f_y y_c/z_c + o_y, with f_x = m_x f and f_y = m_y f in pixels. The four intrinsics are (f_x, f_y, o_x, o_y).</span>

问题是 z_c 在分母上,方程是非线性的。用齐次坐标就能变线性:把 (u, v, 1) 乘上 z_c,写成 (z_c·u, z_c·v, z_c) = M_int · (x_c, y_c, z_c, 1)。
<span class="en">Division by z_c makes it non-linear. Homogeneous coordinates turn it into one linear matrix product.</span>

```
         | f_x  0   o_x  0 |
M_int =  |  0  f_y  o_y  0 |  = [K | 0]      K 是左边 3×3,上三角,叫标定矩阵
         |  0   0    1   0 |
```
<span class="en">M_int = [K | 0], where the 3×3 calibration matrix K is upper triangular.</span>

小例子:f = 4 mm,m_x = m_y = 200 像素/mm,所以 f_x = f_y = 800。主点 (320, 240)。相机坐标里一个点 (0.5, −0.25, 2.0) 米。u = 800 × 0.5 / 2 + 320 = 520,v = 800 × (−0.25) / 2 + 240 = 140。用矩阵算:第一行 800 × 0.5 + 320 × 2 = 1040,第二行 −200 + 480 = 280,第三行 2。除以 2 得 (520, 140),一样。
<span class="en">Example: f_x = f_y = 800, principal point (320, 240), point (0.5, −0.25, 2.0) m maps to pixel (520, 140). The homogeneous product gives (1040, 280, 2), which divides to the same result.</span>

局限:这是针孔模型。真实镜头有径向畸变(点往外或往里偏,离中心越远偏得越多)和切向畸变(有扭转)。讲义把畸变忽略了,实际标定要多加几个畸变系数。
<span class="en">This is a pinhole model. Real lenses add radial and tangential distortion, which need extra coefficients. The lecture ignores them.</span>

### 8.17.2 外参与投影矩阵 · Extrinsics and the projection matrix

比方:外参是「相机此刻站在哪、脸朝哪」。同一台相机挪个位置,外参就变了。
<span class="en">Analogy: extrinsics are where the camera stands and which way it faces right now.</span>

相机在世界里的位置是 c_w,朝向是 3×3 旋转矩阵 R。R 的三行分别是相机 x、y、z 轴在世界坐标里的方向。R 是正交矩阵,所以 R⁻¹ = Rᵀ。
<span class="en">Camera position c_w and rotation R. The rows of R are the camera axes expressed in the world frame. R is orthonormal, so its inverse is its transpose.</span>

世界点变到相机坐标:x_c = R(x_w − c_w) = R·x_w + t,其中 t = −R·c_w。写成齐次形式就是一个 4×4 的外参矩阵 M_ext = [R t; 0 0 0 1]。
<span class="en">x_c = R x_w + t with t = −R c_w, packed into a 4×4 extrinsic matrix.</span>

两个矩阵一乘,得到 3×4 的投影矩阵 P = M_int · M_ext,直接把世界点 (x_w, y_w, z_w, 1) 映射成齐次像素 (ũ, ṽ, w̃)。标定的目标就是求 P。
<span class="en">Multiplying gives the 3×4 projection matrix P = M_int M_ext, mapping world points straight to homogeneous pixels. Calibration means finding P.</span>

小例子:还是上面的内参。相机放在世界坐标 c_w = (0, 0, −5),不旋转(R = I)。那么 t = −c_w = (0, 0, 5)。世界点 (1, 0, 0) 变成相机坐标 (1, 0, 5),u = 800 × 1/5 + 320 = 480,v = 240。
<span class="en">Example: camera at (0, 0, −5) with R = I gives t = (0, 0, 5). World point (1, 0, 0) becomes camera point (1, 0, 5) and pixel (480, 240).</span>

数自由度:P 有 12 个数。但齐次坐标里 P 和 kP 投出一样的像素,所以 P 只定到一个比例,真正自由度是 11。讲义的物理意义是:把场景和相机一起放大两倍,拍出来的图一模一样。
<span class="en">P has 12 entries but is defined only up to scale, so 11 degrees of freedom. Scaling the whole world and camera together gives the same image.</span>

### 8.17.3 标定流程:拍一个已知物体,解 Ap = 0 · Calibration as constrained least squares

比方:拿一把尺子量相机。尺子就是一个尺寸完全已知的标定物。
<span class="en">Analogy: you measure the camera with a ruler, an object whose geometry you know exactly.</span>

![标定物:贴棋盘格的立方体,世界坐标原点放在一个角上](img/fef31e646ed.jpg)

步骤:
1. 做一个已知几何的物体,比如三面贴棋盘格的立方体,世界原点放在它的一个角上。
2. 拍一张图,找出 3D 点和像素的对应。讲义例子:世界点 (0, 3, 4) 英寸对应像素 (56, 115)。
3. 每一对给两个方程。u = (p11·x + p12·y + p13·z + p14) / (p31·x + p32·y + p33·z + p34),v 同理。把分母乘过去,就是关于 12 个 p 的线性方程。
4. n 对点堆成 2n × 12 的矩阵 A,未知向量 p 是 P 的 12 个元素,得到 A·p = 0。
5. 定比例:令 ‖p‖² = 1。问题变成 min ‖Ap‖² s.t. ‖p‖² = 1。
<span class="en">Build an object of known geometry, detect 3D-2D correspondences, write two linear equations per point, stack into A p = 0, and fix the scale with ‖p‖ = 1.</span>

求解:拉格朗日函数 L = pᵀAᵀAp − λ(pᵀp − 1),对 p 求导等于零,得 AᵀA·p = λ·p。所以最优 p 是 AᵀA 最小特征值对应的特征向量。和图像拼接里解单应矩阵是同一招。
<span class="en">Setting the derivative of the Lagrangian to zero gives AᵀA p = λ p. The solution is the eigenvector of AᵀA with the smallest eigenvalue, the same trick as homography estimation.</span>

要几个点?11 个自由度,每个点 2 个方程,至少 6 个点。实际用几十上百个角点来压噪声。点不能都在一个平面上,这就是为什么用立方体的三个面。
<span class="en">11 DOF and 2 equations per point means at least 6 points; in practice many more. The points should not all lie on one plane, hence the three-faced cube.</span>

### 8.17.4 从 P 里拆出 K、R、t · Decomposing P into intrinsics and extrinsics

比方:P 像一杯混好的果汁,K 是上三角、R 是正交矩阵,这两种形状特殊,所以能被干净地分开。
<span class="en">Analogy: P is a mixed drink, but K and R have such special shapes that they can be separated cleanly.</span>

P 的左边 3×3 块等于 K·R。K 是上三角矩阵,R 是正交矩阵。一个上三角乘一个正交矩阵,可以唯一地分解回去(讲义叫 QR 分解,严格说顺序是「上三角在左」,常叫 RQ 分解)。
<span class="en">The left 3×3 block of P equals K R. An upper-triangular times orthonormal product can be uniquely factored back (the lecture calls it QR; strictly, with the triangular factor on the left, it is RQ).</span>

![P 的左 3×3 块 = K·R,用 QR 分解拆开](img/f315409070d.jpg)

P 的最后一列等于 K·t,所以 t = K⁻¹ · (p14, p24, p34)。
<span class="en">The last column of P equals K t, so t = K⁻¹ times that column.</span>

小例子:K 如上,t = (0, 0, 5)。K·t = (320 × 5, 240 × 5, 5) = (1600, 1200, 5)。反过来求:z = 5,y = (1200 − 240 × 5) / 800 = 0,x = (1600 − 320 × 5) / 800 = 0。t 回来了。
<span class="en">Example: K t = (1600, 1200, 5), and K⁻¹ of that returns t = (0, 0, 5).</span>

补一句参数个数:讲义的内参 4 个,外参 6 个(旋转 3 + 平移 3),共 10 个。P 有 11 个自由度,多出的那一个在通用模型里是像素轴的歪斜(skew),讲义假设它为 0。
<span class="en">4 intrinsics plus 6 extrinsics is 10; the 11th DOF of a general P is pixel skew, assumed zero here.</span>

### 8.17.5 简单立体视觉:视差与深度 · Simple stereo: disparity and depth

比方:伸出一根手指,左右眼轮流闭。手指越近,跳得越厉害。这个跳动量就是视差。
<span class="en">Analogy: close each eye in turn while looking at your finger. The closer it is, the more it jumps. That jump is disparity.</span>

单张图只能把一个像素反投成一条射线:x = z/f_x · (u − o_x),y = z/f_y · (v − o_y),z > 0。深度 z 不知道。要定点,得用第二台相机。
<span class="en">One image back-projects a pixel to a ray; depth is unknown. A second camera is needed.</span>

![两台相同相机水平错开基线 b,两条射线交于场景点](img/f54be0d8f64.jpg)

两台一样的标定相机,右相机沿 x 轴错开距离 b(基线)。左图 u_l = f_x · x/z + o_x,右图 u_r = f_x · (x − b)/z + o_x,v 两边相同。解出来:
z = b·f_x / (u_l − u_r),x = b(u_l − o_x) / (u_l − u_r),y = b·f_x(v_l − o_y) / (f_y(u_l − u_r))。
u_l − u_r 就是视差 d。深度和视差成反比,视差和基线成正比。
<span class="en">With baseline b along x: z = b f_x / (u_l − u_r). Depth is inversely proportional to disparity; disparity is proportional to baseline.</span>

小例子:b = 0.1 m,f_x = 800,视差 20 像素,z = 0.1 × 800 / 20 = 4 m。如果 u_l = 420,o_x = 320,则 x = 0.1 × 100 / 20 = 0.5 m(验算:z(u_l − o_x)/f_x = 4 × 100/800 = 0.5)。视差变成 21,z = 80/21 ≈ 3.81 m。差 1 个像素,深度差约 0.19 m。
<span class="en">Example: b = 0.1 m, f_x = 800, d = 20 gives z = 4 m. One pixel more disparity gives 3.81 m, a 0.19 m jump.</span>

这个数说明深度误差随距离平方增长:dz ≈ z² / (b·f_x) · dd = 16 / 80 × 1 = 0.2 m。所以讲义说:应用允许的话,基线越大越好。
<span class="en">Depth error grows with z²: dz ≈ z²/(b f_x) per pixel. Use the largest baseline the application allows.</span>

### 8.17.6 立体匹配:沿扫描线找对应 · Stereo matching along scan lines

比方:找同一个人在两张合照里的位置。如果知道他一定站在同一排,只要横着找。
<span class="en">Analogy: if you know someone stands in the same row in both photos, you only scan horizontally.</span>

因为 v_l = v_r,对应点一定在同一条水平扫描线上,搜索从 2D 降到 1D。做法是在左图取一个小窗口当模板,沿右图同一行滑动,用相似度找最佳位置。
<span class="en">Since v_l = v_r, matches lie on the same scan line, so search is 1D template matching along that row.</span>

三种相似度:SAD(绝对差之和,越小越好)、SSD(平方差之和,越小越好)、NCC(归一化互相关,越大越好)。两台相机增益不同或有暗角时,NCC 更稳,因为它除掉了整体亮度。
<span class="en">SAD and SSD are minimized; NCC is maximized and is robust to gain and vignetting differences.</span>

三个难点。一,无纹理表面(白纸)哪里都一样,匹配不上。二,重复纹理会匹配到多个位置,各给一个深度。三,透视缩短(foreshortening):斜着的面在两张图里形变不同,窗口对不齐。
<span class="en">Three issues: textureless surfaces, repetitive texture, and foreshortening that distorts a patch differently in each view.</span>

![窗口 5 像素噪声大,30 像素边缘糊](img/f46250ea129.jpg)

窗口大小是取舍:小窗口(5 像素)定位准,但容易错配,图很噪;大窗口(30 像素)稳,但物体边缘被抹平。自适应窗口法:每个点试多种尺寸,取每像素 SSD 最小的那个。
<span class="en">Small windows localize well but are noisy; large windows are robust but blur edges. Adaptive windows pick the best size per pixel.</span>

### 8.17.x 面试怎么问 · Likely questions

**Q: What are intrinsic and extrinsic parameters, and how do you calibrate a camera?**
内参外参分别是什么,怎么标定?
> Intrinsics describe the camera's internal geometry: focal lengths in pixels f_x, f_y and the principal point o_x, o_y, collected in an upper-triangular matrix K, plus lens distortion in practice. Extrinsics are the rotation R and translation t from world to camera. I capture an object of known geometry, get 3D-to-2D correspondences, and each gives two linear equations in the 12 entries of the projection matrix. I stack them into A p = 0, fix the scale with ‖p‖ = 1, and take the eigenvector of AᵀA with the smallest eigenvalue. Then I factor the left 3×3 block into K R with an RQ decomposition and get t from K⁻¹ times the last column.

这段在说什么:内参是 K,外参是 R、t;拍已知物体解 Ap = 0 得到 P,再拆成 K、R、t。
<span class="en">Intrinsics K, extrinsics R and t; solve A p = 0 for P, then decompose.</span>

Byte Veda 做无人机和 3D 感知,标定不准,后面所有深度和建图都会漂。可以补一句:实际中用棋盘格多姿态拍摄,还要估畸变系数。

**Q: Why is the projection matrix only defined up to scale, and how many points do you need?**
为什么投影矩阵只定到比例?至少几个点?
> Because it acts on homogeneous coordinates, P and kP give the same pixel after dividing by the third coordinate. Physically, scaling the whole scene and camera together produces an identical image. So P has 11 degrees of freedom, not 12. Each correspondence gives two equations, so we need at least six non-coplanar points, and we use many more for robustness to noise.

这段在说什么:齐次坐标除掉了比例,11 自由度,每点 2 个方程,至少 6 个不共面点。
<span class="en">Homogeneous scale ambiguity gives 11 DOF, so at least 6 non-coplanar points.</span>

**Q: Derive depth from disparity. How does depth error scale with distance?**
推导视差和深度的关系,误差随距离怎么变?
> For a rectified pair with baseline b, the left pixel is u_l = f x / z + o_x and the right is u_r = f (x − b) / z + o_x. Subtracting gives the disparity u_l − u_r = f b / z, so z = f b / d. Differentiating, dz ≈ z² / (f b) times the disparity error, so error grows quadratically with distance. That is why you want a large baseline and sub-pixel matching for far objects.

这段在说什么:z = f·b/d,误差和 z² 成正比,远处要靠大基线和亚像素匹配。
<span class="en">z = f b / d, and depth error grows with z squared.</span>

无人机机身小,基线受限,远处深度会很粗。面试可以主动说:远距离要配合其他线索(运动视差、单目深度网络)。

**Q: Why does stereo matching fail on some surfaces, and how do you choose the window size?**
立体匹配为什么会失败,窗口大小怎么选?
> Matching needs unique local texture. Textureless regions match everywhere, repetitive patterns give multiple candidate depths, and slanted surfaces are foreshortened differently in the two views. Small windows localize edges well but are noisy, while large windows are robust but blur depth discontinuities. Adaptive windows try several sizes per pixel and keep the best match, and active illumination can add texture when the scene has none.

这段在说什么:没纹理、重复纹理、透视缩短是三大坑;窗口是定位精度和稳健性的取舍。
<span class="en">Texture is required; window size trades localization against robustness.</span>

## 8.18 未标定立体视觉 · Uncalibrated Stereo

这一讲解决的问题:你和朋友用两台不同的相机,从随便两个位置拍同一座建筑。两台相机的内参已知,但彼此的相对位置和朝向不知道。能不能只靠两张图,先把相对位姿求出来,再重建 3D?可以,核心工具是对极几何和基础矩阵。
<span class="en">Two arbitrary views of a static scene, known intrinsics, unknown relative pose. Epipolar geometry and the fundamental matrix let us recover the pose from the images and then reconstruct 3D.</span>

整个流程五步:
1. 每台相机的内参矩阵 K 已知(提前标定,或从照片元数据读)。
2. 找少量可靠对应点(至少 8 对,用 SIFT 或手选)。
3. 求两台相机的相对平移 t 和旋转 R。
4. 找稠密对应。
5. 三角化算深度。
<span class="en">Pipeline: known K, a few reliable matches (at least 8), relative pose t and R, dense correspondence, triangulation.</span>

### 8.18.1 对极几何:极点、极平面、极线 · Epipolar geometry

比方:两个人站在不同位置看同一只鸟。两个人的眼睛和鸟,三点确定一个平面。不管鸟在哪,这个平面都绕着「两人连线」这根轴转。
<span class="en">Analogy: two observers and a bird always define a plane, and that plane pivots around the line joining the observers.</span>

几个名词,一次讲清:
- 极点(epipole)e_l、e_r:一台相机的光心在另一台相机图像里的投影。每对相机只有一对极点,可能落在图像外面。
- 极平面(epipolar plane):场景点 P、两个光心 O_l、O_r 构成的平面。每个场景点有唯一一个极平面,而且所有极平面都过基线。
- 极线(epipolar line):极平面和像平面的交线。每个场景点在两张图里各有一条。
<span class="en">Epipole: image of one camera's centre in the other view. Epipolar plane: the plane through P and both camera centres. Epipolar line: where that plane cuts an image plane.</span>

![极平面:场景点和两个光心构成的平面,和两个像平面交出两条极线](img/f1fdfc7378f.jpg)

关键结论:左图一个点反投回去是一条射线。这条射线投到右图上就是一条线,也就是极线。所以对应点一定在极线上,匹配从 2D 搜索降成 1D 搜索。简单立体里的「同一扫描线」只是特例:两台相机水平错开时,极线恰好是水平的。
<span class="en">A left pixel back-projects to a ray whose image in the right view is the epipolar line. Matches must lie on it, so correspondence is a 1D search. Scan-line matching in simple stereo is the special case of horizontal epipolar lines.</span>

### 8.18.2 对极约束与本质矩阵 E · Epipolar constraint and the essential matrix

比方:三根向量躺在同一张桌面上,它们「叠出来的体积」是零。对极约束就是这句话写成公式。
<span class="en">Analogy: three vectors lying flat on one table enclose zero volume. That is the epipolar constraint.</span>

讲义的记号:t 是右相机光心在左相机坐标系里的位置,R 把右相机坐标转到左相机坐标,x_l = R·x_r + t。
<span class="en">Notation: t is the right camera centre in the left frame, and x_l = R x_r + t.</span>

推导三步:
1. 极平面的法向量 n = t × x_l。x_l 在平面里,所以 x_l · (t × x_l) = 0。
2. 叉乘写成矩阵:t × a = T× · a,T× = [0 −t_z t_y; t_z 0 −t_x; −t_y t_x 0],是反对称矩阵(a_ij = −a_ji)。
3. 把 x_l = R·x_r + t 代进去。T× · t = t × t = 0,那一项消掉,剩下 x_lᵀ · (T× R) · x_r = 0。
<span class="en">Normal n = t × x_l, so x_l · (t × x_l) = 0. Write the cross product as the skew-symmetric T×, substitute x_l = R x_r + t, and t × t vanishes, leaving x_lᵀ (T× R) x_r = 0.</span>

![法向量 n = t × x_l 垂直于极平面,所以 x_l · n = 0](img/fd55f21ce2a.jpg)

定义本质矩阵 E = T× R(Longuet-Higgins 1981)。对极约束就是 x_lᵀ E x_r = 0。E 的价值在于:反对称矩阵乘正交矩阵,可以用 SVD 拆回 T× 和 R。所以只要求出 E,就有了 t 和 R。
<span class="en">E = T× R. Because it is skew-symmetric times orthonormal, SVD recovers t and R from E.</span>

小例子:右相机在左相机正右方 1 个单位,不旋转。t = (1, 0, 0),R = I,E = T× = [0 0 0; 0 0 −1; 0 1 0]。取右相机坐标里一点 x_r = (2, 3, 10),则 x_l = (3, 3, 10)。E·x_r = t × x_r = (0, −10, 3)。x_l · (0, −10, 3) = 0 − 30 + 30 = 0。约束成立。
<span class="en">Example: t = (1, 0, 0), R = I. For x_r = (2, 3, 10), x_l = (3, 3, 10), E x_r = (0, −10, 3), and the dot product is −30 + 30 = 0.</span>

一个坑:约束等于零,t 乘任何非零倍数都还成立。所以从 E 拆出来的 t 只有方向,没有长度。两张图重建出来的场景差一个整体比例,要知道真实尺寸得另外给一个已知长度。
<span class="en">The constraint is homogeneous in t, so translation is recovered only up to scale. The reconstruction has a global scale ambiguity.</span>

### 8.18.3 从 3D 坐标到像素:基础矩阵 F · From E to the fundamental matrix

比方:E 说的是「真实空间里的方向」,F 是把它翻译成「像素语言」的版本,中间的翻译官就是两台相机的 K。
<span class="en">Analogy: E speaks in camera-space directions; F is its translation into pixels, with K as the translator.</span>

问题:x_l、x_r 是 3D 坐标,我们不知道。我们只知道像素。透视投影给出 z_l·(u_l, v_l, 1) = K_l·x_l,所以 x_l = z_l·K_l⁻¹·(u_l, v_l, 1),右边同理。
<span class="en">We do not know x_l and x_r, only pixels. From projection, x_l = z_l K_l⁻¹ (u_l, v_l, 1), and similarly for the right.</span>

代入 x_lᵀ E x_r = 0。场景在相机前面,z_l、z_r 都不为零,可以约掉。得到:
(u_l, v_l, 1) · F · (u_r, v_r, 1)ᵀ = 0,其中 F = K_l⁻ᵀ E K_r⁻¹。
反过来,E = K_lᵀ F K_r。这个 3×3 的 F 叫基础矩阵,只用像素坐标就能估计。
<span class="en">Substituting and cancelling the non-zero depths gives ũ_lᵀ F ũ_r = 0 with F = K_l⁻ᵀ E K_r⁻¹, so E = K_lᵀ F K_r.</span>

![基础矩阵 F:约束直接写在像素坐标上,E = K_lᵀ F K_r](img/fd681b735e1.jpg)

求极线:给定左图点 (u_l, v_l) 和 F,展开约束得到 a·u_r + b·v_r + c = 0,一条直线。其中 (a, b, c) = (u_l, v_l, 1)·F。
<span class="en">Given a left pixel, (a, b, c) = (u_l, v_l, 1) F defines the right epipolar line a u_r + b v_r + c = 0.</span>

小例子:接上面的 t = (1, 0, 0)、R = I。两台相机 K 都是 f_x = f_y = 800,主点 (320, 240)。算出来 F = [0 0 0; 0 0 −1/800; 0 1/800 0]。左图点 (400, 300):(a, b, c) = (0, 1, −300)(整体乘 800 后是 (0, 800, −240000))。右图极线是 v_r = 300,一条水平线,行号和左图相同。这就是简单立体的扫描线约束。
<span class="en">Example: with K = [800 0 320; 0 800 240; 0 0 1], F = [0 0 0; 0 0 −1/800; 0 1/800 0]. Left pixel (400, 300) gives the line v_r = 300, the horizontal scan line of simple stereo.</span>

![讲义例子:给定 F 和左图点 (343, 221),右图极线 0.03u + 0.99v − 265 = 0](img/fbc125f5079.jpg)

### 8.18.4 八点法估计 F,再拆出 R 和 t · Eight-point estimation and pose recovery

比方:还是标定那一招。每对匹配点贡献一个方程,凑够数,解一个「最接近零」的最小二乘。
<span class="en">Analogy: the same trick as calibration. Each match gives one equation; solve a constrained least-squares problem.</span>

步骤:
- A:对每对对应点 i,写 (u_l, v_l, 1) F (u_r, v_r, 1)ᵀ = 0,展开成关于 9 个 f 的一个线性方程。
- B:m 对点堆成 m × 9 的矩阵 A,得到 A·f = 0。A 的每行是 (u_l u_r, u_l v_r, u_l, v_l u_r, v_l v_r, v_l, u_r, v_r, 1)。
- C:F 和 kF 描述同一个对极几何,所以令 ‖f‖² = 1。解 min ‖Af‖² s.t. ‖f‖² = 1,答案是 AᵀA 最小特征值的特征向量。
- D:E = K_lᵀ F K_r。
- E:用 SVD 把 E 拆成 T× 和 R。
<span class="en">One linear equation per match, stack to A f = 0, fix ‖f‖ = 1, take the smallest-eigenvalue eigenvector of AᵀA, form E = K_lᵀ F K_r, then split E by SVD.</span>

为什么至少 8 对?F 有 9 个数,去掉比例剩 8 个未知数,每对点给 1 个方程。和标定对比:标定每点给 2 个方程(u 和 v),这里每对只给 1 个,因为只约束「在极线上」,不约束「在极线哪个位置」。
<span class="en">F has 8 unknowns after removing scale, and each match gives one equation, so 8 matches. A match constrains a point to a line, not to a position on it.</span>

讲义外补充两句,面试常追问:F 的秩是 2(T× 的秩是 2),所以真实自由度是 7,线性解出来后通常要把最小奇异值置零。实际用 SIFT 匹配会有错配,一般套 RANSAC 再做八点法。
<span class="en">Supplement: F has rank 2 (7 DOF), so the linear estimate is usually projected to rank 2; in practice the eight-point solver runs inside RANSAC to reject bad matches.</span>

### 8.18.5 稠密匹配与三角化 · Dense correspondence and triangulation

比方:两根激光笔从两头射出,光束相交的地方就是那个点。实际有噪声,两束光会擦肩而过,只好取「最接近两条线」的点。
<span class="en">Analogy: two laser beams meet at the scene point. With noise they miss slightly, so we take the best compromise point.</span>

稠密匹配:对左图每个像素取一个小窗口,沿右图对应的极线做模板匹配,找最佳位置。和简单立体一样,需要纹理。
<span class="en">For each left pixel, template-match along its right epipolar line. Texture is still required.</span>

三角化:左相机成像方程 ũ_l = P_l · x̃_r,其中 P_l = M_int,l · [R t; 0 1];右相机 ũ_r = M_int,r · x̃_r。两式各给 2 个方程,一共 4 个方程,3 个未知数 (x_r, y_r, z_r)。整理成 A·x_r = b,A 是 4 × 3,b 是 4 × 1。
<span class="en">Left and right imaging equations give 4 linear equations in the 3 unknowns of x_r, written A x_r = b.</span>

![4 个方程 3 个未知数,用伪逆求最小二乘解](img/fab54e5d01d.jpg)

方程比未知数多,用伪逆:x_r = (AᵀA)⁻¹Aᵀb。每对对应点都做一次,就得到整张深度图。讲义的例子 Photo Tourism 用 1275 张网上照片重建了圣彼得大教堂。纹理不够时可以用主动照明,往场景上投随时间变化的图案,人为制造纹理。
<span class="en">Solve by pseudo-inverse x_r = (AᵀA)⁻¹Aᵀb for every match. Photo Tourism reconstructed St. Peter's Basilica from 1275 internet images. Active illumination adds texture when the scene lacks it.</span>

### 8.18.x 面试怎么问 · Likely questions

**Q: What is the difference between the essential matrix and the fundamental matrix?**
本质矩阵和基础矩阵有什么区别?
> Both encode the epipolar constraint. The essential matrix E = [t]× R works on normalized camera coordinates, so it needs known intrinsics, and it decomposes by SVD into rotation and translation direction. The fundamental matrix F = K_l⁻ᵀ E K_r⁻¹ works directly on pixel coordinates and can be estimated from matches alone. If I know K, I go from F to E with E = K_lᵀ F K_r and then recover the pose.

这段在说什么:E 在相机坐标里,需要内参,能拆出 R 和 t;F 在像素坐标里,只要匹配就能估。
<span class="en">E lives in camera coordinates and gives pose; F lives in pixels and comes from matches alone.</span>

**Q: Why do we need at least 8 point correspondences, and why is translation only known up to scale?**
为什么至少 8 对点?为什么平移只知道方向?
> F has nine entries but is defined only up to scale, leaving eight unknowns, and each correspondence gives one linear equation, so eight matches give a linear solution. The constraint is homogeneous, so any multiple of t satisfies it equally well. Physically, doubling the scene and the baseline gives the same pair of images. To get metric scale you need extra information such as a known baseline, an IMU, or an object of known size.

这段在说什么:9 个数去掉比例剩 8 个,每对点 1 个方程;约束齐次,所以 t 只有方向。
<span class="en">8 unknowns, one equation per match; homogeneity means scale is lost.</span>

无人机单目建图就有这个问题,通常靠 IMU 或已知高度把尺度补回来。这句很适合 Byte Veda。

**Q: How does epipolar geometry help stereo matching?**
对极几何怎么帮立体匹配?
> A pixel in the left image back-projects to a ray, and that ray projects to a line in the right image, the epipolar line given by (u_l, v_l, 1) F. The true match must lie on that line, so the search drops from 2D to 1D, which is faster and has fewer false matches. In practice we often rectify the images so that epipolar lines become horizontal rows, and then use simple scan-line matching.

这段在说什么:对应点必在极线上,搜索从 2D 降到 1D;校正后极线变成水平行。
<span class="en">Matches lie on the epipolar line, reducing search to 1D; rectification makes those lines horizontal.</span>

**Q: Given two calibrated views and a correspondence, how do you triangulate the 3D point?**
已知两台标定相机和一对对应点,怎么三角化?
> Each camera gives two linear equations from its projection matrix, so I get four equations in three unknowns. Noise means the two rays do not intersect exactly, so I solve the overdetermined system A x = b in the least-squares sense, x = (AᵀA)⁻¹Aᵀb. For better accuracy you can refine by minimizing reprojection error. Accuracy drops when the two rays are nearly parallel, that is, when the baseline is small relative to depth.

这段在说什么:4 个方程 3 个未知数,最小二乘;两条射线越接近平行,误差越大。
<span class="en">Four equations, three unknowns, least squares; near-parallel rays are ill-conditioned.</span>

## 8.19 光流 · Optical Flow

这一讲解决的问题:前面都假设相机和场景不动。真实世界在动,3D 运动量不到,但能量 2D 图像里亮度图案的运动,这就是光流。我们推出一条约束方程,发现一个像素只有一个方程、两个未知数,于是 Lucas-Kanade 方法借用邻域像素把它解出来;运动太大时,用分辨率金字塔从粗到细地算。
<span class="en">The world moves. We cannot measure 3D motion directly, but we can measure how brightness patterns move in the image. One constraint per pixel is not enough, so Lucas-Kanade pools a neighbourhood, and a resolution pyramid handles large motion.</span>

### 8.19.1 运动场和光流不是一回事 · Motion field vs optical flow

比方:运动场是「东西真的在怎么动」,光流是「画面看起来在怎么动」。大多数时候两者一致,但魔术和错觉就是让它们不一致。
<span class="en">Analogy: the motion field is how things really move; optical flow is how the picture appears to move. Usually they agree; illusions make them disagree.</span>

运动场(motion field):场景点 3D 速度 v_o 投影到像平面上的 2D 速度 v_i。由透视投影 r_i / f = r_o / (r_o · z) 求导得:
v_i = f · ((r_o · z)·v_o − (v_o · z)·r_o) / (r_o · z)²。
<span class="en">The motion field is the projection of 3D velocity onto the image, obtained by differentiating the perspective projection.</span>

小例子:点在正前方深度 Z = 10 m 处,横向以 1 m/s 平移,f = 800 像素。这时公式化简成 v_i = f·V/Z = 800 × 1 / 10 = 80 像素/秒。视频 30 帧/秒,每帧移动 80/30 ≈ 2.67 像素。同样速度的点如果在 2 m 处,就是每帧约 13.3 像素。近处动得快,远处动得慢,这也是运动视差能估深度的原因。
<span class="en">Example: a point at 10 m moving sideways at 1 m/s with f = 800 px moves 80 px/s, about 2.67 px per frame at 30 fps. At 2 m it would be about 13.3 px per frame.</span>

光流(optical flow):图像里亮度图案的运动。每个像素一个向量,长度表示速度,方向表示运动方向。理想情况下光流等于运动场,但不总是。
<span class="en">Optical flow is the motion of brightness patterns, one vector per pixel. Ideally it equals the motion field, but not always.</span>

![旋转的均匀球:有运动场没光流;光源绕静止球转:没运动场有光流](img/f1745728563.jpg)

三个反例:
- 均匀材质的球绕竖轴自转,光源不动。表面点在动,但图像不变。有运动场,没光流。
- 球不动,光源绕着转。明暗在移动,但没有点在动。没运动场,有光流。
- 理发店转灯:圆柱水平转,条纹看起来往上走。两者都有,但方向不一致。
<span class="en">A spinning uniform sphere has motion field but no flow; a moving light gives flow but no motion field; the barber pole has both but in different directions.</span>

### 8.19.2 光流约束方程 · The optical flow constraint equation

比方:跟踪一只鸟爪子上的一个亮点。只要它亮度不变、每帧挪得不多,就能从亮度的变化反推它挪了多少。
<span class="en">Analogy: follow a bright spot on a bird's foot. If its brightness stays the same and it moves only a little, brightness changes tell you how far it moved.</span>

两个假设:
1. 亮度恒定:I(x + δx, y + δy, t + δt) = I(x, y, t)。
2. 位移 (δx, δy) 和时间步 δt 都很小,所以可以一阶泰勒展开:I(x + δx, y + δy, t + δt) ≈ I(x, y, t) + I_x·δx + I_y·δy + I_t·δt。
<span class="en">Assume brightness constancy and small displacement, so a first-order Taylor expansion is valid.</span>

两式相减:I_x·δx + I_y·δy + I_t·δt = 0。除以 δt 并令 δt → 0,得到光流约束方程:
I_x·u + I_y·v + I_t = 0,其中 (u, v) = (dx/dt, dy/dt) 是光流。
<span class="en">Subtracting gives I_x u + I_y v + I_t = 0, the optical flow constraint equation.</span>

I_x、I_y、I_t 从两帧图像用有限差分算。讲义用 2×2×2 的像素立方体:I_x 等于 x+1 那一面四个像素的平均,减去 x 那一面四个像素的平均。I_y、I_t 同理。
<span class="en">The derivatives come from finite differences over a 2×2×2 cube of pixels across two frames.</span>

### 8.19.3 一个方程两个未知数:法向流与孔径问题 · Normal flow and the aperture problem

比方:透过一个钥匙孔看一根斜着移动的长杆。你只看到它往「垂直于杆」的方向走,看不出它沿杆滑了多少。
<span class="en">Analogy: through a keyhole, a moving straight edge only reveals motion perpendicular to the edge.</span>

在 (u, v) 平面里,约束方程是一条直线。真实光流在这条线上,但不知道在哪个位置。把光流拆成两部分:u = u_n + u_p。u_n 垂直于约束线,叫法向流;u_p 平行于约束线,叫平行流。
<span class="en">In (u, v) space the constraint is a line. Split flow into normal flow u_n (perpendicular to the line) and parallel flow u_p.</span>

![约束线:光流在线上某处,只有垂直线的分量能算出来](img/fbad66cea62.jpg)

法向流能算。方向是 (I_x, I_y) / √(I_x² + I_y²),大小是原点到约束线的距离 |I_t| / √(I_x² + I_y²)。平行流算不出来。
<span class="en">Normal flow direction is (I_x, I_y) normalized; its magnitude is |I_t| / √(I_x² + I_y²). Parallel flow is unknown.</span>

小例子:某像素 I_x = 2,I_y = 1,I_t = −4。约束线 2u + v = 4。法向流大小 = 4 / √5 ≈ 1.79,向量 = 4/5 × (2, 1) = (1.6, 0.8)。验算:2 × 1.6 + 0.8 = 4,在线上。但 (2, 0)、(0, 4)、(1, 2) 也都在线上,单看这个像素分不出是哪一个。
<span class="en">Example: I_x = 2, I_y = 1, I_t = −4 gives the line 2u + v = 4 and normal flow (1.6, 0.8). But (2, 0), (0, 4) and (1, 2) also satisfy the equation.</span>

![孔径问题:透过小孔只能看到垂直于边缘的法向流](img/fc7a6dce9f2.jpg)

人眼也有同样的问题,这叫孔径问题(aperture problem):局部只能确定法向流。要解光流,必须加额外约束。
<span class="en">Humans suffer from it too. Locally, only normal flow is determinable, so extra constraints are needed.</span>

### 8.19.4 Lucas-Kanade:邻域内光流相同 · Lucas-Kanade

比方:一个人说不清方向,问一圈邻居。只要邻居站的角度各不相同,大家的说法一交叉,方向就定了。
<span class="en">Analogy: one witness is ambiguous, but witnesses at different angles pin the answer down.</span>

假设:每个像素周围的小窗口 W(n × n)里,运动场和光流是常数 (u, v)。窗口里每个像素 (k, l) 都给一个方程 I_x(k,l)·u + I_y(k,l)·v = −I_t(k,l)。n² 个方程,2 个未知数。
<span class="en">Assume constant flow in an n×n window W. Each pixel gives one equation, so n² equations in 2 unknowns.</span>

写成 A·u = B,A 是 n² × 2,B 是 n² × 1。两边乘 Aᵀ:
```
| Σ I_x·I_x   Σ I_x·I_y | |u|   | −Σ I_x·I_t |
| Σ I_x·I_y   Σ I_y·I_y | |v| = | −Σ I_y·I_t |
      AᵀA (2×2)                    AᵀB
```
u = (AᵀA)⁻¹ AᵀB。AᵀA 只有 2×2,求逆很快。
<span class="en">Least squares: u = (AᵀA)⁻¹AᵀB, where AᵀA is a cheap 2×2 matrix of summed gradient products.</span>

小例子:窗口里三个像素,梯度 (I_x, I_y) 分别是 (1, 0)、(0, 1)、(1, 1)。真实光流设为 (1, 2),那么 I_t = −(I_x·u + I_y·v) 分别是 −1、−2、−3。
AᵀA = [1+0+1, 0+0+1; 1, 0+1+1] = [2 1; 1 2]。
AᵀB = −[Σ I_x I_t, Σ I_y I_t] = −[−1 + 0 − 3, 0 − 2 − 3] = [4, 5]。
解 [2 1; 1 2]·u = [4, 5]:行列式 3,u = (2×4 − 1×5)/3 = 1,v = (2×5 − 1×4)/3 = 2。正好是 (1, 2)。AᵀA 的特征值是 3 和 1,都不小,条件好。
<span class="en">Example: gradients (1,0), (0,1), (1,1) with true flow (1,2). AᵀA = [2 1; 1 2], AᵀB = [4, 5], solution (1, 2). Eigenvalues 3 and 1, well conditioned.</span>

### 8.19.5 什么时候 LK 靠得住 · When does it work

比方:问路的邻居如果都站在同一条直线上,他们给的信息其实是同一句话。
<span class="en">Analogy: witnesses standing in one line all tell you the same thing.</span>

条件:AᵀA 必须可逆(det ≠ 0),而且条件要好。设特征值 λ1 ≥ λ2,需要 λ1 > ε、λ2 > ε,并且 λ1 不能远大于 λ2。把窗口里每个像素的 (I_x, I_y) 画成散点,拟合一个椭圆,两个半轴就对应 λ1 和 λ2。
<span class="en">AᵀA must be invertible and well conditioned: both eigenvalues above a threshold and not wildly different. They correspond to the axes of an ellipse fitted to the gradient scatter.</span>

三种区域:
- 平滑区(天空):梯度都接近零,椭圆是个小圆点,λ1、λ2 都小。算不出来。
- 边缘(屋顶边):梯度只在一个方向大,椭圆又细又长,λ1 ≫ λ2。算不出来,这就是孔径问题。
- 纹理区(地面落叶):梯度大且方向多样,椭圆又大又圆,λ1、λ2 都大。能可靠地算。
<span class="en">Smooth regions: both eigenvalues small. Edges: one large, one small (aperture problem). Textured regions: both large, reliable.</span>

![纹理丰富的区域:梯度散点铺得开,两个特征值都大](img/fd6c8e08765.jpg)

用上面的例子验证边缘情况:如果三个像素梯度都是 (1, 0),AᵀA = [3 0; 0 0],有一个特征值是 0,不可逆,v 完全定不了。
<span class="en">Check: if all gradients are (1, 0), AᵀA = [3 0; 0 0] is singular and v is undetermined.</span>

这和 Harris 角点用的是同一个矩阵,所以 LK 跟踪通常选角点来跟。
<span class="en">This is the same matrix used by the Harris corner detector, which is why LK trackers follow corners.</span>

### 8.19.6 大位移:由粗到细的金字塔 · Coarse-to-fine for large motion

比方:先在缩略图上看大概往哪挪,再在原图上微调。
<span class="en">Analogy: find the rough shift on a thumbnail, then refine at full size.</span>

问题:近处的树一帧移动几十个像素,δx 不再小,泰勒展开失效,I_x u + I_y v + I_t ≠ 0。
<span class="en">When motion is tens of pixels, the Taylor approximation and the constraint equation break.</span>

解法:建分辨率金字塔,N×N、N/2×N/2、N/4×N/4……每层一个像素是上一层四个像素的平均。原图里移动 8 像素的点,到 N/8 那层只移动 1 像素。建到最粗那层所有运动都不超过 1 像素,约束方程重新成立。
<span class="en">Build a pyramid by 2×2 averaging. An 8-pixel motion becomes 1 pixel at N/8. At the coarsest level all motion is under one pixel.</span>

![由粗到细:在低分辨率算光流,用它去 warp 下一层,再算残差](img/f3ec8c6b131.jpg)

算法:
1. 在最粗层对 t 和 t + δt 两张图跑 LK,得到 (u, v)⁽⁰⁾。
2. 放大到下一层,用当前光流把 t 时刻的图「推」一下(warp),得到一张接近 t + δt 的图。
3. 在 warp 后的图和真正的 t + δt 图之间再跑 LK,得到很小的残差 Δ(u, v)。
4. 加到原来的光流上,继续往细层走,直到原分辨率。
<span class="en">Run LK at the coarsest level, warp the next finer image by the current flow, solve for a small residual, add it, and repeat to full resolution.</span>

小例子:原图位移 20 像素。降 3 层(÷8)后是 2.5 像素,还偏大;降 5 层(÷32)后是 0.625 像素,可以用。所以这种情况金字塔至少要 6 层(含原图)。
<span class="en">Example: a 20-pixel motion is 2.5 px at ÷8 and 0.625 px at ÷32, so about six levels including the original.</span>

另一种做法是模板匹配:在第二帧的搜索窗口里找第一帧的小块。简单直接,但搜索窗口大时很慢,而且会错配。
<span class="en">Template matching also works but is slow with large search windows and can mismatch.</span>

应用:光学鼠标(低分辨率如 64×64、高帧率如每秒 2000 帧的相机算位移)、车速监测、视频插帧做慢动作、视频防抖(补偿主导光流)、人脸跟踪。
<span class="en">Applications: optical mouse, traffic speed, video retiming, stabilization, face tracking.</span>

### 8.19.x 面试怎么问 · Likely questions

**Q: Derive the optical flow constraint equation. What assumptions does it make?**
推导光流约束方程,用了哪些假设?
> I assume brightness constancy, I(x + δx, y + δy, t + δt) = I(x, y, t), and small motion so a first-order Taylor expansion holds. Expanding the left side and subtracting gives I_x δx + I_y δy + I_t δt = 0, and dividing by δt gives I_x u + I_y v + I_t = 0. That is one equation in two unknowns, so only the normal flow, the component along the image gradient, is determined. This is the aperture problem.

这段在说什么:亮度恒定加小位移,泰勒展开得到 I_x u + I_y v + I_t = 0;一个方程两个未知数,只能定法向流。
<span class="en">Brightness constancy plus small motion gives one equation in two unknowns, so only normal flow is known.</span>

**Q: Explain Lucas-Kanade. When does it fail?**
讲一下 Lucas-Kanade,什么时候失效?
> Lucas-Kanade assumes the flow is constant in a small window, so every pixel in the window adds one constraint and we solve the overdetermined system by least squares, u = (AᵀA)⁻¹AᵀB, where AᵀA is the 2×2 matrix of summed gradient products. It fails when AᵀA is singular or ill-conditioned: in flat regions both eigenvalues are small, and on straight edges one eigenvalue dominates, which is the aperture problem. It also fails when brightness changes or motion is large. That is why we track corners, where both eigenvalues are large.

这段在说什么:窗口内光流相同,最小二乘解;AᵀA 两个特征值都要大,平坦区和直边会失败。
<span class="en">Constant flow in a window, least squares; fails when AᵀA is ill-conditioned.</span>

**Q: How do you handle large motion between frames?**
帧间运动很大怎么办?
> The Taylor approximation only holds for sub-pixel or small motion. I build an image pyramid so that at the coarsest level the motion is under about one pixel, estimate flow there, then upsample it, warp the next finer image, and solve only for the small residual. Repeating down to full resolution recovers large motions. For a drone with fast rotation, I would also use the IMU to predict the motion and warp before running flow.

这段在说什么:金字塔由粗到细,每层只解残差;无人机上还可以用 IMU 预测运动先 warp。
<span class="en">Coarse-to-fine pyramid solving residuals at each level; an IMU prior helps on drones.</span>

和 Byte Veda 的联系:无人机视觉里程计(VIO)前端常用金字塔 LK 跟踪角点,实时、便宜。可以主动提这一点。

**Q: Is optical flow the same as the motion field? Give a counterexample.**
光流等于运动场吗?举个反例。
> No. The motion field is the projection of true 3D velocities, while optical flow is the apparent motion of brightness patterns. A uniform sphere spinning under fixed light has a motion field but produces no optical flow, and a static sphere with a moving light source has optical flow but no motion field. The barber pole has both, but they point in different directions.

这段在说什么:运动场是真实运动的投影,光流是亮度图案的表观运动;转球和移动光源是经典反例。
<span class="en">Motion field is true projected motion; flow is apparent motion. The spinning sphere and moving light are counterexamples.</span>

## 8.20 运动恢复结构 · Structure from Motion

这一讲解决的问题:拿着相机绕一个物体随手拍一段视频,相机怎么动的完全不知道。能不能只靠视频,同时求出物体的 3D 形状和相机每一帧的朝向?能。Tomasi 和 Kanade 发现:把所有跟踪点的坐标排成一个大矩阵,它的秩最多是 3,于是可以用 SVD 把它分解成「相机运动」乘「场景结构」。
<span class="en">From a casual video with unknown camera motion, recover both 3D structure and camera motion. Tomasi and Kanade showed the matrix of tracked image coordinates has rank at most 3, so SVD factors it into motion times structure.</span>

### 8.20.1 问题设定:正交投影下的 SFM · Orthographic SFM setup

比方:从很远的山顶用长焦拍城里的楼。楼前后差几十米,但离你几公里,远近的放大倍数几乎一样。这时透视可以当成平行投影。
<span class="en">Analogy: shooting a city from a distant hilltop with a telephoto lens. Depth variation is tiny compared with distance, so projection is effectively parallel.</span>

第一步是特征检测和跟踪:在第一帧检测角点或 SIFT 点,再用模板匹配、光流(8.19)或 SIFT 描述子一路跟到最后一帧。输入就是这些点的像素坐标 (u_f,p, v_f,p),f 是帧号(共 F 帧),p 是点号(共 N 个点)。
<span class="en">Detect features in the first frame and track them through the video with template matching, optical flow or SIFT. The input is (u_f,p, v_f,p) for F frames and N points.</span>

Tomasi-Kanade 的简化假设是正交投影:场景深度变化远小于场景到相机的距离,所有点放大倍数相同,投影光线互相平行且垂直于像平面。后来的工作换成了更一般的透视模型。
<span class="en">They assume orthographic projection: depth range small relative to distance, so magnification is constant and rays are parallel. Later work uses full perspective.</span>

正交投影的公式很简单。相机坐标系放在像平面一角,用两个单位向量 i、j 沿着像平面两条边。相机在世界坐标里的位置是 C,场景点是 P:
u = iᵀ(P − C),v = jᵀ(P − C)。
就是把 P − C 分别投到 i 和 j 两个方向上。
<span class="en">With image axes i and j and camera position C, u = iᵀ(P − C) and v = jᵀ(P − C): plain dot products.</span>

![多帧正交投影:每一帧的相机位置 C_f 和朝向 i_f、j_f 都未知](img/f8005d56bb4.jpg)

难点:写成多帧就是 u_f,p = i_fᵀ(P_p − C_f),v_f,p = j_fᵀ(P_p − C_f)。右边 P_p、C_f、i_f、j_f 全是未知数。要先想办法减少未知数。
<span class="en">Everything on the right side is unknown: points, camera positions and orientations. We need to remove unknowns first.</span>

### 8.20.2 中心化技巧:把相机位置消掉 · The centering trick

比方:不管一群人在操场哪个角落,只看每个人相对「这群人的中心」站在哪,队形就和他们整体在哪无关了。
<span class="en">Analogy: describe each person relative to the group's centre, and the formation no longer depends on where the group stands.</span>

世界原点我们可以随便放,那就放在所有场景点的质心:(1/N)·Σ P_p = 0。最后求出的 3D 点都是相对质心的坐标。
<span class="en">Place the world origin at the centroid of the scene points, so Σ P_p = 0.</span>

看第 f 帧所有像点的质心:ū_f = (1/N)·Σ i_fᵀ(P_p − C_f) = i_fᵀ·(1/N)·Σ P_p − i_fᵀ C_f = −i_fᵀ C_f。第一项因为质心为零消失了。v̄_f = −j_fᵀ C_f 同理。像点质心和场景结构无关。
<span class="en">The image centroid in frame f is ū_f = −i_fᵀ C_f, independent of the scene points.</span>

把每帧坐标减去该帧质心:ũ_f,p = u_f,p − ū_f = i_fᵀ(P_p − C_f) + i_fᵀ C_f = i_fᵀ P_p。同样 ṽ_f,p = j_fᵀ P_p。相机位置 C_f 彻底消失,只剩朝向。
<span class="en">Subtracting the centroid gives ũ_f,p = i_fᵀ P_p and ṽ_f,p = j_fᵀ P_p. Camera positions disappear.</span>

![中心化:把相机原点移到 2D 质心,C_f 从方程里消掉](img/f4cb9fb0517.jpg)

小例子:某帧四个点的原始 u 坐标是 (11, 10, 10, 9)。质心 ū = 40/4 = 10。中心化后 ũ = (1, 0, 0, −1)。这 4 个数只和 i_f 与点的 3D 位置有关,和相机平移到哪无关。
<span class="en">Example: raw u = (11, 10, 10, 9), centroid 10, centred ũ = (1, 0, 0, −1).</span>

### 8.20.3 观测矩阵 W = M·S · The observation matrix

比方:一张大表格,行是「第几帧的 u 或 v」,列是「第几个点」。表里每个数都是「某帧的一个方向」点乘「某个点的位置」,所以整张表是两张小表相乘。
<span class="en">Analogy: a big table whose every entry is a camera direction dotted with a point position, so the table is a product of two thin tables.</span>

把所有 ũ、ṽ 排成观测矩阵 W(2F × N):前 F 行是各帧的 ũ,后 F 行是各帧的 ṽ。那么
W = M · S
M(2F × 3)叫相机运动矩阵,前 F 行是 i_1ᵀ … i_Fᵀ,后 F 行是 j_1ᵀ … j_Fᵀ。S(3 × N)叫场景结构矩阵,每列是一个点 P_p。W 已知,M 和 S 未知。
<span class="en">Stack centred coordinates into W (2F × N). Then W = M S, with motion matrix M (2F × 3) of camera axes and structure matrix S (3 × N) of point coordinates.</span>

![观测矩阵 W(2F×N) = 运动矩阵 M(2F×3) × 结构矩阵 S(3×N)](img/f224835d278.jpg)

秩的性质(讲义的数学预备):rank(A) 是列向量张成空间的维数;rank(Aᵀ) = rank(A);rank(AB) ≤ min(rank(A), rank(B))。
<span class="en">Rank is the dimension spanned by the columns; rank(AB) ≤ min(rank A, rank B).</span>

秩定理:rank(M) ≤ min(2F, 3),rank(S) ≤ min(3, N),所以 rank(W) ≤ min(3, N, 2F)。帧数和点数都很多,所以 rank(W) ≤ 3。
<span class="en">Rank theorem: rank(W) ≤ 3.</span>

小例子:2 帧、4 个点。点(已中心化)P1 = (1, 0, 0),P2 = (0, 1, 0),P3 = (0, 0, 1),P4 = (−1, −1, −1),和为零。第 1 帧 i1 = (1, 0, 0),j1 = (0, 1, 0);第 2 帧相机绕竖轴转了 90°,i2 = (0, 0, 1),j2 = (0, 1, 0)。
```
        P1  P2  P3  P4
ũ1:  [  1   0   0  -1 ]     = i1·P,取 x 分量
ũ2:  [  0   0   1  -1 ]     = i2·P,取 z 分量
ṽ1:  [  0   1   0  -1 ]     = j1·P,取 y 分量
ṽ2:  [  0   1   0  -1 ]     = j2·P,也是 y 分量
```
W 是 4 × 4,但秩只有 3(最后两行相同,因为两帧共用同一个 j)。如果是 50 帧、200 个点,W 是 100 × 200,秩照样不超过 3。
<span class="en">Example: 2 frames, 4 points. W is 4×4 but has rank 3. With 50 frames and 200 points, W is 100×200 and still rank ≤ 3.</span>

### 8.20.4 用 SVD 强制秩 3 · Enforcing the rank constraint with SVD

比方:一首歌分解成很多音轨,只有三条有声音,其余全是静音。把静音轨扔掉,歌一点没变。
<span class="en">Analogy: a song with only three non-silent tracks; dropping the silent ones changes nothing.</span>

SVD:任何矩阵 A = U Σ Vᵀ。U、V 是正交矩阵,Σ 是对角阵,对角线上是奇异值 σ1 ≥ σ2 ≥ … ≥ 0。σ1 乘的是 U 第一列和 Vᵀ 第一行,所以它们对 A 贡献最大。如果 rank(A) = r,只有前 r 个奇异值非零。
<span class="en">SVD writes A = U Σ Vᵀ with non-negative singular values in decreasing order. A rank-r matrix has exactly r non-zero singular values.</span>

对 W 做 SVD:U 是 2F × 2F,Σ 是 2F × N,Vᵀ 是 N × N。rank(W) ≤ 3,所以只有前 3 个奇异值非零。U 后面 2F − 3 列(U2)和 Vᵀ 后面 N − 3 行(V2ᵀ)都乘到零上,对 W 毫无贡献。
<span class="en">Only the first three singular values of W are non-zero, so U2 and V2ᵀ contribute nothing.</span>

![只有前 3 个奇异值非零,U2 和 V2ᵀ 对 W 没有贡献](img/fbe477dd383.jpg)

于是 W = U1 Σ1 V1ᵀ,U1 是 2F × 3,Σ1 是 3 × 3,V1ᵀ 是 3 × N。这不是近似,是精确的。真实数据有噪声,第 4 个往后的奇异值不会严格为零,这时截断到前 3 个就是最接近的秩 3 矩阵,相当于顺便去噪。
<span class="en">W = U1 Σ1 V1ᵀ exactly for noise-free data. With noise, truncating to three singular values gives the closest rank-3 matrix, which also denoises.</span>

小例子里 W 的奇异值约为 2.36、1.20、1.00、0。第 4 个是 0,正好对应秩 3。
<span class="en">In the small example the singular values are about 2.36, 1.20, 1.00 and 0, confirming rank 3.</span>

### 8.20.5 分解不唯一:用正交约束求 Q · Resolving the ambiguity with orthonormality

比方:把 12 拆成两个数相乘,2 × 6、3 × 4 都行。要拆出唯一答案,得加条件,比如「第一个数必须是 3」。这里的条件是「每帧的 i、j 必须是互相垂直的单位向量」。
<span class="en">Analogy: 12 = 2 × 6 = 3 × 4. You need an extra rule to pick one. Here the rule is that each frame's i and j are orthonormal.</span>

一个自然的拆法是把 Σ1 平分:M = U1 Σ1^(1/2),S = Σ1^(1/2) V1ᵀ。尺寸对,但不一定是合法的运动和结构。因为对任意可逆 3 × 3 矩阵 Q,
W = (U1 Σ1^(1/2) Q) · (Q⁻¹ Σ1^(1/2) V1ᵀ)
也成立。所以问题变成:找一个 Q,让 M 合法。
<span class="en">Splitting Σ1 in half is valid in size but not unique: any invertible 3×3 Q gives another factorization. We must find the right Q.</span>

还没用的约束:M 的行是各帧的 i_f、j_f,它们是单位向量且互相垂直。记 U1 Σ1^(1/2) 的第 f 行为 î_fᵀ,第 F + f 行为 ĵ_fᵀ(都已算出),那么 i_f = Qᵀ î_f,j_f = Qᵀ ĵ_f,得到每帧 3 个方程:
î_fᵀ Q Qᵀ î_f = 1,ĵ_fᵀ Q Qᵀ ĵ_f = 1,î_fᵀ Q Qᵀ ĵ_f = 0。
<span class="en">Each frame gives three equations: î_fᵀQQᵀî_f = 1, ĵ_fᵀQQᵀĵ_f = 1, î_fᵀQQᵀĵ_f = 0.</span>

![正交约束:M 的每对 i_f、j_f 必须是正交单位向量](img/f5353dfb761.jpg)

数一数:Q 有 9 个未知数,F 帧给 3F 个方程,都是 Q 的二次方程。F ≥ 3 时方程够数,讲义用牛顿法求解。求出 Q 后:M = U1 Σ1^(1/2) Q,S = Q⁻¹ Σ1^(1/2) V1ᵀ。
<span class="en">Q has 9 unknowns and F frames give 3F quadratic equations, solvable by Newton's method for F ≥ 3. Then M = U1 Σ1^(1/2) Q and S = Q⁻¹ Σ1^(1/2) V1ᵀ.</span>

讲义外补充:方程里 Q 只以 Q Qᵀ 的形式出现,所以 Q 再右乘任何旋转矩阵结果都一样。这代表世界坐标系的朝向可以任意选,整体旋转确定不了。常见实现会先线性解对称矩阵 L = Q Qᵀ(6 个未知数),再做 Cholesky 分解得到 Q。
<span class="en">Supplement: Q appears only as QQᵀ, so Q is determined up to a rotation, the arbitrary world orientation. Implementations often solve linearly for the symmetric L = QQᵀ and then take a Cholesky factor.</span>

完整流程:
1. 检测并跟踪特征点。
2. 中心化,构造观测矩阵 W。
3. SVD,截断到秩 3:W = U1 Σ1 V1ᵀ。
4. 设 M = U1 Σ1^(1/2) Q,S = Q⁻¹ Σ1^(1/2) V1ᵀ。
5. 用正交约束求 Q。
<span class="en">Track, centre, SVD to rank 3, parameterize with Q, solve Q from orthonormality.</span>

局限:正交投影假设、要求每个点在所有帧都可见、没有处理错误跟踪。现代方法用透视模型,能处理变焦,也能处理中途出现和消失的特征。
<span class="en">Limits: orthographic camera, features visible in every frame, no outlier handling. Modern methods use perspective, handle zoom and features that come and go.</span>

### 8.20.x 面试怎么问 · Likely questions

**Q: Explain the Tomasi-Kanade factorization method.**
讲一下 Tomasi-Kanade 分解法。
> Under orthographic projection, each tracked image coordinate is a dot product of a camera axis with a 3D point plus a camera offset. Subtracting the per-frame centroid removes the camera translation, so the 2F × N matrix of centred coordinates factors as W = M S, with M (2F × 3) holding the camera axes and S (3 × N) the points. Therefore W has rank at most 3. I take the SVD, keep the top three singular values, and write M = U1 Σ1^(1/2) Q and S = Q⁻¹ Σ1^(1/2) V1ᵀ. Finally I solve for the 3×3 matrix Q by requiring each frame's i and j to be orthonormal.

这段在说什么:中心化消平移,W = MS 秩为 3,SVD 截断,再用 i、j 正交单位的约束求 Q。
<span class="en">Centre to remove translation, W = MS has rank 3, truncate the SVD, fix Q with orthonormality.</span>

**Q: Why is the rank of the observation matrix at most 3, and what does SVD truncation buy you with noisy tracks?**
为什么观测矩阵秩最多为 3?有噪声时截断 SVD 有什么好处?
> W is the product of a 2F × 3 motion matrix and a 3 × N structure matrix, and the rank of a product is at most the smaller inner dimension, which is 3. With noisy tracks W becomes full rank, but keeping only the top three singular values gives the closest rank-3 matrix in the least-squares sense. So the truncation both enforces the physical model and averages out tracking noise across all frames and points at once.

这段在说什么:中间维度是 3,所以秩 ≤ 3;截断 SVD 是最好的秩 3 近似,等于一次性对全部数据去噪。
<span class="en">Inner dimension 3 bounds the rank; truncated SVD is the best rank-3 fit and denoises globally.</span>

**Q: Why is the factorization not unique, and what ambiguities remain?**
为什么分解不唯一,最后还剩什么不确定?
> Any invertible 3×3 matrix Q can be inserted between the factors without changing W, so plain SVD gives motion and structure only up to an affine transformation. Requiring the camera axes to be orthonormal pins down Q, but only up to a rotation, because Q appears as Q Qᵀ in the constraints. So the reconstruction is defined up to the choice of world orientation, and the origin is fixed at the centroid by construction.

这段在说什么:中间可以插任何 Q,正交约束把它定到只差一个旋转;原点是质心。
<span class="en">An arbitrary Q fits; orthonormality fixes it up to a rotation; the origin is the centroid.</span>

**Q: How does this relate to modern SfM or SLAM pipelines?**
这和现代 SfM 或 SLAM 有什么关系?
> Tomasi-Kanade is a batch, closed-form method under an affine camera, and it needs every point visible in every frame. Modern pipelines use perspective cameras, estimate pose incrementally from two-view geometry like the essential matrix, triangulate points, and refine everything with bundle adjustment that minimizes reprojection error. The factorization is still useful as an initialization and as intuition for why motion and structure are coupled through a low-rank matrix.

这段在说什么:TK 是正交相机下的批处理闭式解;现代方法用透视、本质矩阵、三角化加光束法平差,TK 可做初值。
<span class="en">TK is a closed-form affine batch method; modern SfM uses perspective, essential matrices, triangulation and bundle adjustment.</span>

和 Byte Veda 的联系:无人机绕目标飞一圈做 3D 建模,本质上就是 SfM。可以把 8.19 的光流跟踪、8.18 的本质矩阵和这里的分解串成一条完整管线讲。
