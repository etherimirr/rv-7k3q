## 9.10 从点云到表面 · From points to surfaces

> 提纲:点云没有「面」→ 网格 = 顶点 + 三角形 → TSDF 把多帧深度融合进体素 → Marching Cubes 抽出网格 → 泊松重建 → 接 4.17

比方:点云像用图钉标出雕塑的位置。网格是在图钉之间绷上三角形的布。TSDF 是把空间切成小方块,每块记「我离表面多远,在表面前面还是后面」。网格就两个数组:V 是顶点 (n, 3);F 是三角形 (m, 3),每行三个顶点下标。立方体:8 个顶点,6 个面每面 2 个三角形共 12 个;欧拉公式 V − E + F = 8 − 18 + 12 = 2(18 条边 = 12 条棱 + 6 条对角线)。面法向和绕序见 4.17。
<span class="en">Analogy: points are pins on a sculpture, a mesh stretches triangles between them, and a TSDF stores in each cube how far it is from the surface and on which side. A mesh is vertices (n×3) and triangle indices (m×3); a cube has 8 vertices and 12 triangles, and 8 − 18 + 12 = 2.</span>

### TSDF 融合 · TSDF fusion

TSDF = 截断的有符号距离场。每个体素存 D(到最近表面的有符号距离)和 W(权重,看过几次)。新来一帧深度图:把体素投到图像上,读出这条光线上测到的深度 z_meas,体素自己的深度是 z_vox,sdf = z_meas − z_vox。正 = 在表面前面(自由空间),负 = 在表面后面。只在 |sdf| < μ(截断距离,比如 5 厘米)以内更新。
<span class="en">Each voxel stores signed distance D and weight W; per frame, sdf = measured depth minus voxel depth, positive in front and negative behind, updated only within the truncation band μ.</span>

```
 沿一条光线看体素的 D 值(厘米,μ = 5)
 相机 ●───→  +5  +5  +3  +1  -1  -3  -5   (更远的不更新)
                          ▲ 表面在 +1 和 -1 之间,D = 0 的地方
 融合:D ← (W·D + w·d) / (W + w),   W ← W + w
```
> 🔤 D、W = 已存的距离和权重;d、w = 这一帧的距离和权重(w 常取 1);μ = 截断距离

算例:D = 0.02 米,W = 3;新一帧 d = 0.04,w = 1 → D = (3 × 0.02 + 0.04)/4 = 0.025,W = 4。多帧加权平均把噪声抹平。截断是因为离表面远的距离不可靠也没用,不更新就省计算。这就是 KinectFusion 的做法。
<span class="en">Example: 0.02 with weight 3 plus a new 0.04 gives 0.025 with weight 4; truncation skips far, useless voxels, as in KinectFusion.</span>

### Marching Cubes 和泊松 · Marching Cubes and Poisson

Marching Cubes:每个小立方格 8 个角,每个角 D 正或负,共 2⁸ = 256 种情况(按对称归并成 15 种基本情形)。查表知道在哪几条边上放三角形顶点,位置用线性插值找 D = 0。例:一条边两端 D = +0.02 和 −0.06,零点在 0.02 / (0.02 + 0.06) = 0.25 处,离正的那端四分之一边长。泊松重建:输入带朝向法向的点云,找一个指示函数 χ(里面 1、外面 0),让 χ 的梯度最像法向场 V,等价于解泊松方程 Δχ = ∇·V,再取等值面。好处:平滑、封闭(watertight)、抗噪。代价:没数据的地方会「编」出表面;法向朝向错了整块会翻。Open3D 里是 `ScalableTSDFVolume`、`create_from_point_cloud_poisson`(这里没跑)。
<span class="en">Marching Cubes: 8 corner signs give 256 cases (15 up to symmetry); a table places vertices on sign-changing edges by linear interpolation, here a quarter of the way from the positive end. Poisson solves Δχ = ∇·V for an inside-outside function matching the oriented normals; smooth and watertight, but it invents surface in holes and breaks with flipped normals.</span>

> A mesh is a <u>vertex array plus triangle indices</u>; point clouds don't have one, so it has to be reconstructed. For depth streams I use <u>TSDF fusion</u>: each voxel stores a <u>truncated signed distance</u> to the surface and a weight, and every frame updates voxels near the surface with a <u>weighted running average</u>, which averages out noise. Then <u>Marching Cubes</u> reads the signs at each cube's eight corners, uses a lookup table for the triangle pattern, and places vertices by <u>linear interpolation</u> of the zero crossing. For a single oriented cloud, <u>Poisson reconstruction</u> solves for an inside-outside function whose gradient matches the normals, giving a smooth watertight mesh. On a drone, real-time avoidance rarely needs a mesh; meshes are for offline inspection models.

这段在说什么:网格是什么 → TSDF 怎么融合 → 怎么抽面 → 另一条路泊松 → 无人机上什么时候真要网格。
<span class="en">What this does: what a mesh is, TSDF fusion, extraction, Poisson, and when a drone needs a mesh.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| TSDF 内存太大 <span class="en">TSDF memory?</span> | 1 立方米 1 厘米就 100 万体素(4.4);只在表面附近分配,用体素哈希。<span class="en">A million voxels per cubic meter at 1 cm; allocate near surfaces with voxel hashing.</span> |

## 9.11 各种表示怎么互相转 · Converting between representations

> 提纲:一张转换图 → 一张总表 → OctoMap 细讲(无人机避障最常用)

比方:同一座城市,可以是航拍照片(深度图)、一堆坐标(点云)、乐高模型(体素)、纸壳模型(网格)。
<span class="en">Analogy: one city as an aerial photo, a list of coordinates, a Lego model or a cardboard model.</span>

```
  深度图 ──反投影 (9.2)──→ 点云 ──插入八叉树──→ OctoMap / 体素
  深度图 ←──用 K 投影────  点云 ←──取占据格中心──  OctoMap / 体素
  深度图 ──TSDF 融合 (9.10)──→ TSDF ──Marching Cubes──→ 网格
                    点云 ──泊松 (9.10)──→ 网格 ──表面采样──→ 点云
```
> 🔤 K = 内参矩阵;箭头 = 怎么转过去

| 表示 <span class="en">Representation</span> | 存什么 <span class="en">Stores</span> | 什么时候用 <span class="en">When</span> | 代价 <span class="en">Cost</span> |
|---|---|---|---|
| 深度图 <span class="en">Depth map</span> | 每像素一个距离 <span class="en">Distance per pixel</span> | 单帧处理、喂 2D 网络 <span class="en">Per-frame work, 2D nets</span> | 只有一个视角 <span class="en">One view</span> |
| 点云 <span class="en">Point cloud</span> | N 个 xyz <span class="en">N points</span> | 配准、聚类、精确几何 <span class="en">Registration, clustering</span> | 没有邻接,不知道哪里是空的 <span class="en">No adjacency, no free space</span> |
| OctoMap <span class="en">OctoMap</span> | 每格占据 / 空闲 / 未知 <span class="en">Occupied, free, unknown</span> | 避障、路径规划 <span class="en">Avoidance, planning</span> | 分辨率受限 <span class="en">Resolution-limited</span> |
| TSDF | 每格到表面的有符号距离 <span class="en">Signed distance per cell</span> | 稠密重建 <span class="en">Dense reconstruction</span> | 内存大 <span class="en">Memory-heavy</span> |
| 网格 <span class="en">Mesh</span> | 顶点 + 三角形 <span class="en">Vertices, triangles</span> | 渲染、仿真、巡检模型 <span class="en">Rendering, simulation</span> | 要重建,难更新 <span class="en">Needs reconstruction</span> |

### OctoMap

八叉树:根是整个空间的大立方体,需要时把一个格子切成 8 个小格子,一直切到最小分辨率(比如 16 层)。只在有东西或看过的地方细分,空旷处一个大格子代替成千上万个小格子。例:20 × 20 × 5 米的场地,0.1 米稠密格子要 200 × 200 × 50 = 200 万格,八叉树只细分表面附近。更新:每个点等于一条从传感器到这个点的光线。终点格子「被打中」,是占据的证据;光线穿过的格子是空闲的证据。概率用对数几率存:L = log(p / (1 − p)),贝叶斯更新变成加法。打中加 log(0.7/0.3) ≈ +0.85,穿过加 log(0.4/0.6) ≈ −0.41。
<span class="en">An octree splits a cube into 8 children only where needed; a 20×20×5 m space at 10 cm is 2 million dense cells, but the octree refines only near surfaces. Each point is a ray: the end cell gets occupied evidence, passed cells get free evidence, stored as log-odds so updates are additions, about +0.85 per hit and −0.41 per miss.</span>

算例:新格子 L = 0(p = 0.5)。连续打中 3 次 → L = 2.54 → p = 1/(1 + e^(−2.54)) ≈ 0.927。再被穿过 1 次 → L = 2.14 → p ≈ 0.894。L 要设上下限,这样一个人走开以后,那格能较快变回空闲。三种状态:占据、空闲、未知。未知最关键:规划器不能把没看过的地方当成空的。规划器常再算一个「离最近障碍物多远」的欧氏距离场(ESDF,如 Voxblox),用来优化轨迹。
<span class="en">Example: three hits take a cell from 0.5 to 0.927, one miss brings it to 0.894; clamping lets cells clear after something moves. Occupied, free and unknown; the planner must not treat unknown as free, and often adds a Euclidean distance field (ESDF, e.g. Voxblox).</span>

> Each representation answers a different question. A <u>depth map</u> is what the sensor gives and suits per-frame work. A <u>point cloud</u> is exact geometry for registration and clustering, but says nothing about free space. For avoidance, drones usually keep an <u>occupancy map</u> like <u>OctoMap</u>: each point is a ray, the end cell gets an occupied hit and the cells along the ray get free evidence, stored as <u>log-odds</u> so updates are additions, in an octree that stays coarse in empty space. Crucially it separates <u>unknown from free</u>. <u>TSDF</u> and <u>meshes</u> are for dense reconstruction and inspection models.

这段在说什么:每种表示回答什么问题 → OctoMap 怎么更新 → 未知和空闲的区别 → 重建用什么。
<span class="en">What this does: what each answers, how OctoMap updates, unknown versus free, reconstruction formats.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 为什么不直接拿点云避障 <span class="en">Why not the raw cloud?</span> | 点云只说哪里有东西,不说哪里确认是空的;多帧还会越堆越大。<span class="en">It shows only occupied space and grows without bound.</span> |

## 9.12 深度学习怎么吃点云 · Deep learning on point clouds

> 提纲:CNN 要规则网格,点云无序 → PointNet / PointNet++ / 体素 + 稀疏卷积 / 投影成 2D

比方:CNN 像按座位号点名,第几排第几列是谁很固定。点云像一群人随便站,只能问「这群人里最高的多高」这种和站位无关的问题。为什么不能直接 CNN:卷积依赖「左边邻居、右边邻居」这种固定位置关系,点云第 i 行和第 i+1 行毫无关系。N 个点有 N! 种排法,网络对每种排法的输出必须一样,这叫置换不变。
<span class="en">Analogy: a CNN calls roll by seat number; a crowd standing anywhere only allows order-free questions like "who is tallest?" Convolution relies on fixed neighbor positions; points have none, and the output must be the same for all N! orderings, called permutation invariance.</span>

### PointNet 和 PointNet++

PointNet:每个点单独过同一个 MLP(共享权重,3 → 64 → 128 → 1024),再在 N 个点上逐通道取最大值,得到 1024 维全局特征,接 MLP 分类。最大值不管顺序,所以整个网络置换不变。
<span class="en">PointNet runs a shared MLP on each point, max-pools per channel across points into a 1024-d global feature, then classifies; max ignores order.</span>

```
  点 1 ─→ [共享 MLP] ─→ 1024 维 ─┐
  点 2 ─→ [共享 MLP] ─→ 1024 维 ─┼─→ 逐通道 max ─→ 全局 1024 维 ─→ MLP ─→ 类别
  点 N ─→ [共享 MLP] ─→ 1024 维 ─┘    (和顺序无关)
```
> 🔤 共享 MLP = 每个点用同一套权重;max = 对 N 个点逐通道取最大

小例子:三个点经过 MLP 得到 2 维特征 [1, 5]、[4, 2]、[3, 3],逐通道 max = [4, 5]。打乱成 [3, 3]、[1, 5]、[4, 2],还是 [4, 5]。分割时把全局特征拼回每个点自己的特征,再给每点一个类别。缺点:每个点单独处理,最后才汇总,看不到局部结构,像只有 1×1 卷积加全局池化。
<span class="en">Example: [1,5], [4,2], [3,3] pool to [4,5] in any order. Segmentation concatenates the global feature back per point. Weakness: no local structure.</span>

PointNet++:分层。用最远点采样(FPS,每次挑离已选点最远的点,分布均匀)选 M 个中心 → 每个中心用球查询拿半径 r 内的邻居 → 每组用一个小 PointNet 提特征 → 中心点成为下一层的「点」,再重复。相当于 CNN 的「局部感受野 + 下采样」。代价:采样和分组慢,点多时是瓶颈。
<span class="en">PointNet++ samples centers by farthest point sampling, groups neighbors by ball query, encodes each group with a mini PointNet, and repeats, like CNN receptive fields; sampling and grouping are slow.</span>

### 体素卷积和投影 · Voxels and projections

稀疏卷积:先体素化,但户外绝大多数格子是空的,稠密 3D 卷积太浪费,稀疏卷积只在非空体素上算(MinkowskiEngine、spconv),3D 检测常用(VoxelNet、SECOND)。投影成 2D:LiDAR 64 线 × 每圈 2048 个方位 = 64 × 2048 的 range image,直接 2D CNN 分割(如 RangeNet++);或者 80 × 80 米、0.1 米一格的俯视图(BEV)= 800 × 800,PointPillars 把每个竖柱里的点编码成一个像素再用 2D CNN,快。
<span class="en">Sparse convolution computes only on occupied voxels (VoxelNet, SECOND); projection makes a 64×2048 range image or an 800×800 bird's-eye grid for fast 2D CNNs like PointPillars.</span>

无人机上算力小(Jetson 级别),几何管线(9.13)是主力,学习方法多用来补语义,比如「这是电线还是树枝」。一个实用折中:2D 图像上跑检测,取检测框里深度的中位数反投影,得到物体的 3D 位置。
<span class="en">On Jetson-class compute the geometric pipeline does the heavy lifting; a practical shortcut is 2D detection plus median depth in the box, back-projected to 3D.</span>

> CNNs need a regular grid, but point clouds are <u>unordered</u>, so the network must be <u>permutation invariant</u>. <u>PointNet</u> applies the same <u>shared MLP</u> to every point and takes a <u>max over points</u> per channel; max is symmetric, so order doesn't matter. Its weakness is no local context, which <u>PointNet++</u> fixes by sampling centers with farthest point sampling, grouping neighbors in a ball and running a small PointNet per group, hierarchically. Alternatives are <u>sparse 3D convolution</u> on voxels, accurate but complex, and <u>projecting to a range image or bird's-eye view</u> for a fast 2D CNN, like PointPillars. On a drone I'd often run 2D detection and lift it to 3D with depth.

这段在说什么:为什么难 → PointNet 怎么做到置换不变 → PointNet++ 补局部 → 两条替代路线 → 无人机上的折中。
<span class="en">What this does: the difficulty, how PointNet achieves invariance, PointNet++, two alternatives, a drone compromise.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 为什么用 max 不用 sum <span class="en">Why max, not sum?</span> | sum、mean 也对称;max 对点数变化和少量离群点更稳,原文实验里最好。<span class="en">Both are symmetric; max is more robust and worked best in the paper.</span> |

## 9.13 无人机感知流水线串讲 · A drone perception pipeline end to end

> 提纲:传感器 → 世界系 → 裁剪 + 下采样 + 去噪 → 去地面 → 聚类出障碍 → 包围盒 / 占据地图 → 规划

比方:像做菜。买菜(采集),放到同一个案板上(统一坐标),择菜洗菜(预处理),把案板本身扣掉(去地面),分成一盘一盘(聚类),最后端给吃饭的人(规划器)。
<span class="en">Analogy: cooking; gather, put it on one board, clean, remove the board itself, portion it, and serve the planner.</span>

```
 深度相机 / LiDAR ──① 反投影或球坐标 (9.2)──→ 相机系点云
      ──② T_world←body · T_body←cam (9.3)──→ 世界系点云
      ──③ 裁剪 → 体素下采样 → 去离群点 (9.5)
      ──④ RANSAC 去地面,法向限制接近竖直 (9.7)
      ──⑤ 欧式聚类 / DBSCAN (9.8)
      ──⑥ 每簇包围盒 + 跨帧跟踪 │ 全部点当光线插入 OctoMap (9.11)
      ──⑦ 规划器:避开占据和未知的格子,生成轨迹
```
> 🔤 ① 到 ⑦ 每帧都跑一遍;括号里是本章对应小节

时间预算:30 帧每秒就是每帧 33 毫秒。所以下采样放在最前面,KD 树相关的重活(去噪、聚类)都在少量点上做。地图只保留飞机周围一块局部区域,随飞机移动,不让它无限长大。容易出问题的地方:位姿漂移(地图重影)、会动的物体(在地图里留下拖影)、细电线(下采样后消失)、玻璃和水面(深度测不准)、LiDAR 运动畸变(要去畸变)。白板上画上面那张图,每个箭头说一句,2 分钟讲完。
<span class="en">Budget: 33 ms per frame at 30 fps, so downsample first, run k-d tree work on few points, and keep a local map that moves with the drone. Failure points: pose drift, moving objects leaving trails, thin wires, glass and water, LiDAR motion distortion. On a whiteboard, draw the diagram and say one sentence per arrow.</span>

> Let me walk through it. The sensor, a stereo depth camera or LiDAR, gives a point cloud in the <u>sensor frame</u>, by back-projecting depth pixels or converting range and angles. I transform it into the <u>world frame</u> with the fixed camera-to-body extrinsic and the current pose from VIO, so frames can be fused. Then <u>preprocessing</u>: crop to a useful range, <u>voxel-downsample</u> to bound the point count, and remove statistical outliers like flying pixels. Next I <u>remove the ground</u> with RANSAC, with the normal constrained near vertical. The remaining points are grouped by <u>Euclidean clustering or DBSCAN</u> into obstacles, each with a bounding box, tracked across frames. In parallel, every point is inserted as a ray into an <u>occupancy map</u> like OctoMap, which keeps occupied, free and <u>unknown</u> space, and the planner avoids both occupied and unknown cells. At 30 frames per second I have 33 milliseconds, so downsampling comes first, and I'd watch for pose drift, moving objects and thin wires.

这段在说什么:按箭头顺序把前面每节串成一句话,最后说时间预算和风险,让面试官看到工程判断。
<span class="en">What this does: one sentence per stage, then the time budget and risks, to show engineering judgment.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 哪一步最慢 <span class="en">Slowest step?</span> | 和邻居搜索有关的:去噪、聚类、法向;所以先下采样,点数降一两个数量级。<span class="en">Neighbor-search steps; downsampling first cuts points by one or two orders of magnitude.</span> |
| 怎么评估 <span class="en">How to evaluate?</span> | 检测看召回率和 3D IoU;地图看和真值的 Chamfer 距离(两边各找最近点的平均距离);系统看每帧延迟和避障成功率。<span class="en">Recall and 3D IoU, Chamfer distance to ground truth, latency and avoidance success.</span> |

## 9.14 Peter 最可能问的 8 道点云题 · Eight point-cloud questions Peter is likely to ask

### Q1. What is a point cloud, and how is it different from an image? · 点云是什么,和图像有什么不一样

> A point cloud is an <u>N by 3 array</u> of 3D points, sometimes with color or intensity. Unlike an image, it's <u>unordered, irregular and sparse</u>, so there are no free neighbors and I need a k-d tree or voxel grid. Its advantage is <u>true metric scale</u>, which is what you need for distances to obstacles. A depth camera gives an organized cloud, H by W by 3; a LiDAR gives an unorganized one.

这段在说什么:定义、三个特点和后果、好处、两种来源(9.1)。
<span class="en">What this does: definition, properties and consequence, benefit, two kinds.</span>

### Q2. How do you turn a depth image into a point cloud? · 深度图怎么变成点云

> I invert the pinhole projection: for pixel (u, v) with depth Z, <u>X = (u − cx)·Z/fx</u> and <u>Y = (v − cy)·Z/fy</u>. With f = 500 and center (320, 240), pixel (420, 190) at 2 meters is (0.4, −0.2, 2.0). I convert depth units to meters first, drop zero depth, and vectorize over the whole image. To combine frames, I then transform it into the world frame with the pose.

这段在说什么:公式、一个能心算的例子、两个工程细节、下一步(9.2、9.3)。
<span class="en">What this does: formula, a mental-math example, two details, the next step.</span>

### Q3. How do you estimate surface normals? · 法向量怎么估计

> For each point I take its <u>k nearest neighbors</u>, compute their <u>covariance</u>, and take the eigenvector with the <u>smallest eigenvalue</u>, the direction of least spread. The sign is ambiguous, so I <u>orient it toward the sensor</u>. The smallest eigenvalue over the sum gives a curvature, near zero on planes. The choice of k trades noise robustness against smoothing across edges.

这段在说什么:做法、为什么取最小、正负号、曲率、k 的权衡(9.6)。
<span class="en">What this does: method, why smallest, the sign, curvature, the trade-off in k.</span>

### Q4. How would you find the ground plane robustly? · 怎么稳健地找出地面

> I'd use <u>RANSAC</u>: sample three points, get the normal by a <u>cross product</u>, count inliers within a few centimeters, keep the best, then refit with PCA. The iteration count is <u>log(1 − p)/log(1 − w³)</u>, about 11 for 70% inliers at 99% confidence. On a drone I'd constrain the normal near vertical so walls aren't chosen, and fit per region on uneven ground. Ground comes first because otherwise it links every obstacle into one cluster.

这段在说什么:四步、迭代次数、两个约束、为什么它是第一步(9.7)。
<span class="en">What this does: steps, iterations, two constraints, why first.</span>

### Q5. Explain ICP. When does it fail? · 讲一下 ICP,什么时候会失败

> ICP alternates <u>nearest-neighbor correspondences</u> and a <u>closed-form rigid fit</u>: subtract centroids, SVD of H = Σ p′q′ᵀ, R = VUᵀ with a determinant check, t = q̄ − Rp̄. It only reaches a <u>local minimum</u>, so it fails with a <u>bad initial guess</u>, symmetric objects, low overlap, or degenerate scenes like a single plane or a long corridor. In a small test it recovered a 60-degree offset on a box but fell into the 180-degree symmetric solution from 120. The fixes are an <u>IMU or odometry prior</u>, <u>FPFH plus RANSAC</u> global registration, outlier rejection, and point-to-plane.

这段在说什么:两步、闭式解、四种失败、一个实跑例子、补救(9.9)。
<span class="en">What this does: two steps, closed form, failure modes, a measured example, remedies.</span>

### Q6. How would you detect obstacles from a depth camera or LiDAR on a drone? · 无人机上怎么检测障碍物

> Transform the cloud to the <u>world frame</u> with the pose, then crop, <u>voxel-downsample</u> and remove outliers. Remove the <u>ground with RANSAC</u>, then <u>cluster</u> the rest with Euclidean clustering or DBSCAN and fit bounding boxes, tracked across frames. In parallel, insert the points as rays into an <u>occupancy map</u> like OctoMap, which separates occupied, free and unknown space for the planner. Everything has to fit the frame budget, about 33 milliseconds at 30 frames per second, so downsampling comes first.

这段在说什么:流水线一句一步,最后落到实时预算(9.13)。
<span class="en">What this does: the pipeline in order, ending on the real-time budget.</span>

### Q7. Why is PointNet permutation invariant? · PointNet 为什么和点的顺序无关

> Because points are unordered, the output must not depend on their order. <u>PointNet</u> applies a <u>shared MLP</u> to every point independently and then takes a <u>max over points</u> per channel; max is symmetric, so any permutation gives the same global feature. <u>PointNet++</u> adds local context by grouping neighbors and applying PointNet hierarchically. Other options are <u>sparse 3D convolution</u> on voxels, or <u>projecting to range or bird's-eye images</u> for a 2D CNN, which is fastest.

这段在说什么:约束是什么、PointNet 怎么满足、局限和补法、另外两条路(9.12)。
<span class="en">What this does: the constraint, how PointNet meets it, its limit, two other routes.</span>

### Q8. Have you worked with point clouds before? · 你做过点云吗(诚实回答,不编)

> Not in a project yet, and I want to be upfront about that. My closest work is <u>RCRI</u>, a two-person project detecting climbing holds in 2D images: we trained <u>YOLOv8 on GCP</u> and deployed it with <u>TensorRT on a Jetson Nano</u>, at 12 FPS for the first stage and 5 FPS for the full three-stage pipeline, so I know what an edge compute budget feels like. For 3D, I understand the standard pipeline, back-projection, world-frame transforms, downsampling, RANSAC ground removal, clustering, ICP and occupancy mapping, and I can derive the math, like normals from PCA and the SVD step in ICP. If I extended RCRI to 3D, I'd add a depth camera and <u>lift each 2D detection to 3D</u> with the median depth inside the box.

这段在说什么:先诚实说没做过 → 讲真实的相邻经验(RCRI,数字照实)→ 证明懂流程和数学 → 给一个具体的延伸思路,有底气但不夸大。
<span class="en">What this does: honest first, then the real adjacent experience with exact numbers, then proof of understanding, then a concrete extension; confident without overclaiming.</span>

(function(){

  const esc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('('+terms.map(esc).join('|')+')','gi');
  const lower={};terms.forEach(t=>lower[t.toLowerCase()]=t);
  const appC=heads.find(h=>h.textContent.trim().startsWith('附录 C'));
  const skip=n=>{for(let e=n.parentElement;e;e=e.parentElement){const tg=e.tagName;if(tg==='PRE'||tg==='CODE'||tg==='A'||tg==='H1'||tg==='H2'||tg==='H3'||tg==='SCRIPT'||e.classList.contains('gl')||e.classList.contains('part'))return true;}return false;};

    const seen=new Set();
    const walker=document.createTreeWalker(bl,NodeFilter.SHOW_TEXT,{acceptNode:n=>skip(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(nd=>{
      const txt=nd.nodeValue;if(!re.test(txt)){re.lastIndex=0;return;}re.lastIndex=0;
      const frag=document.createDocumentFragment();let last=0,m,changed=false;
      while((m=re.exec(txt))){const key=lower[m[1].toLowerCase()];if(!key||seen.has(key)){continue;}
        /* latin terms must be whole words */
        if(/^[A-Za-z0-9+.\- ]+$/.test(key)){const b=txt[m.index-1]||' ',a=txt[m.index+m[0].length]||' ';if(/[A-Za-z0-9_]/.test(b)||/[A-Za-z0-9_]/.test(a))continue;}
        seen.add(key);frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        const sp=document.createElement('span');sp.className='gl';sp.textContent=m[0];sp.dataset.d=G[key];frag.appendChild(sp);last=m.index+m[0].length;changed=true;}
      if(changed){frag.appendChild(document.createTextNode(txt.slice(last)));nd.replaceWith(frag);}
    });
  });
  const tip=document.getElementById('tip');
  main.addEventListener('mouseover',e=>{const t=e.target.closest('.gl');if(!t)return;const d=t.dataset.d;const i=d.indexOf(':');tip.innerHTML='<b></b> ';tip.querySelector('b').textContent=d.slice(0,i);tip.appendChild(document.createTextNode(d.slice(i+1)));tip.style.display='block';

})();

setInterval(savePos,1000);window.addEventListener('pagehide',savePos);window.addEventListener('beforeunload',savePos);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')savePos();});

/* ---- 右侧 Q&A:用 Claude 生成解答(只在 claude.ai 里打开的版本可用) ---- */
let SAMPLE=null;const sampleReady=(async()=>{await new Promise(r=>setTimeout(r,0));try{if(window.claude&&window.claude.use){SAMPLE=await window.claude.use('sample');}}catch(e){SAMPLE=null;}try{render();}catch(e){}})();
function secText(id){const h=document.getElementById(id);if(!h)return '';let t=[];let e=h.nextElementSibling;const lvl=+h.tagName[1];while(e){if(/^H[1-3]$/.test(e.tagName)&&(+e.tagName[1])<=lvl)break;if(!e.classList.contains('part'))t.push(e.innerText);e=e.nextElementSibling;}return t.join('\n').slice(0,6000);}
async function answer(it,box,btn){
  if(!SAMPLE){box.textContent='这个功能只在 claude.ai 上打开的版本可用。本地版请点「复制全部为 Markdown」发给我。';return;}
  const ctx=secText(it.id);btn.disabled=true;box.className='ans think';box.textContent='Claude 在想…(5–60 秒)';
  const prompt='你是在帮一位 2026 年 12 月毕业的哥大计算机工程硕士准备 Byte Veda Computer Vision / 3D Perception Engineer 终面(11/5 周四,lead CV engineer Peter,主题 3D 建模、图像处理、计算机视觉)。她正在读 FPCV(Nayar 计算机视觉第一性原理)课程笔记,看到下面这一节时提了一个问题。请用中文、零基础也能懂的口吻回答:先一句人话给结论,再展开解释,必要时给面试里可以直接说的一句英文原话。控制在 300 字以内。\\n\\n【她正在看的章节】'+(it.title||'')+'\n'+ctx+'\n\n【她的问题】'+it.text;
  try{const {text}=await SAMPLE(prompt,{onText:({text})=>{box.className='ans';box.textContent=text;}});
    const all=load();const i=all.findIndex(x=>x.k===it.k);if(i>=0){all[i].answer=text;store(all);}box.className='ans';box.textContent=text;}
  catch(e){box.className='ans';box.textContent=e&&e.text?e.text:(e&&e.code==='not_granted'?'你没有允许这个页面使用 Claude,所以生成不了。':'生成失败('+(e&&e.code||'unknown')+'),稍后再试或发给我。');}
  finally{btn.disabled=false;}
}
/* ---- 右侧 Q&A ---- */
const KEY='byteveda_fpcv_qa_v1';
let cur={id:'',title:'(未定位)'};
function setSec(h){cur={id:h.id,title:h.textContent.replace('＋问','').replace(/[☐✓] 掌握/,'').replace(/[☆★] (已)?收藏/,'').replace(/🔖 (稍后|待看)/,'').trim()};try{if(h.dataset.k)localStorage.setItem('byteveda_fpcv_last_v1',JSON.stringify({k:h.dataset.k,title:cur.title,when:Date.now()}));}catch(e){}document.getElementById('cursec').textContent='当前章节:'+cur.title;
  tl.querySelectorAll('a.cur').forEach(a=>a.classList.remove('cur'));const a=tl.querySelector('a[href="#'+h.id+'"]');if(a)a.classList.add('cur');}
function nearest(){let best=null;for(const h of heads){if(!h.isConnected)continue;const r=h.getBoundingClientRect();if(r.top<=120)best=h;else break;}if(best)setSec(best);}
nearest();
(function(){try{const LAND="第 0 章";let _sv=null;try{_sv=JSON.parse(localStorage.getItem('byteveda_fpcv_pos_v1')||'null')||JSON.parse(localStorage.getItem('byteveda_fpcv_last_v1')||'null')}catch(e){}if(LAND&&!(_sv&&_sv.k)){const h=heads.find(x=>x.textContent.indexOf(LAND)>=0);if(h){const go=()=>{window.scrollTo({top:Math.max(0,h.getBoundingClientRect().top+window.scrollY-10),behavior:'auto'});try{h.scrollIntoView({block:'start',behavior:'auto'})}catch(e){}};go();setTimeout(go,300);setTimeout(go,1200);setTimeout(go,2500);return;}}let p=JSON.parse(localStorage.getItem('byteveda_fpcv_pos_v1')||'null');if(location.hash&&!(p&&p.k))return;if(!p||!p.k){const l=JSON.parse(localStorage.getItem('byteveda_fpcv_last_v1')||'null');if(l&&l.k)p={k:l.k,off:0};}if(!p||!p.k)return;const h=heads.find(x=>x.dataset.k===p.k);if(!h)return;const go=()=>{const y=h.getBoundingClientRect().top+window.scrollY+(p.off||0);window.scrollTo({top:Math.max(0,y),behavior:'auto'});};go();setTimeout(go,300);setTimeout(go,1200);}catch(e){}})();
function load(){return ld(KEY,'[]')}
function store(list){sv(KEY,list)}
function render(){
  const list=load();const box=document.getElementById('notes');box.innerHTML='';
  if(!list.length){box.innerHTML='<div style="color:var(--mut);font-size:13px">还没有问题。</div>';return;}
  list.slice().reverse().forEach(it=>{
    const d=document.createElement('div');d.className='note'+(it.done?' answered':'');
    d.innerHTML='<div class="t"><span>'+(it.title||'')+' · '+it.when+'</span><span><a data-a="jump">跳转</a> <a data-a="done">'+(it.done?'未答':'已答')+'</a> <a data-a="del">删</a></span></div><div class="b"></div>';
    d.querySelector('.b').textContent=it.text;
    const ab=document.createElement('div');ab.className='ans';ab.hidden=!it.answer;ab.textContent=it.answer||'';d.appendChild(ab);
    const bb=document.createElement('div');bb.className='btns2';const gen=document.createElement('button');gen.textContent=it.answer?'重新生成解答':'生成解答';gen.title=SAMPLE?'用 Claude 生成这一题的解答':'只在 claude.ai 上打开的版本可用';gen.onclick=()=>{ab.hidden=false;answer(it,ab,gen);};bb.appendChild(gen);d.appendChild(bb);
    d.querySelectorAll('.t a').forEach(a=>a.onclick=()=>{
      const all=load();const i=all.findIndex(x=>x.k===it.k);if(i<0)return;
      if(a.dataset.a==='del')all.splice(i,1);
      if(a.dataset.a==='done')all[i].done=!all[i].done;
      if(a.dataset.a==='jump'&&it.id){location.hash='#'+it.id;return;}
      store(all);render();
    });
    box.appendChild(d);
  });
}
document.getElementById('save').onclick=()=>{
  const ta=document.getElementById('qtext');const text=ta.value.trim();if(!text)return;
  const list=load();const now=new Date();const when=now.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  list.push({k:Date.now()+Math.random(),id:cur.id,title:cur.title,text,when,done:false});
  store(list);ta.value='';render();
};
document.getElementById('clear').onclick=()=>{const b=document.getElementById('clear');if(load().length&&b.dataset.arm){store([]);render();delete b.dataset.arm;b.textContent='清空全部';}else{b.dataset.arm='1';b.textContent='再点一次确认清空';setTimeout(()=>{delete b.dataset.arm;b.textContent='清空全部';},3000);}};
document.getElementById('copy').onclick=async()=>{
  const list=load().filter(x=>!x.done);
  const out=['## ❓ 待答(从 HTML 复制,'+new Date().toLocaleDateString('zh-CN')+')',''].concat(list.map(x=>'- **['+x.title+']** '+x.text.replace(/\n/g,' '))).join('\n');
  const b=document.getElementById('copy');
  try{await navigator.clipboard.writeText(out);b.textContent='已复制 '+list.length+' 条';}
  catch(e){const ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');b.textContent='已复制 '+list.length+' 条';}catch(_){b.textContent='复制失败,手动选中';}ta.remove();}
  setTimeout(()=>b.textContent='复制全部为 Markdown',2000);
};
render();
