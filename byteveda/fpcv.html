## 8.21 目标跟踪 · Object Tracking

这一讲解决两件事。第一,静止相机拍的视频里,哪些像素在发生「有意义的变化」(比如车开过),哪些只是噪声、雨雪、树叶晃。第二,框住一个目标后,怎么在后面每一帧里一直找到它。
<span class="en">This lecture covers two problems: detecting meaningful per-pixel changes in a static-camera video, and following a chosen target from frame to frame.</span>

讲义的路线是:帧差 → 平均/中值背景 → 滑动中值 → 高斯混合模型(GMM)背景 → 模板跟踪 → 直方图跟踪 → 基于 SIFT 特征的跟踪。每一步都是在修上一步的毛病。
<span class="en">The path: frame differencing, average/median background, moving median, GMM background, template tracking, histogram tracking, then SIFT feature-based tracking. Each step fixes the previous one's weakness.</span>

### 8.21.1 变化检测:从帧差到滑动中值 · Change detection basics

比方:保安盯监控,要分清「有人走过」和「树叶在晃」。
<span class="en">Analogy: a guard watching CCTV must tell "someone walked by" from "leaves are swaying".</span>

任务定义:每个像素分成前景(foreground,在变)或背景(background,静止)。难点是要忽略这些「无聊的变化」:背景抖动(水波、树叶)、图像噪声、雨雪、光照和影子、相机抖动。
<span class="en">Task: label every pixel foreground (changing) or background (static), while ignoring water ripples, noise, rain/snow, lighting, shadows and camera shake.</span>

最简单的是帧差:F_t = |I_t − I_{t−1}| > T。T 是阈值。
<span class="en">Simplest method, frame differencing: F_t = |I_t − I_{t−1}| > T.</span>

小例子:某像素上一帧 100,这一帧 120,T = 15。差 20 > 15,判前景。
<span class="en">Example: 100 then 120 with T = 15. The difference 20 exceeds 15, so foreground.</span>

帧差的毛病有两个。树叶晃也会超过阈值。一辆颜色均匀的车平移时,车身中间前后两帧颜色一样,只有车的边缘会被检出。
<span class="en">Two problems: swaying leaves also pass the threshold, and a uniformly colored car only shows up at its edges.</span>

改进一:用一张「背景图」B 代替上一帧,F_t = |I_t − B| > T。B 可以是前 K 帧的平均,也可以是中值。中值更好,因为它代表「最常出现的值」,不怕偶尔开过的车。
<span class="en">Fix one: compare with a background image B built from the first K frames. The median beats the average because a passing car does not drag it.</span>

小例子:某像素前 5 帧是 100, 102, 180, 101, 99(第 3 帧有车经过)。平均 = 582 / 5 = 116.4,被车拉偏了。排序后 99, 100, 101, 102, 180,中值 = 101,几乎就是路面本色。
<span class="en">Example: values 100, 102, 180, 101, 99. Mean 116.4 is pulled by the car; median 101 stays at the road value.</span>

改进二:只用开头 K 帧,时间一长光照变了就失效。所以改成滑动中值:B_t = median{I_{t−1}, ..., I_{t−K}},用最近 K 帧。代价是每个像素要存 K 帧,每帧都要重算中值,比较贵。它对树叶好很多,但还是扛不住雨雪、影子和相机抖动。
<span class="en">Fix two, the moving median over the last K frames, adapts to slow lighting changes but costs K frames of memory and a median per pixel per frame. It still fails on rain, shadows and shake.</span>

### 8.21.2 高斯混合模型做背景 · Gaussian mixture background model

比方:一个像素一辈子见过的亮度,像一个班的身高分布。可能有好几个「小团体」,每个团体是一个钟形曲线。
<span class="en">Analogy: a pixel's intensity history is like a height histogram with several clusters, each one a bell curve.</span>

盯住雨天公路上的一个像素,统计它所有帧的亮度直方图。会看到几个鼓包:路面(背景,出现最多)、雪花(也算背景)、偶尔路过的车(前景,鼓包最矮)。
<span class="en">Watch one pixel on a rainy road: the histogram has bumps for the road, the snow (both background) and occasional cars (foreground, smallest bump).</span>

![一个像素的亮度直方图:两个背景鼓包加一个前景鼓包](img/fbaa2ac4606.jpg)

先把直方图归一化成概率分布(面积为 1)。每个鼓包用一个带权重的高斯描述:ω·η(x, μ, σ),其中 η(x, μ, σ) = 1/(√(2π)σ) · exp(−(x−μ)²/(2σ²))。μ 是均值,σ 是宽度,ω 叫证据(evidence),表示这个鼓包占多少比例。
<span class="en">Normalize the histogram, then model each bump as ω·η(x, μ, σ): mean μ, width σ, and evidence ω for the bump's share.</span>

GMM 就是 K 个高斯加起来:P(x) ≈ Σ_k ω_k η(x, μ_k, σ_k),且 Σ ω_k = 1。彩色像素就把 x 换成 [r, g, b] 三维向量,σ 换成 3×3 协方差矩阵 Σ。三通道独立时 Σ 是对角阵,通道相关时是满矩阵。只有分布真的能用少数几个高斯描述时,GMM 才有意义。
<span class="en">A GMM is P(x) ≈ Σ ω_k η(x, μ_k, σ_k) with Σ ω_k = 1. For color, x becomes an RGB vector and σ becomes a covariance matrix. It only makes sense when a few Gaussians suffice.</span>

哪个高斯算背景?直觉是:像素大部分时间看到的是背景,所以背景高斯「出现多(ω 大)且很稳(σ 小)」。规则是看 ω/σ:大的判背景,小的判前景。
<span class="en">Background Gaussians have large evidence and small spread, so rank by ω/σ: large means background, small means foreground.</span>

![ω/σ 大的是背景高斯,小的是前景高斯](img/fbc6c254355.jpg)

### 8.21.3 Stauffer 算法:逐像素分类与更新 · Stauffer's adaptive GMM

每个像素独立做下面几步:
<span class="en">Per pixel, independently:</span>

```
1. 用前 N 帧建亮度直方图 H,归一化成 Ĥ = H / ||H||
2. 用 K 个高斯(3 到 5 个)拟合 Ĥ,按 ω/σ 给每个高斯贴前景/背景标签
3. 新来一帧,像素值 X:
   a. 找均值最近的高斯 k,且要求 |X − μ_k| < 2.5 σ_k
   b. 这个高斯是背景 → 像素判背景;否则判前景
   c. 用 X 更新直方图 H
   d. 只有新旧 Ĥ 差得多时,才重新拟合 GMM
```

小例子:设某像素的 GMM 为 路面 (μ=80, σ=5, ω=0.6)、雪 (μ=220, σ=10, ω=0.3)、车 (μ=150, σ=25, ω=0.1)。ω/σ 分别是 0.12、0.03、0.004。前两个大,判背景;车那个最小,判前景。
<span class="en">Example GMM: road (80, 5, 0.6), snow (220, 10, 0.3), car (150, 25, 0.1). ω/σ = 0.12, 0.03, 0.004, so road and snow are background, car is foreground.</span>

新像素 X = 160:到三个均值的距离是 80、60、10,最近的是车。10 < 2.5 × 25 = 62.5,成立,所以判前景。新像素 X = 84:最近的是路面,距离 4 < 2.5 × 5 = 12.5,判背景。
<span class="en">X = 160 is closest to the car mean (distance 10 < 62.5), so foreground. X = 84 is 4 from the road mean (< 12.5), so background.</span>

第 d 步是为了省算力。百万像素每帧都重拟合 GMM 太贵,所以只在分布明显漂移时才重拟合。这样它既能跟上慢变的光照和天气,又能实时。
<span class="en">Step d saves compute: refitting a million GMMs every frame is too expensive, so refit only when the histogram drifts.</span>

效果上,雨天场景里滑动中值会把大片雨点当成前景,自适应 GMM 基本只留下车。
<span class="en">In the rainy scene, the moving median marks lots of rain as foreground, while the adaptive GMM keeps mostly the car.</span>

![滑动中值(中)vs 自适应 GMM(右)](img/f6839b40e18.jpg)

局限:整套方法假设相机不动。像素之间互相独立,没有用邻域信息。影子和相机抖动讲义只列为挑战,GMM 本身并不专门解决。
<span class="en">Limits: it assumes a static camera, treats pixels independently, and does not specifically solve shadows or camera shake.</span>

### 8.21.4 模板跟踪:外观模板与直方图模板 · Template-based tracking

比方:手里拿着目标的照片,在下一帧附近一块块比,看哪里最像。
<span class="en">Analogy: hold a photo of the target and slide it around the next frame to find the best look-alike.</span>

外观跟踪(appearance-based):上一帧框出的窗口当模板,在下一帧的邻域里做模板匹配。找到后,用新位置的图块更新模板,继续下一帧。相似度可以用:
<span class="en">Appearance tracking: use the previous window as a template, search a neighborhood in the next frame, then replace the template with the new match. Metrics:</span>

```
SAD(k,l) = Σ |I1(i,j) − I2(i+k, j+l)|          取最小
SSD(k,l) = Σ (I1(i,j) − I2(i+k, j+l))²         取最小
NCC(k,l) = Σ I1·I2 / sqrt(Σ I1² · Σ I2²)        取最大
```

小例子:模板是 2×2 的 [10, 20; 30, 40]。候选 A = [12, 18; 30, 41],差是 2, −2, 0, 1,SAD = 5,SSD = 4+4+0+1 = 9。候选 B = [20, 40; 60, 80],就是同一块变亮了一倍。B 的 SSD = 100+400+900+1600 = 3000,很差。但 NCC:Σ T·B = 2 × 3000 = 6000,分母 sqrt(3000 × 12000) = 6000,NCC = 1,满分。
<span class="en">Example: template [10,20;30,40]. Candidate A gives SAD 5, SSD 9. Candidate B is the same patch at double brightness: SSD 3000, but NCC = 6000/6000 = 1. NCC ignores a brightness gain.</span>

这就是讲义说 NCC「对光照更不敏感」的意思。外观跟踪实现简单,但只在相邻帧之间尺度、姿态、光照、遮挡都变化不大时才好用,而且每帧换模板会慢慢漂移。
<span class="en">That is why NCC is more illumination-robust. Appearance tracking is simple but breaks under scale, pose, lighting or occlusion changes, and template updates can drift.</span>

直方图跟踪(histogram-based):模板不是图块本身,而是窗口内的颜色直方图。丢掉了空间信息,反而对姿态和尺度变化更稳。窗口边缘的像素更可能是背景,所以用加权直方图,权重用 Epanechnikov 核:
<span class="en">Histogram tracking uses the window's color histogram as the template. Losing spatial layout makes it robust to pose and scale. Edge pixels are likely background, so weight them with the Epanechnikov kernel:</span>

```
k(x̃) = 1 − ||x̃||²   当 ||x̃|| < 1,否则 0
x̃ = ((x − xc)/W, (y − yc)/H)    归一化到窗口半宽 W、半高 H
```

小例子:窗口中心像素 x̃ = (0, 0),权重 1。x̃ = (0.5, 0),权重 1 − 0.25 = 0.75。x̃ = (0.5, 0.5),权重 1 − 0.5 = 0.5。x̃ = (0.6, 0.8),||x̃||² = 0.36 + 0.64 = 1,权重 0。
<span class="en">Weights: center 1, (0.5, 0) gives 0.75, (0.5, 0.5) gives 0.5, (0.6, 0.8) sits on the boundary and gives 0.</span>

![Epanechnikov 核给中心像素更大权重](img/f10fe2a3668.jpg)

比较两个直方图可以用相关或交集(intersection)。局限:目标颜色在场景里必须独特,大小大致不变。篮球场上两个同队球员交叉时,窗口可能跟错人。
<span class="en">Compare histograms by correlation or intersection. It needs a distinctive color and roughly constant size; two same-uniform players crossing can steal the window.</span>

### 8.21.5 基于特征的跟踪(Gu 2010)· Tracking by feature detection

比方:不再记整张脸的样子,而是记脸上的一堆「指纹点」。下一帧里哪个框装下的指纹点最多,脸就在哪。
<span class="en">Analogy: remember a set of fingerprint points on the face, then pick the box in the next frame that contains the most of them.</span>

![对象模型和背景模型两套特征,来回匹配和更新](img/fd4ef416c37.jpg)

初始化(第 1 帧):给定框 W_1。对整张图跑 SIFT。框内特征放进对象集合 O_1,框外特征放进背景集合 B。SIFT 特征是「位置 + 描述子」,描述子对尺度和旋转不敏感。
<span class="en">Init: run SIFT on frame 1. Features inside W_1 form the object set O_1, the rest form the background set B.</span>

第 t 帧:
<span class="en">At frame t:</span>

```
1. 对整帧提 SIFT 特征 v_1 ... v_N
2. 每个 v_i:d_O = 到对象集合最近匹配的距离,d_B = 到背景集合最近匹配的距离
   C(v_i) = +1 若 d_O / d_B < 0.5,否则 −1
3. 对每个候选窗口 W:φ(W) = 窗口内所有 C 之和
   τ(W, W_{t−1}) = 位置、大小、形状变化太大的惩罚
   匹配分 μ(W) = φ(W) − τ(W, W_{t−1})
4. 取 μ 最大的窗口当新位置 W_t
5. 用 W_t 内的 +1 特征更新对象集合,框外特征更新背景集合
```

小例子:特征甲 d_O = 0.2,d_B = 0.6,比值 0.33 < 0.5,C = +1。特征乙 d_O = 0.4,d_B = 0.6,比值 0.67,C = −1。候选窗口 A 里有 9 个 +1、2 个 −1,φ = 7,惩罚 τ = 1,μ = 6。候选窗口 B 更大,有 11 个 +1、6 个 −1,φ = 5,又因为变形大 τ = 3,μ = 2。选 A。
<span class="en">Example: ratio 0.33 gives +1, ratio 0.67 gives −1. Window A: φ = 9 − 2 = 7, τ = 1, μ = 6. Window B: φ = 11 − 6 = 5, τ = 3, μ = 2. Pick A.</span>

为什么好:SIFT 本身扛尺度和旋转,所以人转身、走远都能跟住。为什么抗遮挡:帽子、杂志上的特征之前没见过,和对象集合匹配不上,不会被当成目标,也不会被加进对象模型。0.5 这个比值检验和 SIFT 匹配里的 ratio test 是同一个思路:只有「明显更像目标」才算数。
<span class="en">SIFT handles scale and rotation. Occluders (hat, magazine) have unseen features that never match the object set, so they neither score nor pollute the model. The 0.5 ratio is the same idea as Lowe's ratio test.</span>

代价:每帧要对整图提 SIFT,还要在候选窗口上搜索,比模板匹配贵。目标本身纹理太少时,特征点不够用。
<span class="en">Cost: full-frame SIFT plus a window search each frame, and it needs enough texture on the target.</span>

应用:街头多人跟踪(Benfold 2011)、已知公路几何后从图像速度换算车速、商店里统计顾客停留热区。
<span class="en">Applications: multi-person tracking, vehicle speed from known road geometry, in-store dwell heatmaps.</span>

### 8.21.x 面试怎么问 · Likely questions

**Q:How would you do background subtraction robustly, and what breaks it?**
怎么做稳健的背景减除?什么情况会失效?

> I'd model each pixel's intensity history as a Gaussian mixture, following Stauffer and Grimson. Gaussians with high weight and low variance, so a large ω over σ, are background. A new pixel is assigned to the nearest Gaussian within 2.5 sigma and inherits its label, and the model is refit only when the histogram drifts, which keeps it real time. It handles swaying leaves and rain far better than a moving median. It breaks when the camera moves, because the per-pixel history is no longer the same scene point.

这段在说什么:每个像素一个 GMM,ω/σ 大的是背景,2.5σ 内归类,只在漂移时重拟合;相机一动就失效。
<span class="en">Per-pixel GMM, ω/σ labels, 2.5σ assignment, lazy refit; fails under camera motion.</span>

和 Byte Veda 的联系:无人机相机在动。要先用单应或光流把上一帧对齐到当前帧(运动补偿),再做背景建模。这句一定要主动说。

**Q:SSD vs normalized cross-correlation for template matching?**
模板匹配用 SSD 还是 NCC?

> SSD sums squared pixel differences, so it is cheap but any brightness change inflates the score. Normalized cross-correlation divides by the energy of both patches, so a patch that is just brighter by a constant gain still scores one. If lighting varies between frames, NCC is safer. Subtracting the patch means first, zero-mean NCC, also removes a constant offset.

这段在说什么:SSD 便宜但怕亮度变,NCC 归一化后不怕整体增益;去均值版还不怕整体偏移。
<span class="en">SSD is cheap but brightness-sensitive; NCC is gain-invariant, and zero-mean NCC is also offset-invariant.</span>

**Q:Why is feature-based tracking more robust to occlusion than template tracking?**
为什么基于特征的跟踪比模板跟踪更抗遮挡?

> A template compares every pixel, so a hand covering half the face ruins the match and the updated template drifts onto the occluder. In the feature approach each SIFT feature votes plus one or minus one with a ratio test against object and background models. Occluder features match neither model well, so they do not add votes and are not added to the object model. The window that keeps the most surviving object features, with a penalty on large jumps, still lands on the target.

这段在说什么:模板是整块比,遮挡一半就崩;特征法是逐点投票,遮挡物的点不投票也不进模型。
<span class="en">Templates fail as a whole; features vote individually and occluders are simply ignored.</span>

和 Byte Veda 的联系:无人机实时跟踪目标时,尺度变化(飞近飞远)和旋转很常见,特征法的尺度旋转不变性正好对口;算力紧时可以把 SIFT 换成更快的特征。

**Q:What does the penalty term τ do in the window search?**
窗口搜索里的惩罚项 τ 有什么用?

> It encodes a motion prior: the object should not jump far or change size and shape drastically between consecutive frames. Without it, a large window could grab many positive features from clutter and win just by being big. Subtracting τ from the vote sum trades evidence against smoothness, similar to a regularizer.

这段在说什么:τ 是「相邻帧不会突变」的先验,防止大窗口靠多装点作弊,作用像正则项。
<span class="en">τ is a smoothness prior that stops large or far windows from winning by accident, like a regularizer.</span>

## 8.22 图像分割 · Image Segmentation

这一讲要把一张图切成若干「有意义」的区域。讲义的做法是把每个像素变成特征空间里的一个点,再把相近的点聚成一类,一类就是一个分割块。
<span class="en">Goal: partition an image into meaningful regions. The lecture maps each pixel to a point in feature space and clusters the points; each cluster is a segment.</span>

三个算法由浅入深:k-means(要先给类数 k)、mean shift(不用给类数,爬山找峰)、归一化图割 NCut(把图像当成图,找代价最小的切法)。
<span class="en">Three methods: k-means (needs k), mean shift (finds the number of clusters by hill climbing), and normalized graph cut.</span>

### 8.22.1 分割为什么难,人怎么分 · Why segmentation is hard

比方:让三个人给同一张照片描边,一个只分「人和背景」,一个连头发和脸都分开,一个连背景装饰都描出来。三个都不算错。
<span class="en">Analogy: three people outline the same photo at three levels of detail, and none is wrong.</span>

所以分割是一个定义不清(ill-posed)的问题,好坏取决于任务。比如帽子算不算人的一部分,要看你要干什么。
<span class="en">Segmentation is ill-posed; whether a cap belongs to the person depends on the task.</span>

人类分组靠格式塔(Gestalt)原则。Gestalt 是德语「形状」的意思,意思是人先看到整体,再看部件。具体原则:接近(离得近的一组)、相似(长得像的一组)、共同命运(一起动的一组)、共同区域/连接(被圈在一起或连线的一组)、连续(落在一条平滑曲线上的一组)、对称。还有错觉轮廓,比如 Kanizsa 三角形,像素里根本没有那条边,人却看得见。
<span class="en">Humans group by Gestalt cues: proximity, similarity, common fate, common region/connectivity, continuity, symmetry. Illusory contours like the Kanizsa triangle show we even see edges that are not in the pixels.</span>

两种思路:自上而下(top-down),像素属于同一个物体所以在一起,要先认出物体;自下而上(bottom-up),像素长得像所以在一起。后者容易定义,本讲走这条路。
<span class="en">Top-down groups pixels because they belong to one object; bottom-up groups them because they look alike. The lecture takes bottom-up.</span>

### 8.22.2 把分割变成聚类 · Segmentation as clustering

每个像素可以有一串属性:亮度、颜色 R/G/B、位置 x/y、深度、运动(光流)、纹理,将来还可能有材质。把它们拼成一个特征向量 f = [R, G, B, x, y, d, ...],整张图就变成高维欧氏空间里的一团点。
<span class="en">Each pixel gets a feature vector such as [R, G, B, x, y, depth, motion, texture], so the image becomes a point cloud in a high-dimensional Euclidean space.</span>

两个像素多像,用 L2 距离衡量:S(f_i, f_j) = sqrt(Σ_k (f_ik − f_jk)²)。距离越小越相似。
<span class="en">Similarity is the L2 distance S(f_i, f_j) = sqrt(Σ (f_ik − f_jk)²); smaller means more similar.</span>

小例子:三个像素的颜色是 p1 = (200, 50, 50) 红,p2 = (190, 60, 50) 也是红,p3 = (50, 50, 200) 蓝。S(p1, p2) = sqrt(100 + 100 + 0) = sqrt(200) ≈ 14.1。S(p1, p3) = sqrt(150² + 0 + 150²) = sqrt(45000) ≈ 212.1。所以 p1 和 p2 该归一类。
<span class="en">Example: two reds are 14.1 apart, red and blue are 212.1 apart, so the two reds cluster together.</span>

聚完类后,每个像素涂成所在类的平均颜色,就得到分割图。
<span class="en">After clustering, recolor every pixel with its cluster's mean color to visualize the segmentation.</span>

### 8.22.3 k-means 分割 · k-means segmentation

比方:先随便插 k 面旗,每个人走向最近的旗,然后旗挪到这群人的中心,反复几次就稳定了。
<span class="en">Analogy: plant k flags, everyone walks to the nearest flag, move each flag to its crowd's center, repeat.</span>

```
1. 在特征空间随机选 k 个点当初始均值 m_1 ... m_k
2. 每个像素分给最近的均值
3. 每类重新算均值
4. 所有均值的移动都小于阈值 ε 就停,否则回到 2
```

小例子(一维):数据 1, 2, 3, 10, 11, 12,k = 2,初始均值 1 和 2。
第 1 轮:1 归 m1;2, 3, 10, 11, 12 都离 2 更近,归 m2。新均值 m1 = 1,m2 = 38 / 5 = 7.6。
第 2 轮:2 离 1 是 1、离 7.6 是 5.6,归 m1;3 离 1 是 2、离 7.6 是 4.6,归 m1;10, 11, 12 归 m2。新均值 m1 = 2,m2 = 11。
第 3 轮:分配不变,收敛。
<span class="en">1-D example with k = 2 starting at 1 and 2: after two updates the means settle at 2 and 11.</span>

初始化有三种办法:随机选点,太近就重抽;在分布范围内均匀撒 k 个点;先在一小撮随机像素上跑 k-means,拿结果当全图的初值。
<span class="en">Initialization: random points with resampling if too close, uniform spread over the range, or k-means on a random subset first.</span>

只用颜色 RGB 时,同一类颜色会散落在图里很多不相连的地方。把 x, y 加进特征变成五维,离得近的像素更容易同类,结果连成块,好用得多。
<span class="en">With RGB only, one cluster maps to many disconnected regions. Adding x and y (5-D features) encourages spatially coherent segments.</span>

![k=16:只用 RGB(左下)vs 加上 x,y(右下)](img/f0186884474.jpg)

优缺点:简单、快。但要事先给 k,对初值敏感,对离群点敏感(离群点被选成初值时会产生没意义的小块)。
<span class="en">Simple and fast, but needs k, is sensitive to initialization, and outliers can create meaningless clusters.</span>

### 8.22.4 Mean shift 分割 · Mean shift segmentation

比方:把特征点的密度想成一片山地。每个点闭着眼往附近最陡的方向爬,爬到同一个山顶的点就是一类。有几座山就有几类,不用提前说。
<span class="en">Analogy: treat point density as terrain. Each point climbs the nearest steepest hill; points reaching the same peak form one cluster, however many peaks there are.</span>

```
1. 每个像素 i 的初始均值 m_i = f_i
2. 对每个 m_i 重复:
   a. 以 m_i 为中心放一个半径 W 的窗口
   b. 算窗口内所有点的均值 m(可以加权,越靠中心权越大),令 m_i = m
   c. 移动量小于阈值 ε 时停,m_i 就是一个峰(mode)
3. 收敛到同一个峰的像素归为同一类
```

「均值一直在挪」就是名字 mean shift 的来源。每次挪动的方向就是密度上升的方向。
<span class="en">The window's mean keeps shifting toward higher density, hence "mean shift".</span>

![不同起点爬到同一个峰,就归为同一类](img/fed7de67160.jpg)

小例子(一维):数据 1, 2, 3, 4, 10, 11,窗口半径 W = 2。
从 1 出发:窗口 [−1, 3] 里有 1, 2, 3,均值 2。窗口 [0, 4] 里有 1, 2, 3, 4,均值 2.5。窗口 [0.5, 4.5] 里还是这四个,均值 2.5,不动了,峰在 2.5。
从 10 出发:窗口 [8, 12] 里有 10, 11,均值 10.5。窗口 [8.5, 12.5] 里还是 10, 11,峰在 10.5。
自动得到 2 类,没人告诉它 k = 2。
<span class="en">1-D example with W = 2: starting at 1 converges to 2.5, starting at 10 converges to 10.5. Two clusters appear without specifying k.</span>

和 k-means 比:三团形状和大小不一的点,k-means(k = 3)会把大团切错一部分,mean shift 几乎和真值一致。
<span class="en">On three uneven clusters, k-means with k = 3 mislabels part of the large blob while mean shift nearly matches ground truth.</span>

![原数据 / k-means / mean shift 对比](img/fab37d54647.jpg)

优缺点:能找任意个类,不用初始化,离群点会被吸进附近的山而不是自成一类。代价是贵,每个像素都要反复算窗口均值。唯一参数是窗口半径 W,复杂图像里结果对 W 敏感。W 太小会碎成很多块,W 太大会把不同的山并成一座。
<span class="en">Pros: any number of clusters, no initialization, robust to outliers. Cons: expensive, and results depend on W (too small fragments, too large merges).</span>

### 8.22.5 图割与归一化图割 · Graph cut and normalized cut

比方:把像素当城市,相似的城市之间修宽马路。要把国家切成两半,就挑那些窄马路去切。
<span class="en">Analogy: pixels are cities, similar ones are joined by wide roads; split the country by cutting the narrow roads.</span>

建图:每个像素是顶点 V,相近的像素之间连边 E。边权是亲和度(affinity),由距离 S 换算:w(i, j) = A(f_i, f_j) = exp(−S(f_i, f_j) / (2σ²))。S 越小,A 越大。σ 控制 A 对 S 有多敏感,要自己选。
<span class="en">Graph: pixels are vertices, edges carry affinity w(i, j) = exp(−S / (2σ²)) as written on the slide. σ sets how fast affinity decays.</span>
注意:幻灯片上 S 没有平方;更常见的写法是 exp(−S² / (2σ²)),也就是高斯核。面试板书写 S² 更稳。
<span class="en">Note: the slide shows S without a square; the more common Gaussian form is exp(−S² / (2σ²)).</span>

小例子:取 σ = 5,2σ² = 50。上面两个红像素 S ≈ 14.1,A = exp(−0.283) ≈ 0.75。红和蓝 S ≈ 212.1,A = exp(−4.24) ≈ 0.014。同类之间的边很强,异类之间几乎为零。
<span class="en">With σ = 5: the two reds get affinity 0.75, red vs blue gets 0.014.</span>

割(cut):把 V 分成不相交的 V_A 和 V_B。代价 cut(V_A, V_B) = Σ_{u∈V_A, v∈V_B} w(u, v),也就是被切断的边权之和。最小割(min-cut)就是找代价最小的切法。
<span class="en">A cut splits V into V_A and V_B; its cost is the sum of severed edge weights. Min-cut minimizes it.</span>

毛病:最小割偏爱切下孤零零的小块。切一个只连一条边的孤点,往往比沿着一长串弱边切开两大块还便宜。
<span class="en">Problem: min-cut favors chopping off tiny isolated pieces, since that severs fewer edges.</span>

![最小割偏向切出小块](img/f31aa086ef4.jpg)

解决办法是按块的「大小」归一化。大小用关联度 assoc(V_A, V) = Σ_{u∈V_A, v∈V} w(u, v) 衡量,即 V_A 里所有顶点的边权总和。归一化割:
<span class="en">Fix: normalize by subgraph size, measured by association assoc(V_A, V). The normalized cut is:</span>

```
NCut(V_A, V_B) = cut(V_A, V_B) / assoc(V_A, V) + cut(V_A, V_B) / assoc(V_B, V)
```

小例子:设全图所有顶点的边权总和(各顶点度数之和)是 20。
切法一:切下一个孤点,只断一条 0.3 的边。assoc(V_A) = 0.3,assoc(V_B) = 19.7。NCut = 0.3/0.3 + 0.3/19.7 ≈ 1 + 0.015 = 1.015。
切法二:沿三条 0.2 的弱边切成两半,cut = 0.6,两边 assoc 各约 10。NCut = 0.6/10 + 0.6/10 = 0.12。
最小割会选切法一(0.3 < 0.6),NCut 会选切法二(0.12 < 1.015)。这正是我们想要的。
<span class="en">Example: chopping one vertex costs 0.3 but NCut ≈ 1.015; cutting three weak edges between two halves costs 0.6 but NCut = 0.12. Min-cut picks the first, NCut picks the second.</span>

代价:精确最小化 NCut 是 NP 完全问题,没有已知多项式算法。Shi 和 Malik(2000)用特征向量做快速近似,也就是谱方法(spectral methods),这是实际常用的做法。讲义的结果用的特征是亮度加位置。
<span class="en">Exact NCut is NP-complete; Shi and Malik's eigenvector (spectral) approximation is the practical solution.</span>

### 8.22.x 面试怎么问 · Likely questions

**Q:Compare k-means and mean shift for segmentation.**
k-means 和 mean shift 做分割有什么区别?

> K-means needs the number of clusters up front, is sensitive to initialization and outliers, but it is simple and fast. Mean shift treats the feature points as a density and lets every point hill-climb to a mode by repeatedly moving a window to the mean of the points inside it. Points that reach the same mode form one segment, so the number of segments comes out automatically and outliers get absorbed. The cost is more computation, and you still have to choose the window radius, which acts like a scale parameter.

这段在说什么:k-means 要给 k、怕初值;mean shift 爬山找峰、自动定类数,但慢且要选窗口半径。
<span class="en">k-means needs k; mean shift finds modes automatically but is slower and needs a bandwidth.</span>

和 Byte Veda 的联系:3D 感知里给点云分物体时,把 (x, y, z) 甚至法向量当特征做 mean shift 或欧氏聚类,思路完全相同;实时场景要注意 mean shift 的计算量。

**Q:Why add pixel coordinates to the feature vector?**
为什么要把像素坐标加进特征?

> With color alone, two distant objects of the same color land in the same cluster, so one segment shows up as many disconnected pieces. Adding x and y means far-apart pixels are also far apart in feature space, which pushes clusters to be spatially coherent. You need to scale position against color, otherwise one term dominates the distance. Depth or motion can be added the same way.

这段在说什么:只用颜色会出现同色不相连的块;加 x, y 让分割连成片,但要平衡各项的尺度。
<span class="en">Position makes segments spatially coherent; balance its scale against color.</span>

和 Byte Veda 的联系:无人机有深度时,把深度加进特征能把颜色相同但前后不同的物体分开。

**Q:What is wrong with min-cut and how does normalized cut fix it?**
最小割有什么问题,归一化割怎么解决?

> Min-cut just sums the severed edge weights, so it prefers to slice off a tiny isolated group that has only a few edges. Normalized cut divides the cut cost by the association of each side, which is the total edge weight attached to that side. A tiny piece has small association, so its normalized cost blows up, and balanced cuts along weak boundaries win. Exact minimization is NP-complete, so in practice we use the Shi and Malik eigenvector relaxation.

这段在说什么:最小割偏爱切小块;NCut 用每一边的总关联度做分母,小块被重罚;精确解 NP 完全,用谱方法近似。
<span class="en">NCut penalizes tiny segments via association; solved approximately with spectral methods.</span>

## 8.23 外观匹配与主成分分析 · Appearance Matching and PCA

这一讲要从一张二维图里认出三维物体是什么,顺便估出它的姿态和光照。做法不是存物体的 3D 形状,而是存它在各种姿态、光照下「长什么样」,再用 PCA 把这堆图片压到一个很低维的空间里,匹配就变快了。
<span class="en">Recognize a 3D object and its pose from one 2D image by storing its appearance under many poses and lightings, compressed with PCA so matching becomes cheap.</span>

### 8.23.1 形状 vs 外观 · Shape vs appearance

比方:认朋友时,你脑子里没有他头骨的 CAD 模型,而是记得他从各个角度看起来的样子。
<span class="en">Analogy: you recognize a friend from remembered views, not from a CAD model of their skull.</span>

形状表示有很多种:体素(voxel,三维的像素格子,记哪些格子被占)、曲面(平面、球、样条、超二次曲面 |x|^r + |y|^s + |z|^t = 1)、构造实体几何 CSG(用并、差、交组合球和方块)。用形状做识别的麻烦是:建库时每个物体都要手工建模或用 3D 传感器扫,识别时场景也要测 3D,大库还很贵。
<span class="en">Shape representations include voxels, surfaces (superquadrics, splines) and CSG. Recognition by shape needs 3D models offline and 3D sensing online, which is tedious and costly.</span>

外观 = F(内参, 外参)。内参是物体自己的:形状和表面反射(BRDF)。外参是拍摄条件:姿态和光照。刚体的内参不变,所以只要把外参扫一遍,就能把「这个物体所有可能的样子」收集起来。
<span class="en">Appearance = F(shape, reflectance; pose, illumination). For a rigid object only the extrinsic parameters vary, so we sample them.</span>

采集方法:把物体(比如橡皮鸭)放在转台上,转角 ω1 表示姿态;灯装在机械臂上,角度 ω2 表示光照方向。每个组合拍一张,得到学习图集。每张图把物体抠出来,缩放到固定大小,背景统一(比如全黑)。
<span class="en">Capture: turntable angle ω1 for pose, robot-mounted light angle ω2 for illumination. Segment, scale to a canonical size, uniform background.</span>

最笨的识别是拿输入图和库里每张图做模板匹配(SAD、SSD 或 NCC)。几千张模板乘几千个物体,算不起。好在相邻两张图几乎一样,图集高度冗余。PCA 就是来榨干这种冗余的。
<span class="en">Naive recognition matches against every stored image, which is far too slow. But consecutive images are nearly identical, so the set is highly redundant; PCA exploits that.</span>

### 8.23.2 一张图是 N 维空间里的一个点 · Images as points

把 P 行 Q 列的图按列拼成 N × 1 的向量 f,N = PQ。怎么拼都行,只要学习和识别用同一种拼法。于是每个像素是一根坐标轴,一张图就是 N 维空间里的一个点。
<span class="en">Stack a P × Q image into an N × 1 vector (N = PQ). Each pixel is an axis, each image is a point in N-dimensional space.</span>

关键观察:两张图的 SSD,正好就是这两个点的 L2 距离的平方:SSD = Σ (I1 − I2)² = ||f1 − f2||²。所以「模板匹配」就是「在 N 维空间里找最近的点」。
<span class="en">Key fact: SSD between two images equals the squared L2 distance between their vectors, so template matching is nearest-neighbor search in N-D.</span>

一个物体的 M 张图在 N 维空间里不是乱撒的。它们挤在一个 K 维的子空间附近,K 远小于 N。就像三维里的一堆点其实都落在一个平面上,用平面上两个方向 e1、e2 当坐标就够了。
<span class="en">The M images of one object lie near a K-dimensional subspace with K ≪ N, just as 3-D points on a plane need only two coordinates.</span>

![鸭子图集在 N 维空间里其实挤在一个低维子空间](img/fe1946dde0e.jpg)

### 8.23.3 主成分分析 PCA · Principal component analysis

比方:给一团雪茄形的点找坐标轴。第一根轴顺着雪茄最长的方向,第二根轴垂直于第一根、沿着剩下最宽的方向,依此类推。
<span class="en">Analogy: for a cigar-shaped cloud, the first axis runs along its length, the next one is perpendicular along the next widest spread, and so on.</span>

步骤:
<span class="en">Steps:</span>

```
1. 均值图 c = (1/M) Σ f'_m,每张图减去均值:f_m = f'_m − c
2. 数据矩阵 F = [f_1 f_2 ... f_M]        (N × M)
3. 协方差矩阵 R = F Fᵀ                   (N × N)
4. 解 R e = λ e,特征值从大到小排,取前 K 个特征向量 e_1 ... e_K
5. 正投影:p = [e_1 ... e_K]ᵀ f          (N 维 → K 维)
6. 反投影:f ≈ Σ p_k e_k                 (K 维 → 近似还原)
```

为什么是特征向量?第一主成分 e 要让投影 f·e 的方差最大,且 e 是单位向量。因为 f 已经减了均值,Var(f·e) = E[(eᵀf)²] = eᵀ E[f fᵀ] e = eᵀ R e。用拉格朗日乘子:L = eᵀRe − λ(eᵀe − 1),对 e 求导令其为 0,得 2Re − 2λe = 0,即 Re = λe。此时方差 eᵀRe = λ,所以要取最大特征值对应的特征向量。第 k 个主成分就是第 k 大特征值的特征向量,彼此正交。
<span class="en">Maximize Var(f·e) = eᵀRe subject to eᵀe = 1. The Lagrangian gives Re = λe and the variance equals λ, so the top eigenvector wins; the next ones are the next eigenvectors, all orthogonal.</span>

讲义还提到:第一主成分的方向,和用最小二乘拟合一条直线得到的方向相同。
<span class="en">The first principal component matches the direction of the least-squares line fit.</span>

![第一主成分:方差最大的方向,投影 p = e1·f](img/f0ade0df5bf.jpg)

小例子:四个已减均值的二维点 (2, 2)、(−2, −2)、(1, −1)、(−1, 1)。
R = F Fᵀ:xx 项 = 4+4+1+1 = 10,yy 项 = 10,xy 项 = 4+4−1−1 = 6,所以 R = [[10, 6], [6, 10]]。
特征值是 10 + 6 = 16 和 10 − 6 = 4,特征向量是 e1 = (1, 1)/√2,e2 = (1, −1)/√2。
投影:(2, 2) 在 e1 上是 4/√2 ≈ 2.83,在 e2 上是 0。(1, −1) 在 e1 上是 0,在 e2 上是 2/√2 ≈ 1.41。
<span class="en">Example: R = [[10, 6], [6, 10]], eigenvalues 16 and 4, eigenvectors (1,1)/√2 and (1,−1)/√2. Point (2,2) projects to (2.83, 0), point (1,−1) to (0, 1.41).</span>

只保留 K = 1:能量占比 16 / 20 = 80%。(1, −1) 的 p1 = 0,还原成 (0, 0),误差平方 = 1 + 1 = 2。(−1, 1) 同样误差 2。总误差 4,正好等于丢掉的特征值 λ2 = 4。这不是巧合:截断误差总和就等于被丢掉的那些特征值之和。
<span class="en">Keeping K = 1 retains 80% of the energy. The two points off the main axis each lose 2, total 4, exactly the dropped eigenvalue.</span>

### 8.23.4 PCA 与 SVD,K 选多少 · PCA via SVD and choosing K

任何 N × M 矩阵都能分解成 F = U Σ Vᵀ,U、V 是正交矩阵,Σ 是对角阵,对角线上是从大到小的奇异值 σ_i ≥ 0。代进去:R = F Fᵀ = U Σ Vᵀ V Σᵀ Uᵀ = U (Σ Σᵀ) Uᵀ = U Λ Uᵀ。所以 U 的列就是 R 的特征向量(主成分),特征值 λ_i = σ_i²。
<span class="en">With F = UΣVᵀ, R = FFᵀ = UΛUᵀ: the columns of U are the principal components and λ_i = σ_i².</span>

验算上面的例子:F 的奇异值应该是 √16 = 4 和 √4 = 2。
<span class="en">Check: the example's singular values are 4 and 2.</span>

实际意义:图像 200 × 200 时 N = 40000,R 是 40000 × 40000,直接建出来很大。对 F 做 SVD 可以不显式构造 R。
<span class="en">Practically, R would be 40000 × 40000 for 200 × 200 images; SVD on F avoids forming it.</span>

K 怎么选:特征值下降很快,讲义的鸭子图集第 13 个以后就接近 0。规则是取最小的 K,使「前 K 个特征值之和 / 全部特征值之和 ≥ 0.95」。讲义例子里 K = 15,也就是从 40000 维降到 15 维。还有一个现象:越靠后的特征向量,图案里的高频细节越多。
<span class="en">Pick the smallest K whose top eigenvalues hold at least 95% of the total. In the lecture K = 15, from 40,000 dimensions down to 15. Later eigenvectors carry higher-frequency patterns.</span>

![鸭子的均值图、各阶特征向量和快速下降的特征值](img/f67f36d5ac7.jpg)

为什么在特征空间里比距离是对的:两点投影后的距离 ||p1 − p2||² 约等于原图的 SSD ||f1 − f2||²,而且在所有 K 维子空间里,特征空间给出的近似最好。
<span class="en">Distance between projections approximates the original SSD, and no other K-D subspace approximates it better.</span>

小例子:继续用 f1 = (2, 2)、f2 = (1, −1)。原空间 SSD = 1² + 3² = 10。K = 2 时 p1 = (2.83, 0),p2 = (0, 1.41),距离平方 = 8 + 2 = 10,完全一致。K = 1 时只剩 2.83 和 0,距离平方 = 8,是近似值。
<span class="en">Example: SSD = 10. With K = 2 the eigenspace distance is exactly 10; with K = 1 it is 8, an approximation.</span>

### 8.23.5 参数化外观表示与识别 · Parametric appearance and recognition

比方:把一个物体所有样子投到特征空间,连成一条光滑的项链。转台转一圈,项链就首尾相接。识别时看新图落在哪条项链的哪颗珠子旁边。
<span class="en">Analogy: project every view into eigenspace and join them into a smooth necklace; a full turntable rotation closes the loop. Recognition asks which necklace, and which bead, the new image lands near.</span>

学习图集里外参只差一点的两张图,投影后也挨得近。外参在两张之间的新图,投影也落在它们之间。所以把投影点用样条等低阶曲面插值成连续的流形(manifold)p(ω),它以外参 ω = [姿态, 光照, ...] 为参数。
<span class="en">Nearby poses project to nearby points, so interpolate them (e.g., with splines) into a continuous manifold p(ω) parameterized by pose and lighting.</span>

一个物体的完整表示就是三样东西:均值图 + K 个特征向量 + 流形。比原始图集紧凑得多。
<span class="en">The parametric appearance model is: mean image + K eigenvectors + manifold.</span>

![投影点插值成以姿态、光照为参数的流形](img/f8e08f8eabd.jpg)

离线学习(对每个物体 q):
<span class="en">Offline learning, per object q:</span>

```
1. 抠图、缩放到固定框,亮度归一化 I' = I / ||I||
2. 转成向量,算均值 c(q),减均值
3. F(q) → R(q) = F Fᵀ → 前 K 个特征向量
4. 所有学习图投影到特征空间,拟合流形 p(q)(ω)
```

在线识别:
<span class="en">Online recognition:</span>

```
1. 输入图同样抠图、缩放、I' = I / ||I||,转成 f'
2. 对每个物体 q:减去 c(q),投影得 p(q)
3. 在流形上找最近点:ω(q) = argmin_ω ||p(q) − p(q)(ω)||,距离记为 d(q)
4. d 最小的物体 r 就是答案(还要小于阈值);最近点的 ω 给出姿态和光照
```

亮度归一化的小例子:两像素的图 [3, 4],模长 5,归一化后 [0.6, 0.8]。同一场景灯亮一倍变成 [6, 8],模长 10,归一化后还是 [0.6, 0.8]。光源强度、相机增益、曝光的影响就这样被去掉了。
<span class="en">Example: [3, 4] and its doubled version [6, 8] both normalize to [0.6, 0.8], removing light intensity, gain and exposure.</span>

找最近点用最近邻算法,讲义引用了 k-d 树(Bentley 1975)。
<span class="en">The closest manifold point is found with nearest-neighbor search, e.g., k-d trees.</span>

局限:要求背景干净、物体能完整抠出、没有遮挡、能缩放到标准大小。因为整张图一起比,遮挡和杂乱背景会直接改变投影。
<span class="en">Limits: clean background, full segmentation, no occlusion, canonical scaling. Whole-image matching breaks under clutter and occlusion.</span>

应用:30 年前就能实时识别 100 个物体并给出姿态的系统;电路板检测(机器人沿固定轨迹扫,外观以时间为参数,和标准板对不上就报缺件);视觉伺服(外观以机械臂位移为参数,反查位移来纠正插销入孔);人脸识别(Turk 和 Pentland 的特征脸 eigenfaces,每张脸是特征脸的加权和)。
<span class="en">Applications: a real-time 100-object recognizer, PCB inspection parameterized by time, visual servoing parameterized by robot displacement, and eigenfaces for face recognition.</span>

![特征脸:每张脸都是这些特征向量的加权和](img/fb2d8e84438.jpg)

### 8.23.x 面试怎么问 · Likely questions

**Q:Derive PCA. Why are the principal components eigenvectors of the covariance matrix?**
推导 PCA,为什么主成分是协方差矩阵的特征向量?

> After subtracting the mean, the variance of the projection onto a unit vector e is e transpose R e, where R is the covariance matrix. I maximize that subject to e transpose e equals one with a Lagrange multiplier. Setting the gradient to zero gives R e equals lambda e, so e must be an eigenvector, and the variance it captures equals lambda. So the first component is the top eigenvector, and the next ones are the following eigenvectors, which are automatically orthogonal because R is symmetric.

这段在说什么:投影方差 = eᵀRe,带单位长度约束求极值得 Re = λe,方差就是 λ,所以按特征值大小取。
<span class="en">Constrained variance maximization gives Re = λe with variance λ.</span>

和 Byte Veda 的联系:3D 感知里天天用同一招。点云局部邻域做 PCA,最小特征值的特征向量就是表面法向量;最大特征值方向是物体主轴,可以用来估朝向。

**Q:How do you choose the number of components, and how does SVD relate?**
主成分取几个?和 SVD 什么关系?

> I keep the smallest K whose eigenvalues sum to, say, 95 percent of the total, since each eigenvalue is the variance along its direction and the dropped ones equal the reconstruction error. In practice I never form the N by N covariance; I take the SVD of the mean-subtracted data matrix. The left singular vectors are the principal components and the eigenvalues are the squared singular values.

这段在说什么:按累计能量 95% 选 K;丢掉的特征值之和就是重建误差;用 SVD 算,λ = σ²。
<span class="en">Choose K by cumulative energy; compute via SVD with λ = σ².</span>

**Q:What are the limits of appearance-based recognition with eigenspaces?**
基于特征空间的外观识别有什么局限?

> It matches the whole image as one vector, so it assumes the object is segmented, scaled to a canonical size, on a clean background and not occluded. Any clutter or occlusion moves the projection off the manifold. It is also a linear subspace per object, so it needs dense sampling of pose and lighting during learning. The upside is that the nearest manifold point gives you pose and illumination for free.

这段在说什么:整图当一个向量比,怕遮挡和背景;要密集采样外参;好处是顺带估出姿态。
<span class="en">Global matching is fragile to clutter and occlusion, needs dense sampling, but yields pose for free.</span>

和 Byte Veda 的联系:无人机视角下背景复杂、遮挡多,这类全局模板法不够稳,通常改用局部特征或学习的方法;但「外观以位姿为参数,反查位姿」的思路和视觉伺服、相对位姿估计是相通的。

## 8.24 神经网络 · Neural Networks

手写字、椅子这类东西,很难用人手写出「特征规则」来识别。这一讲从最简单的感知机出发,讲到 sigmoid 神经元、多层网络、梯度下降,最后讲反向传播为什么让训练快了约一万倍。
<span class="en">Handwriting and chairs resist hand-crafted features. The lecture builds from the perceptron to sigmoid neurons, multilayer networks, gradient descent, and backpropagation, which makes training about 10⁴ times cheaper.</span>

### 8.24.1 感知机:线性分类器和 NAND 门 · The perceptron

比方:感知机像一个打分投票的人。每个理由有权重,加权总分超过门槛就说「是」。
<span class="en">Analogy: a voter who weighs each reason and says yes if the weighted total clears a bar.</span>

公式:z = w·x + b,输出 a = 1(z > 0)或 0(z ≤ 0)。w 是权重,b 是偏置(bias,就是负的门槛)。这种 0/1 的激活函数叫阶跃函数(step function)。
<span class="en">z = w·x + b, output 1 if z > 0 else 0. The activation is a step function; b is the negative threshold.</span>

讲义的例子:去不去看电影。天气权重 4,有伴 2,离得近 2,b = −5。天气差但有伴且近:2 + 2 − 5 = −1,不去。天气好且有伴:4 + 2 − 5 = 1,去。b = −5 的效果是「天气必须好,另外两个至少占一个」。
<span class="en">Movie example: weights 4, 2, 2 and b = −5. Bad weather with company and proximity gives −1 (no); good weather with company gives 1 (yes).</span>

两个输入时,w1 x1 + w2 x2 + b = 0 是平面上的一条直线。直线一侧输出 1,另一侧输出 0。所以单个感知机就是一个线性分类器。
<span class="en">With two inputs, w·x + b = 0 is a line; one side outputs 1, the other 0. A perceptron is a linear classifier.</span>

小例子:w = (−2, −2),b = 3,即 z = −2x1 − 2x2 + 3。输入只取 0 或 1:(0,0) 得 3 → 1;(1,0) 和 (0,1) 得 1 → 1;(1,1) 得 −1 → 0。这正好是 NAND 门(与非门)。
<span class="en">With w = (−2, −2), b = 3: (0,0) → 1, (1,0) → 1, (0,1) → 1, (1,1) → 0. That is a NAND gate.</span>

NAND 是万能逻辑门,NOT、AND、OR、NOR 都能用它搭出来。所以任何数字电路(比如 1 位加法器)都能用感知机网络实现。感知机在计算上是万能的。
<span class="en">NAND is universal, so any digital circuit, such as a 1-bit adder, can be built from perceptrons.</span>

### 8.24.2 多层感知机:用直线围出复杂区域 · Perceptron networks

一个感知机只能画一条直线。四个感知机各画一条线,每个在「区域内侧」输出 1。再接第五个感知机,四个输入权重都是 2,偏置 −7。只有四个都为 1 时,2×4 − 7 = 1 > 0 输出 1。只要有一个是 0,最多 2×3 − 7 = −1,输出 0。这就是一个 AND,围出了一个凸多边形区域。
<span class="en">Four perceptrons draw four lines; a fifth with weights 2 and bias −7 fires only if all four fire (8 − 7 = 1, while three give −1). The network carves out a polygon.</span>

![多个感知机各画一条线,最后一个做 AND,围出阴影区域](img/f34b1d73829.jpg)

推广:第一层叫输入层(只是输入,不是神经元),中间叫隐藏层,最后叫输出层。全连接(fully connected)指每个神经元接收上一层所有神经元的输出。任务需要多个输出时,输出层就放多个神经元。
<span class="en">Layers: input layer (just inputs), hidden layers, output layer. Fully connected means each neuron sees every output of the previous layer.</span>

### 8.24.3 激活函数:为什么换成 sigmoid · Why sigmoid

问题:训练网络要靠「参数改一点点,输出也只变一点点」,这样才知道往哪边调。阶跃函数做不到。z 在 0 的某一侧时,权重往两个方向小改,输出都纹丝不动;一旦 z 跨过 0,输出又突然从 0 跳到 1。
<span class="en">Training needs small parameter changes to cause small output changes. With a step, small changes do nothing, or flip the output from 0 to 1 abruptly.</span>

解决:换成 sigmoid,σ(z) = 1 / (1 + e^(−z))。它是阶跃函数被「抹平」的版本。输出随参数平滑变化,而且你能看出往哪个方向改会让输出变大。
<span class="en">Use the sigmoid σ(z) = 1 / (1 + e^(−z)), a smoothed step whose output changes smoothly and predictably.</span>

小例子:z = −0.1 时,阶跃输出 0,σ ≈ 0.475。z = +0.1 时,阶跃输出 1,σ ≈ 0.525。阶跃在这 0.2 的区间里跳了整整 1,sigmoid 只平滑地变了 0.05。
<span class="en">Example: from z = −0.1 to 0.1, the step jumps by 1, the sigmoid moves smoothly from 0.475 to 0.525.</span>

![sigmoid 神经元:改一点权重,输出平滑地变](img/f893d98eba2.jpg)

sigmoid 还有一个好性质:导数可以用输出自己表示,σ'(z) = σ(z)(1 − σ(z)) = a(1 − a)。z = 0 时 a = 0.5,σ' = 0.25,这也是它的最大值。这个性质是反向传播能「只用激活值」算梯度的关键。
<span class="en">Its derivative is σ'(z) = a(1 − a), at most 0.25 at z = 0. This lets backprop compute gradients from stored activations.</span>

### 8.24.4 训练:代价函数和梯度下降 · Cost and gradient descent

讲义的例子是 MNIST 手写数字:约 6 万张训练图,每个数字放在 20 × 20 的框里,居中于 28 × 28 的图。Nielsen 的网络是 784 个输入、30 个隐藏神经元、10 个输出,准确率约 95%。标签写成 10 维的期望激活向量 â,对应数字那一位是 1,其他是 0。
<span class="en">MNIST: about 60,000 images, 28 × 28. Nielsen's 784-30-10 network reaches about 95%. Labels are one-hot vectors â.</span>

单张图的代价:C_x = ||â − a||²,期望激活和网络输出的欧氏距离平方。总代价是所有训练图的平均:C = (1/n) Σ C_x。越小越好。
<span class="en">Per-image cost C_x = ||â − a||²; the total cost averages over n training images.</span>

梯度下降的推导:泰勒展开 ΔC ≈ ∇C · Δv,v 是所有参数。令 Δv = −η∇C,就得到 ΔC ≈ −η||∇C||² ≤ 0,代价一定下降(步子够小时)。更新规则:w → w − η ∂C/∂w,b → b − η ∂C/∂b。η 叫学习率。
<span class="en">From ΔC ≈ ∇C·Δv, choosing Δv = −η∇C gives ΔC ≈ −η||∇C||² ≤ 0. Update w ← w − η ∂C/∂w.</span>

比方:站在山顶,只看脚下的坡,往最陡的下坡方向迈一步,反复走就到谷底。
<span class="en">Analogy: on a hill, feel the slope underfoot and step downhill, repeatedly.</span>

![沿负梯度方向更新 w 和 b,代价逐步下降](img/f8307e16b74.jpg)

小例子:C(w) = (w − 3)²,最低点在 w = 3,梯度 2(w − 3),从 w = 0 出发。
η = 0.1:梯度 −6,w → 0.6;梯度 −4.8,w → 1.08。稳步接近 3。
η = 1.0:w → 0 + 6 = 6;梯度 6,w → 0。在 0 和 6 之间来回弹,不收敛。
η = 1.1:w → 6.6;梯度 7.2,w → 6.6 − 7.92 = −1.32。越弹越远,发散。
<span class="en">On C = (w − 3)² from w = 0: η = 0.1 converges (0.6, 1.08, ...), η = 1.0 oscillates between 0 and 6, η = 1.1 diverges (6.6, −1.32, ...).</span>

讲义的结论:η 太小走得慢;适中收敛快;太大会冲过头来回弹,甚至跳到别的地方停在局部最小值。
<span class="en">Too small is slow, too large overshoots or lands in a different local minimum.</span>

### 8.24.5 反向传播:用链式法则省掉一万倍 · Backpropagation

笨办法是有限差分:每个参数单独加一个 Δ,重新前向算一遍代价,∂C/∂w ≈ (C(w + Δw) − C(w)) / Δw。Nielsen 网络的参数量:权重 784×30 + 30×10 = 23820,偏置 30 + 10 = 40。一次梯度要 23861 次代价计算(多出的 1 次是基准 C(w))。一次代价计算要对 6 万张图各做 23820 次乘法,约 1.4 × 10⁹。乘起来一次迭代约 3.4 × 10¹³ 次乘法。
<span class="en">Finite differences need one forward pass per parameter: 23,861 cost evaluations of about 1.4 × 10⁹ multiplications each, roughly 3.4 × 10¹³ per iteration.</span>

反向传播的思路:用链式法则把导数拆开,每一项都能用前向时已经算好的激活值表示。对输出层第 j 个神经元:
<span class="en">Backprop splits each derivative with the chain rule so every factor is an already-computed activation. For output neuron j:</span>

```
∂C/∂w_jk = ∂C/∂a_j · ∂a_j/∂z_j · ∂z_j/∂w_jk
         = 2(a_j − â_j) · a_j(1 − a_j) · a_k(上一层)
定义 δ_j = ∂C/∂z_j = 2(a_j − â_j) · a_j(1 − a_j)
```

注意符号:讲义幻灯片上写的是 2(â_j − a_j),少了一个负号。对 (â − a)² 关于 a 求导是 2(a − â)。板书时用 2(a − â),否则梯度方向反了,「下降」会变成「上升」。
<span class="en">Sign note: the slides write 2(â − a); the correct derivative of (â − a)² with respect to a is 2(a − â).</span>

有了 δ,任意一层的梯度都是一行:
<span class="en">With δ, every gradient is one line:</span>

```
∂C/∂w_jk(l) = δ_j(l) · a_k(l−1)        ∂C/∂b_j(l) = δ_j(l)
δ_j(l) = [ Σ_k δ_k(l+1) · w_kj(l+1) ] · a_j(l)(1 − a_j(l))
```

第二行就是「反向传播」名字的来源:后一层的 δ 乘上连接权重,加起来,再乘本层的 sigmoid 导数,就得到前一层的 δ。从输出层一路往回推。
<span class="en">δ flows backward: weight the next layer's δ's, sum them, multiply by a(1 − a).</span>

![反向传播:先算各层 δ,再由 δ 得到所有权重和偏置的梯度](img/fcd7cda639f.jpg)

小例子:一个 sigmoid 输出神经元,输入 a_prev = 1,w = 0,b = 0,目标 â = 1。
前向:z = 0,a = 0.5,C = (1 − 0.5)² = 0.25。
反向:δ = 2(0.5 − 1) × 0.5 × 0.5 = −0.25。∂C/∂w = δ × 1 = −0.25,∂C/∂b = −0.25。
更新(η = 1):w = 0.25,b = 0.25。新的 z = 0.5,a = σ(0.5) ≈ 0.6225,C ≈ 0.3775² ≈ 0.1425。代价从 0.25 降到 0.14。
再往前一层:如果这个输出神经元前面有一个隐藏神经元,激活 a_h = 0.5,连接权重 w = 2,那么 δ_h = (−0.25 × 2) × 0.5 × 0.5 = −0.125。
<span class="en">Example: a = 0.5, target 1, δ = −0.25, gradients −0.25; after one step with η = 1 the output rises to 0.6225 and the cost drops from 0.25 to 0.14. A hidden neuron with a_h = 0.5 and weight 2 gets δ_h = −0.125.</span>

完整流程:随机初始化;每张图前向算激活,算输出层 δ,反推各层 δ,得到这张图的梯度;对所有图平均梯度;用梯度下降更新;重复直到代价够低。
<span class="en">Loop: init randomly; per image, forward pass, output δ, backward δ's, per-image gradients; average; update; repeat.</span>

算力对比:单张图前向 23820 次乘法,反向 24210 次,合计 48030。乘 6 万张约 2.8 × 10⁹。比有限差分的 3.4 × 10¹³ 少了约 10⁴ 倍。
<span class="en">Backprop costs 48,030 multiplications per image, about 2.8 × 10⁹ per iteration, roughly 10⁴ times fewer.</span>

### 8.24.6 CNN、应用和「什么时候该用学习」· CNNs and when to learn

卷积神经网络(CNN,LeCun):视觉里常先用一组线性滤波器处理图像,而线性滤波就是卷积。CNN 把卷积层放进网络,让网络在训练中自己学出最合适的卷积核,后面接下采样和全连接层。
<span class="en">CNNs (LeCun) put convolution layers into the network so the filters themselves are learned, followed by subsampling and fully connected layers.</span>

![CNN:学到的卷积核 → 下采样 → 全连接](img/ffbe099e57b.jpg)

应用:手机上实时识别数字;照片自动打标签(Clarifai);视频动作分类(Karpathy 2014)。识别结果里,看不清是 3 还是 8 的字,网络会在 2、3、8 上都给出较高激活,8 最高。
<span class="en">Applications: real-time digit reading on a phone, photo auto-tagging, video activity classification. Ambiguous digits get high activations on several classes.</span>

Nayar 的收尾观点:自由落体 s = ut + ½at²,用网络学要收集海量精确数据,学完还得不到任何物理洞见。先用第一性原理推到推不动为止;当原理提示这是一个存在解的复杂映射时,再用机器学习。两者是互补的。
<span class="en">Nayar's closing point: use first principles as far as they go, then use learning for mappings too complex to model. They are symbiotic.</span>

### 8.24.x 面试怎么问 · Likely questions

**Q:Explain backpropagation. Why is it so much cheaper than finite differences?**
解释反向传播,为什么比有限差分便宜那么多?

> Finite differences perturb one parameter at a time and rerun the forward pass, so the cost scales with the number of parameters times a full forward pass. Backprop uses the chain rule: define delta as the derivative of the cost with respect to a neuron's pre-activation z. At the output it is the derivative of the loss times sigma prime, and each earlier layer's delta is the weighted sum of the next layer's deltas times its own sigma prime. Then every weight gradient is just delta times the incoming activation. One forward and one backward pass give all gradients, which in the lecture's MNIST network is about ten thousand times fewer multiplications.

这段在说什么:δ = ∂C/∂z 从后往前递推,梯度 = δ × 上一层激活;一次前向加一次反向就拿到全部梯度。
<span class="en">Propagate δ backward; gradient = δ × incoming activation; one forward plus one backward pass.</span>

**Q:Why not use a step activation? And what is the downside of sigmoid?**
为什么不用阶跃激活?sigmoid 的缺点是什么?

> A step has zero gradient almost everywhere and is undefined at zero, so small weight changes either do nothing or flip the output, and gradient descent gets no signal. Sigmoid is smooth, and its derivative is a times one minus a, which is cheap to compute from stored activations. The downside follows from that formula: the derivative is at most 0.25 and near zero when the neuron saturates, so multiplying it across many layers shrinks gradients. That vanishing gradient is why deep networks moved to ReLU-type activations.

这段在说什么:阶跃几乎处处梯度为 0;sigmoid 平滑且导数 = a(1 − a),但最大只有 0.25,层数一多梯度会消失。
<span class="en">Step gives no gradient; sigmoid is smooth but its ≤ 0.25 derivative causes vanishing gradients in deep nets.</span>

**Q:Your loss oscillates or diverges during training. What do you check?**
训练时 loss 来回震荡或发散,你查什么?

> First the learning rate: on a simple quadratic, a step that is too large overshoots and bounces, and slightly larger diverges. I would lower it or add a schedule. Then I would check the gradient sign and implementation, for example with a finite-difference gradient check on a few parameters, since a flipped sign turns descent into ascent. Finally I would look at input scaling, because badly scaled features make the cost surface elongated and force a small step size.

这段在说什么:先降学习率;再用有限差分做梯度检验查符号和实现;最后看输入归一化。
<span class="en">Lower the learning rate, gradient-check against finite differences, and normalize inputs.</span>

和 Byte Veda 的联系:有限差分在这里不是用来训练,而是用来验证反向传播写对了没有,这是手写网络时的标准排错手段。

**Q:When would you use a learned model versus a geometric, first-principles method?**
什么时候用学习的方法,什么时候用几何/第一性原理的方法?

> If the physics or geometry is well understood, like projecting points with a calibrated camera or triangulating depth from stereo, a model-based method is exact, data-efficient and interpretable. Learning pays off when the mapping is too complex to write down, like recognizing chairs or handwriting. In practice I combine them: learned features or detections feeding a geometric pipeline that enforces known constraints.

这段在说什么:原理清楚的部分(投影、三角测量)用几何,写不出规则的部分(识别)用学习,两者组合。
<span class="en">Use geometry where the model is known and learning where it is not; combine them.</span>

和 Byte Veda 的联系:3D 感知岗正好是这种组合。相机标定、位姿、三角化用几何保证精度;检测、分割、特征提取用网络;在无人机上还要考虑实时算力。

# 篇九 · 点云从零讲
> 点云是什么、怎么存、怎么从深度图来、法向量、配准(ICP)、分割和地面提取、PointNet

## 9.1 点云是什么 · What a point cloud is

> 提纲:N×3 数组 → 可带颜色/强度/法向 → 无序、不规则、稀疏 → 和图像对比 → 有组织 vs 无组织

比方:图像像一张方格纸,每个格子都涂了颜色。点云像往空中撒了一把芝麻,只记下每颗芝麻在哪。
<span class="en">Analogy: an image is graph paper with every square colored; a point cloud is sesame seeds thrown in the air, recording only where each one is.</span>

点云就是一个形状 (N, 3) 的数组,每行一个点的 (x, y, z),单位通常是米。可以多带几列:颜色变成 (N, 6),LiDAR 强度(回波有多亮)变成 (N, 4),法向再加 3 列。三个特点,后面所有算法都是被它们逼出来的。无序:打乱行的顺序还是同一片点云。不规则:点不在格子上,间距不固定。稀疏:只有物体表面有点,离传感器越远越稀。
<span class="en">A point cloud is an N×3 array of x, y, z in meters; color makes it N×6, LiDAR intensity N×4, normals add three columns. Three properties drive everything later: unordered (shuffling rows changes nothing), irregular (no grid), sparse (points only on surfaces, thinner with distance).</span>

```
图像 (H×W)                      点云 (N×3)
┌──┬──┬──┬──┐                  ·    ·   ·
│  │  │  │  │   每格都有值          ·  ·      ·   只有表面上有点
├──┼──┼──┼──┤                ·      ·
│  │  │  │  │   邻居 = 上下左右       ·   ·   ·   邻居要自己找
└──┴──┴──┴──┘                  [x y z] [x y z] ...  顺序无意义
```
> 🔤 H、W = 图像高宽;N = 点数;每个 · 是一个 (x, y, z)

有组织点云:形状 H×W×3,来自深度相机,第 (v, u) 格就是像素 (u, v) 打出去的点,邻居直接看相邻像素,没测到的存 0 或 NaN。无组织点云:形状 N×3,来自 LiDAR 或多帧拼成的地图,找邻居要自己建索引(9.4)。小例子:640×480 深度相机一帧 = 307,200 个点。每点 3 个 float32 = 12 字节,一帧约 3.7 MB,30 帧每秒约 110 MB/s。所以第一件事总是下采样(9.5)。
<span class="en">Organized: H×W×3 from a depth camera, with neighbors from pixel adjacency and 0 or NaN for missing depth. Unorganized: N×3 from LiDAR or merged maps, needing an index. Example: one 640×480 frame is 307,200 points, about 3.7 MB, about 110 MB/s at 30 fps, so we downsample first.</span>

> A point cloud is an <u>N by 3 array</u> of 3D points, optionally with color, intensity or normals. Unlike an image, it's <u>unordered, irregular and sparse</u>: shuffling the rows changes nothing, points aren't on a grid, and there are points only on surfaces. So there are no free neighbors, and I need a <u>k-d tree or voxel grid</u> to search it. A depth camera gives an <u>organized</u> cloud, H by W by 3, where pixel adjacency still gives neighbors; a LiDAR gives an <u>unorganized</u> one. The upside is <u>true metric units</u>, which is exactly what obstacle avoidance needs.

这段在说什么:定义 → 三个特点 → 为什么要建索引 → 两种来源 → 好处。
<span class="en">What this does: definition, three properties, why an index is needed, the two kinds, the benefit.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 为什么有人叫它 2.5D <span class="en">Why "2.5D"?</span> | 单个视角只看到正面,背面没点;多视角融合后才是完整 3D。<span class="en">One view sees only the front; full 3D needs several views.</span> |

## 9.2 点云从哪来 · Where point clouds come from

> 提纲:深度图反投影 → LiDAR:飞行时间 + 角度 → 双目 Z = fB/d → SfM 多视图 → 无人机上常用哪几种

比方:每个点都是「方向 + 距离」。不管哪种传感器,都是先知道这条光线朝哪,再量出沿它走了多远。
<span class="en">Analogy: every point is a direction plus a distance; each sensor knows where a ray points and measures how far it goes.</span>

### 深度图反投影 · Back-projecting a depth map

深度图和图像一样大,每个像素存它看到的东西沿光轴的距离 Z。4.10 的投影是 u = fx·X/Z + cx,反过来解出 X 就是反投影。
<span class="en">A depth map stores Z per pixel; inverting the 4.10 projection u = fx·X/Z + cx gives back-projection.</span>

```
X = (u − cx) · Z / fx        Y = (v − cy) · Z / fy        Z = depth[v, u]
```
> 🔤 u = 列号;v = 行号;fx、fy = 焦距(像素);cx、cy = 主点(画面中心);Z = 深度(米)

算例:fx = fy = 500,cx = 320,cy = 240,像素 (420, 190) 深度 2.0 米。X = (420 − 320) × 2 / 500 = 0.4;Y = (190 − 240) × 2 / 500 = −0.2。点是 (0.4, −0.2, 2.0),正好是 4.10 的例子倒过来。注意 RealSense 这类相机原始深度是 uint16 毫米,先乘 0.001。
<span class="en">Example: pixel (420, 190) at 2 m gives (0.4, −0.2, 2.0), the 4.10 example reversed; convert raw millimeters to meters first.</span>

```python
import numpy as np
fx = fy = 500.0; cx, cy = 320.0, 240.0           # 内参(像素)
depth = np.full((480, 640), 2.0)                  # 面前 2 米一堵平墙
depth[:10] = 0                                    # 顶上 10 行没测到 = 无效
v, u = np.mgrid[0:480, 0:640]                     # 每个像素的行号 v、列号 u
X = (u - cx) * depth / fx; Y = (v - cy) * depth / fy
org = np.dstack([X, Y, depth])                    # 有组织点云 H×W×3
pts = org.reshape(-1, 3); pts = pts[pts[:, 2] > 0]   # 摊平成 N×3,去掉无效点
print(org.shape, org[190, 420], pts.shape)
```

已实跑(python3,2026-10-25),输出: <span class="en">Run on this machine; output:</span>

```text
(480, 640, 3) [ 0.4 -0.2  2. ] (300800, 3)
```

结果:像素 (420, 190) 得到 (0.4, −0.2, 2.0);307,200 个像素去掉 10 × 640 = 6,400 个无效点,剩 300,800 个。整张图向量化一次算完。Open3D 里对应 `create_from_depth_image`(这里没跑)。
<span class="en">Result: the expected point, and 300,800 valid points after dropping 6,400; Open3D's create_from_depth_image does the same.</span>

### LiDAR · Time of flight plus angles

LiDAR 发一束激光,量来回时间 Δt,距离 r = c·Δt / 2(除 2 是因为一来一回)。激光头在转,每次发射的方位角 θ 和俯仰角 φ 已知,球坐标换直角坐标就是点。
<span class="en">LiDAR measures round-trip time, r = c·Δt/2, and knows each shot's azimuth θ and elevation φ, so it converts spherical to Cartesian.</span>

```
x = r·cosφ·cosθ        z ↑    ● 点
y = r·cosφ·sinθ          │   ╱ r
z = r·sinφ               │  ╱ φ(俯仰)
                         └────────→ x      θ = 在 xy 平面里的方位角
```
> 🔤 r = 距离;θ = 方位角;φ = 俯仰角;c = 光速 3×10⁸ m/s

算例:Δt = 66.7 ns → r = 3×10⁸ × 66.7×10⁻⁹ / 2 ≈ 10.0 米。θ = 30°,φ = −2° → x ≈ 10 × 0.9994 × 0.8660 ≈ 8.655,y ≈ 10 × 0.9994 × 0.5 ≈ 4.997,z = 10 × sin(−2°) ≈ −0.349。代价:转一圈约 0.1 秒,无人机这段时间在动,一圈里前后点的拍摄位置不同,叫运动畸变。要用 IMU 按每个点的时间戳补偿(去畸变,deskew)。
<span class="en">Example: 66.7 ns is 10.0 m; at 30° and −2° the point is (8.655, 4.997, −0.349). Cost: a sweep takes about 0.1 s while the drone moves, so IMU-based deskewing corrects each point by timestamp.</span>

### 双目和 SfM · Stereo and structure from motion

双目先算视差 d,用 Z = fB/d(4.14)得到每个像素的深度,再套反投影。f = 700 像素、B = 0.12 米、d = 21 像素 → Z = 4.0 米;误差随 Z² 增长,所以远处的点云很「毛」。SfM:多张照片匹配特征 → 同时求相机位姿和稀疏 3D 点(如 COLMAP)→ 多视图立体(MVS)加密。离线、慢,单目还没有绝对尺度,要 GPS、IMU 或已知长度定比例。无人机上常见四种:双目深度相机(如 RealSense 类)轻、便宜、出有组织点云,但只在近距离准,怕无纹理和强光;ToF 相机不靠纹理,但分辨率低、怕阳光;小型 LiDAR 远、准、黑夜也行,但重、贵、耗电;相机加 SfM 只要一个相机,但只能离线做巡检建模。
<span class="en">Stereo gets Z = fB/d then back-projects (4.0 m in the 4.14 example), with error growing as Z². SfM jointly solves poses and points from photos (COLMAP), then MVS densifies; offline and scale-ambiguous. Drones carry stereo depth cameras (light, cheap, short range), ToF cameras (texture-independent, low resolution), compact LiDAR (long range, heavy and costly), or a camera for offline SfM.</span>

> Point clouds come from four main sources. From a <u>depth image</u>, I back-project each pixel: X = (u − cx)·Z/fx, Y = (v − cy)·Z/fy; with f = 500 and center (320, 240), pixel (420, 190) at 2 meters becomes (0.4, −0.2, 2.0). A <u>LiDAR</u> measures range by <u>time of flight</u>, r = c·Δt/2, and knows each beam's azimuth and elevation, so it's a spherical-to-Cartesian conversion. <u>Stereo</u> gets depth from Z = fB/d and then back-projects. <u>Structure from motion</u> reconstructs points from many photos offline. On drones, stereo depth cameras are the common lightweight choice, and LiDAR when range matters.

这段在说什么:四种来源各一个公式,反投影给一个能心算的例子,最后落到无人机怎么选。
<span class="en">What this does: four sources with one formula each, a mental-math example, and the drone choice.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |

## 9.3 坐标系和变换 · Frames and transforms

> 提纲:相机系、机体系、世界系 → p' = R p + t → 4×4 齐次矩阵 → 链式相乘 → 算例 → 为什么每帧都要做

比方:同一个杯子,「在镜头前 2 米」是相机系的说法,「在机头正前方」是机体系,「在房间东北角」是世界系。杯子没动,只是描述的人变了。
<span class="en">Analogy: the same cup is "2 m in front of the lens," "ahead of the nose," or "in the room's northeast corner"; only the describer changes.</span>

相机系:OpenCV 约定 x 右、y 下、z 前,点云刚出来就在这里。机体系:原点在飞机中心,跟着飞机动(ROS 用前左上 FLU,PX4 用前右下 FRD)。世界系:固定在地上(ROS 用东北天 ENU,PX4 用北东地 NED)。刚体变换 p' = R·p + t:R 是 3×3 旋转矩阵(RᵀR = I,det R = +1),t 是平移。把点写成齐次坐标 [x, y, z, 1],旋转加平移合成一个 4×4 矩阵,连续变换就是矩阵连乘。
<span class="en">Camera: x right, y down, z forward. Body: fixed to the drone, FLU in ROS, FRD in PX4. World: fixed to the ground, ENU or NED. A rigid transform is p' = Rp + t; in homogeneous coordinates it is one 4×4 matrix, so chains are products.</span>

```
      | R   t |        T_world←cam = T_world←body · T_body←cam
  T = |       |                       (每帧在变)      (标定一次,固定)
      | 0ᵀ  1 |        逆变换 T⁻¹ = [ Rᵀ  −Rᵀt ; 0ᵀ  1 ]
```
> 🔤 R = 旋转;t = 平移;T_body←cam = 相机装在机身上的外参;T_world←body = 飞机当前位姿

算例:飞机在世界系 (10, 5, 3),水平朝世界 +X 飞(X 东、Y 北、Z 上),相机装在中心朝正前方。相机三根轴在世界里的指向就是 R 的三列:相机 x(右)→ −Y,相机 y(下)→ −Z,相机 z(前)→ +X。
<span class="en">Example: the drone is at (10, 5, 3) facing +X with Z up; camera right, down and forward map to −Y, −Z and +X, the columns of R.</span>

```
      | 0   0   1 |                 p_cam   = (0.4, −0.2, 2.0)     ← 9.2 那个点
  R = | −1  0   0 |   det R = +1    R·p_cam = (2.0, −0.4, 0.2)
      | 0  −1   0 |                 + t     = (12.0, 4.6, 3.2)     ← 世界坐标
```
> 🔤 t = 飞机位置 (10, 5, 3)

检查:点在镜头前 2 米,X 从 10 变 12;在右边 0.4 米,朝东时右边是南,Y 从 5 变 4.6;y = −0.2 是向上,Z 从 3 变 3.2。三项都对(已用 python 核对)。为什么无人机要不停做这个:飞机每帧都在动,同一个障碍物在相机系里的坐标每帧都不同。要把多帧拼成地图,或判断「它离我越来越近」,必须先统一到世界系。位姿有误差,地图上就出现重影。
<span class="en">Check: 2 m ahead adds 2 to X, 0.4 m right is south so Y is 4.6, and 0.2 m up makes Z 3.2. Why every frame: the drone moves, so merging frames or tracking obstacles needs the world frame, and pose error shows up as ghosting.</span>

> Every point starts in the <u>camera frame</u>. I chain two transforms: the fixed <u>extrinsic</u> from camera to body, found by calibration, and the drone's current <u>pose</u> from body to world, from VIO or SLAM, which changes every frame. Each is a <u>4 by 4 homogeneous matrix</u> with R and t, so the chain is a product, and the inverse is Rᵀ and −Rᵀt. With the drone at (10, 5, 3) facing +X, a point 2 meters ahead, 0.4 right and 0.2 up lands at <u>(12, 4.6, 3.2)</u>. Doing this every frame is what lets us fuse frames into one map.

这段在说什么:两段变换谁固定谁在变 → 4×4 矩阵 → 一个能心算的例子 → 为什么每帧都做。
<span class="en">What this does: which transform is fixed and which changes, the matrix form, one example, and why it runs every frame.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 旋转有几种表示 <span class="en">Rotation representations?</span> | 矩阵 9 个数;欧拉角 3 个数但有万向锁;四元数 4 个数无奇异、插值好;轴角 3 个数,优化里常用。<span class="en">Matrix, Euler angles (gimbal lock), quaternions (no singularity), axis-angle (optimization).</span> |
| 时间不同步会怎样 <span class="en">Timestamp mismatch?</span> | 位姿和点云差 20 ms,飞 5 m/s 就是 10 cm 误差;要按时间戳插值位姿。<span class="en">20 ms at 5 m/s is 10 cm; interpolate the pose at the cloud's timestamp.</span> |

## 9.4 怎么找邻居 · Finding neighbors

> 提纲:几乎所有算法都要「找附近的点」→ 暴力 O(N²) → KD 树 → kNN vs 半径搜索 → 体素哈希 → 有组织点云看像素

比方:在全校找离你最近的同学,一个个量太慢。先按楼分、再按层分、再按教室分,只在你附近的组里找。法向(9.6)、去噪(9.5)、聚类(9.8)、ICP(9.9)每一步都要问「这个点附近有哪些点」。暴力法每个点和所有点算距离,N = 10 万时所有点对约 N²/2 ≈ 50 亿次。
<span class="en">Analogy: to find your nearest classmate, split by building, floor and room, and only search nearby groups. Normals, denoising, clustering and ICP all need neighbors; brute force over 100,000 points is about five billion pairs.</span>

### KD 树 · k-d tree

建树:选一个轴(x、y、z 轮流,或选方差最大的),在中位数切一刀,两半各自递归,直到叶子只剩几个点,O(N log N)。查询:从根走到查询点所在的叶子,得到当前最近距离 r。往回走时,只有查询点到某个切分面的距离小于 r,另一边才可能有更近的点,才进去看;否则整棵子树剪掉。平均 O(log N),最坏 O(N)。
<span class="en">Build by median splits along one axis per level, O(N log N). Query: descend to the leaf, keep best distance r, and only cross a split plane closer than r; average O(log N).</span>

```
  y ↑         │                      树:      [x < 5 ?]
    │  ●      │     ●                         /        \
    │─────────┤ y=4                  [y < 4 ?]          [y < 2 ?]
    │  ●      │   ★ q   ●             /     \           /      \
    │         │──────── y=2        {下左}  {上左}     {下右}   {上右}
    │    ●    │  ●
    └─────────┴──────────→ x       查 ★:先到「上右」叶子,得到 r;
             x=5                   ★ 到 x = 5 的距离 < r 才去左半边看
```
> 🔤 ● = 点;★ q = 查询点;每条线 = 一次切分;r = 目前最近距离

小例子:log₂(10 万) ≈ 16.6,每次查询约走 17 层加少量回溯。所有点各查一次约 170 万次节点访问,比 50 亿少三千倍左右(粗略量级)。
<span class="en">Example: about 17 levels per query, roughly 1.7 million node visits for all points versus five billion.</span>

### kNN、半径搜索、体素哈希 · kNN, radius search, voxel hashing

kNN 固定找 k 个最近的,稀疏处第 k 个可能很远,跨到别的物体上。半径搜索找 r 以内所有点,稀疏处可能 0 个,稠密处几千个。实际常用混合:r 以内最多 k 个。法向用 kNN 或混合,聚类用半径。
<span class="en">kNN returns k points that may be far in sparse areas; radius search returns all within r, possibly none or thousands; hybrid caps both. Normals use kNN, clustering uses radius.</span>

体素哈希:把空间切成边长 s 的小方块,key = (⌊x/s⌋, ⌊y/s⌋, ⌊z/s⌋) 放进哈希表。半径不超过 s 的查询只看自己和周围 26 格,共 27 格。平均 O(1),新点随时插入。例:s = 0.1,点 (1.23, −0.05, 2.0) → key (12, −1, 20);注意 ⌊−0.5⌋ = −1。有组织点云更省事,邻居就是相邻像素,但物体边缘处深度会跳变,像素相邻不等于 3D 相邻。库函数:scipy 的 `cKDTree(pts).query(q, k)` 和 `query_ball_point(q, r)`;Open3D 是 `KDTreeFlann`。
<span class="en">Voxel hashing indexes by floor(x/s); a query within s checks 27 cells, O(1), streaming-friendly; (1.23, −0.05, 2.0) hashes to (12, −1, 20). Organized clouds use pixel neighbors, except across depth edges. Libraries: scipy cKDTree query and query_ball_point; Open3D KDTreeFlann.</span>

> Almost every point-cloud step needs neighbor search, and brute force is <u>O(N²)</u>, five billion pairs for 100,000 points. A <u>k-d tree</u> splits at the median along one axis per level. To query, I descend to the leaf, keep the best distance r, and when backtracking I only <u>cross a split plane closer than r</u>, so most of the tree is pruned and a query is about <u>log N</u>. I use <u>kNN</u> when I need a fixed sample size, like normals, and <u>radius search</u> when I need a physical distance, like clustering. For streaming data, a <u>voxel hash</u> gives O(1) lookups over 27 cells.

这段在说什么:为什么要找邻居 → 暴力多慢 → KD 树怎么剪枝 → 两种查询各用在哪 → 流式数据换哈希。
<span class="en">What this does: why, brute-force cost, pruning, which query when, hashing for streams.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 高维为什么不行 <span class="en">Why does it fail in high dimensions?</span> | 到切分面的距离几乎总小于 r,剪不掉;高维用近似最近邻(FAISS、HNSW)。<span class="en">Nothing gets pruned; use approximate search like FAISS or HNSW.</span> |

## 9.5 预处理三件套 · Three preprocessing steps

> 提纲:范围裁剪 → 体素下采样 → 离群点去除;从便宜到贵,越早扔掉越省

比方:拍完照先裁掉没用的边,再缩小尺寸,最后把脏点擦掉。
<span class="en">Analogy: crop the photo, shrink it, then wipe off the specks.</span>

范围裁剪(passthrough):每个轴设上下限,范围外的点扔掉。例:相机系只留 0.3 米 < z < 8 米;世界系去掉天花板以上;用机体系的小盒子挖掉被拍进来的机臂和螺旋桨。就是一个布尔掩码,O(N)。体素下采样:把空间切成边长 s 的格子,每个非空格子只留一个点,通常是格内所有点的质心。点数大降,密度变均匀,点数上限 = 格子数。
<span class="en">Passthrough: keep points within per-axis bounds, such as 0.3 to 8 m ahead, and cut out the drone's own arms; one boolean mask. Voxel downsampling keeps one centroid per occupied cell, bounding the count and evening out density.</span>

算例:10 万个点均匀在 2 × 2 × 1 米的盒子里。体素 0.1 米 → 20 × 20 × 10 = 4,000 格,每格平均 25 点,几乎都非空,剩约 4,000 点,压缩 25 倍。体素 0.05 米 → 40 × 40 × 20 = 32,000 格,每格平均 3.125 点;按泊松分布空格约 e^(−3.125) ≈ 4.4%,剩约 30,600 点。
<span class="en">Example: at 0.1 m there are 4,000 cells, all occupied; at 0.05 m, 32,000 cells averaging 3.1 points, about 4.4% empty, so about 30,600 remain.</span>

```python
import numpy as np
pts = np.random.default_rng(0).uniform([0, 0, 0], [2, 2, 1], (100_000, 3))  # 2×2×1 米盒子
def voxel_down(pts, s):
    keys = np.floor(pts / s).astype(np.int64)                 # 每个点落在哪个格子
    _, inv = np.unique(keys, axis=0, return_inverse=True); inv = inv.ravel()
    sums = np.zeros((inv.max() + 1, 3)); np.add.at(sums, inv, pts)
    return sums / np.bincount(inv)[:, None]                   # 每格留一个质心
for s in [0.1, 0.05]:
    print(f"voxel {s} m: 100000 -> {len(voxel_down(pts, s))}")
```

```text
voxel 0.1 m: 100000 -> 4000
voxel 0.05 m: 100000 -> 30609
```

结果:和手算一致。Open3D 里是 `voxel_down_sample(voxel_size)`(这里没跑)。代价:格子太大丢细节,细电线可能整根消失,这对无人机是真危险;质心也不是真实测量点,可能落在两个表面中间。
<span class="en">Result: matches the estimate (Open3D voxel_down_sample). Cost: big cells can erase a thin wire, which is dangerous for a drone, and centroids can fall between surfaces.</span>

统计离群点去除:每个点算到 k 个最近邻的平均距离 dᵢ,再求所有 dᵢ 的均值 μ 和标准差 σ,dᵢ > μ + α·σ 的删掉。例:k = 20,μ = 2 厘米,σ = 0.5 厘米,α = 2 → 阈值 3 厘米;空中一个孤零零的点平均邻居距离 25 厘米,删掉。半径法:半径 r 内邻居少于 m 个就删。两种都专门对付深度相机在物体边缘插值出来、悬在前景和背景之间的「飞点」(flying pixels)。Open3D 里是 `remove_statistical_outlier`、`remove_radius_outlier`(这里没跑)。
<span class="en">Statistical removal drops points whose mean neighbor distance exceeds μ + α·σ (3 cm in the example, so a 25 cm loner goes); the radius version drops points with too few neighbors. Both target flying pixels at depth edges.</span>

> I usually do three steps. First a <u>passthrough crop</u> to drop points outside a useful range and the drone's own body. Second, <u>voxel downsampling</u>, one centroid per occupied voxel, which bounds the point count and evens out density: 100,000 points in a 2 by 2 by 1 meter box become <u>4,000</u> at 10 centimeters. Third, <u>statistical outlier removal</u>: drop points whose mean distance to their k neighbors is above <u>mean plus α standard deviations</u>, which removes flying pixels. The order goes from cheap to expensive, so the k-d tree work runs on fewer points. The main risk is a voxel so large that thin wires disappear.

这段在说什么:三步各一句,一个能心算的数,顺序为什么这样排,最大的风险。

## 9.6 法向量 · Surface normals

> 提纲:法向 = 垂直于局部表面的方向 → k 个邻居 → 协方差 → 最小特征值的特征向量 → 朝向传感器翻转 → 曲率

比方:一小把芝麻撒在桌面上,在桌面方向摊得很开,在垂直桌面的方向几乎没有厚度。那个「最薄」的方向就是法向。法向量:垂直于表面、长度为 1 的方向。点云没有面,只能用附近的点估计一个局部平面。
<span class="en">Analogy: seeds on a table spread along the table but have almost no thickness vertically; the thinnest direction is the normal. A normal is the unit vector perpendicular to the surface; with no faces, we estimate a local plane from neighbors.</span>

```
1. 点 p 的 k 个邻居 q₁ … q_k,质心 q̄ = (1/k) Σ qⱼ
2. 协方差 C = (1/k) Σ (qⱼ − q̄)(qⱼ − q̄)ᵀ          (3×3 对称)
3. 特征分解 λ₁ ≥ λ₂ ≥ λ₃ ≥ 0,法向 n = λ₃ 的特征向量
4. 如果 n · (s − p) < 0,就 n ← −n               (朝向传感器)
5. 曲率 σ = λ₃ / (λ₁ + λ₂ + λ₃)
```
> 🔤 qⱼ = 邻居点;q̄ = 质心;λ = 该方向上的方差;s = 传感器位置

为什么是最小特征值:要找单位方向 n,让邻居在 n 上的投影方差 nᵀCn 最小。对称矩阵的这个最小值就是最小特征值,方向是它的特征向量。1.15 的 PCA 留最大的方向,法向要最小的那个。
<span class="en">Why the smallest: minimizing nᵀCn over unit n gives the smallest eigenvector; PCA in 1.15 keeps the largest, normals take the smallest.</span>

手算:四个点 (0,0,0)、(1,0,0)、(0,1,0)、(1,1,0),都在 z = 0 上。质心 (0.5, 0.5, 0),偏差都是 (±0.5, ±0.5, 0)。C_xx = 4 × 0.25 / 4 = 0.25,C_yy = 0.25,C_xy = (0.25 − 0.25 − 0.25 + 0.25)/4 = 0,z 那一行全 0。C = diag(0.25, 0.25, 0),最小特征值 0 对应 (0, 0, 1),曲率 0,完美平面。朝向:特征向量正负都对,算法不知道哪边是「外面」。单个传感器时让法向朝向传感器;多视角融合后没有单一传感器,就沿最小生成树把朝向传下去。曲率:平面上接近 0,三个方向一样散(角点、树叶)时最大 1/3。曲率小 = 地面、墙;曲率大 = 边缘、角点。
<span class="en">By hand: four points on z = 0 give C = diag(0.25, 0.25, 0), so the normal is (0, 0, 1) and curvature is 0. ±n are both valid, so flip toward the sensor, or propagate along a spanning tree for merged clouds. Curvature is near 0 on planes and at most 1/3 for clutter.</span>

```python
import numpy as np
from scipy.spatial import cKDTree
rng = np.random.default_rng(1)
xy = rng.uniform(-1, 1, (2000, 2))                            # 斜平面 z = 0.5x + 1,1 cm 噪声
pts = np.c_[xy, 0.5 * xy[:, 0] + 1 + rng.normal(0, 0.01, 2000)]
true_n = np.array([0.5, 0, -1]) / np.linalg.norm([0.5, 0, -1])   # 朝下(朝传感器)的真法向
_, idx = cKDTree(pts).query(pts, k=20)                        # 每个点 20 个邻居
d = pts[idx] - pts[idx].mean(1, keepdims=True)
lam, vec = np.linalg.eigh(np.einsum('nki,nkj->nij', d, d) / 20)  # 每点一个 3×3 协方差
n = vec[:, :, 0]                                              # 最小特征值的特征向量
flip = np.einsum('ni,ni->n', n, -pts) < 0                     # 传感器在原点:背对它的翻过来
n[flip] *= -1
err = np.degrees(np.arccos(np.clip(n @ true_n, -1, 1)))
print("flipped", flip.sum(), " mean err deg", err.mean().round(2), " n[0]", n[0].round(3), " true", true_n.round(3))
print("median curvature", np.median(lam[:, 0] / lam.sum(1)).round(4))
```

```text

> For each point I take its <u>k nearest neighbors</u>, subtract their centroid and form the <u>3 by 3 covariance</u>. The eigenvector with the <u>smallest eigenvalue</u> is the normal, because it's the direction in which the neighbors vary least, the thickness of the local plane. The sign is ambiguous, so I <u>flip it toward the sensor</u>. The smallest eigenvalue over the sum is a <u>curvature</u> measure, near zero on planes and larger at edges. In a quick test with 2,000 points and 1 centimeter noise, k = 20 gave under 3 degrees of mean error.

## 9.7 平面分割和地面去除 · Plane segmentation and ground removal

> 提纲:三点定平面 → 叉积求法向 → 点到平面距离 → 数内点 → 迭代次数公式 → 内点精修 → 无人机第一步通常是去地面

比方:和 4.19 一样。随便抽三个点问「地面在哪」,数有多少点同意,最后信同意最多的那组。
<span class="en">Analogy, as in 4.19: ask three random points where the ground is and trust the answer most others agree with.</span>

平面写成 n · x + d = 0,|n| = 1。三点 a、b、c:n = (b − a) × (c − a) 再归一化,d = −n · a。点 p 到平面的距离 = |n · p + d|。算例:a = (0,0,0),b = (1,0,0),c = (0,1,0.5)。叉积 (1,0,0) × (0,1,0.5) = (0·0.5 − 0·1, 0·0 − 1·0.5, 1·1 − 0·0) = (0, −0.5, 1),长度 √1.25 ≈ 1.118,n ≈ (0, −0.447, 0.894),d = 0。点 (0, 2, 1):−0.894 + 0.894 = 0,在面上。点 (0, 0, 0.1):距离 0.0894 米,约 9 厘米,超过 5 厘米阈值,是外点。
<span class="en">A plane is n·x + d = 0; from three points n is the normalized cross product, d = −n·a, and distance is |n·p + d|. Example: n ≈ (0, −0.447, 0.894); (0, 2, 1) lies on the plane, and (0, 0, 0.1) is 9 cm away, an outlier at 5 cm.</span>

迭代次数 N = log(1 − p) / log(1 − w³),p = 0.99 是把握,w 是内点比例,3 是每次抽的点数。w = 0.7 → 11 次;w = 0.5 → 35 次;w = 0.3 → 169 次。找到最好的内点集后,用 9.6 的 PCA 对全部内点再拟合一次。
<span class="en">Iterations: 11 at 70% inliers, 35 at 50%, 169 at 30% for 99% confidence; then refit all inliers with PCA.</span>

```
侧视图     ┌──┐            ┌─┐
           │  │  箱子      │ │ 箱子     ← 非内点,留给聚类
  · · · · ─┴──┴─ · · · · · ┴─┴ · · · ·  ← 距离 < 5 cm 的内点
  ════════════════════════════════════  RANSAC 拟合的平面 n·x + d = 0
```
> 🔤 · = 地面点;方框 = 障碍物;双线 = 拟合出的平面

为什么第一步去地面:地面点通常占一大半。不去掉的话,所有障碍物会通过地面连成一个大簇,聚类就废了。
<span class="en">Why first: the ground is most of the points and would connect every obstacle into one cluster.</span>

```python
import numpy as np
from scipy.spatial import cKDTree
rng = np.random.default_rng(2)
ground = np.c_[rng.uniform(0, 10, (700, 2)), rng.normal(0, 0.02, 700)]   # 地面 700 点,2 cm 噪声
pts = np.vstack([ground, rng.uniform([2, 2, .1], [2.5, 2.5, 1], (150, 3)),     # 两个箱子
                 rng.uniform([6, 7, .1], [6.6, 7.4, .8], (150, 3))])
best = 0
for _ in range(200):
    a, b, c = pts[rng.choice(len(pts), 3, replace=False)]   # 三点定平面
    n = np.cross(b - a, c - a)                               # 法向 = 两边叉积
    if np.linalg.norm(n) < 1e-9: continue                    # 三点共线就跳过
    n /= np.linalg.norm(n); d = -n @ a                       # 平面 n·x + d = 0
    inl = np.abs(pts @ n + d) < 0.05                         # 距离 < 5 cm 算内点
    if inl.sum() > best: best, plane, mask = inl.sum(), n * np.sign(n[2]), inl
print("normal", plane.round(3), " inliers", best)

obs = pts[~mask]; tree = cKDTree(obs)                        # 去地面后欧式聚类,r = 0.3 m
label = -np.ones(len(obs), int); k = 0
for i in range(len(obs)):
    if label[i] >= 0: continue
    stack, label[i] = [i], k
    while stack:
        for m in tree.query_ball_point(obs[stack.pop()], 0.3):
            if label[m] < 0: label[m] = k; stack.append(m)
    k += 1
print("clusters", k)
for c in range(k):
    q = obs[label == c]
    if len(q) >= 20: print(len(q), "pts  box", q.min(0).round(2), q.max(0).round(2))   # 小簇当噪声
```

clusters 11
150 pts  box [2.   2.01 0.1 ] [2.5  2.5  0.99]
150 pts  box [6.  7.  0.1] [6.6  7.4  0.79]
```

结果:法向 (0.001, 0.001, 1.000),几乎正好竖直。700 个地面点里 691 个是内点。另 9 个噪声超过 5 厘米:σ = 2 厘米,5 厘米是 2.5σ,超出概率约 1.2%,700 × 1.2% ≈ 8.7,对得上。下半段聚类见 9.8。Open3D 里是 `segment_plane(distance_threshold, ransac_n=3, num_iterations)`(这里没跑)。
<span class="en">Result: a near-vertical normal and 691 of 700 ground inliers; the 9 misses are beyond 2.5σ, about 1.2% as expected. Open3D: segment_plane.</span>

> The first step is usually <u>removing the ground</u>, because it's most of the points and would connect every obstacle into one cluster. I fit it with <u>RANSAC</u>: sample <u>three points</u>, get the normal from the <u>cross product</u> of two edges, count points within a threshold like 5 centimeters, keep the best plane, and refit with PCA on all inliers. The iteration count is <u>log(1 − p) over log(1 − w³)</u>, so with 70% inliers, about 11 iterations give 99% confidence. On a drone I'd constrain the normal to be <u>near vertical</u> so I don't pick a wall, and on uneven terrain I'd fit planes per region.

这段在说什么:为什么先做 → 怎么做 → 迭代次数 → 两个工程改进。
<span class="en">What this does: why first, how, iterations, two practical refinements.</span>

## 9.8 聚类分物体 · Clustering into objects

> 提纲:去地面后剩下的点 → 欧式聚类:距离小于 r 就连起来 → DBSCAN:加一个密度条件 → 每簇算包围盒

比方:地上散着几堆沙子。手拉手,能够得着的算一伙。
<span class="en">Analogy: grains of sand that can hold hands belong to one pile.</span>

欧式聚类:拿一个没标记的点当种子,用 KD 树找它半径 r 内的邻居加入同一簇,再找邻居的邻居,没有新点了就开下一个簇,最后删掉太小或太大的簇。本质是「距离小于 r 就连边」这张图的连通分量。9.7 代码的下半段就是它:r = 0.3 米,一共 11 个簇。其中 9 个是地面漏掉的噪声点,每个只有几点,按「少于 20 点不要」删掉。剩下两个各 150 点,包围盒 (2.00, 2.01, 0.10) 到 (2.50, 2.50, 0.99),和 (6.0, 7.0, 0.1) 到 (6.6, 7.4, 0.79),和两个箱子的真实范围一致。
<span class="en">Euclidean clustering grows each cluster by repeated radius-r neighbor search; it is connected components of the radius graph. The second half of the 9.7 script: 11 clusters, 9 tiny noise ones dropped, and two 150-point clusters whose boxes match the true boxes.</span>

DBSCAN 有两个参数:eps(半径)和 min_pts(最少点数)。核心点:eps 内至少 min_pts 个点。边界点:自己不是核心,但在某个核心点的 eps 内。噪声:两者都不是。簇只从核心点往外扩,所以零星噪声不能把两个物体搭桥连起来。不用预先给簇数(k-means 要),形状也可以任意。
<span class="en">DBSCAN: core points have at least min_pts within eps, border points touch a core point, the rest is noise; clusters grow only from cores, so noise can't bridge objects, and no k is needed.</span>

```
  eps = 0.3 m,min_pts = 5
     ● ● ●            ●  核心点:圈里 ≥ 5 个点
    ● (●) ●   ○       ○  边界点:不够 5 个,但挨着核心点
     ● ● ●            ×  噪声:谁都不挨
                ×
```
> 🔤 (●) 外面那圈 = 半径 eps

小例子:某点 0.3 米内有 7 个点 → 核心。另一点只有 2 个邻居,但其中一个是核心 → 边界。一个点 0.3 米内只有它自己 → 噪声。r 怎么选:大于点间距(比如体素的 2 到 3 倍),小于两个物体之间的最小缝隙;LiDAR 远处点稀,r 要随距离变大,否则远处物体被切碎。包围盒:AABB(轴对齐)各轴取 min 和 max,一遍 O(n)。OBB(有向)先用 PCA 找主方向当坐标轴,再取 min、max,对斜放的物体更紧。Open3D 里是 `cluster_dbscan(eps, min_points)`,PCL 里是 `EuclideanClusterExtraction`(这里没跑)。
<span class="en">Example: 7 neighbors is core, 2 with a core neighbor is border, none is noise. Pick r above point spacing and below the gap between objects, growing with range. AABB uses per-axis min and max; OBB uses PCA axes and fits rotated objects tighter. Open3D cluster_dbscan, PCL EuclideanClusterExtraction.</span>

> After removing the ground, I group the remaining points into objects. <u>Euclidean clustering</u> grows a region from a seed by repeatedly adding neighbors within a radius r, using the k-d tree; it's connected components on a radius graph. <u>DBSCAN</u> adds a density rule: only <u>core points</u> with at least min_pts neighbors within eps can expand a cluster, so isolated noise can't bridge two objects, and it doesn't need the number of clusters. The radius should exceed the point spacing but stay below the gap between objects. For each cluster I fit an <u>axis-aligned box</u> from min and max, or an <u>oriented box</u> from PCA.

这段在说什么:两种聚类、它们的区别、参数怎么选、怎么出包围盒。
<span class="en">What this does: both methods, the difference, parameters, boxes.</span>

| 追问 <span class="en">Follow-up</span> | 答法 <span class="en">Answer</span> |
|---|---|
| 为什么不用 k-means <span class="en">Why not k-means?</span> | 要提前知道 k,只会切凸的团,还会把噪声硬塞进某个簇。<span class="en">It needs k, assumes convex blobs, and absorbs noise.</span> |

## 9.9 配准 ICP · Registration with ICP

> 提纲:两片点云差一个 R、t → 知道对应就 SVD 一步解 → 不知道就猜「最近的就是对应」→ 交替迭代 → 只到局部最优 → 初值从哪来 → 点到面

比方:见 4.16。两张描在透明纸上的地图,先大概叠上,再一点点挪、转,直到线条最重合。问题:源点云 P 和目标点云 Q 是同一个东西从两个位置看到的。找 R、t,让 E = Σ ‖R pᵢ + t − q_c(i)‖² 最小,c(i) 是 pᵢ 对应的目标点。用在哪:相邻两帧对齐 = 估计飞机动了多少(里程计);新一帧对齐到地图 = 定位;多次扫描拼成一张地图。
<span class="en">Analogy from 4.16: overlay two tracing-paper maps roughly, then nudge until the lines match. Find R, t minimizing squared distances to corresponding points; frame-to-frame is odometry, frame-to-map is localization, and merging scans builds maps.</span>

### 已知对应时:SVD 一步解(Kabsch)· Closed form with known matches

```
1. 质心 p̄、q̄;去质心 p'ᵢ = pᵢ − p̄,q'ᵢ = qᵢ − q̄
2. H = Σ p'ᵢ q'ᵢᵀ                                   (3×3)
3. SVD:H = U S Vᵀ
4. R = V Uᵀ;如果 det R < 0,把 V 最后一列取反再算      (去掉反射)
5. t = q̄ − R p̄
```
> 🔤 p = 源点;q = 对应的目标点;H = 交叉协方差;U、S、V = SVD 的三个矩阵

为什么:最优的 t 一定让两个质心对齐,所以去质心后 t 就消失了。展开 E,和 R 有关的只剩 −2 Σ q'ᵀ R p',等于要最大化 trace(R H)。H = U S Vᵀ 时取 R = V Uᵀ,trace 正好等于奇异值之和,是最大值。手算例:P = (1,0,0)、(0,1,0)、(0,0,1)。Q = 绕 z 转 90° 再加 (1,0,0)。转 90° 把 (x, y, z) 变成 (−y, x, z),所以 Q = (1,1,0)、(0,0,0)、(1,0,1)。下面代码第一行输出 R = [[0,−1,0],[1,0,0],[0,0,1]],t = (1, 0, 0),正是答案。
<span class="en">Why: the optimal t aligns centroids, so centering removes it; what remains is maximizing trace(RH), achieved by R = VUᵀ. Example: three unit points rotated 90° about z and shifted by (1, 0, 0); Kabsch recovers both exactly.</span>

### ICP 循环 · The ICP loop

```
  ① 每个源点用 KD 树找目标里最近的点当对应
  ② 用上面的 SVD 求这一步的 R、t,把源点云整体变换过去
  ③ 平均距离不再下降就停,否则回到 ①
```
> 🔤 每一轮误差都不增,所以一定收敛;但只保证收敛到局部最优

```python
import numpy as np
from scipy.spatial import cKDTree
from scipy.spatial.transform import Rotation as Rot
rng = np.random.default_rng(3)
def kabsch(P, Q):                                   # 已知 P[i] 对应 Q[i]
    p0, q0 = P.mean(0), Q.mean(0)                   # 质心
    U, _, Vt = np.linalg.svd((P - p0).T @ (Q - q0)) # H = Σ p' q'ᵀ 的 SVD
    D = np.diag([1, 1, np.sign(np.linalg.det(Vt.T @ U.T))])   # 防反射
    R = Vt.T @ D @ U.T                              # R = V Uᵀ
    return R, q0 - R @ p0                           # t = q̄ − R p̄
def icp(src, dst, iters=50):
    tree, cur, prev = cKDTree(dst), src.copy(), np.inf
    for i in range(iters):
        dist, j = tree.query(cur)                   # ① 最近点当对应
        R, t = kabsch(cur, dst[j]); cur = cur @ R.T + t   # ② SVD 求 R, t 并变换
        if abs(prev - dist.mean()) < 1e-7: break    # 误差不降了就停
        prev = dist.mean()
    return kabsch(src, cur), i + 1, np.sqrt((dist ** 2).mean())   # 总变换 = 起点到终点

P = np.eye(3); Q = P @ Rot.from_euler('z', 90, degrees=True).as_matrix().T + [1, 0, 0]
R, t = kabsch(P, Q); print("tiny R rows", (R.round(3) + 0.0).tolist(), " t", (t.round(3) + 0.0).tolist())
dst = rng.uniform(0, 1, (2000, 3)) * [1, .6, .4]    # 1 × 0.6 × 0.4 米箱子表面 2000 点
ax = rng.integers(0, 3, 2000); dst[np.arange(2000), ax] = rng.integers(0, 2, 2000) * np.array([1, .6, .4])[ax]
for deg in [15, 60, 120]:
    Rt = Rot.from_euler('zx', [deg, 5], degrees=True).as_matrix(); tt = np.array([.3, -.2, .1])
    src = (dst - tt) @ Rt + rng.normal(0, 0.003, dst.shape)   # 源 = 目标做逆变换 + 3 mm 噪声
    (R, t), it, rmse = icp(src, dst)
    err = np.degrees(Rot.from_matrix(R @ Rt.T).magnitude())
    print(f"start {deg:>3} deg: iters {it:>2}, rot err {err:6.2f} deg, t {t.round(2)}, rmse {rmse*1000:.1f} mm")
```

结果:初始差 15° 时 17 轮收敛,旋转误差 0.03°,平移完全恢复。差 60° 要 31 轮,还能对上。差 120° 失败:跑满 50 轮,结果差了将近 180°。原因是箱子绕 z 转 180° 和自己几乎重合,ICP 掉进了这个对称的错误解,残差 19.6 毫米,明显大于正确时的 5.1 毫米(5.1 毫米来自 3 毫米噪声和两边采样点不完全重合)。Open3D 里是 `registration_icp`(这里没跑)。
<span class="en">Result: 15° converges in 17 iterations and 60° in 31, but 120° falls into the box's 180° symmetric solution with a larger residual, a concrete local minimum.</span>

点到面:E = Σ ((R pᵢ + t − qᵢ) · nᵢ)²,nᵢ 是目标点的法向。只罚沿法向的误差,允许点沿表面滑动,墙和地面多的场景收敛快得多。旋转很小时用 R ≈ I + [ω]× 线性化,每轮解一个 6 个未知数的线性最小二乘。初值从哪来:ICP 的误差函数不是凸的,对应关系每轮在变,只保证局部最优,上面 120° 就是例子。无人机上最常见的是用 IMU 或里程计的预测当初值,相邻两帧只差一点点。没有先验时做全局粗配准:每个点算 FPFH 描述子(33 维直方图,统计邻域里法向之间的夹角)→ 按描述子匹配 → RANSAC 每次抽 3 对对应求 R、t、数内点 → 最后用 ICP 精修。
<span class="en">Point-to-plane penalizes only error along the target normal, letting points slide along surfaces; it converges much faster on planar scenes and linearizes to a 6-unknown least squares. ICP is only locally optimal, as the 120° run shows. On a drone the IMU or odometry prediction seeds it; without a prior, match 33-dimensional FPFH descriptors, run RANSAC on 3-pair samples, then refine with ICP.</span>

> ICP aligns a source cloud to a target by alternating two steps. First, <u>correspondences</u>: each source point is matched to its nearest target point with a k-d tree. Second, the <u>best rigid transform</u> for those matches in closed form: subtract the centroids, form H = Σ p′q′ᵀ, take the <u>SVD</u>, R = VUᵀ with a <u>determinant check</u> against reflections, and t = q̄ − Rp̄. Repeat until the error stops decreasing. It only converges to a <u>local minimum</u>: in a quick test it recovered a 60-degree offset on a box but fell into the symmetric solution at 120. So I seed it with the <u>IMU or odometry</u>, or with <u>FPFH features plus RANSAC</u>, and I use <u>point-to-plane</u> for faster convergence on planar scenes.

这段在说什么:两步交替 → SVD 闭式解 → 局部最优,用实跑例子证明 → 初值的两种来源 → 点到面。
<span class="en">What this does: the alternation, the closed form, the local-minimum limit with a measured example, two initializations, point-to-plane.</span>
