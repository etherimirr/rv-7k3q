<script type="text/markdown" id="src"># 篇零 · 开会前看这一屏
> 11/6 周五 15:00–15:30 ET,Zoom。今晚读完篇一、篇二,明天 14:45 只看这一屏和反问

## 时间和链接 · Time and link

- **15:00–15:30 ET**,30 分钟,Zoom:<a href="https://stevens.zoom.us/j/9231685583">stevens.zoom.us/j/9231685583</a>
- 你前面 14:00–14:45 是 ArrePath,中间只有 15 分钟。后面 16:00 是 Emissary。
- 邀请里只写了 "Meeting with Christina Jia",没有议程。

## 这是什么会 · What this meeting is

## 先看这两篇:SpectralCache 和 IG-VLA · Read these two first

### SpectralCache(2026.10,arXiv)
一作 Zhendong Mi,黄老师是末位作者。

- **问题**:扩散世界模型生成视频要跑很多步,每步都过一遍大网络,太慢。
- **比方**:画动画,相邻两帧大部分一样,没必要每帧都重画。
- **做法**:相邻去噪步之间,特征的「方向」(奇异子空间)几乎不变,变的只是「力度」(奇异值)。所以复用方向,只用线性外推估力度。再根据相邻结果的一致性,跳过一些大网络计算。不用重新训练。
- **结果**:HunyuanWorld-Voyager-13B 上加速 5.22 倍,静态场景 WorldScore 65.90。

> I reproduced Ctrl-World, so I've felt how heavy these rollouts are. What I'd want to know is whether caching that looks fine visually still keeps a policy's outcome the same.

🈶 我复现过 Ctrl-World。我想知道的是:画面上看没问题的缓存,策略的结果还能保持一样吗?

### IG-VLA(2026.10,arXiv)
一作 Shenglan Li。VLA = vision-language-action,看图 + 听指令 → 出动作。

- **问题**:让机器人先「想象」未来再动作,效果好,但想象太慢。
- **比方**:学骑车时要一步步想,熟练后变成直觉,想的结果留下来了,过程省掉了。
- **做法**:训练时预测场景怎么变化,但只在特征空间预测,不生成像素。再把学到的东西压进一个 Scene Gist Token。推理时不再想象,只用这个 token。
- **结果**:LIBERO-Plus Language 上成功率比最强基线高近 6%;每个动作块延迟从 1081 ms 降到 169.5 ms(单张 A6000);最高 6.38 倍提速。

> 169 milliseconds on an A6000 is a big step. I'm curious how far it is from running on the robot's own compute.

🈶 A6000 上 169 毫秒已经进步很大。我好奇离跑在机器人自己的算力上还有多远。

## 大模型压缩三篇 · Three LLM compression papers

### RFID-MoE(ICML 2026)
- **问题**:MoE 大模型用 SVD 压缩时,以前对所有专家差不多一视同仁。
- **比方**:预算有限,常用又重要的工具买好的,很少用的买便宜的。
- **做法**:用「被调用的频率」和「有效秩」给专家打分,重要的多分秩。压缩丢掉的信息,再用稀疏投影补回来一部分。
- **结果**:Qwen3-30B 压缩到 60%,PTB 困惑度 16.92,比基线低 8 以上;HellaSwag 准确率约高 8%。

### PARSE(2026.5,arXiv)
一作 Hengyi Zhu。

- **问题**:SVD 压缩后所有输入都用同样的秩,但不同问题需要的不一样。
- **比方**:简单问题用小模型回答,难问题多调用一些。
- **做法**:离线训练一个线性路由器,按 prompt 选秩;相似 prompt 的选择结果可以缓存复用。
- **结果**:LLaMA-7B 在压缩比 0.6 下平均准确率最高提升 10%;prefill 提速 2.5 倍,decode 提速 2.4 倍。

> PARSE and SpectralCache feel like the same idea at different levels: spend less compute when the input doesn't need it.

🈶 PARSE 和 SpectralCache 好像是同一个想法在不同层面:输入不需要的时候,就少花计算。

### P-GAP(2025.10,arXiv)
- **问题**:微调大模型要反向传播,内存和时间都贵。零阶方法不用反向传播,但参数太多,估得不准,收敛慢。
- **做法**:先估一个低维的梯度子空间,在里面沿着投影后的梯度方向扰动。扰动的维度小了,方差小了。
- **结果**:分类准确率最高 +6%,生成 +12%;迭代最多少约 81%;GPU 时间最多少 70%。

> TaskMap also puts weight updates in a low-dimensional space, but for a different reason: we wanted updates that could be compared across tasks, and you want gradient estimates with lower variance.

🈶 TaskMap 也把权重更新放到低维空间,但目的不同:我们要的是任务之间能比较,您要的是梯度估计方差小。

## SVD 压缩 · SVD compression

**一句话**:大矩阵的信息常常集中在少数几个方向上,只留那几个方向就够了。

**比方**:一张照片,记「主要的几个明暗模式」,而不是每个像素。

<div class="dg"><svg viewBox="0 0 400 190" role="img" aria-label="SVD 低秩分解示意"><rect class="bx hl" x="14" y="30" width="110" height="110" rx="4"/><text class="s1" x="69" y="82" text-anchor="middle">W</text><text class="t2" x="69" y="100" text-anchor="middle">1000 × 1000</text><text class="s1" x="140" y="90" text-anchor="middle">≈</text><rect class="bx me" x="158" y="30" width="46" height="110" rx="4"/><text class="s1" x="181" y="88" text-anchor="middle">U</text><rect class="bx me" x="216" y="74" width="28" height="28" rx="4"/><text class="s1" x="230" y="93" text-anchor="middle">S</text><rect class="bx me" x="256" y="62" width="130" height="46" rx="4"/><text class="s1" x="321" y="90" text-anchor="middle">Vᵀ</text><text class="t2" x="181" y="158" text-anchor="middle">1000 × 50</text><text class="t2" x="230" y="124" text-anchor="middle">50 个数</text><text class="t2" x="321" y="124" text-anchor="middle">50 × 1000</text><text class="t2" x="200" y="182" text-anchor="middle">存储:100 万 → 约 10 万,小了约 90%</text></svg></div>

**算一遍**:1000×1000 的矩阵有 1,000,000 个数。留秩 50:U 有 50,000,V 有 50,000,S 有 50,合计 100,050。小了约 90%,乘法也少了差不多这么多。

**代价**:丢掉的方向就是信息损失。秩越低越省,但准确率可能掉。

**黄老师的两步改进**:RFID-MoE 决定「哪个专家留多少秩」;PARSE 决定「这个问题用多少秩」。

> SVD keeps only the strongest directions of a weight matrix. A 1000 by 1000 matrix at rank 50 goes from a million numbers to about a hundred thousand.

<span class="tg me">真做过相近的</span> TaskMap 用的是**固定**的正交基,不是对每层做 SVD。两者都是「低维坐标」,但基不一样。别说成同一件事。

## MoE:专家混合 · Mixture of experts

**一句话**:把大模型的一层拆成很多「专家」,每个 token 只叫几个专家干活。

<div class="dg"><svg viewBox="0 0 400 200" role="img" aria-label="MoE 路由示意"><rect class="bx hl" x="150" y="10" width="100" height="36" rx="8"/><text class="s1" x="200" y="33" text-anchor="middle">一个 token</text><rect class="bx" x="130" y="66" width="140" height="36" rx="8"/><text class="s1" x="200" y="89" text-anchor="middle">路由器选 top-k</text><line class="ar" x1="200" y1="46" x2="200" y2="66"/><g><rect class="bx me" x="20" y="134" width="64" height="40" rx="6"/><text class="t2" x="52" y="158" text-anchor="middle">专家 1</text><rect class="bx" x="96" y="134" width="64" height="40" rx="6"/><text class="t2" x="128" y="158" text-anchor="middle">专家 2</text><rect class="bx me" x="172" y="134" width="64" height="40" rx="6"/><text class="t2" x="204" y="158" text-anchor="middle">专家 3</text><rect class="bx" x="248" y="134" width="64" height="40" rx="6"/><text class="t2" x="280" y="158" text-anchor="middle">专家 4</text><text class="t2" x="352" y="158" text-anchor="middle">… 几百个</text></g><line class="ar" x1="170" y1="102" x2="52" y2="134"/><line class="ar" x1="200" y1="102" x2="204" y2="134"/><text class="t2" x="200" y="194" text-anchor="middle">全部专家都要占内存,但每次只算被选中的</text></svg></div>

**比方**:大医院几百个专科医生,每个病人只看两三个。

**为什么好压缩**:专家被叫的次数差很多。很少被叫的专家可以压得更狠。这就是 RFID-MoE 的「路由频率」。

**为什么和调度有关**:每次只算几个专家,其余可以放到 CPU 内存里,要用时再搬上 GPU。这就是 GPU-CPU 编排。

> In a mixture-of-experts model, a router picks a few experts for each token. All experts take memory, but only the chosen ones compute, so memory is the bottleneck and usage is uneven.

<span class="tg gen">只懂原理</span>

## 剪枝、量化、蒸馏 · Pruning, quantization, distillation

- **剪枝**:把不重要的权重或结构删掉。比方:修树枝。
- **量化**:用更少的位存每个数,32 位变 16 位或 8 位。比方:价格只记到元。你的 RCRI 用的就是 **FP16**。
- **蒸馏**:用大模型教小模型。比方:老师把经验讲给学生。
- **稀疏训练**:训练时就保持大部分权重为 0,而不是训完再剪。她 DAC 2023 做过。
- **分解**:SVD 这类,上面讲了。

<span class="tg me">真做过</span> FP16 和 TensorRT。<span class="tg gen">只懂原理</span> 剪枝、蒸馏、稀疏训练。

## 零阶优化 · Zeroth-order optimization

**一句话**:不用反向传播,只靠多跑几次前向,试出该往哪走。

**比方**:蒙着眼下山。往某个方向迈一小步、再往反方向迈一小步,哪边低就知道了。

**公式**(知道意思就行):

`g ≈ [ L(θ + μu) − L(θ − μu) ] / (2μ) · u`

θ 是参数,u 是随机方向,μ 是步长。L 是损失。

**难点**:参数有几十亿个,随机方向几乎都试不到点子上,估得很不准。P-GAP 的办法就是先把搜索范围缩到低维。

**好处**:不存计算图,省内存,所以适合小设备微调。

<span class="tg gen">只懂原理</span>

## 为什么扩散模型能缓存 · Why diffusion can be cached

扩散模型从噪声开始,一步一步去噪。每一步都要过一次大网络。

## 世界模型、VLA、action chunk · World models, VLA, action chunks

- **世界模型**:模型内部的模拟器。给当前画面和一个动作,预测接下来会发生什么。这样不用真机器人也能试策略。
- **Ctrl-World**:用扩散模型做世界模型,基于 Stable Video Diffusion。三个特点:多视角联合预测、按位姿检索记忆、逐帧的动作条件。
- **VLA**:看图 + 听指令 → 输出动作。
- **action chunk**:一次输出接下来一小段动作,而不是一步一步出。IG-VLA 的 169.5 ms 是一个 chunk 的时间。
- **为什么延迟要紧**:机器人的世界不会等你。模型算得慢,动作就基于旧画面。

## prefill 和 decode · Prefill and decode

- **prefill**:读你的 prompt,把上下文算一遍。
- **decode**:一个 token 一个 token 往外吐。

PARSE 两个都提速了。这个你为 Alpaca 学过。

/* ---- 名词悬停解释(来自附录 C) ---- */
(function(){
  const G=JSON.parse(document.getElementById('gloss').textContent||'{}');
  const terms=Object.keys(G).sort((a,b)=>b.length-a.length);if(!terms.length)return;
  const esc=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('('+terms.map(esc).join('|')+')','gi');
  const lower={};terms.forEach(t=>lower[t.toLowerCase()]=t);
  const appC=heads.find(h=>h.textContent.trim().startsWith('附录 C'));
  const skip=n=>{for(let e=n.parentElement;e;e=e.parentElement){const tg=e.tagName;if(tg==='PRE'||tg==='CODE'||tg==='A'||tg==='H1'||tg==='H2'||tg==='H3'||tg==='SCRIPT'||e.classList.contains('gl')||e.classList.contains('part'))return true;}return false;};
  let inC=false;
  const blocks=main.querySelectorAll('p,li,td,th,blockquote');
  blocks.forEach(bl=>{
    if(appC&&bl.compareDocumentPosition(appC)&Node.DOCUMENT_POSITION_PRECEDING)return; /* skip glossary itself */
    const seen=new Set();
    const walker=document.createTreeWalker(bl,NodeFilter.SHOW_TEXT,{acceptNode:n=>skip(n)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(nd=>{
      const txt=nd.nodeValue;if(!re.test(txt)){re.lastIndex=0;return;}re.lastIndex=0;
      const frag=document.createDocumentFragment();let last=0,m,changed=false;
      while((m=re.exec(txt))){const key=lower[m[1].toLowerCase()];if(!key||seen.has(key)){continue;}
        /* latin terms must be whole words */
        if(/^[A-Za-z0-9+.\- ]+$/.test(key)){const b=txt[m.index-1]||' ',a=txt[m.index+m[0].length]||' ';if(/[A-Za-z0-9_]/.test(b)||/[A-Za-z0-9_]/.test(a))continue;}
        seen.add(key);frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
        const sp=document.createElement('span');sp.className='gl';sp.textContent=m[0];sp.dataset.d=G[key];frag.appendChild(sp);last=m.index+m[0].length;changed=true;}
      if(changed){frag.appendChild(document.createTextNode(txt.slice(last)));nd.replaceWith(frag);}
    });
  });
  const tip=document.getElementById('tip');
  main.addEventListener('mouseover',e=>{const t=e.target.closest('.gl');if(!t)return;const d=t.dataset.d;const i=d.indexOf(':');tip.innerHTML='<b></b> ';tip.querySelector('b').textContent=d.slice(0,i);tip.appendChild(document.createTextNode(d.slice(i+1)));tip.style.display='block';
    const r=t.getBoundingClientRect();let x=r.left,y=r.bottom+8;if(x+370>innerWidth)x=innerWidth-380;if(y+140>innerHeight)y=r.top-8-tip.offsetHeight;tip.style.left=x+'px';tip.style.top=y+'px';});
  main.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.gl'))tip.style.display='none';});
})();

function load(){return ld(KEY,'[]')}
function store(list){sv(KEY,list)}
function render(){
  const list=load();const box=document.getElementById('notes');box.innerHTML='';
  if(!list.length){box.innerHTML='<div style="color:var(--mut);font-size:13px">还没有问题。</div>';return;}
  list.slice().reverse().forEach(it=>{
    const d=document.createElement('div');d.className='note'+(it.done?' answered':'');
    d.innerHTML='<div class="t"><span>'+(it.title||'')+' · '+it.when+'</span><span><a data-a="jump">跳转</a> <a data-a="done">'+(it.done?'未答':'已答')+'</a> <a data-a="del">删</a></span></div><div class="b"></div>';
    d.querySelector('.b').textContent=it.text;
    const ab=document.createElement('div');ab.className='ans';ab.hidden=!it.answer;ab.textContent=it.answer||'';d.appendChild(ab);
    const bb=document.createElement('div');bb.className='btns2';const gen=document.createElement('button');gen.textContent=it.answer?'重新生成解答':'生成解答';gen.title=SAMPLE?'用 Claude 生成这一题的解答':'只在 claude.ai 上打开的版本可用';gen.onclick=()=>{ab.hidden=false;answer(it,ab,gen);};bb.appendChild(gen);d.appendChild(bb);
    d.querySelectorAll('.t a').forEach(a=>a.onclick=()=>{
      const all=load();const i=all.findIndex(x=>x.k===it.k);if(i<0)return;
      if(a.dataset.a==='del')all.splice(i,1);
      if(a.dataset.a==='done')all[i].done=!all[i].done;
      if(a.dataset.a==='jump'&&it.id){location.hash='#'+it.id;return;}
      store(all);render();
    });
    box.appendChild(d);
  });
}
document.getElementById('save').onclick=()=>{
  const ta=document.getElementById('qtext');const text=ta.value.trim();if(!text)return;
  const list=load();const now=new Date();const when=now.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  list.push({k:Date.now()+Math.random(),id:cur.id,title:cur.title,text,when,done:false});
  store(list);ta.value='';render();
};
document.getElementById('clear').onclick=()=>{const b=document.getElementById('clear');if(load().length&&b.dataset.arm){store([]);render();delete b.dataset.arm;b.textContent='清空全部';}else{b.dataset.arm='1';b.textContent='再点一次确认清空';setTimeout(()=>{delete b.dataset.arm;b.textContent='清空全部';},3000);}};
document.getElementById('copy').onclick=async()=>{
  const list=load().filter(x=>!x.done);
  const out=['## ❓ 待答(从 HTML 复制,'+new Date().toLocaleDateString('zh-CN')+')',''].concat(list.map(x=>'- **['+x.title+']** '+x.text.replace(/\n/g,' '))).join('\n');
  const b=document.getElementById('copy');
  try{await navigator.clipboard.writeText(out);b.textContent='已复制 '+list.length+' 条';}
  catch(e){const ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');b.textContent='已复制 '+list.length+' 条';}catch(_){b.textContent='复制失败,手动选中';}ta.remove();}
  setTimeout(()=>b.textContent='复制全部为 Markdown',2000);
};
render();
</script></body></html>
